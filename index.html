coApplicant":true,"expiry":"2042.04.27","inventor":"이상철","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 구기자 순의 생물전환 추출물을 유효성분으로 함유하는 항균용 조성물에 관한 것으로, 구기자 순 추출물에 바실러스 속 균주를 혼합해 생물전환 반응을 유도한 뒤 원심분리한 상등액을 유효성분으로 사용한다. 황색포도상구균, 대장균, 프로피오니박테리움 아크니스에 항균 활성을 나타내며 화장품, 건강기능식품, 세정제, 의약품에 적용할 수 있다. 화학 합성 항생제의 오남용과 내성 문제를 대체할 천연 항균 소재를 지향한다.","features":[{"k":"특징","v":"구기자 순을 열수 또는 에탄올로 추출해 에틸아세테이트 층을 농축한 뒤 바실러스 속 JD3-7 균주를 가해 30℃에서 72시간 생물전환 반응시킨 상등액을 동결건조해 사용하며, 미생물 효소에 의한 구조 변화로 기존 추출물보다 항균 활성을 끌어올린 것이 핵심이다."},{"k":"효과","v":"MIC 측정 결과 세 균주 모두에서 기존 구기자 순 추출물보다 항균 활성이 증가했고, 특히 에탄올 추출물 기반 생물전환 추출물은 메티실린 내성 황색포도상구균에서 MIC가 2.5에서 0.31㎎/㎖로 낮아졌으며 활성이 없던 대장균에도 항균 활성을 나타냈다."}],"lvl":3,"comparison":[{"item":"항균 소재 구성","old":"대부분 화학적 합성으로 제조된 항생제이며 고비용 소요","new":"구기자 순을 미생물로 생물전환한 천연 추출물을 사용"},{"item":"부작용과 내성","old":"오남용으로 항생제 내성 균주가 출현하고 부작용을 유발","new":"환경 친화적으로 사용 가능한 천연 생리활성 물질 기반"},{"item":"항균 활성 수준","old":"기존 구기자 순 추출물은 항균 활성이 상대적으로 낮음","new":"황색포도상구균·대장균 등에 대한 항균 활성이 현저히 증가"}],"applications":[{"title":"여드름 개선 화장품","desc":"프로피오니박테리움 아크니스에 대한 항균 활성을 활용한 화장품 소재로 적용 가능"},{"title":"피부 항균 세정제","desc":"황색포도상구균과 대장균에 대한 항균 활성을 갖는 세정제 조성물로 활용할 수 있음"},{"title":"천연 항균 건강기능식품","desc":"합성 항생제를 대체하는 환경 친화적 천연 항균 소재로 건강기능식품과 의약품에 적용"}]},{"id":"p1020230001777","title":"야외용 간이 휴게시설물","field":"생활","status":"등록","regNo":"10-2692539","regDate":"2024.08.01","appNo":"10-2023-0001777","appDate":"2023.01.05","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2043.01.05","inventor":"이선순","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 야외용 간이 휴게시설물에 관한 것으로, 전방에 벤치가 있는 제1벽체와 그 후방에 간격을 두고 벤치가 마련된 제2벽체, 제2벽체 상단에서 지면으로 이어지는 제3벽체, 그리고 세 벽체 상단을 잇는 상판으로 구성된다. 전방이 완전 개방된 관람 공간과 전후방 개방이 차단된 독서·학습 공간을 한 시설물 안에 구분해 제공한다.","features":[{"k":"특징","v":"제1벽체와 제2벽체는 후방으로 기울어지게 배치되고 벤치는 복수 단으로 높이 차를 두어 다수인이 편안히 착석하며, 상판이 각 공간 상부를 덮어 햇빛과 비를 막고 제3벽체의 계단으로 상판에 올라 조망할 수 있으며 지붕부재와 난간을 더할 수 있다."},{"k":"효과","v":"상판에 의해 날씨와 무관하게 이용할 수 있고, 개방 공간에서는 경기·공연 관람이 원활하며 차단 공간에서는 주변 왕래의 간섭 없이 독서와 학습 쿰 균주와 이를 이용해 폴리페놀로부터 글루코사이드 유도체를 생산하는 방법에 관한 것으로, 바실루스 리체니포르미스 유래 YdhE 유전자를 도입한 균주(KCTC 15905BP)와 여기에 UDP-D-글루코스 경로 유전자인 Pgm·GalU1을 추가 도입한 균주(KCTC 15906BP)를 제공한다. 외부에서 공급한 폴리페놀을 생물전환해 글루코사이드로 전환한다.","features":[{"k":"특징","v":"YdhE가 글리코실트랜스퍼라제로 작용하고, Pgm(포스포글루코뮤타제)과 GalU1(UDP-D-글루코스 피로포스포릴라제)의 과발현으로 내인성 UDP-글루코스 풀을 늘려 글루코실화 효율을 높인다. 재조합 벡터 pSKSM-YPG로 유전자를 도입하고, IPTG 첨가와 기질 농도 3~12 mM, 배양 온도 25~37℃ 조건에서 발효해 목적 글루코사이드를 선택적으로 생산한다."},{"k":"효과","v":"값비싼 당 공여체를 외부 공급하는 시험관 내 효소 반응이나 화학적 합성의 한계를 넘어, 플라본·플라바놀·플라바논·이소플라본·안트라퀴논·칼콘 등 다양한 폴리페놀을 높은 수율로 글루코사이드 유도체로 안정적으로 전환할 수 있어 식품·화장품·제약용 소재의 대량생산에 적합하다."}],"lvl":3,"comparison":[{"item":"당 공여체 공급","old":"UDP-포도당 등 값비싼 활성 당 공여체를 외부에서 공급해야 함","new":"Pgm·GalU1 과발현으로 내인성 UDP-글루코스 경로의 당을 활용"},{"item":"합성 수율과 순도","old":"화학적 합성은 기질 파괴와 낮은 수율, 아노머 형성 문제가 발생","new":"재조합 균주 생물전환으로 글루코사이드 유도체를 높은 수율로 합성"},{"item":"대량생산 적합성","old":"시험관 내 효소 반응 시스템이어서 산업적 대규모 합성에 부적합","new":"균주 배양으로 생물전환이 이루어져 안정적 대량생산에 적합"}],"applications":[{"title":"기능성 식품 소재 생산","desc":"폴리페놀을 용해도와 안정성이 높은 글루코사이드 유도체로 전환해 식품 기능성 소재로 활용"},{"title":"화장품 원료 생물전환","desc":"아피게닌·퀘르세틴 등 폴리페놀의 배당체를 재조합 균주 배양으로 생산해 화장품 원료로 공급"},{"title":"제약용 배당체 합성","desc":"항암·항염 활성이 보고된 폴리페놀 글루코사이드 유도체를 제약 분야 소재로 합성하는 공정"}],"figFile":"10-2024-0076069.jpg","figureCaption":"공보 대표도면"},{"id":"p1020210154133","title":"대장균을 이용한 메이신의 대량 생산방법","field":"의료","status":"등록","regNo":"10-2674605","regDate":"2024.06.07","appNo":"10-2021-0154133","appDate":"2021.11.10","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2041.11.10","inventor":"송재경","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 대장균을 이용한 메이신의 대량 생산방법에 관한 것으로, 옥수수 수염에 극히 소량만 존재하는 생리활성 플라본 C-글리코시드인 메이신을 미생물 세포공장에서 생산한다. 메이신 생합성 유전자를 삽입한 플라스미드로 형질전환한 재조합 대장균을 항생제 보충 LB 배지에서 배양하고, 배양액에 전구물질인 루테올린을 공급해 이소오리엔틴·람노실이소오리엔틴을 거쳐 메이신을 합성한다.","features":[{"k":"특징","v":"Gentiana triflora의 6-C-글리코실트랜스퍼라제 유전자(GtF6CGT1)와 글루코스 2″-O-람노실트랜스퍼라제 유전자(UGT91L1)를 대장균 C-41(DE3)에 도입하고, 배양 20시간 후 루테올린을 글루코스 또는 글리세린 5%와 함께 공급해 35~40℃에서 24~72시간 배양한다."},{"k":"효과","v":"옥수수 수염에 소량만 포함된 메이신을 대장균을 통해 대량 생산할 수 있으며, 72시간 배양 시 기질의 약 80%가 이소오리엔틴·람노실이소오리엔틴으로 전환되고 RHS1 효소 반응으로 메이신 생성이 확인되어 메이신 공급 한계를 해소할 수 있다."}],"lvl":3,"comparison":[{"item":"메이신 생산 방식","old":"옥수수 수염에서 메이신을 추출하는 방법에 의존하였음","new":"메이신 생합성 유전자로 형질전환한 재조합 대장균 배양"},{"item":"생산량 한계","old":"옥수수 수염의 메이신 함량이 극히 적어 대량 생산 한계","new":"루테올린을 기질로 공급해 대장균 세포공장에서 대량 생산"},{"item":"핵심 구현 수단","old":"추출물 제조 및 고수율 추출 공정 개선에 머물렀음","new":"GtF6CGT1·UGT91L1 플라스미드를 도입한 대장균을 이용"}],"applications":[{"title":"메이신 대량 생산","desc":"옥수수 수염에 소량 포함된 메이신을 재조합 대장균으로 대량 생산하는 분야"},{"title":"플라보노이드 생합성","desc":"루테올린을 기질로 플라본 C-글리코시드를 합성하는 미생물 생합성 기술 분야"},{"title":"기능성 소재 원료 생산","desc":"살충 및 신경 보호 활성을 갖는 메이신을 기능성 소재 원료로 공급하는 분야"}],"figFile":"10-2021-0154133.jpg","figureCaption":"공보 대표도면"},{"id":"p1020240065094","title":"개인건강기록 기반 발달장애 관리 시스템 및 방법","field":"의료","status":"공개","regNo":"","regDate":"","appNo":"10-2024-0065094","appDate":"2024.05.20","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2044.05.20","inventor":"유재호","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 개인건강기록(PHR) 기반 발달장애 관리 시스템 및 방법에 관한 것으로, 증강현실로 구현된 콘텐츠를 수행하는 피훈련자의 인지역량과 신체역량을 산출해 개인건강기록을 실시간으로 갱신하고 맞춤형 운동프로그램을 제공한다. 개인별 운동 방법·횟수·강도를 반영하지 못하는 기존 훈련 프로그램과 실시간으로 갱신되지 않는 전자의료기록의 한계를 보완하기 위한 것이다.","features":[{"k":"특징","v":"증강현실 디바이스가 디스플레이로 콘텐츠를 구현하고 3D 깊이 카메라로 모션 변화를 측정해 상지 강도·상지 유연도·하지 균형도와 인지역량을 산출하며, 서버가 이를 개인건강기록에 누적해 의료전문가 또는 자체 로직이 맞춤형 운동프로그램을 생성하도록 한다."},{"k":"효과","v":"발달장애인의 상태에 맞는 운동 형태·강도·횟수를 제공해 인지능력과 신체능력을 향상시키고, 환자 본인과 유관련자가 건강 상태를 실시간으로 통합 조회·관리할 수 있어 비대면으로도 상태 확인과 처방이 가능하다."}],"lvl":3,"comparison":[{"item":"훈련 개인화 수준","old":"장애 정도별 집중 훈련이나 포괄적 훈련에 머무름","new":"산출된 역량에 맞춘 맞춤형 운동프로그램 제공"},{"item":"기록 갱신 시점","old":"전자의료기록은 평가 완료 후에야 수기로 갱신","new":"훈련 중 산출한 역량을 서버로 보내 실시간 갱신"},{"item":"역량 측정 방식","old":"전문가 입력에 의존해 객관적 역량 지표가 부족","new":"3D 깊이 카메라로 상지 강도·유연도·하지균형도 측정"}],"applications":[{"title":"발달장애 인지·신체 훈련","desc":"증강현실 컨텐츠를 인지하고 몸으로 구현하게 해 인지능력과 신체능력을 함께 훈련"},{"title":"개인건강기록 관리 시스템","desc":"훈련 결과를 개인건강기록에 실시간 기록해 보호자와 전문가가 상태를 확인하는 체계"},{"title":"증강현실 재활 콘텐츠","desc":"3D 깊이 카메라로 모션변화를 측정하는 증강현실 디바이스용 운동프로그램 콘텐츠"}],"figFile":"10-2024-0065094.jpg","figureCaption":"공보 대표도면"},{"id":"p1020200105249","title":"사포닌에 대해 생물전환능을 갖는 락토바실러스 펜토서스 KK18 균주, 이를 이용한 진세노사이드 Re의 함량이 증대된 새싹삼 발효 조성물의 제조방법, 이에 따른 새싹삼 발효 조성물 및 이를 포함하는 식품 조성물","field":"의료","status":"등록","regNo":"10-2668553","regDate":"2024.05.20","appNo":"10-2020-0105249","appDate":"2020.08.21","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2040.08.21","inventor":"서희재","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 사포닌에 대해 생물전환능을 갖는 락토바실러스 펜토서스 KK18 균주(수탁번호 KCCM12762P)와 이를 이용한 진세노사이드 Re 함량 증대 새싹삼 발효 조성물의 제조방법에 관한 것이다. 김치에서 분리한 이 균주로 새싹삼 전초 분말을 발효시켜, 새싹삼에 매우 미량으로만 존재하는 진세노사이드 Rg2, Re, F2의 함량을 높인 발효 조성물과 식품 조성물을 제공한다.","features":[{"k":"특징","v":"새싹삼 전초를 증숙·건조·분쇄한 분말 100중량부에, 유기산으로 pH 4.8~6.4로 조정한 정제수에 균주를 0.5~2중량% 접종한 현탁액 25~40중량부를 혼합해 32~42℃에서 60~72시간 발효시키며, 이 균주는 β-글루코시다아제 활성과 내산성·내담즙성이 우수하다."},{"k":"효과","v":"발효 조성물의 진세노사이드 Re 함량이 0.15mg/g 이상으로 현저히 증대되고 Rg2와 F2 함량도 함께 높아져, 뿌리인삼보다 저렴한 새싹삼을 원료로 학습 및 기억력 개선, 인지기능 증진용 식품 조성물을 제조하는 데 유용하다."}],"lvl":3,"comparison":[{"item":"발효 균주 구성","old":"락토바실러스 플란타룸·브레비스 혼합 균주로 발효하였다","new":"김치에서 분리한 락토바실러스 펜토서스 KK18 균주를 사용"},{"item":"진세노사이드 함량","old":"새싹삼은 뿌리인삼보다 진세노사이드 Re 함량이 매우 낮았다","new":"발효로 진세노사이드 Re 함량을 0.15 mg/g 이상으로 높인다"},{"item":"제조 공정 조건","old":"혼합 균주로 새싹삼의 기능성을 높이는 수준에 머물렀다","new":"pH 4.8~6.4 정제수에서 32~42℃, 60~72시간 발효시킨다"}],"applications":[{"title":"새싹삼 발효 식품","desc":"진세노사이드 Re 함량이 증대된 새싹삼 발효 조성물을 포함하는 식품으로 제조한다"},{"title":"인지기능 개선 소재","desc":"학습 및 기억력 개선과 인지기능 증진용 식품 조성물의 제조에 유용하게 쓰인다"},{"title":"사포닌 생물전환 공정","desc":"사포닌을 진세노사이드 Rb1, Rb2, Rg2, Re, F2로 전환하는 발효 공정에 적용한다"}],"figFile":"10-2020-0105249.jpg","figureCaption":"공보 대표도면"},{"id":"p1020240064233","title":"마우스피스형 치아 진단장치","field":"의료","status":"공개","regNo":"","regDate":"","appNo":"10-2024-0064233","appDate":"2024.05.17","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2044.05.17","inventor":"이혜주","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 마우스피스형 치아 진단장치에 관한 것으로, 복수의 초박형 카메라가 장착된 마우스피스를 환자의 구강에 착용해 치아 전체 형상을 동시에 촬영하고 AI로 치아 상태를 진단한다. 견인기와 반사거울을 이용하는 기존 구내 촬영은 최소 5장 이상을 찍어야 하고 많은 인력과 시간이 들며 어금니 측면 이미지가 왜곡되는 문제가 있었는데, 이를 해결하고자 한 것이다.","features":[{"k":"특징","v":"윗니·아랫니 삽입부가 있는 마우스피스 본체부에 교합면과 내외측 경사면마다 초박형 카메라를 배치해 치아별 교합면·외측면·내측면을 촬영하며, 압력 센서로 교합이 고르게 감지되면 발광 램프와 카메라를 동시에 작동시키고 영상을 단말기로 무선 전송한다."},{"k":"효과","v":"촬영 시간을 단축하고 촬영 편의성을 확보하면서 정확한 치아 형상을 얻어 진단 정확도와 환자의 이해도를 높이며, 3D 영상 변환과 딥러닝 기반 치아우식 판독 솔루션으로 우식 여부 및 중증도를 빠르게 도출할 수 있다."}],"lvl":3,"comparison":[{"item":"촬영 수행 방식","old":"정면·좌우측면·교합면 등 5장 이상을 순차 촬영","new":"복수 카메라로 치아 전체 형상을 동시에 촬영"},{"item":"보조 인력 필요","old":"견인기와 반사거울, 에어 분사용 보조자가 여럿 필요","new":"구강에 마우스피스를 착용하는 것만으로 촬영"},{"item":"영상 왜곡 정도","old":"어금니 측면을 반사거울로 찍어 왜곡된 영상을 획득","new":"치아에 마주보게 배치한 카메라로 직접 촬영"}],"applications":[{"title":"치과 구내 촬영 장치","desc":"견인기와 반사거울 없이 마우스피스 착용만으로 윗니와 아랫니를 촬영하는 구내 장치"},{"title":"AI 치아 상태 진단","desc":"촬영 영상을 기저장된 치과용 영상 데이터와 비교·분석해 치아 상태를 진단하는 용도"},{"title":"치아 우식 중증도 판정","desc":"AI 기반 분석으로 질환 유무와 치아 우식 여부, 중증도 결과를 자동 도출하는 용도"}],"figFile":"10-2024-0064233.jpg","figureCaption":"공보 대표도면"},{"id":"p1020210104079","title":"NK1R을 표적으로 하는 siRNA를 포함하는 뇌암 치료, 개선 또는 예방용 조성물","field":"의료","status":"등록","regNo":"10-2665137","regDate":"2024.05.07","appNo":"10-2021-0104079","appDate":"2021.08.06","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2041.08.06","inventor":"정혜진","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 화학적 합성치사 상호작용(chemical synthetic lethality)을 이용한 뇌암 치료용 조성물에 관한 것으로, 뉴로키닌-1 수용체(NK1R) 유전자 발현을 침묵시키는 siRNA(siNK1R)와 함께 HBC, 베르바민 또는 siCaMKIIγ 중 어느 하나를 유효성분으로 포함한다. 유전자 침묵 방식으로 뇌암 줄기세포의 자기재생능과 종양 형성능을 겨냥하며, 약학적 조성물과 식품 조성물 형태로 제공된다.","features":[{"k":"특징","v":"siNK1R로 NK1R 발현을 차단하면서 CaMKII를 표적하는 HBC(20~80:1), 베르바민(40~80:1) 또는 siCaMKIIγ(3~5:1)를 각각의 몰 농도비로 병용하는 구성으로, U87MG 암줄기유사세포에서 단독 처리 대비 세포 생존을 현저히 억제하는 합성치사 상호작용을 유도한다."},{"k":"효과","v":"세 가지 병용 조합 모두 개별 성분 단독 투여보다 상승적인 합성치사 효과를 보여 암줄기유사세포를 사멸시키고 신경구체 형성을 강력하게 억제하므로, 뇌암 치료·예방·개선 용도로 유용하게 이용될 수 있다."}],"lvl":3,"comparison":[{"item":"치료 접근 방식","old":"수술·방사선 및 화학요법이 뇌암 치료의 주종을 이룸","new":"HBC 등과 siNK1R 병용투여로 화학적 합성치사 상호작용을 유도"},{"item":"약물 작용 표적","old":"세포독소가 빠르게 성장하는 세포를 손상·사멸시킴","new":"재발·전이의 원인인 뇌암 줄기세포를 선택적으로 사멸시킴"},{"item":"병용 상승효과","old":"개별 성분 단독 투여로는 상승적 억제 효과를 얻기 어려움","new":"HBC·베르바민 등과 siNK1R 병용으로 신경구체 형성까지 현저하게 억제"}],"applications":[{"title":"뇌암 치료용 의약품","desc":"HBC·베르바민 등과 siNK1R을 유효성분으로 포함하는 뇌암 예방 또는 치료용 약학적 조성물 개발"},{"title":"뇌암 개선 식품 조성물","desc":"siNK1R 병용 조합을 유효성분으로 포함하는 뇌암 예방 또는 개선용 식품 조성물 분야"},{"title":"암줄기세포 표적 치료","desc":"암줄기세포의 자가재생능·증식능을 제어하는 표적 항암 치료 연구 및 개발 분야"}],"figFile":"10-2021-0104079.jpg","figureCaption":"공보 대표도면"},{"id":"p1020240058083","title":"복합기능 수술용 전극","field":"전기·전자","status":"공개","regNo":"","regDate":"","appNo":"10-2024-0058083","appDate":"2024.04.30","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2044.04.30","inventor":"이상철","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 복합기능 수술용 전극에 관한 것으로, 하나의 기기로 절개(Cut), 응고(Coagulation), 흡인(Suction) 기능을 복합적으로 수행할 수 있는 수술용 전극을 제공한다. 절개와 응고, 또는 응고와 흡인만 결합된 기존 보비 나이프는 목적에 따라 전극을 반복 교체해야 해 수술 시간이 지체되고 환자 안전 문제를 초래했는데, 이러한 한계를 해결하기 위한 것이다.","features":[{"k":"특징","v":"중공 내부에 길이 방향 흡인유로와 전류 제어용 PCB를 갖춘 하우징에, 유입유로가 형성된 전극 팁을 결합하며, PCB의 절개용 제1 소자와 응고용 제2 소자를 버튼으로 선택해 고주파 전류를 인가하고 삼각뿔형 선단부 측면의 흡입공으로 이물질과 혈액을 흡인한다."},{"k":"효과","v":"수술 중 전극을 교체하는 번거로움이 없어 수술 편의성이 높아지고 수술을 신속하게 진행할 수 있어 수술의 질 향상과 환자 안전 확보에 기여하며, 하나의 기기로 제작해 제작 비용과 구매 비용도 절감할 수 있다."}],"lvl":3,"comparison":[{"item":"기능 통합 범위","old":"절개+응고 또는 응고+흡인 등 두 기능까지만 복합","new":"하나의 기기에 절개·응고·흡인을 모두 복합 구성"},{"item":"기기 교체 번거로움","old":"목적별 전극을 반복 교체해 수술 시간이 지체됨","new":"교체 없이 버튼으로 절개와 응고 전류를 전환"},{"item":"제작·보관 효율","old":"전극을 각각 제작·보관해 비용과 공간 효율이 저하","new":"한 기기로 통합해 제작 비용과 보관 부담을 절감"}],"applications":[{"title":"복합기능 전기수술기","desc":"고주파 전류로 조직을 절개하고 지혈하는 보비 나이프를 하나의 기기로 통합한 전극"},{"title":"수술 부위 흡인 장치","desc":"하우징 흡인유로와 전극 팁 유입유로, 커넥터로 흡인장치를 연결해 환부를 흡인"},{"title":"전류 제어 PCB 모듈","desc":"절개용 제1 소자와 응고용 제2 소자를 버튼으로 통전시켜 고주파 전류를 제어"}],"figFile":"10-2024-0058083.jpg","figureCaption":"공보 대표도면"},{"id":"p1020210140347","title":"내부 광 추출용 양자점 함유한 내부 산란층을 포함하는 유기발광소자","field":"전기·전자","status":"등록","regNo":"10-2661158","regDate":"2024.04.23","appNo":"10-2021-0140347","appDate":"2021.10.20","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2041.10.20","inventor":"박영욱","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 내부 광 추출 효율을 높이고 시야각을 넓힌 유기발광소자(OLED)에 관한 것으로, 양극 하단의 내부 산란층 내부에 유기 발광층과 동일한 파장 영역의 빛을 방출하는 복수의 양자점체를 분산 배치해 빛의 세기를 증가시켜 기판층으로 전달한다. 주름 구조의 산란 구조막과 산란 입자체를 함께 적용해 전극과 기판 계면에 갇히는 빛을 끌어내며, 마이크로 캐버티 구조의 좁은 시야각 문제도 함께 해소한다.","features":[{"k":"특징","v":"내부 산란층은 PMMA를 스핀 코팅·경화 후 이온 식각한 투명 나노 구조체에 ZnO를 스퍼터링해 평탄한 주름 구조로 만든 산란 구조막과 분산된 산란 입자체·양자점체로 구성되고, 동일한 주름 구조가 발광층과 양극·음극 계면에 전사되어 외부 양자효율을 높인다."},{"k":"효과","v":"여러 시야각에서 측정한 외부 양자효율이 마이크로 캐버티 적용 시료보다 크고, 60˚ 시야각에서 피크 파장 이동은 42nm에서 20~26nm로, 컬러 코오디네이션 변화는 0.165에서 0.078~0.087로 약 47%까지 줄어 시야각에 따른 색 변화 현상을 감소시킨다."}],"lvl":3,"comparison":[{"item":"광 추출 구조","old":"굴절률 차이로 빛이 계면에 가두어져 추출 효율이 낮음","new":"내부 산란층 내부에 양자점체를 분산시켜 빛 세기 증가"},{"item":"시야각 특성","old":"마이크로 캐버티 구조로 패널의 시야각이 좁아지는 문제","new":"시야각에 따른 피크 파장 이동과 색 변화를 절반 가까이 감소"},{"item":"산란층 구성","old":"광 투과 향상을 위해 마이크로 캐버티 구조를 주로 적용","new":"나노 산란 구조막과 산란 입자체에 양자점을 함께 구성"}],"applications":[{"title":"광시야각 OLED 패널","desc":"보는 각도에 따른 색 변화를 줄여 넓은 시야각을 확보하는 OLED 디스플레이 패널"},{"title":"양자점 광 추출 소재","desc":"내부 산란층에 분산되어 빛의 세기를 증가시키는 양자점 함유 광 추출 소재 분야"},{"title":"OLED 디스플레이 제조","desc":"내부 광 추출 효율과 색 재현 특성을 함께 요구하는 유기발광 디스플레이 제조 분야"}],"figFile":"10-2021-0140347.jpg","figureCaption":"공보 대표도면"},{"id":"p1020210165605","title":"유아용 살균 칫솔","field":"의료","status":"등록","regNo":"10-2660201","regDate":"2024.04.19","appNo":"10-2021-0165605","appDate":"2021.11.26","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2041.11.26","inventor":"이혜주","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 유아용 살균 칫솔에 관한 것으로, 칫솔모가 구비된 칫솔부와 칫솔부가 돌출되는 손잡이 본체부, 손잡이 본체부 상부에 분리 가능하게 결합되는 칫솔 보호용 캡부, 캡부 내에 장착된 칫솔 살균부 및 제어부로 구성된다. 세워서 거치할 수 있고 보관 중에 사용된 칫솔을 간단히 살균·건조할 수 있는 휴대형 살균 칫솔이다.","features":[{"k":"특징","v":"칫솔 살균부는 자외선 살균 램프와 건조 히터, 공기 배출유로부 및 송풍팬부를 포함하고, 캡부 하부면의 온오프 스위치가 손잡이 본체부에 결합되어 눌린 상태에서만 기설정 시간 동안 작동한다. 충전지와 충전량 확인 램프부를 두고, 칫솔 회전모터로 칫솔모를 회전시켜 고르게 살균한다."},{"k":"효과","v":"보관 중 즉시 살균·건조가 가능해 활용도가 높고 면역력이 취약한 유아의 치아 건강을 안정적으로 유지할 수 있다. 휴대가 용이해 야외나 여행 시에도 사용할 수 있으며, 동물·캐릭터 형상의 캡부로 유아가 양치에 거부감을 갖지 않게 한다."}],"lvl":3,"comparison":[{"item":"살균 장치 구성","old":"가정·실내용 별도 칫솔 살균기에 칫솔을 거치해 살균","new":"칫솔 보호용 캡 안에 자외선 살균 램프와 건조 히터를 내장"},{"item":"휴대 편의성","old":"살균기 휴대가 어려워 야외나 여행 중 살균이 곤란","new":"충전지를 갖춘 칫솔 일체형으로 장소에 관계없이 살균 가능"},{"item":"위생 관리 방식","old":"성인 칫솔과 함께 살균해 유아 칫솔만 관리하기 어려움","new":"캡을 씌우면 보관 중 해당 칫솔만 살균·건조가 수행됨"}],"applications":[{"title":"유아용 구강위생 용품","desc":"면역력이 취약한 유아의 칫솔을 사용 직후 살균·건조해 구내염 예방과 치아 건강 관리에 활용할 수 있다"},{"title":"휴대용 칫솔 살균 제품","desc":"충전지와 손잡이 받침부를 갖춘 일체형 구조로 야외 활동이나 여행용 휴대 칫솔 살균 제품에 적용된다"},{"title":"캐릭터 디자인 생활용품","desc":"보호용 캡을 동물이나 애니메이션 캐릭터 형상으로 만들어 유아의 양치 거부감을 줄이는 생활용품으로 쓸 수 있다"}],"figFile":"10-2021-0165605.jpg","figureCaption":"공보 대표도면"},{"id":"p1020220031221","title":"증강현실 기반 실내 소방 훈련 시스템","field":"소프트웨어","status":"등록","regNo":"10-2660077","regDate":"2024.04.18","appNo":"10-2022-0031221","appDate":"2022.03.14","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2042.03.14","inventor":"박윤용","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 증강현실 기술을 이용해 실내 재난에 대비한 소방 훈련을 지원하는 시스템에 관한 것으로, 실내 소방훈련장에 일정 간격으로 배치되어 블루투스 신호의 수신신호세기를 측정하는 복수의 액세스포인트, 소방 훈련자가 착용하는 증강현실 사용자 헬멧, 설정된 훈련 상황에 따라 재난을 재연하는 재난 재연 장치, 그리고 훈련 상황 데이터와 실내 지도 데이터를 제공하고 훈련 데이터를 수집·저장하는 중앙 서버로 구성된다.","features":[{"k":"특징","v":"중앙 서버가 수신신호세기로 훈련자와 가상 요구조자의 위치를 파악해 헬멧에 전달하면 헬멧은 재난 재연 영상·소리, 요구조자까지의 경로, 현재 위치가 표시된 실내지도, 발견 알람을 증강현실 화면에 출력하며, 액세스포인트의 비콘·온도·연기 센서가 측정한 온도와 연기 농도도 함께 표시한다."},{"k":"효과","v":"실제 연소 물질이나 가스를 사용하지 않고 증강현실로 재난 상황을 재연해 훈련자의 부상 위험 없이 구조·소화 훈련을 수행할 수 있으며, 훈련 중 수집된 영 ntor":"남연교","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 거북목 교정 운동기구에 관한 것으로, 등과 어깨뼈 주변 근육 및 목 근육이 정상 정렬상태를 유지한 상태에서 근력을 강화하는 운동을 수행할 수 있게 하는 기구를 제공한다. 자세를 바로잡아 주는 역할에 그쳤던 기존 거북목 교정기와 달리, 바로 선 자세나 바로 누운 자세에서 목의 정렬을 맞춘 뒤 부착된 밴드로 직접 근력 운동까지 할 수 있도록 구성된 점이 특징이다.","features":[{"k":"특징","v":"사람의 등을 받치는 등받이부, 등받이부 상단에서 앞쪽으로 돌출되어 뒷목을 받치는 목받이부, 목받이부 후면의 고리부로 구성되며, 측면 개방부를 통해 걸린 탄력밴드를 당기는 운동과 탄성 변형되는 목받이부를 이용한 목 운동을 반복할 수 있다."},{"k":"효과","v":"등과 어깨뼈 주변 근육을 강화해 어깨뼈를 안정화하고 목 근육을 강화하며, 운동 중 정상 정렬상태를 쉽게 인지할 수 있어 움직임 수행 능력 향상과 통증 완화, 거북목의 빠른 교정을 기대할 수 있다."}],"lvl":3,"comparison":[{"item":"교정 접근 방식","old":"목을 고정해 자세를 바로잡는 역할에 그치는 교정기","new":"정상 정렬 상태에서 근육 강화 운동을 수행"},{"item":"운동 기능 유무","old":"센서와 경고음으로 자세 변화만 알려 운동 기능이 없음","new":"고리부에 탄력밴드를 걸어 등·어깨뼈 근육 운동"},{"item":"사용 자세 범위","old":"착용형 목 받침대로 착용한 상태의 자세 유지에 한정","new":"벽면이나 바닥면에 밀착해 서거나 누워서 사용"}],"applications":[{"title":"거북목 교정 운동기구","desc":"잘못된 생활 습관으로 목의 정상 정렬이 무너진 거북목을 운동으로 교정하는 기구"},{"title":"어깨뼈 안정화 트레이닝","desc":"등과 어깨뼈 주변 근육을 강화해 어깨뼈를 안정화하고 가동범위 저하를 막는 트레이닝"},{"title":"자세 교정 재활 보조기구","desc":"목의 정상 정렬을 스스로 인지하게 도와 잘못된 자세에서의 운동 부상을 방지하는 보조기구"}],"figFile":"10-2024-0039847.jpg","figureCaption":"공보 대표도면"},{"id":"p1020240034305","title":"새싹보리 초음파 추출물을 유효성분으로 함유하는 혈행 개선 또는 항염증용 조성물","field":"의료","status":"공개","regNo":"","regDate":"","appNo":"10-2024-0034305","appDate":"2024.03.12","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2044.03.12","inventor":"김진우","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 새싹보리 초음파 추출물을 유효성분으로 함유하는 혈행 개선 또는 항염증용 조성물에 관한 것으로, 부작용이 보고된 합성의약품 소재를 대체할 안전성 높은 천연물 소재를 제공한다. 혈행 개선 또는 항염증용 식품 조성물은 물론 염증성 질환의 예방·치료용 약학 조성물, 피부염의 예방·개선용 화장료 조성물로 적용할 수 있으며, 관절염·비염·피부염 등 다양한 염증성 질환을 대상으로 한다.","features":[{"k":"특징","v":"새싹보리를 물, 탄소수 1~4의 저급알코올 또는 혼합용매와 섞어 20~50 kHz 진동수 및 50~700 W 파워의 초음파기로 40~90 ℃에서 5~60분간 처리해 추출하며, 추출물에서 클로로겐산과 쿠마린산이 지표물질로 확인되었다."},{"k":"효과","v":"초음파 처리를 생략한 추출물보다 총 폴리페놀·플라보노이드 함량과 지질·다당류 분해효소 저해능이 높고, NO 생성량과 지방구 형성, 지방세포 분화 유전자 발현을 감소시켜 독성 없이 혈행 개선 과를 확인해 환자별 재활 경과를 관리하는 체계"}],"figFile":"10-2024-0032158.jpg","figureCaption":"공보 대표도면"},{"id":"p1020190136438","title":"상품 정보 제공 및 상품 주문이 가능한 어플리케이션과 연동되는 스마트 자판기 관리 장치","field":"소프트웨어","status":"등록","regNo":"10-2645291","regDate":"2024.03.05","appNo":"10-2019-0136438","appDate":"2019.10.30","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2039.10.30","inventor":"한창호","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 상품 정보 제공 및 상품 주문이 가능한 어플리케이션과 연동되는 스마트 자판기 관리 장치에 관한 것으로, 자판기 내에 인입되는 음료 상품의 영상을 획득해 상품 수량, 유통 기한, 제품 정보를 파악한다. 사용자가 설정 거리 이내로 접근해 어플리케이션을 활성화하면 보유 음료 리스트를 제공받아 주문할 수 있고, 선택 정보에 따라 자판기 모터가 제어되어 해당 상품이 인출된다.","features":[{"k":"특징","v":"음료 상품의 바닥 이미지를 흑백 변환 및 이진화한 뒤 에지 영역에서 원을 검출해 그 크기와 개수로 수량을 파악하고, 검출된 원을 ROI 영역으로 설정해 유통기한 이미지를 추출하며, 바코드 영역은 이진화 후 검은색과 흰색 선의 간격 비율을 비교해 제품 정보를 판독한다."},{"k":"효과","v":"자판기 상품의 유통 기한과 보유 수량을 자동으로 파악해 식품 안전성에 대한 고객의 불안감을 줄일 수 있고, 관리자 단말에 제품 보유 현황, 판매 현황 및 회원 정보를 제공하여 판매 시간대와 비인기 품목까지 관리할 수 있다."}],"lvl":3,"comparison":[{"item":"상품 상태 관리","old":"유통기한과 위생 관리가 미흡해 식품 안전성 신뢰가 낮았다","new":"상품 영상의 원·ROI·바코드 검출로 수량과 유통기한을 파악"},{"item":"상품 정보 제공","old":"구매자가 자판기 상품의 정보를 확인할 수단이 부족하였다","new":"앱이 활성화된 사용자 단말에 자판기 내 음료 리스트를 제공"},{"item":"상품 구매 방식","old":"자판기 전면에서 직접 조작해 상품을 선택하고 구매하였다","new":"단말의 선택 정보를 받아 모터를 제어해 상품을 자동 인출한다"}],"applications":[{"title":"스마트 무인 판매","desc":"앱과 연동해 상품 리스트 제공과 주문·인출을 수행하는 무인 음료 자판기 운영에 적용한다"},{"title":"식품 안전성 관리","desc":"영상 인식으로 유통 기한과 제품 정보를 파악해 자판기 음료의 안전성 관리에 활용한다"},{"title":"자판기 운영 관리","desc":"관리자 단말에 제품 보유 현황, 판매 현황, 회원 정보를 제공해 운영과 재고 관리를 지원한다"}],"figFile":"10-2019-0136438.jpg","figureCaption":"공보 대표도면"},{"id":"p1020210102459","title":"게이미피케이션이 적용된 발달장애인의 훈련방법","field":"의료","status":"등록","regNo":"10-2645679","regDate":"2024.03.05","appNo":"10-2021-0102459","appDate":"2021.08.04","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2041.08.04","inventor":"유재호","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 게이미피케이션이 적용된 발달장애인의 훈련방법에 관한 것으로, 수동적으로 진행되어 흥미를 끌기 어려웠던 기존 신체·인지 훈련 프로그램의 한계를 보완한다. 복수의 피훈련자를 감지한 뒤 훈련시스템이 제공하는 컨텐츠 중 하나를 선정해 디스플레이에 증강현실로 구현하고, 피훈련자의 자세와 동작을 인식·분석하여 그룹별·개인별 수행 결과를 분석한다. 훈련 전후에는 사회성 평가 단계를 수행할 수 있다.","features":[{"k":"특징","v":"3D 뎁스 카메라가 일정 거리 이내의 피훈련자를 감지하고 어깨·팔꿈치·손목·척추·골반·무릎·발목 등의 움직임을 뼈대와 인체골격 정보로 분석하며, 컨텐츠의 난이도와 수행시간을 설정하고 포인트·레벨·점수를 도입해 수행 결과를 분석한다."},{"k":"효과","v":"게임 요소를 도입해 훈련에 대한 흥미와 자발적 참여율을 높여 훈련 성과를 향상시키고, 개인뿐 아니라 그룹 단위 훈련으로 사회성을 높일 수 있으며, 훈련 전후 사회성 평가를 비교해 증진 여부도 확인할 수 있다."}],"lvl":3,"comparison":[{"item":"훈련 참여 방식","old":"기존 훈련프로그램이 대부분 수동적으로 진행되는 방식","new":"증강현실 게이미피케이션으로 자발적 참여율을 높이는 방식"},{"item":"훈련 흥미 유발","old":"수동적 진행으로 피훈련자의 흥미를 유발하기 어려웠음","new":"게임 요소를 도입해 훈련 흥미와 훈련 성과를 함께 향상"},{"item":"사회성 증진 효과","old":"위축된 신체·인지활동과 낮은 사회성을 개선하지 못했음","new":"복수 피훈련자의 다자간 훈련으로 사회성을 증진하고 평가"}],"applications":[{"title":"발달장애인 훈련 프로그램","desc":"신체능력과 인지능력 향상을 목표로 하는 발달장애인 특수교육·훈련 프로그램"},{"title":"증강현실 훈련 콘텐츠","desc":"증강현실을 통해 다자간 게이미피케이션을 구현하는 재활·훈련 콘텐츠 개발 분야"},{"title":"사회성 평가 도구","desc":"훈련 전후의 사회성을 평가해 증진 여부를 확인하는 장애인 복지 평가 도구"}],"figFile":"10-2021-0102459.jpg","figureCaption":"공보 대표도면"},{"id":"p1020190126968","title":"스마트 지팡이","field":"생활","status":"등록","regNo":"10-2645290","regDate":"2024.03.05","appNo":"10-2019-0126968","appDate":"2019.10.14","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2039.10.14","inventor":"김대응","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 소모 전력을 감소시켜 사용 시간을 향상시킬 수 있는 스마트 지팡이에 관한 것으로, 사용자의 파지 여부를 감지하는 파지부, 지면 접촉 여부를 감지하는 지지부, 그리고 두 부분을 연결하며 주변 상황을 감지하고 판단해 알리는 본체부로 구성된다. 지팡이의 무게 한계로 배터리 용량을 충분히 확보할 수 없다는 문제를 해결하기 위해, 지팡이가 실질적으로 사용되는 때에만 감지부가 구동되도록 구성한 것이 특징이다.","features":[{"k":"특징","v":"파지부와 지지부에 각각 압력 센서를 두어 파지 압력과 지면 압력이 임계값 이상일 때 감지부로 허가 신호를 전송하고, 신호를 받은 감지부가 카메라, 심도 센서, 적외선 센서로 주변을 감지하며, 판단부가 위험 상황으로 판단하면 스피커와 진동 모터로 알림을 준다."},{"k":"효과","v":"사용자가 지팡이를 파지하고 지면에 지지한 경우에만 감지 기능이 동작하므로 소모 전력이 감소되며, 무게 한계로 배터리 용량을 충분히 확보할 수 없었던 스마트 지팡이의 사용 시간을 향상시킬 수 있다."}],"lvl":3,"comparison":[{"item":"주변 감지 동작","old":"카메라로 주변을 촬영해 보행정보를 음성으로 제공하였다","new":"파지·지면 압력이 임계값을 넘을 때만 주변 상황을 감지한다"},{"item":"전력 소모 구조","old":"지팡이 무게 한계로 배터리 용량을 충분히 확보할 수 없었다","new":"불필요한 감지를 차단해 소모 전력을 줄이고 사용 시간을 늘린다"},{"item":"위험 알림 방식","old":"지팡이 접촉이나 발바닥 감각으로 점자블럭을 직접 인지","new":"판단부가 위험 상황을 판단해 스피커와 진동 모터로 알린다"}],"applications":[{"title":"시각장애인 보행 보조","desc":"점자블럭 유도라인 보행 중 위험 상황을 감지해 소리와 진동으로 알려주는 보조기기로 활용한다"},{"title":"복지용 보조기기 산업","desc":"저전력 설계로 사용 시간을 늘린 스마트 지팡이 형태의 복지·재활 보조기기 제품에 적용한다"},{"title":"저전력 센서 제어","desc":"압력 센서의 허가 신호로 감지 모듈을 선택 구동하는 방식을 휴대형 기기 전력 절감에 응용한다"}],"figFile":"10-2019-0126968.jpg","figureCaption":"공보 대표도면"},{"id":"p1020240030561","title":"스피노사드 생산능이 향상된 재조합 사카로폴리스포라 스피노사 균주","field":"의료","status":"공개","regNo":"","regDate":"","appNo":"10-2024-0030561","appDate":"2024.03.04","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2044.03.04","inventor":"송재경","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 스피노사드 생산능이 향상된 재조합 사카로폴리스포라 스피노사 균주에 관한 것으로, 친환경 해충 방제제 성분인 스피노사드의 수율을 높이기 위해 UV 돌연변이 균주에 당(sugar) 코딩 유전자와 조절 유전자 bldA를 도입한 균주를 제공한다. 아울러 해당 균주의 제조방법, 이를 배양하는 스피노사드 생산방법 및 균주를 포함하는 해충 방제용 조성물을 함께 제공한다.","features":[{"k":"특징","v":"염색체 접합·통합에 적합한 pIBR-SPN 벡터를 구축해 람노스·포로사민 전구체 공급 유전자(rmbA, rmbB, rmbD, spnG, spnS)를 과발현시키고, 스트렙토마이세스 코엘리컬러 유래 글로벌 조절자 bldA를 함께 발현시킨 기탁 균주(KCTC 15785BP)를 이용한다."},{"k":"효과","v":"당 유전자 조합 도입만으로 야생형 대비 약 13~17배 스피노사드 수율이 향상되고, bldA를 함께 발현한 균주는 4,397 mg/L까지 생산해 친환경 해충 방제제를 고수율로 확보할 수 있다."}],"lvl":3,"comparison":[{"item":"균주 개량 방법","old":"조절 메커니즘이 불분명해 유전적 조작 기반 개량이 곤란","new":"UV 돌연변이 균주에 당 코딩 유전자와 bldA를 도입"},{"item":"당 전구체 공급","old":"람노스·포로사민 전구체 공급이 생산 속도를 제한","new":"rmbA·rmbB·rmbD·spnS·spnG 과발현으로 전구체 보강"},{"item":"유전자 도입 수단","old":"염색체에 유전자를 통합할 적합한 벡터가 부재","new":"pIBR-SPN 벡터와 pIBR25로 원형질체 형질전환"}],"applications":[{"title":"친환경 해충 방제제","desc":"곤충에는 독성을 보이나 포유동물에는 상대적으로 독성이 낮은 스피노사드 방제제 생산"},{"title":"작물 해충 방제 생균제","desc":"곡물 저장고와 야채·과일·관상용 작물의 해충 방제에 쓰이는 생균제 조성물로 적용"},{"title":"스피노사드 발효 생산 균주","desc":"기탁번호 KCTC 15785BP 재조합 균주를 발효해 스피노신 A와 D를 생산하는 산업 균주"}],"figFile":"10-2024-0030561.jpg","figureCaption":"공보 대표도면"},{"id":"p1020210165030","title":"차조기를 함유하는 고령친화식품","field":"식품","status":"등록","regNo":"10-2644939","regDate":"2024.03.04","appNo":"10-2021-0165030","appDate":"2021.11.26","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2041.11.26","inventor":"이상철","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 차조기를 함유하는 고령친화식품에 관한 것으로, 차조기 잎을 마이크로웨이브 진공장치로 저온 건조한 후 분쇄한 차조기 분말을 이용하여 쿠키를 제조하는 방법과 그 방법으로 제조된 차조기 함유 쿠키를 제공한다. 관절염 개선과 뼈 강화에 좋다고 알려진 차조기를 고령층이 손쉽게 섭취할 수 있는 간식 형태로 가공한 것이 특징이다.","features":[{"k":"특징","v":"차조기 잎을 35~45℃, 20~40 torr에서 3~5시간 저온진공 건조·분쇄한 분말에 쌀 분말, 누룽지 분말, 팽화미 분말, 설탕, 쇼트닝, 계란, 감자전분, 전지분유, 조청, 난소화성말토덱스트린, 분리대두단백, 해조칼슘 등을 최적 배합비로 혼합해 반죽을 만들고 160~180℃에서 10~20분 굽는다."},{"k":"효과","v":"관절염으로 고통받는 고령층 소비자를 위한 유용한 간식을 제공할 수 있고, 밀가루 대신 쌀을 주재료로 하여 소화가 잘 되며, 향·맛·조직감 및 종합 기호도에서 비교예보다 높은 관능 평가를 얻어 맛과 식감이 우수하다."}],"lvl":3,"comparison":[{"item":"관절 건강 관리","old":"진통제·연골보호제 복용으로 통증과 염증을 일시 완화","new":"관절염과 뼈 강화에 좋다고 알려진 차조기를 식품으로 섭취"},{"item":"차조기 가공 방식","old":"차조기 잎을 향료·착색제나 떡·죽의 재료로 단순 이용","new":"마이크로웨이브 진공장치로 건조한 뒤 분쇄해 분말로 배합"},{"item":"쿠키 주원료","old":"호정화·효소처리 쌀가루를 이용한 쌀쿠키에 한정","new":"밀가루 없이 쌀·누룽지·팽화미 분말에 해조칼슘 등을 배합"}],"applications":[{"title":"고령친화식품 제조","desc":"손쉽게 섭취할 수 있고 풍미와 기호도가 우수한 쿠키 형태의 고령친화식품으로 제조할 수 있다"},{"title":"관절 건강 기능성 간식","desc":"관절염으로 고통받는 고령층 소비자를 대상으로 뼈 건강과 관절에 좋은 차조기를 담은 간식으로 공급할 수 있다"},{"title":"쌀 가공식품·제과 산업","desc":"밀가루를 쓰지 않고 쌀을 주재료로 하여 소화가 잘되는 쌀 베이커리 제품군을 개발하는 데 적용된다"}],"figFile":"10-2021-0165030.jpg","figureCaption":"공보 대표도면"},{"id":"p1020240028027","title":"퀘스트를 이용한 가족 소통 서비스 제공 장치","field":"기계","status":"공개","regNo":"","regDate":"","appNo":"10-2024-0028027","appDate":"2024.02.27","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2044.02.27","inventor":"석희성","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 퀘스트를 이용한 가족 소통 서비스 제공 장치에 관한 것으로, 가족 구성원이 하나의 그룹을 형성해 일상을 공유하고 교육·학습·여행·생활 등의 활동을 퀘스트 목표로 수행하도록 지원한다. 핵가족화와 맞벌이로 가족 간 의사소통이 줄고 자녀의 교육·동기부여가 어려워진 문제를 퀘스트와 보상 체계로 해결하고자 한 것으로, 주최자가 설정한 목표의 성공 여부에 따라 보상이 지급되는 구조를 갖는다.","features":[{"k":"특징","v":"그룹생성부, 캘린더제공부, 퀘스트생성부, 보상설정부, 퀘스트판단부, 결과확인부, 저장부로 구성되며, 주최자가 장소·시간·일자에 따른 퀘스트목표를 설정하고 난이도별로 보상을 설정하고 참여자가 입력한 사진·위치·시간 정보를 AI 및 딥러닝으로 성공기준과 대조해 성공 여부를 판단한 뒤 내부포인트와 현금포인트로 보상을 지급한다."},{"k":"효과","v":"가족 구성원 간의 친밀감과 성취감을 높이고, 보상에 따른 동기부여로 퀘스트를 효율적으로 수행하게 하며, 함께 참여하는 활동을 통해 의사소통과 관계 개선, 규칙적인 생활습관 형성 및 긍정적인 자아 이미지 확립을 기대할 수 있다."}],"lvl":3,"comparison":[{"item":"소통 활동 범위","old":"캘린더와 이벤트, 응원 메시지 전송 수준에 머무름","new":"교육·학습·여행·생활을 퀘스트 목표로 함께 수행"},{"item":"동기부여 수단","old":"알림으로 소식만 전달해 동기부여 기능이 없음","new":"난이도별 보상을 설정·가산해 퀘스트 수행을 유도"},{"item":"수행 결과 관리","old":"활동 성공과 실패를 판단하고 기록하는 절차가 없음","new":"성공·실패를 판단해 보상 지급 또는 재수행을 결정"}],"applications":[{"title":"가족 소통 애플리케이션","desc":"핵가족화와 맞벌이로 줄어든 가족 구성원 간 일상 공유와 의사소통을 돕는 전용 앱 서비스"},{"title":"자녀 생활습관 형성 도구","desc":"부모가 주최자로 퀘스트를 생성하고 자녀가 수행하며 학습과 생활습관을 형성하는 도구"},{"title":"보상 기반 목표관리 플랫폼","desc":"주최자가 난이도와 보상을 설정하고 성공 여부에 따라 보상을 지급하는 목표관리 플랫폼"}],"figFile":"10-2024-0028027.jpg","figureCaption":"공보 대표도면"},{"id":"p1020240027936","title":"정보 격차 해소를 위한 뉴스 요약 서비스 제공 시스템","field":"소프트웨어","status":"공개","regNo":"","regDate":"","appNo":"10-2024-0027936","appDate":"2024.02.27","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2044.02.27","inventor":"우에노고홍","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 정보 격차 해소를 위한 뉴스 요약 서비스 제공 시스템에 관한 것으로, 장애나 노화로 인터넷 사용이 어려운 정보 취약계층에게 알기 쉬운 뉴스 기사를 생성해 제공한다. 온라인으로 뉴스 기사를 수집하는 수집부, 주제별로 비교 분석해 핵심 내용을 분류하는 분석부, 통합 뉴스 기사를 생성하는 생성부, 전용 앱으로 제공하는 제공부로 구성된다. 수집·분석·생성·제공 기능은 하나의 메인 서버에 포함되어 수행된다.","features":[{"k":"특징","v":"분석부는 육하원칙에 기반해 공통 핵심 내용과 차이 나는 핵심 내용을 분류하고, 생성부는 절충 가능한 내용은 통합하고 절충이 불가한 내용은 출처와 함께 표시하며, 문장·단어 간소화와 이미지 유사도 판단에 따른 이미지 삽입, 텍스트 음성 변환 기능을 수행한다."},{"k":"효과","v":"인터넷으로 수집한 다수의 뉴스 기사를 바탕으로 알기 쉬운 통합 기사를 생성하고 음성 재생 등 편의 기능과 함께 전용 앱으로 제공하므로, 정보화 수준에 따른 세대 간 정보 격차 문제를 일정 부분 해소할 수 있다."}],"lvl":3,"comparison":[{"item":"정보 접근 방식","old":"QR 코드를 촬영해야 소식지 정보를 받을 수 있어 접근성 저하","new":"전용 앱의 이용자 입력만으로 기사를 제공받음"},{"item":"기사 가공 제거 신경망의 학습 시스템 및 방법","field":"소프트웨어","status":"등록","regNo":"10-2640143","regDate":"2024.02.20","appNo":"10-2022-0040839","appDate":"2022.03.31","applicant":"주식회사 오엔디자인 · 선문대학교 산학협력단","coApplicant":true,"expiry":"2042.03.31","inventor":"유원상","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 피부 이미지에 포함된 털 이미지를 제거하는 신경망의 학습 시스템 및 방법에 관한 것으로, 합성 신경망으로 구현되는 털 제거 신경망과 진위 판별 신경망으로 이루어진 생성적 적대 신경망 기반의 비지도 학습을 이용한다. 털 제거 신경망은 털이 포함된 피부 이미지를 입력받아 털이 제거된 이미지를 생성하고, 진위 판별 신경망은 생성된 이미지가 비교 이미지에 대비해 가짜인지를 판단한다.","features":[{"k":"특징","v":"판별 결과를 털 제거 신경망에 피드백해 비교 이미지에 더 가까운 털 제거 이미지를 생성하도록 학습시키며, 학습용 입력은 털이 없는 원본 이미지에 털 영역분할 신경망의 털 패턴 정보로 만든 털 마스크를 합성해 생성하고, CycleGAN 방식으로 재합성 이미지와의 차이를 최소화한다."},{"k":"효과","v":"짝지어진 정답 데이터를 따로 구축하지 않고도 털 제거용 신경망을 효과적으로 학습시킬 수 있어, 털에 가려 병변 판별이 어려운 반려동물 등의 피부 이미지 분석 전처리 기술로 활용할 수 있다."}],"lvl":2,"applications":[{"title":"피부 영상 전처리","desc":"털이 포함된 피부 이미지에서 털을 제거한 영상을 생성해 피부 영상 분석의 전처리에 활용할 수 있다"},{"title":"털 영역분할 신경망 학습","desc":"교사 신경망이 추출한 털 영역 정보와의 유사도에 기반한 대조손실함수로 털 영역분할 신경망을 학습시킨다"},{"title":"비지도 학습 영상 생성","desc":"서로 다른 대상을 촬영한 이미지만으로도 털 제거 신경망을 학습시키는 비지도 학습 방식에 적용된다"}],"figFile":"10-2022-0040839.jpg","figureCaption":"공보 대표도면"},{"id":"p1020200113035","title":"시험 문제 자동 출제 방법","field":"소프트웨어","status":"등록","regNo":"10-2640034","regDate":"2024.02.20","appNo":"10-2020-0113035","appDate":"2020.09.04","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2040.09.04","inventor":"이지연","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 각 응시자에게 비대면으로 시험 문제를 제공하는 문제은행 방식의 시험 문제 자동 출제 방법에 관한 것으로, 서버 접속 후 응시하는 단계, 출제 문제와 응시 결과를 채점·저장하는 기록 단계, 시험 결과 데이터를 분류하는 분류 단계를 포함한다. 기존 출제가 응시자별로 선택지 배열만 달리하는 수준에 머물러 수험 능력 향상의 대안을 제시하지 못한 점을 개선하고 출제자의 출제 부담을 덜고자 한다.","features":[{"k":"특징","v":"분류 단계는 응시자 시험 결과를 분석해 단원별 정답률에 따라 분류하는 제1 분류 단계와 출제자 의도의 난이도에 따라 분류하는 제2 분류 단계로 나뉘며, 두 단계에서 추출하거나 매칭하여 실전 문제 또는 개인별 연습 문제로 출제한다. 단말기 카메라·마이크·화면 녹화를 활용한 제1·제2 검수 단계로 부정행위를 관찰·판별한다."},{"k":"효과","v":"시험 문제를 과목 및 단원별로 세분화해 응시자의 수험 역량을 평가할 수 있고, 정답률과 출제자 의도 난이도를 함께 반영해 보다 공정한 평가가 가능하다. 연습 시험에서 문항별 제한 시간과 잔여 시간에 따른 가산점으로 응시자를 독려해 학습 능력과 실제 정답률을 높일 수 있으며, 비대면 온라인 시행으로 전염병 확산도 예방할 수 있다."}],"lvl":3,"comparison":[{"item":"문제 출제 방식","old":"문제은행에서 응시자별로 선택지 배열만 다르게 하는 수준","new":"정답률과 출제자 의도 난이도로 분류해 문제를 자동 출제"},{"item":"학습 지원 기능","old":"시험 결과만 채점하고 응시자별 학습 대안을 제시하지 못함","new":"분류 결과를 연습 문제로 반영해 개인별 반복 학습을 제공"},{"item":"출제자 업무 부담","old":"출제자가 과목·단원별 문항을 직접 선별해 출제해야 하는 부담","new":"문제은행 데이터베이스 기반 자동 출제로 출제 수고를 절감"}],"applications":[{"title":"비대면 온라인 평가","desc":"공간 제약 없이 응시자에게 시험 문제를 제공하고 결과 처리를 수행하는 온라인 평가"},{"title":"원격 강의 학습 평가","desc":"원격 강의와 연계해 과목 및 단원별로 세분화한 문항으로 응시자의 학습 능력을 평가"},{"title":"자격 검정 문제은행","desc":"자격 검증 목적의 시험에서 난이도를 조절한 문항을 공정하게 출제하는 문제은행"}],"figFile":"10-2020-0113035.jpg","figureCaption":"공보 대표도면"},{"id":"p1020240024034","title":"차량용 윈도우 충격장치","field":"건설","status":"공개","regNo":"","regDate":"","appNo":"10-2024-0024034","appDate":"2024.02.20","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2044.02.20","inventor":"강민수","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 긴급 상황에서 차량 내부의 탑승자가 윈도우를 신속하게 파괴할 수 있도록 하는 차량용 윈도우 충격장치에 관한 것으로, 윈도우가 커버하는 개구부가 형성된 도어부, 도어부 내측에 배치되어 윈도우와 접촉 가능한 타격부, 외부에서 가해지는 외력으로 타격부에 동력을 전달해 타격부를 윈도우에 충돌시키는 트리거부를 포함한다. 긴급 상황에서 창문 파괴에 시간과 체력이 소모되는 문제를 개선하기 위한 것이다.","features":[{"k":"특징","v":"타격부는 도어부에 고정된 하우징부와 탄성지지부로 지지되는 타격본체부, 트리거부의 동력으로 이동을 제어하는 제어부로 구성되며, 다른 실시예에서는 충돌부가 발화부와 충돌해 하우징 내 타격체를 폭발시켜 윈도우를 파괴한다. 타격부는 윈도우 하측 영역에 배치된다."},{"k":"효과","v":"사고 등 긴급 상황에서 이동모듈부가 구동되지 않아 윈도우를 내릴 수 없는 상태에서도 사용자가 도어부에 충격을 가하는 기계적 방법으로 윈도우의 일부 영역을 신속히 파괴해 개구부를 개방하고 안전하게 탈출할 수 있다."}],"lvl":3,"comparison":[{"item":"파괴 수행 방식","old":"탑승자가 직접 창문을 깨야 해 시간과 체력을 소모","new":"트리거부 외력을 타격부에 전달해 윈도우를 타격"},{"item":"장치 설치 위치","old":"차량 외부나 별도 위치의 고정형 유리파괴 장치 사용","new":"도어부 내측 윈도우 하측 영역에 타격부를 내장"},{"item":"윈도우 파괴 범위","old":"윈도우 전체를 깨뜨려야 탈출 통로를 확보할 수 있음","new":"소정 영역만 부분 파괴해 도어 개구부를 개방"}],"applications":[{"title":"차량 비상 탈출 장치","desc":"사고 등 긴급 상황에서 탑승자가 도어 내측 장치로 윈도우를 깨고 탈출하는 비상 장치"},{"title":"도어 내장형 유리파괴 모듈","desc":"하우징부와 탄성지지부, 제어부로 이루어진 타격부를 도어부에 위치 고정하는 내장형 모듈"},{"title":"발화식 타격체 구동 장치","desc":"충돌부가 발화부와 충돌하면 타격체를 폭발시켜 윈도우를 파괴하는 발화 구동 방식"}],"figFile":"10-2024-0024034.jpg","figureCaption":"공보 대표도면"},{"id":"p1020210104076","title":"베르바민 및 아프레피탄트를 포함하는 뇌암 치료, 개선 또는 예방용 조성물","field":"의료","status":"등록","regNo":"10-2639035","regDate":"2024.02.16","appNo":"10-2021-0104076","appDate":"2021.08.06","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2041.08.06","inventor":"정혜진","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 화학적 합성치사 상호작용(chemical synthetic lethality)을 이용한 뇌암 치료용 조성물에 관한 것으로, CaMKII 억제 활성을 갖는 알칼로이드 베르바민과 뉴로키닌-1 수용체 대항제인 아프레피탄트를 유효성분으로 함께 포함한다. 자기재생·분화 능력으로 종양 재발과 전이를 일으키는 뇌암 줄기세포를 선택적으로 겨냥하며, 약학적 조성물과 건강기능식품을 포함한 식품 조성물로 제공된다.","features":[{"k":"특징","v":"베르바민과 아프레피탄트를 1:0.1~6의 몰 농도비로 병용 처리하여 CaMKII 신호와 NK1 수용체 경로를 동시에 억제하며, 인간 교모세포종 U87MG·U373MG 유래 암줄기유사세포에서 단독 처리 대비 세포 생존을 현저히 낮추는 합성치사 상호작용을 나타낸다."},{"k":"효과","v":"개별 성분 단독 투여와 비교해 암줄기유사세포에 대한 상승적 합성치사 상호작용을 보이고 신경구체 형성도 강력하게 억제하므로, 뇌암 치료·예방·개선 용도의 약학 및 식품 소재로 유용하게 이용될 수 있다."}],"lvl":3,"comparison":[{"item":"치료 접근 방식","old":"수술·방사선 및 화학요법이 뇌암 치료의 주종을 이룸","new":"베르바민과 아프레피탄트 병용투여로 화학적 합성치사 상호작용을 유도"},{"item":"약물 작용 표적","old":"세포독소가 빠르게 성장하는 세포를 손상·사멸시킴","new":"재발·전이의 원인인 뇌암 줄기세포를 선택적으로 사멸시킴"},{"item":"병용 상승효과","old":"개별 성분 단독 투여로는 상승적 억제 효과를 얻기 어려움","new":"베르바민 및 아프레피탄트 병용으로 신경구체 형성까지 현저하게 억제"}],"applications":[{"title":"뇌암 치료용 의약품","desc":"베르바민 및 아프레피탄트을 유효성분으로 포함하는 뇌암 예방 또는 치료용 약학적 조성물 개발"},{"title":"뇌암 개선 식품 조성물","desc":"베르바민·아프레피탄트 조합을 유효성분으로 포함하는 뇌암 예방 또는 개선용 식품 조성물 분야"},{"title":"암줄기세포 표적 치료","desc":"암줄기세포의 자가재생능·증식능을 제어하는 표적 항암 치료 연구 및 개발 분야"}],"figFile":"10-2021-0104076.jpg","figureCaption":"공보 대표도면"},{"id":"p1020210104078","title":"베르바민 및 SR 140333을 포함하는 뇌암 치료, 개선 또는 예방용 조성물","field":"의료","status":"등록","regNo":"10-2639036","regDate":"2024.02.16","appNo":"10-2021-0104078","appDate":"2021.08.06","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2041.08.06","inventor":"정혜진","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 화학적 합성치사 상호작용(chemical synthetic lethality)을 이용한 뇌암 치료용 조성물에 관한 것으로, CaMKII 억제제인 알칼로이드 베르바민과 NK1 수용체 억제제인 SR 140333을 유효성분으로 함께 포함한다. 종양 형성능과 자기재생능으로 재발·전이의 원인이 되는 뇌암 줄기세포를 선택적으로 겨냥하며, 약학적 조성물과 건강기능식품을 포함한 식품 조성물로 제공된다.","features":[{"k":"특징","v":"베르바민과 SR 140333을 1:0.5~10의 몰 농도비로 병용하여 CaMKII 신호와 NK1 수용체 경로를 동시에 차단하는 구성으로, 각 성분 단독 처리로는 U87MG·U373MG 암줄기유사세포에 영향이 없는 농도에서도 병용 시 강력한 합성치사 상호작용을 나타낸다."},{"k":"효과","v":"병용 투여만으로 암줄기유사세포의 생존과 신경구체 형성을 강력하게 억제하는 상승 효과를 얻을 수 있어, 낮은 농도로도 뇌암 줄기세포를 제거하는 치료·예방·개선 소재로 유용하게 이용될 수 있다."}],"lvl":3,"comparison":[{"item":"치료 접근 방식","old":"수술·방사선 및 화학요법이 뇌암 치료의 주종을 이룸","new":"베르바민과 SR 140333 병용투여로 화학적 합성치사 상호작용을 유도"},{"item":"약물 작용 표적","old":"세포독소가 빠르게 성장하는 세포를 손상·사멸시킴","new":"재발·전이의 원인인 뇌암 줄기세포를 선택적으로 사멸시킴"},{"item":"병용 상승효과","old":"개별 성분 단독 투여로는 상승적 억제 효과를 얻기 어려움","new":"베르바민 및 SR 140333 병용으로 신경구체 형성까지 현저하게 억제"}],"applications":[{"title":"뇌암 치료용 의약품","desc":"베르바민 및 SR 140333을 유효성분으로 포함하는 뇌암 예방 또는 치료용 약학적 조성물 개발"},{"title":"뇌암 개선 식품 조성물","desc":"베르바민·SR 140333 조합을 유효성분으로 포함하는 뇌암 예방 또는 개선용 식품 조성물 분야"},{"title":"암줄기세포 표적 치료","desc":"암줄기세포의 자가재생능·증식능을 제어하는 표적 항암 치료 연구 및 개발 분야"}],"figFile":"10-2021-0104078.jpg","figureCaption":"공보 대표도면"},{"id":"p1020220051509","title":"줄 꼬임을 이용한 모빌리티용 가변 서스펜션","field":"건설","status":"등록","regNo":"10-2638576","regDate":"2024.02.15","appNo":"10-2022-0051509","appDate":"2022.04.26","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2042.04.26","inventor":"강민수","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 줄꼬임 구동기(TSA)를 이용한 모빌리티용 가변 서스펜션에 관한 것으로, 코일 형상의 스프링과 양단의 스프링시트, 한쪽 스프링시트에 결합되어 회전축이 스프링 내측을 향하는 모터, 모터 회전축과 반대쪽 스프링시트를 연결하는 선형부재로 구성된다. 모터 회전으로 줄이 꼬이면서 스프링 압축 상태를 조절해 서스펜션 특성을 가변하며, 구조가 복잡하고 고가인 에어 서스펜션을 대체할 수 있다.","features":[{"k":"특징","v":"모터가 동일 방향으로 반복 회전할수록 선형부재가 더 꼬여 길이가 줄어들고 두 스프링시트 사이 거리가 좁혀져 스프링이 압축되며 스프링 상수가 조정된다. 선형부재는 내구성 확보를 위해 선재고정부재에 2개 이상 결합할 수 있고, 모터에는 회전을 감속해 전달하는 감속기를 둔다."},{"k":"효과","v":"비교적 단순하고 저렴한 구조로 서스펜션 스프링의 강성을 조절하면서 감쇠기 역할까지 수행할 수 있다. 또한 주행 노면의 요철과 주행 상황에 따라 서스펜션 스트로크와 차체 높이를 조정해 서스펜션의 성격을 변화시킬 수 있다."}],"lvl":3,"comparison":[{"item":"강성 설정 방식","old":"차종 성격에 따라 하드 또는 소프트로 고정 세팅해 사용","new":"모터로 줄을 꼬아 스프링 강성을 주행 중 가변 조절"},{"item":"감쇠 기능 수단","old":"코일 스프링과 하부 고정체 내부의 별도 완충수단으로 흡수","new":"줄 꼬임 구동기가 강성 조절과 감쇠기 역할을 함께 수행"},{"item":"구조와 비용","old":"상부·하부 고정체와 완충수단을 갖춘 복잡한 구성","new":"스프링시트·모터·선형부재의 단순 구조로 저렴하게 구현"}],"applications":[{"title":"차량용 가변 서스펜션","desc":"주행 상황에 따라 스프링 강성을 바꿔 승차감과 운동 성능을 함께 확보하는 현가장치로 적용"},{"title":"퍼스널 모빌리티 현가장치","desc":"단순하고 저렴하게 구현되는 줄 꼬임 구조라 소형 모빌리티의 가변 현가 모듈로 활용 가능"},{"title":"줄 꼬임 구동기 모듈","desc":"감속기를 갖춘 모터와 복수의 선형부재로 선형 변위와 힘을 만드는 TSA 구동 모듈로 응용"}],"figFile":"10-2022-0051509.jpg","figureCaption":"공보 대표도면"},{"id":"p1020240020870","title":"인삼 유래 세포외 소포체를 포함하는 조성물","field":"의료","status":"공개","regNo":"","regDate":"","appNo":"10-2024-0020870","appDate":"2024.02.14","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2044.02.14","inventor":"김진우","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 인삼 유래 세포외 소포체를 포함하는 조성물에 관한 것으로, 인삼 캘러스 배양액에서 분리한 평균 직경 150 내지 250 nm의 세포외 소포체(extracellular vesicles)를 유효성분으로 함유한다. 창상 치료용 외용 조성물, 주름개선용 화장료 조성물 및 창상 치료용 패치의 형태로 제공된다. 인삼 캘러스 배양액을 원심분리·여과한 뒤 크기 기반으로 분획하여 소포체를 수득한다.","features":[{"k":"특징","v":"세포외 소포체는 1.0X10^6 내지 9.0X10^9 particles/ml의 농도로 함유되며, 피부 섬유아세포의 이동성을 높이고 TGF-β, SMAD-2, SMAD-3, COL1A1, PDGF, VEGF, bFGF의 발현을 증가시켜 콜라겐 합성과 혈관 신생을 촉진한다."},{"k":"효과","v":"독성이 없고 세포 이동성이 우수하여 피부 재생 효과가 뛰어나므로 창상 치료 및 흉터 관리용 창상치료제로 활용할 수 있고, 창상에 의한 질환이나 주름을 개선하는 기능성 화장품 조성물로도 사용할 수 있다."}],"lvl":3,"comparison":[{"item":"창상 치료 소재","old":"스테로이드 연고와 항생제 연고를 쓰는 합성 약물 중심","new":"인삼에서 유래한 생체 친화적 세포외 소포체를 유효성분화"},{"item":"부작용 위험","old":"곰보자국·피부주름·모낭염, 항생제 내성 우려가 보고","new":"독성이 없어 연약한 피부에도 적용 가능한 천연 소재"},{"item":"피부 재생 기능","old":"소염·항균에 치우쳐 피부 재생을 유도하는 기능은 미흡","new":"콜라겐 합성과 창상 치유 핵심 유전자 발현을 높임"}],"applications":[{"title":"창상 치료용 외용제","desc":"평균 직경 150~250nm 세포외 소포체를 함유해 상처 봉합을 돕는 창상 치료용 외용 조성물"},{"title":"주름개선 화장료 조성물","desc":"섬유아세포의 콜라겐 합성을 유도해 피부 탄력을 높이는 주름개선용 기능성 화장품 소재"},{"title":"창상 치료용 패치","desc":"세포외 소포체를 담지한 패치 형태로 제조해 상처 부위에 부착하고 흉터를 관리하는 용도"}],"figFile":"10-2024-0020870.jpg","figureCaption":"공보 대표도면"},{"id":"p1020240021128","title":"동충하초 초음파 추출물을 유효성분으로 포함하는 항산화 또는 면역 증강용 조성물","field":"의료","status":"공개","regNo":"","regDate":"","appNo":"10-2024-0021128","appDate":"2024.02.14","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2044.02.14","inventor":"김진우","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 동충하초(Cordyceps militaris) 초음파 추출물을 유효성분으로 포함하는 항산화 또는 면역 증강용 조성물에 관한 것으로, 물, 탄소수 1 내지 4의 저급알코올 또는 이들의 혼합용매 하에서 초음파로 추출한 성분을 사용한다. 식품 조성물 또는 약학 조성물의 형태로 제공된다. 동충하초와 추출용매를 1 : 5 내지 25의 중량비로 혼합해 초음파 처리하여 유효성분을 추출한다.","features":[{"k":"특징","v":"추출물은 20~85℃ 하에서 50~700 W 파워의 초음파기로 10~60분 동안 처리해 수득하며, 열수·알코올 추출물보다 총 폴리페놀 및 총 플라보노이드 함량이 높고 대식세포에서 NF-kB, COX-2, PGE2의 발현을 농도 의존적으로 증가시킨다."},{"k":"효과","v":"항산화능과 면역 기능을 증진시키는 효능이 뛰어나고 독성이 없어 장기간 섭취가 가능하므로, 일상적인 식이와 생활습관을 통한 면역력 관리와 항산화·면역 증강용 식품 및 의약품 제조에 활용할 수 있다."}],"lvl":3,"comparison":[{"item":"복용 목적 범위","old":"예방보다 치료용으로 복용되는 시판 면역 증강제 중심","new":"독성이 없어 예방과 치료에 모두 적합한 조성물"},{"item":"장기 섭취 가능성","old":"부작용 문제로 장기 복용이 어려운 면역 증강제와 치료제","new":"독성이 없어 일상 식이로 장기 섭취가 가능"},{"item":"추출 처리 조건","old":"추출 조건이 특정되지 않은 통상의 용매 추출 방식","new":"50~700W 초음파로 20~85℃에서 10~60분간 처리"}],"applications":[{"title":"면역 증강 건강기능식품","desc":"저하된 면역기능을 증진시키는 기능성을 활용해 장기 섭취하는 면역 증강용 식품 조성물"},{"title":"항산화 식품 소재","desc":"동충하초 초음파 추출물의 항산화능을 이용해 일상 식이와 생활습관으로 산화 방어를 돕는 소재"},{"title":"면역 증강용 의약품","desc":"동충하초 초음파 추출물을 유효성분으로 하는 약학 조성물 형태의 면역 증강용 의약품 제조"}],"figFile":"10-2024-0021128.jpg","figureCaption":"공보 대표도면"},{"id":"p1020210121745","title":"CYP105D18 효소를 이용한 이소퀴놀린 알칼로이드 화합물의 N-산화 생물전환 방법","field":"의료","status":"등록","regNo":"10-2638205","regDate":"2024.02.14","appNo":"10-2021-0121745","appDate":"2021.09.13","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2041.09.13","inventor":"오태진","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 CYP105D18 효소를 이용한 이소퀴놀린 알칼로이드 화합물의 N-산화 생물전환 방법에 관한 것으로, CYP105D18을 이용하여 파파베린, 코데인, 베르베린 등의 이소퀴놀린 알칼로이드 화합물을 N-산화시키는 단계를 포함한다. 이 방법으로 얻어진 이소퀴놀린 알칼로이드 화합물도 함께 제공하며, 변형된 파파베린은 효능이 개선되고 세포 독성이 감소하는 것으로 확인되었다.","features":[{"k":"특징","v":"CYP105D18은 스트렙토마이세스 로렌티이 유래 시토크롬 P450으로, 파파베린에 대한 Km 값은 212~215 μM, Kcat 값은 4~6 min-1이며, 과산화수소를 산소 대리물로 사용해도 200 mM 고농도에서 헴 산화 속도가 0.3 min-1 미만으로 낮다. 구부러질 수 있는 구조 덕분에 이소퀴놀린 알칼로이드에 대한 기질 선호도가 높다."},{"k":"효과","v":"과산화수소에 대한 높은 내성과 독특한 기질 특이성을 가지므로 고효율로 이소퀴놀린 알칼로이드 화합물을 N-산화시킬 수 있다. 또한 약학 분야에서 기존 스테로이드를 대체할 수 있는 약물 개발 방법으로 유용하게 사용될 수 있다."}],"lvl":3,"comparison":[{"item":"반응 전환 유형","old":"효소 생물전환이 진세노사이드 등 특정 성분에 한정됨","new":"CYP105D18로 이소퀴놀린 알칼로이드를 N-산화시킴"},{"item":"반응 효율성","old":"CYP 반응에 값비싼 보조인자와 산화환원 파트너가 필요","new":"과산화수소를 이용한 션트 경로로 고효율 N-산화 수행"},{"item":"효소 안정성","old":"과산화수소에 의한 헴 산화로 활성 유지가 쉽지 않음","new":"200mM 고농도 과산화수소에서도 헴 산화 속도가 낮음"}],"applications":[{"title":"알칼로이드 생물전환","desc":"파파베린·코데인·베르베린 등 이소퀴놀린 알칼로이드를 N-산화 유도체로 전환하는 분야"},{"title":"의약품 후보물질 개발","desc":"기존 스테로이드를 대체할 수 있는 약물 개발 방법으로 N-산화 알칼로이드를 활용"},{"title":"산업용 효소 촉매","desc":"과산화수소 내성이 높은 시토크롬 P450을 이용한 생명공학 산화 반응 촉매 분야"}],"figFile":"10-2021-0121745.jpg","figureCaption":"공보 대표도면"},{"id":"p1020240019747","title":"TV 시청패턴 분석 장치","field":"소프트웨어","status":"공개","regNo":"","regDate":"","appNo":"10-2024-0019747","appDate":"2024.02.08","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2044.02.08","inventor":"남연교","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 TV 시청패턴 분석 장치에 관한 것으로, 모니터링 대상자의 TV 시청기록을 시간순으로 정렬해 전처리하는 전처리부, 설정 주기로 시청패턴을 산출하는 시청패턴 분석부, 산출된 패턴 데이터 세트를 학습해 시청패턴 모델을 생성하는 모델링부, 그 모델로 실시간 시청기록의 이상 여부를 판별하는 모니터링부로 구성된다. 고령자의 TV 시청패턴 분석으로 건강이상징후를 발견하려는 장치다.","features":[{"k":"특징","v":"전처리부는 TV에 연결된 시청기록 수집기로부터 기록을 수집해 중복 데이터를 제거하고 시청기록이 없는 시간은 공백으로 처리하며, 모니터링부는 판별 결과가 이상인 경우 모니터링 대상자를 돌보는 사용자의 단말로 건강 이상 알람 메시지를 전송한다."},{"k":"효과","v":"채널·프로그램·장르별 시청 시간대와 이동경로, 1일 시청 시작·종료 시각을 담은 시청패턴 모델로 평소와 다른 변화를 포착해, 모니터링 대상자의 건강 이상을 조기에 발견하고 조치를 는 피드백 콘텐츠 제공부로 구성된다.","features":[{"k":"특징","v":"주파수 특징 추출부는 20~40ms 프레임 분할, 해밍 윈도우 함수, 푸리에 변환, 멜 스케일 변환, 주파수 필터링, 로그 변환, 캡셀럼 변환을 거쳐 MFCC를 추출한다. 임계치 분석부는 에너지 변화량이 임계값을 넘는 프레임이 지속되면 스트레스 상태로 판단하고, 기계 학습부가 사용자별로 재조정한다."},{"k":"효과","v":"AI 음성 인식을 기반으로 음성의 감성을 판단해 사용자의 감성에 대응하는 결과물을 도출할 수 있다. 또한 주파수 스펙트럼 특정 구간의 주파수 성분 변화량을 도출함으로써 그 변화량에 대응하는 사용자의 스트레스 상태를 판별할 수 있다."}],"lvl":3,"comparison":[{"item":"음성 분석 목적","old":"발화된 단어 분석 중심으로 발화 의도 인식에 한정됨","new":"프레임별 주파수 스펙트럼으로 스트레스 상태를 판단"},{"item":"감성 판단 범위","old":"단어에 포함된 음성의 감성은 판단하지 못하는 한계","new":"음성 에너지 변화 패턴과 기계 학습으로 감성 판별"},{"item":"결과 활용 방식","old":"인식 결과를 자연스러운 문장으로 음성 처리할 뿐임","new":"AI 서버에서 스트레스별 콘텐츠를 받아 스피커 출력"}],"applications":[{"title":"음성 기반 스트레스 측정","desc":"마이크 음성 신호의 노이즈를 제거하고 MFCC로 주파수 특징을 추출해 스트레스를 측정"},{"title":"정서 케어 콘텐츠 서비스","desc":"판별된 스트레스 상태별로 AI 서버의 피드백 콘텐츠를 음성으로 제공하는 정서 관리 서비스"},{"title":"AI 음성 감성 인식","desc":"텍스트 마이닝과 기계 학습을 결합해 사용자 음성에 담긴 감성을 인식하는 기술 분야"}],"figFile":"10-2024-0010245.jpg","figureCaption":"공보 대표도면"},{"id":"p1020240010246","title":"음성패턴 인식 기능을 갖는 인공지능 스트레스 피드백 장치","field":"소프트웨어","status":"공개","regNo":"10-3013350","regDate":"","appNo":"10-2024-0010246","appDate":"2024.01.23","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2044.01.23","inventor":"강민수","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 음성패턴 인식 기능을 갖는 인공지능 스트레스 피드백 장치에 관한 것으로, 음성 신호에서 음소·음운 정보를 추출하는 음향분석 모듈, 사용자별 억양·악센트·발음 습관을 고려하는 발음분석 모듈, 문맥에 적합한 인식을 수행하는 언어모델링 모듈, 문맥 감성의 긍정·부정·중립을 판단하는 감성분석 모듈, 문맥을 텍스트로 바꾸고 감성을 이모티콘으로 도출하는 텍스트 변환 모듈로 구성된다.","features":[{"k":"특징","v":"음향분석 모듈은 HMM과 MFCC로 특징을 추출하고, 발음분석 모듈은 DNN으로 음소 시퀀스를 예측하며, 언어모델링 모듈은 N-gram 또는 통계적 언어 모델을 적용한다. 감성분석 모듈은 문장을 고차원 벡터로 임베딩한 뒤 RNN·LSTM·트랜스포머 딥러닝과 경사하강법 최적화로 감성을 분류한다."},{"k":"효과","v":"AI 음성 인식을 기반으로 음성의 감성을 판단해 사용자의 감성에 대응하는 결과물을 도출할 수 있다. 또한 발음의 억양·악센트·발음 습관을 고려해 음성을 인식하므로 발음 차이나 방언을 반영하여 개인의 감성을 정밀하게 분석할 수 있다."}],"lvl":3,"comparison":[{"item":"인식 대상 범위","old":"발화된 단어 분석만 이루어져 감성 판단이 어려움","new":"음소·음운 발음정보와 억양·악센트를 함께 분석"},{"item":"개인차 반영", tus":"등록","regNo":"10-2628242","regDate":"2024.01.18","appNo":"10-2021-0166141","appDate":"2021.11.26","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2041.11.26","inventor":"심연수","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 치과 수복 키트 박스에 관한 것으로, 내부 공간을 가지는 본체부, 상부에 구비되는 지지판, 지지판에 복수로 결합되어 치과 수복용 기구를 지지하는 지지핀, 지지판 위에 안치되는 프레임 및 착탈 가능한 덮개부를 포함한다. 기구별 전용 박스와 달리 형태와 사이즈에 관계없이 각종 치과 수복 실습 기구를 범용으로 수납할 수 있다.","features":[{"k":"특징","v":"지지핀은 중공형 몸통부 내부의 탄성 부재와 출몰식 지지 부재로 구성되어 안치된 기구의 형상에 맞춰 길이가 가변되며 밀착 지지한다. 본체부·지지판·프레임 세트를 수직으로 적층해 높이를 조절할 수 있고, 덮개부 내측면의 안내문과 QR 코드로 교육 영상에 접속할 수 있다."},{"k":"효과","v":"다양한 크기와 형태의 치과 수복용 기구를 흔들림 없이 모두 수용·지지하여 실습에 필요한 기구를 한 박스에 보관 및 사용할 수 있고, 세트를 수직으로 적층하여 보관 수량을 늘릴 수 있어 임상 교육 현장의 사용 범위 제한과 교육 효과 저하 문제를 해소한다."}],"lvl":3,"comparison":[{"item":"기구 수납 구조","old":"기구 형상에 맞춘 전용 수납홈에 해당 기구만 삽입","new":"지지판에 결합된 복수의 지지핀이 기구를 받쳐 지지"},{"item":"수용 범용성","old":"전용 키트 박스여서 형태가 다른 기구는 수납할 수 없음","new":"지지핀 길이가 가변되어 다양한 크기와 형태의 기구를 수용"},{"item":"보관 용량 확장","old":"단일 전용 박스 구조로 보관 가능한 기구 수가 제한됨","new":"본체부·프레임·지지판을 수직 방향으로 적층 조립해 확장"}],"applications":[{"title":"치과 수복 기구 보관","desc":"형태와 크기가 다른 각종 치과 수복용 기구를 하나의 박스에 지지·보관하는 범용 키트로 활용할 수 있다"},{"title":"치과 임상 실습 교육","desc":"특정 키트에 제한되지 않고 다양한 수복 실습을 진행할 수 있어 치과 재료 기반 임상 교육 현장에 적용된다"},{"title":"의료기구 수납 용기","desc":"지지핀이 기구 형상에 맞춰 수축하며 대면하는 구조를 응용해 소형 의료기구용 수납 용기를 구성할 수 있다"}],"figFile":"10-2021-0166141.jpg","figureCaption":"공보 대표도면"},{"id":"p1020240006771","title":"폐기 페트병 분리수거장치","field":"기계","status":"공개","regNo":"","regDate":"","appNo":"10-2024-0006771","appDate":"2024.01.16","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2044.01.16","inventor":"이장범","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 폐기 페트병 분리수거장치에 관한 것으로, 투입구가 마련된 몸체 내부에 승강모듈로 승강하는 가압부재와 모터로 일 방향 회전하는 회전부재, 이들의 작동을 개시하는 페달을 배치한 장치이다. 회전부재가 투입된 페트병 입구의 마개와 접하며 회전해 마개를 자동 분리하고, 가압부재가 하강하며 페트병을 자동 압착한다. 번거로움 때문에 마개 분리와 압착 없이 배출되는 문제를 겨냥한다.","features":[{"k":"특징","v":"지지판의 하향 경사로 슬라이딩한 페트병의 마개가 고무 또는 실리콘 t":"선문대학교 산학협력단","coApplicant":false,"expiry":"2042.12.06","inventor":"이경순","transfer":"매매 · 라이센스","smk":false,"brief":false,"lvl":0},{"id":"p1020210106603","title":"실리카 피라미드 구조를 갖는 PN 접합 태양전지 및 그 제조 방법","field":"전기·전자","status":"등록","regNo":"10-2600281","regDate":"2023.11.06","appNo":"10-2021-0106603","appDate":"2021.08.12","applicant":"호서대학교 산학협력단 · 선문대학교 산학협력단","coApplicant":true,"expiry":"2041.08.12","inventor":"배병성","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 실리카 피라미드 구조를 갖는 PN 접합 태양전지 및 그 제조 방법에 관한 것으로, PN 접합 실리콘 웨이퍼 표면에 V홈을 형성하고 그 표면에 SiO2 산화막을 입혀 실리카 피라미드를 만든 뒤 웨이퍼 저면에도 V홈을 내어 피라미드 저면을 노출시킨 구조이다. 온도 상승으로 효율이 떨어지는 태양전지의 자가 냉각, 자가 세정, 포톤 트랩 효과를 한 소자에 집적한다.","features":[{"k":"특징","v":"열산화·포토리소그래피·염기성 용액 에칭을 거쳐 높이 4~5um의 실리카 피라미드를 웨이퍼에 직접 가공하는 방식으로, 10마이크론대 복사 방출률을 높여 외부 에너지 없이 열을 우주로 방출하고 미세 돌기 표면이 오염을 막으며 입사광은 SiO2를 따라 도파된다."},{"k":"효과","v":"열발산 촉진에 따른 냉각과 표면 오염 저감, 포톤 트랩의 복합 효과로 태양전지 효율을 높일 수 있고, 별도 부착 없이 웨이퍼를 직접 가공해 내부 발생열까지 방출하므로 건물 냉각 등 무전력 냉각 분야에도 적용할 수 있다."}],"lvl":3,"comparison":[{"item":"표면 처리 구조","old":"플라즈마 식각 등으로 태양전지 표면을 텍스쳐링하는 방식","new":"실리콘 웨이퍼에 실리카 피라미드 구조를 형성해 집적"},{"item":"소자 냉각 성능","old":"온도가 상승하면 에너지 변환 효율이 감소하는 문제가 있음","new":"열발산과 표면 방출률을 높여 자가 냉각이 이루어짐"},{"item":"광 포집·오염 대응","old":"프레넬 렌즈 등으로 집광하고 표면 오염 시 효율이 저하됨","new":"포톤 트랩 효과와 표면 자가 세정 기능을 함께 제공"}],"applications":[{"title":"PN 접합 태양전지","desc":"실리카 피라미드 구조를 집적해 변환 효율을 높인 PN 접합 태양전지 제조 분야"},{"title":"광센서·이미지 센서","desc":"입사광을 효율적으로 이용해야 하는 광센서 및 이미지 센서의 수광 효율 개선"},{"title":"반도체 소자 방열","desc":"실리콘 웨이퍼나 기타 막에 적용해 열발산을 촉진하는 반도체 소자 냉각 기술"}],"figFile":"10-2021-0106603.jpg","figureCaption":"공보 대표도면"},{"id":"p1020230147787","title":"대사공학적 방법으로 제작된 모유 올리고당 생성을 위한 재조합 미생물 및 이를 이용한 모유 올리고당의 제조방법","field":"의료","status":"공개","regNo":"","regDate":"","appNo":"10-2023-0147787","appDate":"2023.10.31","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2043.10.31","inventor":"송재경","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 대사공학적 방법으로 제작된 모유 올리고당 생성용 재조합 미생물 및 이를 이용한 제조방법에 관한 것으로, 글루코스로부터 UDP-갈락토오스와 프럭토오스-6-인산을 생성하는 대장균에 LNTII 및 락토-N-네오테트라오스(LNnT) 전환 효소 유전자와 UDP-N-아세틸글루코사민 합성 효소 유전자를 도입해 LNnT 생합성능을 높였다. 모유 공급 부족과 화학 합성의 높은 비용 및 제조 제약을 대체하는 생물학적 생산 기술이다.","features":[{"k":"특징","v":"LgtA·LgtB와 함께 glmS·glmM·glmU를 공동 발현하고 GalE 및 수크로스 합성효소(AtSUS1)를 과발현해 UDP-갈락토오스 재생 경로를 강화하며, 경쟁 경로인 wecB·nagB를 CRISPR/Cas9로 결실시킨 lacZ 결손 대장균을 락토오스·수크로스 함유 배지에서 배양한다."},{"k":"효과","v":"최적 균주는 진탕 플라스크에서 약 1g/L, 3L 발효기 유가식 배양에서 60시간 후 3g/L의 LNnT 역가를 달성하였다. 모유 유래 올리고당을 재조합 대장균으로 저렴한 비용에 고수율 제조할 수 있어 모유 올리고당 함유 기능성 식품 및 의약품 제조에 유용하다."}],"lvl":3,"comparison":[{"item":"LNnT 확보 방식","old":"모유에서 분리하거나 화학적 합성을 통해 생산","new":"유전자를 도입한 재조합 대장균을 배양해 생합성"},{"item":"제조 비용 수준","old":"측기 보호 및 탈보호 지침이 엄격해 제조 비용이 많이 소요","new":"글루코스를 기질로 재조합 균주를 배양해 저렴하게 제조"},{"item":"전구체 공급 경로","old":"기존 재조합 균주는 UDP-갈락토오스 재생 경로가 없음","new":"UDP-갈락토오스 재생경로를 도입해 수율을 현저히 증가"}],"applications":[{"title":"모유 올리고당 기능성 식품","desc":"세포 합성 촉진, 면역력 강화, 장내 세균총 조절 기능을 갖는 LNnT를 함유한 기능성 식품"},{"title":"LNnT 생산 재조합 대장균","desc":"전구체 전환 효소 유전자를 도입해 락토-N-네오테트라오스 생합성능을 높인 재조합 미생물"},{"title":"올리고당 의약품 원료","desc":"면역 및 장내 환경 조절과 관련된 의약품 제조에 쓰이는 모유 유래 올리고당 원료 생산"}],"figFile":"10-2023-0147787.jpg","figureCaption":"공보 대표도면"},{"id":"p1020210119089","title":"통풍 및 충격 완화 기능이 구비된 의지 보조기","field":"의료","status":"등록","regNo":"10-2597537","regDate":"2023.10.30","appNo":"10-2021-0119089","appDate":"2021.09.07","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2041.09.07","inventor":"강민수","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 통풍 및 충격 완화 기능이 구비된 의지 보조기에 관한 것으로, 신체절단부가 삽입되는 소켓본체와 라이너에 소켓본체 내부 공기를 순환시키는 통풍부와 지면으로부터의 충격을 완화하는 충격흡수부를 함께 구성한 보조기다. 별도의 전동장치나 전기·전자 제어장치 없이 보행 시 발생하는 기계적 운동만으로 팬이 회전하도록 구성하여 착용 부위 피부를 보호하고 근육 통증을 저감하는 것을 목적으로 한다.","features":[{"k":"특징","v":"소켓본체 내부에서 의지본체로 이어지는 축연결부 외측에 나사산을 형성하고, 보행 시 중력으로 축연결부가 상하 이동하면 나사산을 따라 통풍팬이 회전해 매쉬망 형상의 통풍구로 환기가 이루어진다. 베어링볼을 갖춘 팬하우징이 팬을 제자리에서 회전시키고, 라이너 외주면의 충격흡수부재와 축연결부 상·하측의 제1·제2댐버가 충격을 흡수한다."},{"k":"효과","v":"전동장치 없이 기계적 팬회전 시스템으로 환기와 통풍 mk":true,"brief":false,"summary":"본 기술은 유기 발광 다이오드 등 유기 전자 소자 제작용 유기재료 증착에 사용되는 열증착기의 필라멘트 타입 히터에 관한 것으로, 가열이 계속되면서 열선이 하측으로 쳐지는 문제를 해결한다. 한 가닥의 선형 금속을 도가니 외면을 에워싸는 원통형 터널부, 반경이 커지는 나선형 플랜지부, 두 개의 직선부로 구성하고, 플랜지부 하면을 지지하는 링부와 복수의 바를 갖는 받침대로 열선을 받친다.","features":[{"k":"특징","v":"받침대는 세라믹 재질로 디스크 위에 고정되고 링부 상면이 평평하며 폭이 플랜지부보다 커서 열선을 안정적으로 지지하고, 터널부는 상측 코일 피치를 하측보다 작게 감아 도가니 상단부에 발열체를 집중시켜 온도 분포를 조절한다."},{"k":"효과","v":"열선 쳐짐에 따른 단락과 국부 발열 부족을 막아 증착 박막의 유니포미티와 커버리지를 확보하고, 적은 비용으로 재료 종류에 무관하게 유기재료 비산과 도가니 상단 막힘 현상을 방지해 공정 수율을 향상시킬 수 있다."}],"lvl":3,"comparison":[{"item":"히터 코일 구조","old":"원통형 도가니 주변을 감싸는 단순 필라멘트 구조의 히터","new":"터널부·나선형 플랜지부·직선부로 구성된 코일형 열선 구조"},{"item":"히터 처짐 방지","old":"가열이 계속되면 필라멘트 히터가 하측으로 처지는 문제 발생","new":"링부와 복수의 바를 가진 받침대가 플랜지부 하면을 지지"},{"item":"공정 수율 확보","old":"히터 처짐에 따라 재료 비산 및 도가니 막힘 현상이 발생","new":"적은 비용으로 기존 히터의 문제를 개선해 공정 수율 향상"}],"applications":[{"title":"유기 전자 소자 제조","desc":"유기 발광 다이오드 등 유기 전자 소자 제작을 위한 유기재료 열증착 공정에 적용"},{"title":"열증착기 증발원 부품","desc":"진공 챔버 내 도가니를 간접 가열하는 필라멘트 타입 히터와 받침대 부품 제조 분야"},{"title":"유기 발광 표시 장치","desc":"유기 발광 표시 장치용 박막을 기판 상에 증착하는 디스플레이 제조 장비 분야에 활용"}],"figFile":"10-2021-0075024.jpg","figureCaption":"공보 대표도면"},{"id":"p1020190066432","title":"덮개 교체가 가능한 슬리퍼","field":"생활","status":"등록","regNo":"10-2582457","regDate":"2023.09.20","appNo":"10-2019-0066432","appDate":"2019.06.05","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2039.06.05","inventor":"박찬빈","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 덮개부를 밑창부에서 분리하여 교체할 수 있는 슬리퍼에 관한 것으로, 겨울용과 그 외 계절용 슬리퍼를 따로 구매하고 보관해야 하는 번거로움과 경제적 부담을 해소한다. 덮개가 손상되거나 디자인이 식상해진 경우에도 덮개부만 교체해 계속 사용할 수 있고, 발열체와 선풍기부를 덮개에 내장해 계절별 온열·송풍 기능까지 제공하므로 하나의 밑창으로 사계절 사용이 가능하다.","features":[{"k":"특징","v":"덮개부 하면 둘레의 결합용 테두리 프레임부가 밑창부의 결합용 레일부에 슬라이딩 결합되고 보조 밑창부재가 레일 입구를 막아 위치를 고정하며, 보온 외피와 발열체를 갖춘 동계용 덮개부와 선풍기부를 갖춘 사계절용 덮개부를 선택해 사용한다."},{"k":"효과","v":"하나의 밑창으로 계절별 덮개를 바꿔 쓸 수 있어 구매 비용과 보관 공간이 절감되고, 충전지와 제어부가 연결단자로 이어져 발열·송풍 세기를 스위치나 스마트폰 어플리케이션으로 조절할 수 있어 사용 편의성과 만족도가 향상된다."}],"l 배터리 교환 설비"}],"figFile":"10-2020-0164548.jpg","figureCaption":"공보 대표도면"},{"id":"p1020230076250","title":"양자점 유기발광 다이오드 디바이스","field":"전기·전자","status":"공개","regNo":"","regDate":"","appNo":"10-2023-0076250","appDate":"2023.06.14","applicant":"선문대학교 산학협력단 · 가천대학교 산학협력단","coApplicant":true,"expiry":"2043.06.14","inventor":"권정현","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 유기발광소자층, 양자점 필름, 반사 향상 필름을 순차 적층한 양자점 유기발광 다이오드(QD-OLED) 디바이스에 관한 것으로, 유기발광소자층에서 방출되는 가시광선 대역의 단파장 빛을 양자점 필름이 장파장 빛으로 변환해 반사 향상 필름을 통해 방출한다. 기존 QD-OLED는 빛을 양자점에 통과시켜 색변환하는 특성상 원하지 않는 빛샘이 생기고 출력이 크게 감소하는 단점이 있었다.","features":[{"k":"특징","v":"반사 향상 필름은 굴절률 차이가 0.3 이상인 제1·제2 박막을 교번 적층한 구조로 단파장 빛은 반사하고 적외선 등 장파장 빛은 투과시키며, 반사된 빛을 양자점 필름이 재흡수해 장파장 빛을 다시 발생시켜 세기를 증폭한다. 동시에 수분과 산소의 투습을 막는 가스 배리어 역할도 수행한다."},{"k":"효과","v":"블루 빛샘을 차단해 방출 빛의 색순도를 높이면서 광세기를 증폭하며, 구동 전압 6.25V에서 복사 에너지 방출량이 33%, 3.25V에서 빛 변환 비율이 89.9% 증가했다. 기존 OLED가 구현하기 어려운 700nm 이상의 근적외선 파장을 확보해 광기반 의료기기 성능 향상을 기대할 수 있다."}],"lvl":3,"comparison":[{"item":"파장 제어 방식","old":"OLED 단독으로는 파장 제어가 어렵고 NIR 재료가 거의 없음","new":"양자점 필름의 크기 조절로 전 파장 영역을 자유롭게 변환"},{"item":"색순도 및 출력","old":"QD 통과형 구조에서 빛샘이 발생하고 출력이 크게 감소","new":"반사 향상 필름이 단파장을 반사·재흡수시켜 색순도와 세기 증대"},{"item":"소자 보호 구조","old":"유기반도체가 수분과 산소에 취약해 별도 봉지 구조가 필요","new":"굴절률이 다른 박막을 교번 적층해 가스 배리어와 광선택성 확보"}],"applications":[{"title":"광 치료용 의료 광원","desc":"유연·투명·면광원 형태의 OLED 기반 광원으로 기존 레이저 광 조사기를 대체하는 광 치료기 용도"},{"title":"근적외선 QD-OLED 광원","desc":"양자점 변환으로 700nm 이상 근적외선, 중적외선, 원적외선 대역을 확보하는 적외선 발광 디바이스"},{"title":"박막 봉지 광학 필름","desc":"굴절률 차 0.3 이상 박막을 교대 적층해 투습을 막고 특정 파장만 투과시키는 선택 투과 광학 필름"}],"figFile":"10-2023-0076250.jpg","figureCaption":"공보 대표도면"},{"id":"p1020200113037","title":"자동 배달 장치 및 방법","field":"기계","status":"등록","regNo":"10-2541702","regDate":"2023.06.05","appNo":"10-2020-0113037","appDate":"2020.09.04","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2040.09.04","inventor":"이지연","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 아파트 단지 내에서 배달 모빌을 이용해 수취인의 문 앞까지 물품을 전달하는 무인 자동 배달 장치 및 방법에 관한 것으로, 배송 물품을 운반하는 배달 모빌과 물품 정보를 분류·분배하고 모빌의 동선을 제어하는 배달 서버를 포함한다. 기존 배송이 배송원과 무인 택배함에 의존해 자동 배달 수단이 없고 인력 소모와 대면 감염 위험이 큰 점을 해결하고자 한다.","features":[{"k":"특징","v":"배달 모빌은 집하장에서 RFID·바코드로 물품 정보를 읽어 배송을 시작하고, 독립 구동되는 메카넘 휠로 전후좌우 전방위 주행하며, 초음파·레이더·GPS·카메라의 제1 센서부와 방사형 격벽 구조로 신호 방해를 줄인 라이다 제2 센서부로 지형과 장애물을 탐색한다. 수취인·관리사무소 메시지, 배달 서버 제어, QR 근거리 통신의 세 루트로 출입문과 엘리베이터를 이용한다."},{"k":"효과","v":"자율 주행 배송 로봇과 배달 서버의 협동으로 최소 인력으로 운용 가능한 무인 배송 시스템을 구축할 수 있고, 배송 물품 정보 분류와 동선 제어를 통해 아파트 단지 내 배송 효율성을 높일 수 있다. 적재부 RFID 중간 점검으로 물품 손실·도난을 확인해 관리자에게 통지할 수 있다."}],"lvl":3,"comparison":[{"item":"배송 전달 방식","old":"배송원이 단지 내 무인 택배함에 물품을 맡기는 방식이 일반적","new":"배달 모빌이 자율 주행으로 수취인 문 앞까지 직접 전달"},{"item":"배송 운영 인력","old":"세대별 배송을 위해 배송원의 수작업 이동이 계속 필요함","new":"배달 서버와 모빌의 협동으로 최소 인력 무인 배송을 운용"},{"item":"물품 분류·제어","old":"물품 정보 분류와 배분을 배송원이 수동으로 처리해야 함","new":"배달 서버가 물품 정보를 분류해 모빌에 분배하고 제어"}],"applications":[{"title":"아파트 단지 무인 배송","desc":"아파트 단지 내에서 배달 모빌이 세대 문 앞까지 배송 물품을 전달하는 무인 배송"},{"title":"스마트홈 배송 서비스","desc":"스마트홈 서비스의 일환으로 단지 자체 복지 시설과 연계한 자동 배달 운영"},{"title":"배송 로봇 관제 서버","desc":"배송 물품 정보를 분류해 배달 로봇에 분배하고 배달을 제어하는 관제 서버"}],"figFile":"10-2020-0113037.jpg","figureCaption":"공보 대표도면"},{"id":"p1020230070173","title":"고효율 가변 시분할 이중 통신 장치 및 방법","field":"소프트웨어","status":"공개","regNo":"","regDate":"","appNo":"10-2023-0070173","appDate":"2023.05.31","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2043.05.31","inventor":"오인열","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 자동차가 기지국 또는 보행자 모바일과 통신할 때 주고받는 데이터의 종류에 따라 시분할 이중통신 비율(TDD ratio)을 조정하는 장치 및 방법에 관한 것으로, 통신 채널을 스캔하고 TDD 비율을 미리 설정된 초기값으로 설정한 뒤 동작 모드에 따라 비율을 조정해 데이터를 송수신한다. 자동차 통신은 제어데이터부터 영상데이터까지 용량과 속도가 다양해 자원을 효율적으로 쓰려면 송수신 구조를 바꿀 필요가 있었다.","features":[{"k":"특징","v":"시분할 이중통신 간격을 복수의 슬롯으로 구성하고 상향 슬롯과 하향 슬롯의 개수 비율로 TDD 비율을 산출하며, 오디오·비디오 수신 모드는 하향 슬롯을 최대 개수로, 센서데이터 송신 모드는 상향 슬롯을 최소 개수로, 제어데이터 송수신 모드는 상향 슬롯을 하나로 설정하고 짝수 또는 3의 배수번째 프레임으로 제어데이터를 간헐 전송한다."},{"k":"효과","v":"데이터 종류에 맞춰 상향·하향 전송 시간을 가변함으 Applicant":false,"expiry":"2041.01.29","inventor":"최재성","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 적외선 인터렉티브 프로젝션 시스템에 관한 것으로, 빔 프로젝터가 스크린에 투사한 영상을 센서부가 인식하고 제어부가 그 영상 정보를 판독해 센서부의 위치를 자동으로 조정한다. 전시관이나 박물관의 콘텐츠를 단순 시청에서 사용자의 행동에 반응하는 체험 학습 콘텐츠로 전환하는 데 활용된다. 스크린의 콘텐츠를 적외선 플래시로 비추면 내부 구조나 해결 방안이 그 영역 안에 나타나는 방식으로 연출할 수 있다.","features":[{"k":"특징","v":"영상 인식 센서와 적외선 인식 센서로 구성된 센서부를 팬-틸트-줌 방식 위치 조정부로 제어하며, 제어부는 배럴 디스토션과 투영 변환으로 화면을 평면 보정해 콘텐츠 좌표와 매칭하고, 적외선 마커의 식별 정도가 가장 높은 위치로 센서를 재조정한 뒤 경계면 노이즈를 제거한다."},{"k":"효과","v":"센서 위치와 좌표 매핑을 자동화하여 전문기술자가 직접 센서를 설치하고 좌표값을 매핑하는 불편을 해소하고, 외부 광원에 의한 적외선 인식 성능 저하를 자동 보정함으로써 체험자가 더 높은 정확도와 편의성으로 투사 영상과 상호작용할 수 있다."}],"lvl":3,"comparison":[{"item":"센서 위치 조정","old":"투사 화면에 맞춘 센서 위치 조정과 좌표 인식이 수동에 의존","new":"제어부가 팬-틸트-줌으로 센서 위치를 자동 조정하고 좌표 매칭"},{"item":"적외선 인식 성능","old":"외부 광원의 영향으로 적외선 인식 성능이 저하될 수 있음","new":"적외선 마커의 식별 정도를 판별해 센서 위치를 재조정함"},{"item":"콘텐츠 체험 방식","old":"전시관·박물관 콘텐츠를 단순히 시청하는 형태에 머무름","new":"사용자 행동에 실시간 반응하는 체험 학습 콘텐츠로 구현"}],"applications":[{"title":"전시관·박물관 체험 콘텐츠","desc":"단순 시청을 넘어 관람객 행동에 반응하는 체험 학습 콘텐츠를 전시 공간에 제공"},{"title":"인터랙션 콘텐츠 시스템","desc":"사용자와 시스템 간 상호 작용에 기반해 실시간 반응하는 인터랙션 콘텐츠 구현"},{"title":"교육·시뮬레이션 서비스","desc":"항공 교육 시뮬레이션이나 게임 등 다양한 분야에서 활용되는 교육 서비스 콘텐츠"}],"figFile":"10-2021-0013419.jpg","figureCaption":"공보 대표도면"},{"id":"p1020200078460","title":"베르바민 및 L-732,138를 포함하는 뇌암 치료, 개선 또는 예방용 조성물","field":"의료","status":"등록","regNo":"10-2524954","regDate":"2023.04.19","appNo":"10-2020-0078460","appDate":"2020.06.26","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2040.06.26","inventor":"정혜진","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 베르바민 및 L-732,138을 유효성분으로 포함하는 뇌암 치료·개선 또는 예방용 조성물에 관한 것으로, 암줄기세포에 특이적으로 나타나는 화학적 합성치사 상호작용을 이용한다. CaMKII 억제제인 베르바민과 선택적 NK1 길항제인 L-732,138을 1:2.5 내지 10의 몰 농도비로 병용하는 약학적 조성물 및 식품 조성물을 제공한다.","features":[{"k":"특징","v":"각 성분을 단독 처리할 경우 인간 교모세포종 U87MG 유래 암줄기유사세포의 생존성과 신경구체 형성에 영향을 주지 않으나, 2μM 베르바민과 10μM L-732,138을 병용 처리하면 상승적인 합성치사 상호작용이 나타나 암줄기유사세포가 사멸된다."},{"k":"효과","v":"병용투여는 개별 성분과 비교해 암줄기유사세포에 대한 상승적 사멸 효과와 신경구체 형성 억제 효과를 보이고 전이능력 억제 활성도 우수하여, 뇌암의 치료·예방 또는 개선 용도로 유용하게 이용될 수 있다."}],"lvl":3,"comparison":[{"item":"치료 표적 세포","old":"세포독성제가 빠르게 성장하는 세포를 손상시키거나 살해","new":"재발·전이의 원인인 뇌암 줄기세포를 표적으로 사멸시킨다"},{"item":"약물 투여 방식","old":"단일 세포독성 약제를 중심으로 화학요법이 수행되었다","new":"베르바민과 L-732,138을 1:2.5~10 몰비로 병용 투여한다"},{"item":"전이·재발 억제","old":"암 줄기세포가 남아 재발과 전이의 원인이 되었다","new":"신경구체 형성과 전이 능력을 함께 현저하게 억제한다"}],"applications":[{"title":"뇌암 치료 의약품","desc":"베르바민과 L-732,138을 유효성분으로 하는 뇌암 예방·치료용 약학 조성물에 쓴다"},{"title":"암 줄기세포 표적 치료","desc":"암 줄기세포의 자가재생능, 증식능, 분화유도능을 제어하는 표적 치료 연구에 활용한다"},{"title":"뇌암 개선용 식품","desc":"뇌암 예방 또는 개선 용도의 식품 조성물로 제형화해 보조 소재로 적용할 수 있다"}],"figFile":"10-2020-0078460.jpg","figureCaption":"공보 대표도면"},{"id":"p1020230048871","title":"김 원초 초음파 추출물을 유효성분으로 포함하는 면역 증강용 조성물","field":"의료","status":"공개","regNo":"","regDate":"","appNo":"10-2023-0048871","appDate":"2023.04.13","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2043.04.13","inventor":"김진우","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 김 원초(Porphyra tenera) 초음파 추출물을 유효성분으로 포함하는 항산화 또는 면역 증강용 조성물에 관한 것으로, 김 원초를 물이나 저급알코올 수용액에서 초음파 처리해 얻은 추출물을 활용한다. 식품, 화장료, 약학 조성물 형태로 적용할 수 있으며, 반응표면분석법으로 최적 추출 조건을 도출하는 제조방법도 함께 제시한다. 김 원초는 아이소람네틴과 캠퍼롤 등 유용물질을 함유한 보라털과 해조류로, 초음파 추출로 유효성분 회수를 높인다.","features":[{"k":"특징","v":"김 원초를 20~50 kHz 진동수와 50~700 W 파워의 초음파기로 20~85 ℃에서 10~60분 추출하고, 총 폴리페놀·총 플라보노이드·DPPH 라디칼 소거능에 대한 2차 회귀식과 반응표면곡선을 겹치기기법으로 중첩해 추출 시간 36분, 추출 온도 64 ℃, 에탄올 농도 80 부피%의 공통 최적 조건을 도출했다."},{"k":"효과","v":"초음파 추출물이 열수 추출물보다 총 폴리페놀·총 플라보노이드 함량과 DPPH 라디칼 소거능이 우수하고, 대식세포에서 MAPK, NF-kB, iNOS, COX-2, PGE2 발현을 증진시켜 면역 증강 및 항산화 효과를 나타내므로 건강기능식품, 화장료, 약학 조성물로 활용할 수 있다."}],"lvl":3,"comparison":[{"item":"유효성분 원료","old":"합성 면역 증강제와 치료제가 주로 사용되고 있음","new":"김 원초 초음파 추출물을 유효성분으로 포함해 구성"},{"item":"부작용 및 복용","old":"부작용 문제가 있고 주로 예방이 아닌 치료용으로 복용","new":"천연물 유래 소재로 예방과 치료 모두에 적합하도록 구성"},{"item":"기능성 범위","old":"면역기능 증진이나 과도한 면역 조절 중심으로 구분됨","new":"면역 증강 효과와 항산화 효과를 함께 갖는 조성물"}],"applications":[{"title":"면역 증강 건강기능식품","desc":"김 원초 초음파 추출물을 유효성분으로 포함해 저하된 면역기능을 증진시키는 식품 조성물"},{"title":"항산화 화장료 조성물","desc":"DPPH 라디칼 소거능으로 확인된 항산화 효과를 활용해 피부에 적용하는 화장료 조성물"},{"title":"면역 관련 약학 조성물","desc":"장기 복용이 가능한 천연 해조류 추출물을 활용해 면역기능 장애의 예방과 치료에 쓰는 약학 조성물"}],"figFile":"10-2023-0048871.jpg","figureCaption":"공보 대표도면"},{"id":"p1020210058052","title":"미세 입자 이물질 포집 기능을 갖는 차량용 라디에이터","field":"건설","status":"등록","regNo":"10-2519614","regDate":"2023.04.04","appNo":"10-2021-0058052","appDate":"2021.05.04","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2041.05.04","inventor":"황찬승","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 미세 입자 이물질 포집 기능을 갖는 차량용 라디에이터에 관한 것으로, 내연기관 차량의 주행 과정에서 유입되는 외기에 함유된 분진과 미세먼지를 걸러내도록 구성된다. 냉각수를 수용하는 상부 및 하부 탱크와 튜브·핀으로 이루어진 코어를 갖추고, 코어 후방에 포집유닛을 배치해 코어 전면을 통해 유입된 외기의 미세 입자 이물질을 포집한 뒤 엔진 흡기라인으로 보낸다.","features":[{"k":"특징","v":"포집유닛은 코어를 마주하는 전방 면에 외기 유입구, 후방 면에 외기 유출관이 형성된 몸체와 그 사이에 간격을 두고 배치되는 복수의 필터부재로 구성되며, 필터부재는 마이크로 단위 다공성 구조의 부직포필터로 외기 유동 간섭을 최소화하면서 장착과 분리가 용이하다."},{"k":"효과","v":"주행 과정에서 미세 입자 이물질을 포집해 도로 주변 공기의 질을 높일 수 있고, 이물질이 제거된 외기가 흡기라인으로 유입되어 연소실 오염과 엔진오일 오염이 최소화되므로 엔진의 연소 성능 향상도 기대할 수 있다."}],"lvl":3,"comparison":[{"item":"이물질 처리 기능","old":"수냉식 라디에이터는 방열만 담당해 외기 중 분진을 그대로 통과","new":"코어 후방에 포집유닛을 배치해 외기 중 미세 입자 이물질을 포집"},{"item":"도로 공기질 영향","old":"주행 중 매연·분진이 더해져 도로 주변 공기 질이 날로 악화","new":"주행 과정에서 분진·미세먼지를 포집해 도로 주변 공기 질 개선"},{"item":"엔진오일 오염","old":"미세 입자 이물질이 연소실로 유입되어 엔진오일이 오염됨","new":"유입 외기의 이물질을 사전 포집해 엔진오일 오염을 최소화"}],"applications":[{"title":"내연기관 차량 라디에이터","desc":"가솔린·디젤 엔진 차량의 수냉식 냉각 라디에이터에 포집유닛을 적용해 냉각과 집진을 동시 수행"},{"title":"차량용 집진 필터 부품","desc":"마이크로 단위 다공성 구조의 부직포필터를 사용하는 차량용 미세먼지 포집 필터 부재 제조"},{"title":"도로 미세먼지 저감","desc":"주행 차량을 집진 수단으로 활용해 도로 주변의 분진·미세먼지를 저감하는 환경 개선 분야"}],"figFile":"10-2021-0058052.jpg","figureCaption":"공보 대표도면"},{"id":"p1020200102555","title":"나르제니신 A1 유도체를 포함하는 위암 예방 또는 치료용 조성물","field":"의료","status":"등록","regNo":"10-2517926","regDate":"2023.03.30","appNo":"10-2020-0102555","appDate":"2020.08.14","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2040.08.14","inventor":"정혜진","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 나르제니신 A1 유도체를 포함하는 위암 예방 또는 치료용 조성물에 관한 것으로, 방선균 유래 나르제니신 A1의 생합성 경로를 재설계해 확보한 신규 유도체 23-demethyl 8,13-deoxynargenicin(컴파운드 9)을 유효성분으로 한다. 약학적 조성물과 식품 조성물, 그리고 시클로필린 A의 발현 또는 활성 억제용 조성물로 제공된다.","features":[{"k":"특징","v":"컴파운드 9은 AGS 위암세포의 성장을 가장 민감하게 억제하면서 정상 세포에는 독성을 보이지 않고, 세포 내 표적단백질인 시클로필린 A에 직접 결합해 CD147 매개 MAPK 신호전달을 차단하며 G2/M 세포주기 정지와 아팝토시스·오토파지를 유도한다."},{"k":"효과","v":"위암세포에서 우수한 증식 저해 활성과 전이 억제 활성을 나타내고 시클로필린 A의 발현 및 활성을 억제하는 효과가 확인되었으므로, 의약품과 식품 산업에서 위암 치료·예방 또는 개선 용도로 유용하게 활용될 수 있다."}],"lvl":3,"comparison":[{"item":"항암 유효성분","old":"외과적 절제와 기존 항암제 중심의 화학요법에 의존하였다","new":"나르제니신 A1 유도체 화합물을 유효성분으로 사용한다"},{"item":"항암 작용 기전","old":"세포독성제 중심으로 작용해 부작용 문제가 지적되었다","new":"시클로필린 A 결합·억제와 아팝토시스·오토파지로 사멸 유도"},{"item":"유도체 연구","old":"나르제니신 유도체의 항암 활성 연구가 부족하였다","new":"컴파운드 9의 위암세포 증식 저해와 전이 억제 활성을 확인"}],"applications":[{"title":"위암 치료 의약품","desc":"나르제니신 A1 유도체를 유효성분으로 하는 위암 예방·치료용 약학 조성물로 개발한다"},{"title":"위암 개선용 식품","desc":"위암 예방 또는 개선 용도의 식품 조성물로 제형화해 식품 산업에 활용할 수 있다"},{"title":"시클로필린 A 억제제","desc":"시클로필린 A의 발현 또는 활성을 억제하는 조성물로서 관련 연구와 개발에 쓴다"}],"figFile":"10-2020-0102555.jpg","figureCaption":"공보 대표도면"},{"id":"p1020200140137","title":"인공 지능 기반 비전 감시 장치","field":"기계","status":"등록","regNo":"10-2511084","regDate":"2023.03.13","appNo":"10-2020-0140137","appDate":"2020.10.27","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2040.10.27","inventor":"고국원","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 인공 지능에 기반하여 대상물의 이상을 감시하는 비전 감시 장치에 관한 것으로, 출입구를 통과하는 방문객의 신원 정보를 등록하는 방문객 등록부, 얼굴 인식부와 신체 인식부로 이루어지는 인식부, 방문객 영상을 상시 감시하는 감시부를 포함한다. 많은 사람이 모이는 관광지나 행사장에서 감염자 발생 시 감염 경로 추적이 어려운 문제를 해결해 주변 접촉자를 신속히 파악하고자 한다.","features":[{"k":"특징","v":"인식부는 카메라부, 저장부, 매칭부, 인증부로 구성되어 등록된 얼굴·신체 이미지와 매칭해 입장 가능 여부를 판정하며, 매칭율 임계값을 70%로 두어 70% 이상은 성공, 50% 미만은 실패, 50~70%는 재매칭한다. 감시부는 감시 카메라부와 비접촉 온도 측정부를 갖추고, 제어부가 시간차 영상의 픽셀 변화로 움직이는 물체를 추출해 액츄에이터로 온도 측정부를 추종·정렬시킨다."},{"k":"효과","v":"얼굴만이 아니라 신체 이미지를 함께 조합해 매칭하므로 마스크 착용 등으로 얼굴 인식율이 떨어져도 원하는 방문객을 정확히 찾을 수 있다. 확진자가 발생하면 해당 시간대·장소의 영상에서 주변 접촉자의 신원까지 즉시 확인해 감염 확산을 방지할 수 있고, 방문자 자동 등록·집계와 체온 측정 데이터를 빅데이터로 축적해 관광지 운영에 활용할 수 있다."}],"lvl":3,"comparison":[{"item":"감염 경로 추적","old":"많은 사람이 모이는 관광지에서 감염 경로 추적이 어려움","new":"등록 정보와 감시 영상을 매칭해 확진자 동선과 접촉자 파악"},{"item":"방문객 인식 방식","old":"정형화된 프로그램 기반 감시로 개인 식별 기능이 제한적","new":"얼굴 인식부와 신체 인식부로 방문객을 이중으로 인식함"},{"item":"관광지 운영 관리","old":"방문자 데이터 취득과 분석 체계 없이 현장 관리에 의존","new":"방문자 자동 등록·집계와 체온 측정 데이터를 통합 관리"}],"applications":[{"title":"관광지 방역 감시 시스템","desc":"관광지 출입구에서 방문객을 등록하고 감시 영상과 매칭해 주변 접촉자를 파악"},{"title":"행사장 출입 관리","desc":"박람회나 각종 행사장에서 방문객 신원을 등록하고 출입과 동선을 관리하는 장치"},{"title":"관광 빅데이터 플랫폼","desc":"방문자 수와 체온, 기상 정보 등 데이터를 모아 관광지 운영을 지원하는 플랫폼"}],"figFile":"10-2020-0140137.jpg","figureCaption":"공보 대표도면"},{"id":"p1020200164482","title":"듀얼 라이다","field":"전기·전자","status":"등록","regNo":"10-2511088","regDate":"2023.03.13","appNo":"10-2020-0164482","appDate":"2020.11.30","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2040.11.30","inventor":"고국원","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 레이저를 쏘아 거리를 측정하는 라이다에 관한 것으로, 레이저를 발광하는 트랜스듀서는 하나만 두고 하프 미러로 광경로를 분할하여 복수의 수광부가 서로 다른 각도의 대상물을 동시에 측정하도록 한 듀얼 라이다이다. 라이다 센서부를 회전부로 회전시켜 주위의 측정 대상을 360도 범위에서 실시간 반복 측정한다. 하나의 센서부에 여러 개의 수광부를 구비하여 라이다의 비싼 가격과 다량의 데이터 처리 부담을 줄이는 것이 특징이다.","features":[{"k":"특징","v":"케이스 내부에 단일 트랜스듀서와 복수의 수광부를 수납하고, 하프 미러와 반사 거울로 광경로를 축대칭·동일 거리·동일 각도로 분할하며, 회전부는 스텝 모터와 구동 풀리·종동 풀리·벨트로 센서부를 평행한 회전축 구조로 회전시킨다."},{"k":"효과","v":"하나의 라이다로 여러 대를 설치한 효과를 얻어 가격을 절감하고, 수광부가 2개면 1/2 회전만으로 360도 스캔이 가능해 측정 주기와 탐지 시간이 단축된다. 분할된 광경로의 레이저 특성이 동일하므로 데이터 처리 로직이 간소화되고 측정 정밀도와 분해도가 향상된다."}],"lvl":3,"comparison":[{"item":"수광부 구성","old":"트랜스듀서와 수광부를 1대1로 구성해 라이다를 복수 설치","new":"단일 트랜스듀서의 광경로를 분할해 복수 수광부에 배분"},{"item":"측정 주기·정밀도","old":"1회전마다 360도를 스캔하므로 측정 주기가 길어짐","new":"수광부 2개로 1/2 회전에 360도를 스캔해 주기를 단축"},{"item":"가격·데이터 처리","old":"라이다 센서 가격이 비싸고 대량 데이터 처리가 필요함","new":"광경로 길이와 각도를 동일하게 세팅해 연산 로직 간편화"}],"applications":[{"title":"자율주행 주변 인식 센서","desc":"자율주행차의 차선 유지 보조나 긴급 자동 제동을 구현하기 위한 주변 장애물 인식 센서"},{"title":"소형 주행체 라이다","desc":"전기 자동차와 모형 자동차 등 주행체에 장착되는 슬림한 두께의 라이다 센서"},{"title":"3차원 공간 정보 획득","desc":"폭과 거리, 높낮이를 반영한 3차원 데이터로 사물 형상을 추출하는 측정 장비"}],"figFile":"10-2020-0164482.jpg","figureCaption":"공보 대표도면"},{"id":"p1020200113034","title":"보행 보조 장치","field":"의료","status":"등록","regNo":"10-2511079","regDate":"2023.03.13","appNo":"10-2020-0113034","appDate":"2020.09.04","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2040.09.04","inventor":"이지연","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 근력이 저하되거나 보행이 불편한 노약자·장애인을 위한 보행 보조 장치에 관한 것으로, 다리에 착용하는 웨어러블 보행 보조기와 사용자가 잡고 이동하는 스마트 워커로 구성된다. 기존 지팡이·목발·휠워커가 단순 보조 역할에 그쳐 사용자의 편익성, 안정성, 휴대 간편성을 높일 기술이 요구된다는 점에 착안하여, 착용형 구동 보조와 이동형 워커를 함께 제공한다.","features":[{"k":"특징","v":"보행 보조기는 양쪽 다리 측면에 대면되는 한 쌍의 구동부, 구동부에 결합되어 회동하는 지지대, 허리에 착용하는 벨트로 이루어지고, 구동부는 링 기어와 제1~제3 기어가 맞물린 유성 기어 세트와 구동 모터로 토크를 키워 무릎 위 곡면 지지대를 회동시킨다. 스마트 워커는 본체부·다리부·메카넘 휠과 단말기 페어링 기능을 갖춘다."},{"k":"효과","v":"보행 시 적은 힘으로 움직일 수 있고 앉거나 일어서는 동작도 보조받으며, 지지대 길이 조절로 체격에 맞춰 사용할 수 있다. 메카넘 휠로 이동 방향을 자유롭게 바꾸고 본체부를 접어 보관·휴대가 간편하며, 페어링과 알람 기능으로 본인 소유 워커를 쉽게 찾고 일정 거리 이상 멀어지면 알려주어 도난을 방지한다."}],"lvl":3,"comparison":[{"item":"보행 보조 방식","old":"지팡이·목발·휠워커로 체중을 지지하는 수동 보조에 그침","new":"구동부와 지지대로 다리 회동을 돕는 웨어러블 보조기 적용"},{"item":"이동 편의성","old":"일반 바퀴로 방향 전환이 제한되고 사용자가 직접 밀어야 함","new":"메카넘 휠 스마트 워커로 이동 방향을 자유롭게 전환 가능"},{"item":"보관·분실 대응","old":"접이 구조나 도난 방지 기능이 없어 보관과 관리가 불편함","new":"2개 지지부 접이 구조와 단말기 페어링·알람으로 도난 방지"}],"applications":[{"title":"노약자 보행 재활 보조","desc":"근력이 저하된 노인이 적은 힘으로 보행할 수 있도록 돕는 웨어러블 보행 보조기"},{"title":"재활·요양 시설 보조기기","desc":"신체 장애나 부상으로 보행이 어려운 이용자를 위한 시설용 보행 보조 장비"},{"title":"스마트 워커 이동 보조","desc":"사용자가 잡고 지지하며 이동하고 접어서 휴대·보관할 수 있는 스마트 워커"}],"figFile":"10-2020-0113034.jpg","figureCaption":"공보 대표도면"},{"id":"p1020210120287","title":"안정성이 향상된 전기차 플랫폼","field":"건설","status":"등록","regNo":"10-2511090","regDate":"2023.03.13","appNo":"10-2021-0120287","appDate":"2021.09.09","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2041.09.09","inventor":"이경순","transfer":"매매 · 라이센스","smk":false,"brief":false,"lvl":0},{"id":"p1020200187045","title":"유채 추출물의 바이오리노베이션에 의한 미백 조성물 및 이의 제조 방법","field":"의료","status":"등록","regNo":"10-2509273","regDate":"2023.03.08","appNo":"10-2020-0187045","appDate":"2020.12.30","applicant":"주식회사 헬리오스 · 선문대학교 산학협력단","coApplicant":true,"expiry":"2040.12.30","inventor":"현광희","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 유채 추출물의 바이오리노베이션에 의한 미백 조성물 및 그 제조 방법에 관한 것으로, 미생물의 효소적 기능을 이용해 천연물인 유채의 유효성분을 생물전환시켜 B16F10 흑색종 세포의 활성화를 억제하고 멜라닌 합성을 저해하는 화합물을 생성한다. 그동안 미백 소재로 쓰이지 않던 유채를 활용해 피부 안정성을 높이고 부작용을 줄인 미백 조성물을 제공하며, 제주에서 재배되는 유채와 제주 재래간장에서 분리한 균주를 소재로 삼는다.","features":[{"k":"특징","v":"유채의 꽃과 잎을 에탄올로 주정추출해 감압 농축한 추출물과, 배양 후 원심분리해 얻은 바실러스 아미로리쿼파시엔스 펠렛을 PG 버퍼 현탁액 상태로 반응시켜 생물전환하고, 반응액을 원심분리·여과·감압 농축하여 멜라닌 합성 저해 유효성분을 수득한다."},{"k":"효과","v":"생물전환된 유채 추출물은 기존 추출물보다 티로시나아제 활성과 TRP-1 발현을 크게 억제해 우수한 미백 활성을 보이며, 세포 독성이 없어 스킨·로션·크림·에센스 등 화장품이나 외용 연고에 첨가해 피부 트러블 없이 사용할 수 있다."}],"lvl":3,"comparison":[{"item":"미백 유효성분","old":"하이드로퀴논·아스콜빈산·코지산 등 합성 소재를 배합","new":"유채 추출물을 미생물로 생물전환한 천연 유효성분 사용"},{"item":"피부 안정성","old":"하이드로퀴논은 피부 자극이 심해 배합량을 극소량 제한","new":"천연물 기반으로 피부 안정성을 높이고 부작용을 감소함"},{"item":"소재 활용 범위","old":"유채를 피부 미백을 위한 재료로 사용한 사례가 없었음","new":"유채 추출물을 바이오리노베이션해 신규 미백 소재로 활용"}],"applications":[{"title":"미백 화장료 조성물","desc":"멜라닌 합성을 저해해 피부 톤을 밝게 하는 연고와 에센스 등 화장료 조성물"},{"title":"과색소 침착증 개선","desc":"자외선과 호르몬 등에 기인하는 기미, 주근깨 등 피부 과색소 침착증을 개선"},{"title":"천연물 생물전환 소재","desc":"바실러스 아미로리쿼파시엔스를 이용해 천연물 유효성분을 전환하는 소재 제조"}],"figFile":"10-2020-0187045.jpg","figureCaption":"공보 대표도면"},{"id":"p1020210110294","title":"적대적 생성 신경망을 이용한 영상처리 시스템 및 이를 이용한 이미지간 변환방법","field":"소프트웨어","status":"등록","regNo":"10-2507654","regDate":"2023.03.03","appNo":"10-2021-0110294","appDate":"2021.08.20","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2041.08.20","inventor":"이규중","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 적대적 생성 신경망(GAN) 기반 영상처리 시스템 및 이미지간 변환방법에 관한 것으로, 입력된 단일 얼굴 이미지를 미리 정해진 카테고리별 표정 이미지로 변환해 여러 표정의 결과물을 생성한다. 기존 StarGAN은 학습과 변환을 모두 단일 네트워크로 처리해 학습이 용이하지 못하고 출력이 쉽게 변형되는 문제가 있었는데, 이를 개선하기 위해 생성자를 복수의 네트워크로 분리하여 이미지별로 나누어 학습과 생성이 수행되도록 구성하였다.","features":[{"k":"특징","v":"입력부, 영상처리부, 출력부, 제어부로 구성되며, 영상처리부의 StarGAN 생성자가 2개 이상의 네트워크로 나뉘어 제1 네트워크가 기쁨·슬픔·화남·놀람·무서움·싫음의 6가지 표정 이미지를 학습해 무표정 이미지를 생성하고, 제2 네트워크가 그 무표정 이미지로부터 다시 6가지 표정을 생성해 총 7가지 표정을 출력한다."},{"k":"효과","v":"학습에 요구되는 파라미터가 감소하여 학습이 보다 용이해지고, 기존 StarGAN의 출력 변형 문제와 전체적인 성능 한계를 개선할 수 있다. 또한 낮은 연산처리 능력의 시스템에서도 처리시간을 단축하여 비교적 간단한 구성과 저렴한 비용으로 고품질 결과물을 얻을 수 있다."}],"lvl":3,"comparison":[{"item":"네트워크 구성","old":"학습과 변환을 단일 네트워크에서 모두 처리하는 구조","new":"복수 네트워크가 이미지별로 학습·생성을 나누어 수행"},{"item":"학습 난이도","old":"파라미터가 많아 학습이 쉽지 않고 출력이 쉽게 변형됨","new":"학습에 요구되는 파라미터를 감소시켜 학습이 용이해짐"},{"item":"결과물 품질","old":"출력이 변형되어 고품질 결과물 확보에 한계가 있음","new":"간단한 구성과 저렴한 비용으로 고품질 결과물을 획득"}],"applications":[{"title":"얼굴 표정 이미지 변환","desc":"단일 얼굴 이미지로부터 미리 정해진 카테고리별 표정 이미지를 자동 생성하는 영상처리 서비스"},{"title":"스마트폰 사진 편집","desc":"스마트폰·태블릿 등 개인 휴대용 단말기에서 촬영한 이미지를 원하는 형태로 변환·편집하는 기능"},{"title":"딥러닝 영상처리 모듈","desc":"GAN 기반 이미지 변환 알고리즘을 탑재한 영상처리 시스템 및 소프트웨어 모듈 개발 분야"}],"figFile":"10-2021-0110294.jpg","figureCaption":"공보 대표도면"},{"id":"p1020210085279","title":"페트병 자동 분류 장치","field":"기계","status":"등록","regNo":"10-2506792","regDate":"2023.03.02","appNo":"10-2021-0085279","appDate":"2021.06.30","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2041.06.30","inventor":"조소민","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 페트병 자동 분류 장치에 관한 것으로, 재활용 과정에서 수작업으로 이루어지던 페트병 선별을 자동화한다. 투입부가 구비된 본체 하우징부 내부에 페트병 이송부와 색상 감지부, 제1페트병 분류부를 두어 투입된 페트병을 유색과 투명으로 자동 분류하고, 투명 페트병은 라벨 감지부와 제2페트병 분류부를 통해 비닐 라벨 부착 여부에 따라 다시 나누어 각각의 저장부에 보관한다.","features":[{"k":"특징","v":"제1카메라부 영상으로 제어부가 색상과 라벨 부착 여부를 판정하고, 격벽 상부의 중앙 회전 도어부재를 회전모터로 양방향 중 한쪽으로 돌려
