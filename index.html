<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="선문대학교 산학협력단 보유특허 기술이전 포털 - 특허번호·분야별 조회 및 기술요약자료(SMK) 열람">
<meta property="og:title" content="선문대 보유특허 기술이전">
<meta property="og:description" content="특허번호나 연구분야로 검색하고 기술요약자료(SMK)를 바로 확인하세요.">
</head>
<body>
<title>선문대 보유특허 기술이전</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#ffffff; --bg-alt:#f5f5f7; --tile:#f5f5f7; --tile-alt:#ffffff;
  --ink:#1d1d1f; --ink-2:#6e6e73; --ink-3:#86868b;
  --line:#d2d2d7; --line-soft:#e8e8ed;
  --link:#0066cc; --btn:#0071e3; --btn-hover:#0077ed;
  --nav-bg:rgba(255,255,255,.72); --nav-line:rgba(0,0,0,.14);
  --pill:#1d1d1f; --pill-ink:#ffffff; --field:#f5f5f7;
  --ok:#0a7d4b; --warn:#8a6100;
  --bar-bg:rgba(29,29,31,.92); --bar-ink:#f5f5f7;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --w:1080px; --w-mid:920px; --w-narrow:740px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#000000; --bg-alt:#0d0d0f; --tile:#1d1d1f; --tile-alt:#1d1d1f;
    --ink:#f5f5f7; --ink-2:#a1a1a6; --ink-3:#86868b;
    --line:#424245; --line-soft:#2a2a2c;
    --link:#2997ff; --btn:#0071e3; --btn-hover:#0077ed;
    --nav-bg:rgba(0,0,0,.72); --nav-line:rgba(255,255,255,.18);
    --pill:#f5f5f7; --pill-ink:#1d1d1f; --field:#1d1d1f;
    --ok:#4cd08a; --warn:#e0b357;
    --bar-bg:rgba(245,245,247,.94); --bar-ink:#1d1d1f;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000000; --bg-alt:#0d0d0f; --tile:#1d1d1f; --tile-alt:#1d1d1f;
  --ink:#f5f5f7; --ink-2:#a1a1a6; --ink-3:#86868b;
  --line:#424245; --line-soft:#2a2a2c;
  --link:#2997ff; --btn:#0071e3; --btn-hover:#0077ed;
  --nav-bg:rgba(0,0,0,.72); --nav-line:rgba(255,255,255,.18);
  --pill:#f5f5f7; --pill-ink:#1d1d1f; --field:#1d1d1f;
  --ok:#4cd08a; --warn:#e0b357;
  --bar-bg:rgba(245,245,247,.94); --bar-ink:#1d1d1f;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.47;
  letter-spacing:-.01em;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:3px solid var(--link);outline-offset:3px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.wrap{max-width:var(--w);margin:0 auto;padding-inline:22px}
.wrap.mid{max-width:var(--w-mid)}
.wrap.narrow{max-width:var(--w-narrow)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:0}
.center{text-align:center}
.sec{padding-block:clamp(56px,8vw,104px)}
.sec.tight{padding-block:clamp(38px,5vw,60px)}
.sec.alt{background:var(--bg-alt)}
.sec.alt .tilebox{background:var(--tile-alt)}
.sec.alt .searchbox{background:var(--tile-alt)}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--nav-bg);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--nav-line)}
.nav .wrap{display:flex;align-items:center;gap:14px;height:48px}
.navbrand{display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;cursor:pointer;
  font-size:14px;font-weight:600;letter-spacing:-.012em;color:var(--ink)}
.navbrand .mark{width:21px;height:21px;border-radius:6px;background:var(--ink);color:var(--bg);
  display:grid;place-items:center;font-size:9px;font-weight:700;letter-spacing:0}
.navbrand em{font-style:normal;font-weight:400;color:var(--ink-2)}
.navlinks{margin-left:auto;display:flex;gap:4px;align-items:center}
.navlink{background:none;border:0;padding:6px 11px;font-size:12px;color:var(--ink);cursor:pointer;border-radius:8px;white-space:nowrap}
.navlink:hover{color:var(--link)}

/* type */
.eyebrow{font-size:19px;font-weight:600;color:var(--link);letter-spacing:-.012em;margin:0 0 8px}
h1.hero-t{font-size:clamp(40px,7.2vw,74px);line-height:1.05;font-weight:700;letter-spacing:-.026em;margin:0;text-wrap:balance}
p.hero-s{font-size:clamp(21px,3vw,29px);line-height:1.22;font-weight:600;letter-spacing:-.02em;margin:14px 0 0;text-wrap:balance}
p.hero-d{font-size:17px;line-height:1.5;color:var(--ink-2);margin:20px auto 0;max-width:580px}
h2.sec-t{font-size:clamp(28px,4.6vw,42px);line-height:1.1;font-weight:600;letter-spacing:-.022em;margin:0;text-wrap:balance}
p.sec-s{font-size:17px;color:var(--ink-2);margin:12px auto 0;max-width:620px;line-height:1.5}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--btn);color:#fff;
  border:1px solid var(--btn);border-radius:980px;padding:11px 22px;font-size:17px;line-height:1.2;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--btn-hover);border-color:var(--btn-hover);text-decoration:none;color:#fff}
.btn.sm{font-size:14px;padding:8px 17px}
.btn.ghost{background:transparent;color:var(--link);border-color:var(--link)}
.btn.ghost:hover{background:color-mix(in srgb,var(--link) 9%,transparent);color:var(--link)}
.btn.plain{background:var(--tile);color:var(--ink);border-color:transparent}
.btn.plain:hover{background:var(--line-soft);color:var(--ink)}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.ctarow{display:flex;gap:24px;justify-content:center;flex-wrap:wrap;margin-top:28px;align-items:center}
.chev::after{content:" \203A"}

/* stats */
.stats{display:flex;justify-content:center;flex-wrap:wrap;margin-top:54px;border-top:1px solid var(--line-soft);padding-top:34px}
.stat{padding:4px 34px;text-align:center;border-right:1px solid var(--line-soft)}
.stat:last-child{border-right:0}
.stat b{display:block;font-size:clamp(30px,4vw,42px);font-weight:600;letter-spacing:-.024em;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:13px;color:var(--ink-2);margin-top:6px}
@media (max-width:620px){.stats{gap:24px 0}.stat{flex:1 0 46%;border-right:0;padding-inline:8px}}

/* search */
.searchwrap{max-width:620px;margin:0 auto}
.searchbox{display:flex;align-items:center;gap:10px;background:var(--field);border-radius:980px;padding:0 20px;border:1px solid transparent}
.searchbox:focus-within{border-color:var(--link)}
.searchbox input{flex:1;border:0;background:none;padding:14px 0;outline:none;min-width:0;font-size:17px}
.searchbox input::-webkit-search-cancel-button{display:none}
.searchbox svg{flex:0 0 17px;color:var(--ink-3)}
.clearbtn[hidden]{display:none}
.clearbtn{border:0;background:var(--ink-3);color:var(--bg);cursor:pointer;width:19px;height:19px;border-radius:50%;
  display:grid;place-items:center;font-size:11px;line-height:1;padding:0;flex:0 0 19px}
.toolrow{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:22px}
.chipgroup{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.chiplabel{font-size:12px;color:var(--ink-3);margin-right:2px}
.chip{border:1px solid var(--line);background:transparent;border-radius:980px;padding:6px 15px;font-size:14px;
  cursor:pointer;white-space:nowrap;color:var(--ink);line-height:1.35}
.chip:hover{border-color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--pill);border-color:var(--pill);color:var(--pill-ink)}
.chip .c{font-size:12px;opacity:.55;margin-left:5px;font-variant-numeric:tabular-nums}
select.sortsel{border:1px solid var(--line);background:transparent;border-radius:980px;padding:6px 14px;font-size:14px;cursor:pointer}

/* cards */
.resultbar{display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 0 20px;font-size:13px;color:var(--ink-3)}
.resultbar b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(318px,1fr));gap:18px}
.card{background:var(--tile);border-radius:20px;padding:28px 26px 20px;display:flex;flex-direction:column;gap:12px;
  transition:transform .25s cubic-bezier(.28,.11,.32,1)}
.card:hover{transform:scale(1.012)}
.card .open{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:11px}
.card .open:focus-visible{outline:3px solid var(--link);outline-offset:6px;border-radius:10px}
.card-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.field-tag{font-size:13px;font-weight:600;color:var(--link);letter-spacing:-.012em}
.badge{font-size:11px;font-weight:600;border-radius:980px;padding:3px 9px;border:1px solid currentColor;line-height:1.4}
.b-reg{color:var(--ok)} .b-app{color:var(--warn)}
.b-smk{color:var(--link)}
.b-sum{color:var(--ink-3)}
.fieldhead{grid-column:1/-1;margin:22px 0 2px;font-size:22px;font-weight:600;letter-spacing:-.018em;
  display:flex;align-items:baseline;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line-soft)}
.fieldhead:first-child{margin-top:0}
.fieldhead span{font-size:13px;font-weight:400;color:var(--ink-3);font-variant-numeric:tabular-nums}
.fieldmore{margin-left:auto;background:none;border:0;color:var(--link);font-size:14px;cursor:pointer;padding:2px 0}
.fieldmore:hover{text-decoration:underline}
.morerow{display:flex;justify-content:center;margin-top:28px}
.notice{max-width:700px;margin:34px auto 0;border:1px solid var(--line);border-radius:18px;
  padding:26px 28px;text-align:center}
.notice b{display:block;font-size:19px;font-weight:600;letter-spacing:-.016em;margin-bottom:8px}
.notice span{color:var(--ink-2);font-size:15px;line-height:1.55}
.fieldnote{font-size:12px;color:var(--ink-3);text-align:center;margin:18px 0 0}
.card h3{font-size:21px;line-height:1.24;margin:0;letter-spacing:-.018em;font-weight:600;text-wrap:balance}
.card .nums{font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:3px}
.card .nums b{font-weight:500;color:var(--ink)}
.card-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line-soft);display:flex;align-items:center;
  justify-content:space-between;gap:10px}
.cardlink{color:var(--link);font-size:14px;background:none;border:0;padding:0;cursor:pointer}
.cardlink:hover{text-decoration:underline}
.pickbtn{border:1px solid var(--line);background:transparent;border-radius:980px;padding:5px 13px;font-size:13px;cursor:pointer;
  white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.pickbtn:hover{border-color:var(--ink-2)}
.pickbtn[aria-pressed="true"]{background:var(--link);border-color:var(--link);color:#fff}
.empty{text-align:center;padding:84px 20px}
.empty b{display:block;font-size:26px;font-weight:600;letter-spacing:-.018em;margin-bottom:10px}
.empty span{color:var(--ink-2)}

/* detail */
.dhero{background:#000;color:#f5f5f7;padding-block:clamp(60px,9vw,112px);text-align:center}
.dhero .hashes{font-size:15px;color:#2997ff;margin:0 0 14px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.dhero h1{font-size:clamp(32px,6.2vw,64px);line-height:1.07;font-weight:700;letter-spacing:-.026em;margin:0;color:#fff;text-wrap:balance}
.dhero .pills{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:26px}
.dhero .pill{border:1px solid rgba(255,255,255,.34);border-radius:980px;padding:5px 14px;font-size:13px;color:#f5f5f7}
.dhero .num{font-family:var(--mono);font-size:13px;color:#a1a1a6;margin-top:18px}
.figstage{background:var(--bg-alt);padding-block:clamp(38px,6vw,68px)}
.figstage figure{margin:0;text-align:center}
.figstage img{border-radius:18px;background:#fff;padding:22px;max-width:640px;width:100%}
.figstage figcaption{font-size:13px;color:var(--ink-2);margin-top:18px}
.lead{font-size:clamp(19px,2.3vw,23px);line-height:1.45;letter-spacing:-.016em;margin:0 auto;max-width:700px;text-align:center;text-wrap:pretty}
.spec{max-width:700px;margin:38px auto 0;border-top:1px solid var(--line-soft)}
.spec .row{display:flex;gap:20px;padding:15px 2px;border-bottom:1px solid var(--line-soft);font-size:15px;align-items:baseline}
.spec .row dt{flex:0 0 132px;color:var(--ink-2);margin:0}
.spec .row dd{margin:0;flex:1;font-weight:500}
@media (max-width:560px){.spec .row{flex-direction:column;gap:3px}.spec .row dt{flex:none;font-size:13px}}
.fx{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-top:40px}
.tilebox{background:var(--tile);border-radius:20px;padding:30px 28px}
.fx .tilebox h3{margin:0 0 12px;font-size:15px;font-weight:600;color:var(--link)}
.fx .tilebox p{margin:0;font-size:16px;line-height:1.52}
.cmp{max-width:800px;margin:40px auto 0;border-top:1px solid var(--line)}
.cmp .hd,.cmp .rw{display:grid;grid-template-columns:.8fr 1.1fr 1.1fr;gap:18px;padding:16px 4px;border-bottom:1px solid var(--line-soft);align-items:start}
.cmp .hd{font-size:13px;color:var(--ink-3);border-bottom-color:var(--line)}
.cmp .hd span:last-child{color:var(--link);font-weight:600}
.cmp .rw{font-size:15px;line-height:1.45}
.cmp .rw .it{font-weight:600}
.cmp .rw .old{color:var(--ink-2)}
@media (max-width:640px){
  .cmp .hd{display:none}
  .cmp .rw{grid-template-columns:1fr;gap:6px;padding-block:18px}
  .cmp .rw .old::before{content:"기존 · ";color:var(--ink-3)}
  .cmp .rw .new::before{content:"개발 · ";color:var(--link)}
}
.apps,.market{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px;margin-top:40px}
.apps .tilebox{display:flex;flex-direction:column;gap:12px}
.apps h3{margin:0;font-size:20px;font-weight:600;letter-spacing:-.018em;line-height:1.26}
.apps p{margin:0;font-size:15px;line-height:1.5;color:var(--ink-2)}
.market .tilebox h3{margin:0;font-size:15px;font-weight:600;color:var(--ink-2)}
.mfig{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:18px 0 0}
.mfig .v{font-size:clamp(28px,4.4vw,40px);font-weight:700;letter-spacing:-.028em;line-height:1.05;font-variant-numeric:tabular-nums}
.mfig .v small{font-size:.42em;font-weight:600;color:var(--ink-2);margin-left:3px}
.mfig .yr{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.mfig .to{color:var(--link);font-size:20px;line-height:1}
.cagr{display:inline-block;margin-top:14px;border:1px solid var(--link);color:var(--link);border-radius:980px;
  padding:3px 11px;font-size:12px;font-weight:600}
.market p.note{margin:16px 0 0;font-size:14px;line-height:1.55;color:var(--ink-2)}
.backrow{padding-block:18px}
.backbtn{background:none;border:0;color:var(--link);font-size:15px;cursor:pointer;padding:4px 0}
.backbtn:hover{text-decoration:underline}

/* contact + foot */
.contact{text-align:center}
.contact dl{display:flex;justify-content:center;flex-wrap:wrap;margin:34px 0 0;padding:0}
.contact .ci{padding:6px 28px;border-right:1px solid var(--line-soft)}
.contact .ci:last-child{border-right:0}
.contact dt{font-size:13px;color:var(--ink-3)}
.contact dd{margin:4px 0 0;font-size:18px;font-weight:500;letter-spacing:-.014em}
@media (max-width:620px){.contact .ci{flex:1 0 46%;border-right:0;padding-inline:10px}}
.copybtn{border:1px solid var(--line);background:transparent;border-radius:980px;padding:2px 10px;font-size:12px;
  cursor:pointer;margin-left:8px;color:var(--ink-2);vertical-align:middle}
.copybtn:hover{border-color:var(--ink-2)}
.foot{background:var(--bg-alt);padding-block:26px;font-size:12px;color:var(--ink-3);line-height:1.6}
.foot .wrap{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap}


/* brand */
.logo{height:24px;width:auto;display:block;flex:0 0 auto}
.brandname{font-weight:600;letter-spacing:-.014em;white-space:nowrap}
.navbrand{gap:9px}
.navbrand .brandname{font-size:14px}
.herobrand{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 20px}
.herobrand .logo{height:46px}
.herobrand .brandname{font-size:clamp(18px,2.4vw,22px);color:var(--ink-2)}
.footbrand{display:flex;align-items:center;gap:10px}
.footbrand .logo{height:30px}
.footbrand .brandname{font-size:14px;color:var(--ink-2)}
.footcol{display:flex;flex-direction:column;gap:8px}
@media (max-width:620px){
  .navbrand em{display:none}
  .navbrand .logo{height:20px}
  .navbrand .brandname{font-size:13px}
  .herobrand{gap:9px}
  .herobrand .logo{height:36px}
  .nav .navlinks .navlink:first-child{display:none}
  .nav .wrap{gap:8px}
}
@media (max-width:400px){.navlink{padding:6px 7px;font-size:11px}}

/* selection bar */
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));
  z-index:60;background:var(--bar-bg);color:var(--bar-ink);border-radius:980px;padding:9px 9px 9px 22px;
  display:flex;align-items:center;gap:16px;max-width:calc(100% - 32px);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 14px 38px -12px rgba(0,0,0,.45)}
.selbar .t{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.selbar .t b{font-variant-numeric:tabular-nums}
.selbar .clr{background:none;border:0;color:inherit;opacity:.6;font-size:13px;cursor:pointer;padding:4px}
.selbar .clr:hover{opacity:1}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.48);display:grid;place-items:center;z-index:80;padding:20px;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);overflow-y:auto}
.modal{background:var(--bg);border-radius:20px;max-width:460px;width:100%;padding:30px;margin:auto;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.4)}
.modal h3{margin:0 0 8px;font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.22}
.modal p{margin:0 0 18px;color:var(--ink-2);font-size:15px}
.modal ol{margin:0 0 20px;padding-left:20px;font-size:15px;line-height:1.7;color:var(--ink-2)}
.modal .picked{background:var(--field);border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.6;margin-bottom:20px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:980px;font-size:15px;z-index:90;
  box-shadow:0 14px 34px -12px rgba(0,0,0,.5);max-width:calc(100% - 40px)}
</style>

<script type="application/json" id="seed">

의 사용자 인터페이스부를 통해 게임을 제공하고, 그 게임의 스코어를 기초로 모터 활성화 여부를 결정한다. 게임은 기억력 게임, 순발력 게임, 균형 게임 중 적어도 하나를 포함한다. 공유 킥보드 서비스에서 음주 후 운행 사례가 증가하는 문제에 대응하기 위한 것이다.","features":[{"k":"특징","v":"부저 횟수 기억, 도형 대응 버튼 입력, 킥보드 위 균형 유지 시간으로 스코어를 산출하고, 요청 시간대와 주변 주류 판매 음식점 수에 따라 난이도를 가변하며, 스코어 구간에 따라 레버 잠금 부재를 해제하거나 모터 전력을 차단하고 추가 게임을 제공한다."},{"k":"효과","v":"게임 스코어로 모터 활성화를 결정해 음주 운전을 방지할 수 있고, 주행 패턴이 비정상으로 인식되면 모터를 비활성화하고 게임을 다시 제공하여 운전자 바꿔치기 행위까지 차단해 사고 발생을 줄일 수 있다."}],"lvl":3,"comparison":[{"item":"음주 판단 방식","old":"스마트폰 음주측정기와 얼굴 인식으로 음주 여부를 확인","new":"기억력·순발력·균형 게임 스코어로 음주 여부 판단"},{"item":"주행 차단 수단","old":"이용이 자율에 맡겨져 음주 상태에서도 주행이 가능","new":"스코어가 기준 구간에 들지 않으면 모터를 비활성"},{"item":"검사 난이도 조절","old":"이용자 상황과 무관하게 동일한 기준으로만 확인","new":"요청 시간대와 주변 주류 판매 음식점 수로 난이도 조정"}],"applications":[{"title":"공유 전동 킥보드 서비스","desc":"사용자 단말의 사용 요청을 받아 게임 통과 여부로 공유 킥보드 대여를 제어하는 서비스"},{"title":"퍼스널 모빌리티 제어 장치","desc":"전동 킥보드 사용자 인터페이스부와 모터 활성화를 연동해 주행 개시를 제어하는 장치"},{"title":"음주 운전 예방 프로그램","desc":"기억력·순발력·균형 게임을 단계적으로 제공해 음주 상태의 원동기 운행을 사전에 차단"}],"figFile":"10-2024-0024037.jpg","figureCaption":"공보 대표도면"},{"id":"p1020230018324","title":"자동차 내부 환경 제어 방법 및 컴퓨터 프로그램","field":"건설","status":"등록","regNo":"10-2986781","regDate":"2026.07.01","appNo":"10-2023-0018324","appDate":"2023.02.10","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2043.02.10","inventor":"최창하","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 탑승자를 얼굴 화상으로 인식해 차량 실내 환경을 맞춤 제어하는 방법 및 컴퓨터 프로그램에 관한 것으로, 사용자가 승차하면 화상 이미지로 식별 정보를 인식하고 메모리에서 해당 사용자의 선호 환경 정보를 불러온다. 이어 차량 내·외부 온습도와 날씨·시간 등 현재 환경 정보와 비교해 온도 올림·내림, 습도 올림·내림 중 설정 타입을 결정하고 환경 제어 모듈을 작동시킨다.","features":[{"k":"특징","v":"사용자가 공조 장치를 조작한 시점의 환경 정보와 조작 내용, 일정 시간 경과 후 변화된 실내 환경을 맵핑해 선호 환경 정보를 생성·업데이트하고, 조작 이력을 산점도 그래프로 만들어 클러스터링해 자동 설정에 활용한다. 여러 명이 탑승하면 추천 온습도 범위에 드는 선호값에 가중치를 주어 설정값을 정한다."},{"k":"효과","v":"탑승자별 평소 습관에 맞춰 실내 온도와 습도가 자동 조절되므로 탑승마다 공조 장치를 반복 조작할 필요가 없고, 선호값과 차이가 큰 경우 제어 장치 출력을 최대로 설정해 빠르게 쾌적한 실내 환경에 도달할 수 있다."}],"lvl":3,"comparison":[{"item":"환경 설정 방식","old":"터치 스크린 3-0058549","appDate":"2023.05.04","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2043.05.04","inventor":"김진우","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 미세조류에서 유래된 불검화물의 제조방법 및 그에 따라 제조된 불검화물에 관한 것으로, 미세조류를 제1 용매로 40~70 ℃에서 1차 추출하고 진탕배양기에서 2차 추출해 미세조류 지질을 분리한 뒤, 이 지질을 제2 용매와 혼합해 초음파기로 검화반응을 수행하고 검화되지 않은 불검화물을 수득한다. 클로렐라, 스피룰리나 등 다양한 미세조류에 적용된다. 2단계 추출로 지질을 확보한 뒤 초음파 검화를 적용하는 점이 특징이다.","features":[{"k":"특징","v":"제1 용매로 헥산이나 저급알코올 등을 쓰고, 제2 용매로 수산화칼륨·에탄올 수용액 혼합용매 등을 사용하여 20~50 kHz 진동수와 50~700 W 파워의 초음파기로 60~100 ℃에서 50~150분 검화반응을 진행한 다음, 헥산층과 수층의 층분리로 불검화물을 분리·세척해 용매를 제거한다."},{"k":"효과","v":"초음파 검화 방식이 KOH 단독 용매나 고체/액체 추출 방식보다 불검화물 수율이 높았고(36.85% 대 19.44%, 10.87%), 얻어진 불검화물에서 헥사데칸산, 테트라데칸산 에틸에스터, 콜레스트-5-en-3-ol 등이 검출되어 골다공증, 항균·항진균, 항염, 항산화용 의약품·식품·화장료 소재로 활용할 수 있다."}],"lvl":3,"comparison":[{"item":"불검화물 수득 방식","old":"검화 후 불검화물을 고순도로 다량 수득하는 방법이 부족","new":"2차에 걸쳐 지질을 분리한 뒤 검화해 높은 수율로 수득"},{"item":"검화반응 조건","old":"알칼리 상에서 가열하는 일반적인 검화반응으로 수행","new":"20~50kHz, 50~700W 초음파기로 검화반응을 수행"},{"item":"불순물 저감","old":"불순물 함량이 높아 고순도 불검화물 확보가 어려움","new":"정치 후 고액분리로 지질을 분리해 불순물 함량을 낮춤"}],"applications":[{"title":"골다공증 개선 소재","desc":"미세조류 유래 불검화물을 골다공증 개선용 의약품이나 식품 조성물의 유효성분으로 활용"},{"title":"항균·항염 기능성 소재","desc":"불검화물에 함유된 유용물질로 항균·항진균·항염 효과를 내는 의약품 및 식품 조성물"},{"title":"항산화 화장료 원료","desc":"클로렐라나 스피룰리나 등 미세조류에서 얻은 불검화물을 항산화용 화장료 조성물의 원료로 사용"}],"figFile":"10-2023-0058549.jpg","figureCaption":"공보 대표도면"},{"id":"p1020240183817","title":"줄넘기 계수용 스마트 바이오 헬스 장치 및 이를 운용하는 방법","field":"생활","status":"등록","regNo":"10-2963222","regDate":"2026.05.06","appNo":"10-2024-0183817","appDate":"2024.12.11","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2044.12.11","inventor":"양현석","transfer":"매매 · 라이센스","smk":false,"brief":false,"lvl":0},{"id":"p1020240022192","title":"무소음 고광속 촬영 조명구조물","field":"건설","status":"등록","regNo":"10-2948456","regDate":"2026.04.01","appNo":"10-2024-0022192","appDate":"2024.02.16","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2044.02.16","inventor":"유순재","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 촬영 스튜디오에서 영상 촬영 시 조명으로 영상 색채의 시각적 효과를 조절하는 무소음 고광속 촬영 조명구조물에 관한 것으로, 외부 전원을 공급받는 등기구에 전기적으로 접속되어 등기구로 둘러싸이는 조명 도구를 포함한다. 조명 도구는 단상 부재, 조명 기둥들, 열방출 부재, 안착 디스크, 소켓 베이스, 전원 공급부 및 정전류 회로부로 구성된다. 발열이 크고 수명이 짧은 할로겐 램프를 대체하기 위한 LED 조명 구조물이다.","features":[{"k":"특징","v":"단상 부재 가장자리에 16개의 조명 기둥을 배치해 전원 공급부를 둘러싸고 각 기둥의 인쇄회로기판에 발광 다이오드와 정전류 회로를 두며, 방열핀과 방열 필러, 열발산 패턴을 통해 방열팬 없이 전원 공급부와 LED의 열을 외부로 배출한다."},{"k":"효과","v":"스튜디오 조명 타입 3000K 또는 6000K 설정 시 광선속 20,000~25,000 lm과 연색성 90~95를 확보해 색온도 설정 자유도를 높이고, 150분 동작에도 부품 온도를 100℃ 미만으로 유지하여 촬영 환경을 개선하고 사용 수명 연장으로 촬영 단가를 낮춘다."}],"lvl":3,"comparison":[{"item":"조명 광원 방식","old":"유리 벌브에 할로겐 가스를 봉입한 할로겐 램프를 사용","new":"정전류 회로부를 갖춘 LED 조명 기둥 16개로 구성"},{"item":"발열·방열 처리","old":"전력 소모가 커 열이 많이 나 실내 온도를 크게 올림","new":"방열 필러와 열발산 패턴, 방열핀으로 열을 방출"},{"item":"색온도 설정","old":"할로겐 램프는 3000~3200K에 묶여 색온도 설정 자유도가 제한","new":"스튜디오 조명 타입 3000K 또는 6000K로 설정 가능"}],"applications":[{"title":"영화 촬영 스튜디오 조명","desc":"할로겐 램프를 대체해 영상 촬영 시 색채의 시각적 효과를 조절하는 스튜디오 조명구조물"},{"title":"고광속 LED 등기구","desc":"외부 전원을 공급받는 등기구에 접속해 광선속 20000~25000lm을 내는 고광속 조명 도구"},{"title":"방열 일체형 조명 구조","desc":"단상 부재에 방열 필러와 열발산 패턴을 일체로 구성해 실내 온도 상승을 억제하는 조명 구조"}],"figFile":"10-2024-0022192.jpg","figureCaption":"공보 대표도면"},{"id":"p1020240067289","title":"이동 로봇","field":"기계","status":"등록","regNo":"10-2948220","regDate":"2026.03.31","appNo":"10-2024-0067289","appDate":"2024.05.23","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2044.05.23","inventor":"이경순","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 무한궤도 주행부를 갖춘 자율 주행 이동 로봇에 관한 것으로, 본체부의 전방·측면·후면·저면에 배치된 복수의 거리 감지 센서와 카메라 센서·레이저 스캐너를 포함하는 감지부, 그리고 주행 제어부·데이터베이스부·객체 추적부를 갖는 메인 제어부로 구성된다. 주변 시설물을 인식해 계단이나 경사로를 오르거나 벽·기둥은 우회하며, 사용자를 인식·추적해 따라다닐 수 있다.","features":[{"k":"특징","v":"전방 제1 거리 감지 센서의 측정값을 제1 기준값과 비교해 계단 여부를 판단하고, 무한궤도가 진입해 기울어진 상태에서 저면 제4 거리 감지 센서의 측정값을 제2 기준값과 비교해 전복 없이 통과 가능한지 최종 판단한다. 객체 추적부는 카메라 영상의 스켈레톤 데이터와 레이저 스캔 데이터를 w":"센서와 카메라 모듈러 유니트를 기능별로 착탈하는 오픈 아키텍처"},{"item":"보행자 소통 수단","old":"방향 지시등에만 의존해 미점등 시 의사 전달이 이루어지지 않음","new":"안내 문구와 스피커 음성으로 정지·좌우·긴급 상황을 주변에 알림"}],"applications":[{"title":"차량 외부 알림 디스플레이","desc":"차량의 전방·측방·후방에 설치해 정지, 좌우, 긴급 상황을 주변에 알리는 외부 표시 장치"},{"title":"자율주행로봇 상태 표시","desc":"자율주행로봇이 자체 상황과 충돌 방지 알림을 외부로 출력해 보행자와 소통하게 하는 장치"},{"title":"방향 지시 보조 시스템","desc":"방향 지시등 미점등으로 인한 사고를 줄이기 위해 운행자의 음성이나 문자를 외부로 출력"}],"figFile":"10-2024-0085150.jpg","figureCaption":"공보 대표도면"},{"id":"p1020230113437","title":"레스베라트롤 글루코사이드의 제조방법","field":"의료","status":"등록","regNo":"10-2945646","regDate":"2026.03.25","appNo":"10-2023-0113437","appDate":"2023.08.29","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2043.08.29","inventor":"송재경","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 아밀로수크라아제의 존재 하에 레스베라트롤과 수크로스를 반응시키는 레스베라트롤 글루코사이드의 제조방법에 관한 것으로, 생체 내 및 시험관 내 시스템에서 신속하고 간편하게 높은 전환율로 글루코사이드를 제조한다. 레스베라트롤은 심혈관 보호·노화 방지·항암·항산화 등 유용한 활성을 갖지만 수성 매질에서 용해도가 낮고 빛·pH·고온에 불안정하며, 화학적 글리코실화는 반응 조건이 까다롭고 비용과 시간이 많이 들어 활용에 한계가 있었다.","features":[{"k":"특징","v":"Deinococcus geothermalis 유래 아밀로수크라아제(DgAS)를 재조합 대장균으로 생산해 값싼 수크로스를 포도당 공여체로 사용하며, 레스베라트롤 0.5~15mM, 수크로스 25~250mM, 효소 0.5~5㎍/ml 조건에서 25~60℃·pH 6~7로 반응시켜 3-OH와 4'-OH 위치에 글루코스를 1~4개 결합시킨다."},{"k":"효과","v":"시험관 내와 생체 내 모두 짧은 시간에 약 97.0%의 높은 전환율로 용해도가 높은 글루코실화 산물을 얻을 수 있고, 제조된 레스베라트롤 글루코사이드는 세포독성이 낮으면서 항산화·항염증·항노화 및 미백 활성을 가져 화장료 조성물로 활용할 수 있다."}],"lvl":3,"comparison":[{"item":"글리코실화 방법","old":"화학적 합성은 엄격한 반응 조건과 보호·탈보호기가 필요","new":"아밀로수크라아제로 수크로스를 공급원으로 당을 전이"},{"item":"생산 효율성","old":"낮은 입체특이성과 정제 난이도로 비용과 시간이 많이 소요","new":"생체 내 및 시험관 내에서 신속하고 간편하게 전환율 향상"},{"item":"세포 독성 문제","old":"미생물 세포 공장은 대사산물 고농도로 세포에 독성 발생","new":"시험관 내 효소 반응으로 세포 독성 문제를 회피"}],"applications":[{"title":"기능성 화장료 조성물","desc":"항산화, 항염증, 항노화 및 미백 활성을 갖는 레스베라트롤 글루코사이드를 함유한 화장료"},{"title":"레스베라트롤 용해도 개선","desc":"수성 매질에서 용해도가 낮은 레스베라트롤을 글루코실화해 활용도를 높이는 소재화 기술"},{"title":"효소 기반 당전이 공정","desc":"아밀로수크라아제와 수크로스를 이용해 폴리페놀에 당을 전이시키는 효소 생산 공정"}],"figFile":"10-2023-0113437.jpg","figureCaption":"공보 대표도면"},{"id":"p1020230189232","title":"차량용 다용도 콘솔 박스","field":"건설","status":"등록","regNo":"10-2944028","regDate":"2026.03.23","appNo":"10-2023-0189232","appDate":"2023.12.22","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2043.12.22","inventor":"이경순","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 차량용 다용도 콘솔 박스에 관한 것으로, 바디부 내부에 에어컨과 냉장 유니트를 두고 측면 통기공으로 냉기 또는 온기를 방출하며, 냉장 보관할 내용물을 올린 거치대를 바디부로부터 인출할 수 있도록 구성한다. 수납 공간과 뚜껑만으로 물품 보관에 그쳤던 기존 콘솔 박스로는 운전자와 탑승객의 다양한 편의 요구를 충족할 수 없었던 점을 해결하고자 한 것이다.","features":[{"k":"특징","v":"거치대는 덮개부·연결 부재·안착 부재로 이루어지고 안착 부재 바닥의 관통공으로 냉기가 고르게 전달되며, 걸림 돌기와 탄성 부재로 된 록킹 수단이 인출 위치를 유지한다. 바디부는 랙크 부재·전달 기어·구동 모터로 가이드 레일을 따라 이동하고, 전동 수단이 착탈식 기기 모듈을 외부로 인출한다."},{"k":"효과","v":"에어컨·냉장고·접이식 테이블·모니터 착탈·컵홀더 기능과 신발 드라이기나 쿡커 같은 착탈식 기기 모듈을 한 곳에 모아, 차량의 한정된 실내 공간에서 다양한 편의 기능을 제공한다. 실내 공간 확보가 용이한 자율주행차와 전기차에서 특히 활용도가 높다."}],"lvl":3,"comparison":[{"item":"콘솔 기능 범위","old":"수납 공간과 뚜껑으로 물품을 수납하는 정도로만 이용","new":"에어컨, 냉장, 테이블, 모니터 착탈 등 다용도로 활용"},{"item":"온도 조절 기능","old":"별도의 냉난방이나 냉장 기능이 제공되지 않음","new":"내부 에어컨의 냉기와 온기를 측면 통기공으로 방출"},{"item":"내용물 보관 방식","old":"수납 공간에 물품을 그대로 넣어 보관","new":"바디부에서 입출되는 거치대로 내용물을 냉장 보관"}],"applications":[{"title":"차량 실내 편의 장치","desc":"운전석과 조수석 사이에 설치해 운전자와 탑승객에게 다양한 편의 기능을 제공하는 장치"},{"title":"차량용 소형 냉장 유니트","desc":"바디부에서 인출되는 거치대에 내용물을 거치한 상태로 차량 내에서 냉장 보관하는 유니트"},{"title":"자율주행차 실내 구성","desc":"실내 공간 확보가 용이한 자율 주행차와 전기차에 설치해 다양한 편의 기능을 구현하는 구성"}],"figFile":"10-2023-0189232.jpg","figureCaption":"공보 대표도면"},{"id":"p1020230108228","title":"건강 모니터링 장치 및 방법","field":"소프트웨어","status":"등록","regNo":"10-2938588","regDate":"2026.03.09","appNo":"10-2023-0108228","appDate":"2023.08.18","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2043.08.18","inventor":"황찬승","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 사용자의 건강상태를 지속적으로 모니터링하여 심근경색과 같은 이상증세를 사전에 감지하고 대응하기 위한 건강 모니터링 장치 및 방법에 관한 것으로, 수분센서와 온도센서를 포함하는 측정센서부와 측정값을 분석하는 사용자 단말기로 구성된다. 종래에는 건강상태를 검사하려면 병원 등 검진시설을 직접 방문하거나 각종 측정장치를 별도로 구비해 측정해야 하는 불편함이 있어 주기적·지속적인 모니터링이 어려웠고, 그로 인해 치명적인 질환의 이상증세를 사전에 감지하기 어려웠다.","features":[{"k":"특징","v":"측정센서부는 셔츠나 내의류의 땀 발산이 많은 복부 부위에 부착되어 수분량과 체온을 주기적으로 측정해 블루투스로 전송하며, 사용자 단말기의 전용 앱은 체온과 외부 온도의 차이가 기준을 벗어나고 수분량이 기준값을 초과하면 심근경색 위험으로 판단해 위험도 등급별 대응절차를 수행한다."},{"k":"효과","v":"비교적 간단한 구성과 저렴한 비용으로 건강상태를 상시 모니터링해 심근경색 등 이상증세를 사전에 감지하고 신속히 대응할 수 있으며, 측정값과 모니터링 정보로 데이터베이스를 구축해 맞춤형 건강관리 서비스로 확장할 수 있다."}],"lvl":3,"comparison":[{"item":"측정 수행 방식","old":"검진시설을 방문하거나 측정장치를 별도로 구비해 측정","new":"의복 복부에 부착한 센서가 수분량과 체온을 주기 측정"},{"item":"모니터링 지속성","old":"특정 시점 측정만 가능해 상시 모니터링이 어려움","new":"부착형 센서와 전용 앱으로 건강상태를 지속적으로 모니터링"},{"item":"이상징후 대응","old":"진단 정확성 향상에 그쳐 사전 징후 감지 수단이 없음","new":"체온과 외기 차이 및 수분량으로 위험 등급을 판단해 경고"}],"applications":[{"title":"심근경색 예방 모니터링","desc":"체온과 외부 온도의 차이 및 수분량을 비교해 심근경색 위험 등급을 판단하고 대응하는 용도"},{"title":"의류 부착형 센서 모듈","desc":"셔츠나 내의류의 땀 발산이 많은 복부 부위에 부착해 수분량과 체온을 측정하는 부착형 센서부"},{"title":"건강 데이터베이스 구축","desc":"측정값과 모니터링 정보를 서버로 전송해 사용자별 건강 모니터링 데이터베이스를 구축하는 용도"}],"figFile":"10-2023-0108228.jpg","figureCaption":"공보 대표도면"},{"id":"p1020250006261","title":"스마트 건강 신발","field":"생활","status":"등록","regNo":"10-2938589","regDate":"2026.03.09","appNo":"10-2025-0006261","appDate":"2025.01.15","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2045.01.15","inventor":"황찬승","transfer":"매매 · 라이센스","smk":false,"brief":false,"lvl":0},{"id":"p1020240010767","title":"테이블 변환이 가능한 차량 적재함 커버 및 이를 구비한 차량","field":"건설","status":"등록","regNo":"10-2938548","regDate":"2026.03.09","appNo":"10-2024-0010767","appDate":"2024.01.24","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2044.01.24","inventor":"강민수","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 테이블 변환이 가능한 차량 적재함 커버 및 이를 구비한 차량에 관한 것으로, 적재함 격벽에 적층되는 커버 프레임, 적재함을 밀폐하는 루프 커버, 일측 격벽에 고정되는 힌지 프레임, 커버 프레임의 회동축을 형성하는 원통 형상의 힌지 축, 타측 빔에 체결되는 테이블 레그로 구성된다. 평시에는 적재함 커버로 쓰고 캠핑 시 루프 커버를 회동시켜 테이블로 전환한다.","features":[{"k":"특징","v":"테이블 레그를 힌지 프레임에서 빼면 커버 프레임 전체가 180도 회동해 루프 커버가 뒤집히고, 힌지 축이 ㄱ자 힌지 프레임의 가이드 레일을 따라 제2 위치까지 하강해 테이블 높이가 정해진다. 빼낸 테이블 레그는 제1 빔의 레그 체결부에 체결되어 루프 커버를 지지한다."},{"k":"효과","v":"기존 픽업트럭 등 일반 트럭의 적재함 격벽에 힌지 프레임을 탈착식으로 설치할 수 있어 차체 특수 설계가 필요 없다. 테이블 레그는 평시 힌지 프레임에 수납되어 보관이 쉽고, 루프 커버의 아랫면을 테이블 면으로 사용해 위생 관리가 용이하며 대면적으로 다수 인원을 수용할 수 있다."}],"lvl":3,"comparison":[{"item":"차체 개조 범위","old":"테이블 변환을 위해 트렁크나 적재부의 특수 설계가 필요함","new":"힌지 프레임을 적재함 격벽에 고정해 탈착식으로 설치"},{"item":"적용 가능 차종","old":"차체 설계가 특화되어 보급된 일반차량에는 적용이 어려움","new":"기존 픽업트럭 및 기타 트럭에 장착 가능한 모듈형 커버"},{"item":"테이블 확보 방식","old":"테이블은 부피와 무게가 커서 보관과 운반이 용이하지 않음","new":"루프 커버를 회동·반전시켜 대면적 테이블로 활용함"}],"applications":[{"title":"픽업트럭 적재함 커버","desc":"평시에는 적재함을 밀폐해 짐칸이 보이지 않게 하고 캠핑 시 테이블로 전환하는 커버"},{"title":"차량 캠핑 용품","desc":"부피와 무게가 큰 테이블을 따로 운반하지 않고 차량 커버로 대체하는 캠핑 장비 분야"},{"title":"차량 개조 애프터마켓","desc":"힌지 프레임과 테이블 레그를 결합해 기존 트럭에 탈착 설치하는 차량 개조 부품 분야"}],"figFile":"10-2024-0010767.jpg","figureCaption":"공보 대표도면"},{"id":"p1020240011489","title":"차량용 휠체어 램프 인출장치","field":"의료","status":"등록","regNo":"10-2937398","regDate":"2026.03.05","appNo":"10-2024-0011489","appDate":"2024.01.25","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2044.01.25","inventor":"강민수","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 차량용 휠체어 램프 인출장치에 관한 것으로, 말릴 수 있도록(rollable) 형성된 슬로프를 하우징에 인출 가능하게 수용하고, 하우징 내측벽의 홈으로 이루어진 이동경로부가 슬로프가 말려 수용되도록 이동을 안내하며, 인출 방향으로 신장되는 지지부가 슬로프를 지지한다. 램프가 차량 후미에 설치되어 트렁크 공간을 효율적으로 쓰지 못하고 주차장 경계석 때문에 후방 전개가 어려웠던 문제를 해결하고자 한 것이다.","features":[{"k":"특징","v":"슬로프는 복수의 지지편과 그 하면의 돌출편, 이를 잇는 연결링크로 구성되어 하방으로만 말리고 상방 변형은 지지편 간 간섭으로 저지되며, 연결링크에 맞물리는 스프라켓기어가 슬로프를 인출·인입하고 수용바와 제1·제2지지바, 고정바가 펴지면서 하중을 지지한다."},{"k":"효과","v":"슬로프가 말려 수용되므로 하우징 길이와 전체 부피가 줄어 차량 측방으로도 인출할 수 있고, 차량의 내부공간을 최대한 활용하면서 램프를 용이하게 인출할 수 있다. 또한 연결링크가 인장력을 견디므로 휠체어 하중에도 슬로프가 아래로 처지지 않는다."}],"lvl":3,"comparison":[{"item":"램프 설치 위치","old":"램프 길이로 인해 차량 후미에 설치되어 후방으로 펼쳐짐","new":"말릴 수 있는 슬로프를 하우징에 수용해 설치 공간을 절약"},{"item":"적재공간 활용","old":"후미 설치로 트렁크 등 짐 수용 공간을 효율적으로 못 씀","new":"슬로프가 말려 수용되어 차량 내부공간을 최대한 활용함"},{"item":"주차 환경 대응" atus":"등록","regNo":"10-2935808","regDate":"2026.03.03","appNo":"10-2024-0019752","appDate":"2024.02.08","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2044.02.08","inventor":"이현섭","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 반도체 물류 장비인 스토커(Stocker)의 고장을 사전에 진단하는 시스템 및 방법에 관한 것으로, 벨트의 장력·진동·소음, 이재부의 전류, 주행부의 변위·기울기·전류를 각각 감지하는 복수의 감지부와 고장진단 서버로 구성된다. 서버는 수집된 감지 데이터를 학습된 머신러닝 모델에 입력하여 스토커 장비의 고장진단 결과 데이터를 획득하고, 이를 유저 단말에 제공하여 디스플레이시킨다.","features":[{"k":"특징","v":"서버는 7종 감지 데이터를 받는 데이터 수신부, 학습된 머신러닝 모델로 진단 결과를 산출하는 AI 분석부, 결과를 단말에 표시하는 분석결과 출력부로 구성되며, 감지 데이터와 고장진단 결과의 데이터 세트로 모델을 학습시키고 진단 결과는 데이터베이스로 축적한다."},{"k":"효과","v":"스토커를 구성하는 장비의 상태 감지 데이터를 기초로 AI 분석을 수행해 고장을 사전에 진단할 수 있어, 최적의 유지보수 시점 설정과 돌발 정지 회피, 부품 내구성 데이터 관리가 가능하고 고장으로 인한 생산 피해를 줄일 수 있다."}],"lvl":3,"comparison":[{"item":"고장 대응 방식","old":"고장 발생 후 수리하는 사후 대응으로 생산 피해 발생","new":"감지 데이터 AI 분석으로 고장을 사전에 진단"},{"item":"상태 감지 범위","old":"스토커 예측 진단 기술이 개발·도입된 사례가 드묾","new":"벨트·이재부·주행부 7종 감지부로 상태를 동시 수집"},{"item":"진단 결과 활용","old":"부품 내구성과 고장 원인을 데이터화하여 관리하지 못함","new":"머신러닝 진단 결과를 유저 단말에 제공해 유지보수 시점 설정"}],"applications":[{"title":"반도체 물류 스토커 예지보전","desc":"반도체 소재·자재를 보관하고 입출고하는 스토커 장비의 고장을 사전에 진단해 돌발 정지를 피하는 용도"},{"title":"디스플레이 생산설비 진단","desc":"수백 대 규모로 운영되는 디스플레이·반도체 생산 설비의 상태 감지 데이터를 모아 고장 원인을 제거하는 관리"},{"title":"설비 유지보수 일정 관리","desc":"고장진단 결과를 데이터베이스화해 부품 내구성을 관리하고 최적의 유지보수 시간대를 설정하는 데 활용"}],"figFile":"10-2024-0019752.jpg","figureCaption":"공보 대표도면"},{"id":"p1020240019753","title":"스토커 장비 고장진단 서버","field":"의료","status":"등록","regNo":"10-2935809","regDate":"2026.03.03","appNo":"10-2024-0019753","appDate":"2024.02.08","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2044.02.08","inventor":"이현섭","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 스토커 장비의 고장을 사전에 진단하는 고장진단 서버에 관한 것으로, 벨트 장력·진동·소음 감지부, 이재부 전류 감지부, 주행부 변위·기울기·전류 감지부로부터 감지 데이터를 입력받아 학습된 딥러닝 모델에 입력시켜 고장진단 결과 데이터를 획득하고, 획득된 결과를 유저 단말에 제공하여 디스플레이시키도록 구성된다. 반도체 및 디스플레이 생산 라인의 물류 장비인 스토커를 대상으로 한다.","features":[{"k":"  소재","desc":"베타인과 제아잔틴이 함유된 구기자 열매를 분말화해 식품 부재료로 활용하는 소재"},{"title":"글루텐프리 면 제조 공정","desc":"곡류 분말과 구기자 분말에 물을 넣어 반죽하고 제면하는 글루텐프리 면 제조 공정"}]},{"id":"p1020240115683","title":"시각 장애인의 디지털 활용 역량을 교육하기 위한 교육 제공 장치","field":"의료","status":"등록","regNo":"10-2933050","regDate":"2026.02.25","appNo":"10-2024-0115683","appDate":"2024.08.28","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2044.08.28","inventor":"경종수","transfer":"매매 · 라이센스","smk":false,"brief":false,"lvl":0},{"id":"p1020240011484","title":"조명장치","field":"기계","status":"등록","regNo":"10-2929950","regDate":"2026.02.19","appNo":"10-2024-0011484","appDate":"2024.01.25","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2044.01.25","inventor":"유순재","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 발광다이오드(LED)를 구비한 조명장치에 관한 것으로, 하부 연결단과 상부 연결단 및 복수의 분리 펜스로 이루어진 연결단, 연결단 가장자리에 현수되는 거치대, 거치대 위의 조명부, 그리고 상부 연결단에 순차 적층되는 방열 부재와 결합 부재, 조명기구 소켓과 나선 결합하는 베이스 및 전원부로 구성된다. 방열핀과 방열팬을 함께 써야 했던 기존 LED 조명의 구조를 단순화하면서 LED에서 발생하는 열을 신속하게 식히는 것을 목적으로 한다.","features":[{"k":"특징","v":"연결단 가장자리를 따라 반복 배치된 거치대에 인쇄회로기판과 복수의 LED를 길이 방향으로 장착해 LED를 외부에 직접 노출시키고, 거치대를 관통하는 홀의 내주면과 외주면에 방열 돌기를 형성하며, 별도의 방열팬 없이 방열 부재와 결합 부재만으로 열을 분산시킨다."},{"k":"효과","v":"발광 다이오드 주변 구성 요소를 단순화하면서 발생열을 신속히 식힐 수 있어, 접합부 온도 상승에 따른 출력 광량 감소와 색 변화, 주변 부품 노화로 인한 사용수명 단축을 억제할 수 있다."}],"lvl":3,"comparison":[{"item":"LED 방열 구조","old":"방열핀과 방열팬 용도가 내부 온도를 낮추는 데 제한됨","new":"연결단 상에 방열 부재를 적층하고 거치대에 관통홀 형성"},{"item":"발광부 배치","old":"발광 다이오드가 장치 내부에 위치해 내부 온도가 상승함","new":"연결단 가장자리 거치대에 LED를 외부로 직접 노출시킴"},{"item":"광량·수명 유지","old":"접합부 온도 상승으로 출력 광량이 줄고 사용수명이 짧아짐","new":"열 집중을 완화해 광량 감소와 구성 요소 노화를 억제함"}],"applications":[{"title":"LED 실내 조명기구","desc":"외부 조명기구 소켓과 나선 결합하는 베이스를 구비해 건축물 실내 조명에 쓰는 등전구"},{"title":"조명 방열 부품","desc":"연결단과 거치대, 방열 부재로 발광 다이오드의 열을 분산시키는 방열 구조 부품 분야"},{"title":"장수명 LED 등전구","desc":"열에 의한 패키지 노화를 억제해 사용수명과 발광 색 유지가 요구되는 조명 분야"}],"figFile":"10-2024-0011484.jpg","figureCaption":"공보 대표도면"},{"id":"p1020240085153","title":"주행 및 보행이 가능한 모빌리티","field":"의료","status":"등록","regNo":"10-2928679","regDate":"2026.02.12","appNo":"10-2024-0085153","appDate":"2024.06.28","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2044.06.28","inventor":"이경순","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 평지에서는 바퀴로 주행하고 험로나 장애물에서는 보행으로 이동하는 모빌리티에 관한 것으로, 본체부 양쪽 측면에 각각 3개씩 총 6개의 관절 구조 레그부를 두고 각 레그부에 바퀴를 장착했다. 주변 환경을 감지하는 센서 모듈과 이를 토대로 레그부·바퀴를 제어하는 메인 제어부를 포함해, 재난 현장 등 사람이 접근하기 어려운 곳에 진입할 수 있다.","features":[{"k":"특징","v":"각 레그부는 회전 가능하게 결합된 2개의 링크와 링크용 모터, 바퀴 구동 모터로 구성되어, 링크 사이각을 좁혔다 펼치는 접철 동작으로 앞 다리는 계단에 바퀴를 걸치고 뒤 다리는 미는 힘을 만들어 계단을 오른다. 초음파 센서는 브래킷과 회동 모터로 설치 각도를 바꿀 수 있어 자세 감지부의 데이터에 따라 전방·후방·저면을 하나의 센서로 측정한다."},{"k":"효과","v":"평지 주행과 보행 모드 전환으로 계단·험로 등 접근이 어려운 곳까지 자유롭게 이동해 임무를 수행할 수 있고, 6개 레그부가 지지점을 늘려 계단 승강 시 균형을 잃지 않는다. 사고 현장 상황 확인·전송은 물론 엘리베이터 없는 건물의 택배 배달 등 다양한 용도로 활용할 수 있다."}],"lvl":3,"comparison":[{"item":"이동 가능 지형","old":"바퀴 주행에 의존해 험로나 장애물이 있는 현장 진입이 어려움","new":"평지에서는 바퀴로 주행하고 험로에서는 보행 모드로 전환해 이동"},{"item":"장애물 극복 방식","old":"장애물을 넘을 수 있는 기능이 없어 사고 현장 접근이 제한됨","new":"2개 링크와 모터로 접철되는 6개 레그부가 장애물을 넘어 이동"},{"item":"자세 안정성","old":"계단 등을 오를 때 균형을 잃고 자세가 불안정해질 수 있음","new":"양측 3개씩 여섯 레그부를 순차 또는 동시 제어해 균형을 유지"}],"applications":[{"title":"재난 현장 정찰 모빌리티","desc":"사람이 접근하기 어려운 사고 현장에 진입해 구조 대상자 유무를 확인하고 전송하는 모빌리티"},{"title":"자율주행 택배 배송 로봇","desc":"특정 임무를 설정해 자율 주행하며 목적지까지 택배 물품을 배달하는 주행·보행 겸용 로봇"},{"title":"험로 주행 작업 플랫폼","desc":"초음파 센서와 자세 감지부로 주변을 파악해 험로와 계단에서 임무를 수행하는 이동 플랫폼"}],"figFile":"10-2024-0085153.jpg","figureCaption":"공보 대표도면"},{"id":"p1020220188779","title":"유산소 운동능력 측정장치 및 이를 이용한 운동능력 측정방법","field":"기계","status":"등록","regNo":"10-2926509","regDate":"2026.02.06","appNo":"10-2022-0188779","appDate":"2022.12.29","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2042.12.29","inventor":"김진섭","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 유산소 운동능력 측정장치 및 이를 이용한 운동능력 측정방법에 관한 것으로, 퀸즈 칼리지 스텝 테스트(QCST)에 적용된다. 무릎관절과 고관절 각도를 재는 인체 센서부, 그 각도에 따라 지지대 높이가 자동 조절되는 스테퍼부, 발 안착을 감지하는 스테퍼 센서부, 표준 걸음을 알려주는 가이드부, 실제 걸음과의 차이를 찾는 모니터링부, 출력부 및 수신부로 구성된다.","features":[{"k":"특징","v":"인체 부착형 자이로 센서로 측정한 무릎·고관절 굽힘 각도가 각각 90°가 되도록 스테퍼 높이를 30~50cm 범위에서 자동 조절하고, 가이드부가 표준 걸음 박자를 음향·시각·진동으로 제시하면 모니터링부가 실제 걸음과 비교해 불일치 구간을 실시간 피드백한다."},{"k":"효과","v":"피측정자의 키와 무관하게 운동능력을 정확히 측정할 수 있고, 실제 걸음을 표준 걸음에 근접시키면서 차이가 큰 구간을 반영해 최대산소섭취량 계산치의 오차를 보정하므로 기존 스텝 테스트의 정확도와 평가 신뢰도를 크게 높인다."}],"lvl":3,"comparison":[{"item":"스텝 높이 설정","old":"41.3cm로 높이가 고정되어 키가 큰 사람에게 유리함","new":"무릎·고관절 각도를 측정해 지지대 높이를 자동 조절함"},{"item":"걸음 관리 방식","old":"메트로놈이나 케이던스 테이프로 걸음 속도만 제시함","new":"가이드부의 표준 걸음과 실제 걸음을 비교해 차이를 탐색함"},{"item":"측정 정확도","old":"개인별 생체 역학 차이가 반영되지 않아 측정치 오차가 큼","new":"걸음 차이가 큰 구간을 고려해 최종 계산치의 오차를 보정함"}],"applications":[{"title":"심폐 지구력 측정 장비","desc":"퀸즈 칼리지 스텝 테스트 기반으로 심폐·지구력 운동능력을 측정하는 검사 장비"},{"title":"최대산소섭취량 평가","desc":"맥박 산소측정기로 심장 박동수를 측정해 최대산소 섭취량을 산출하는 체력 평가"},{"title":"자가 운동능력 관리 기기","desc":"표준 걸음 가이드와 모니터링 결과를 수신부로 받아 스스로 운동능력을 관리하는 기기"}],"figFile":"10-2022-0188779.jpg","figureCaption":"공보 대표도면"},{"id":"p1020230159377","title":"디지털 운행기록계 데이터를 이용한 버스 운행정보 제공시스템 및 방법","field":"소프트웨어","status":"등록","regNo":"10-2926417","regDate":"2026.02.06","appNo":"10-2023-0159377","appDate":"2023.11.16","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2043.11.16","inventor":"황영섭","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 디지털 운행기록계(DTG) 데이터를 이용한 버스 운행정보 제공시스템 및 방법에 관한 것으로, 차량 DTG에 기록된 원본 데이터를 수집·분류해 시간에 따른 위치 정보를 추출하고 정류장별 도착시간과 해당 노선을 자동으로 결정한 뒤 CSV처럼 가공이 쉬운 파일 형태로 변환해 제공한다. 데이터가 방대한 이진 파일이고 노선번호도 포함되지 않아 원하는 정보만 추출하기 어려웠던 기존 DTG 활용의 한계를 해소한다.","features":[{"k":"특징","v":"데이터 수집부·데이터 처리부·출력부로 구성되며, 전처리부가 경도·위도·시각의 이동정보와 정류장 데이터를 추출하고, 운행정보 분석부가 차량과 정류장 간 유클리드 거리를 기준거리와 비교해 도착 데이터를 생성하며, 노선정보 분석부가 마스크에 기록된 정류장 운행순서의 오름차순 여부로 노선을 결정한다."},{"k":"효과","v":"차량에 기본 장착되는 DTG 데이터만으로 비교적 간단한 구성과 저렴한 비용으로 노선별 정류장 도착시간 등 각종 운행정보를 맞춤형으로 제공할 수 있다. 별도의 위치추적장치 없이 비정형 데이터 처리 부담을 줄여 DTG 기반 소프트웨어 연구 및 서비스 개발에 기여한다."}],"lvl":3,"comparison":[{"item":"데이터 가공 방식","old":"원본 DTG 데이터 가공에 상당한 시간과 비용이 소요","new":"수집부터 추출, 변환, 저장까지 일련 과정을 자동 처리"},{"item":"노선 판별 방법","old":"DTG에 노선번호가 없어 좌표만으로 정차 판별이 불가","new":"정류장 데이터와 노선정보를 비교해 유사 노선을 결정"},{"item":"운행정보 제공","old":"과속, 급제동 등 운전자료 분석에 주로 활용","new":"노선별 정류장 도착시간 등 버스 운행정보를 산출 제공"}],"applications":[{"title":"버스 도착시간 안내","desc":"DTG 위치정보와 미리 저장된 정류장 정보를 비교해 노선별 정류장 도착시간을 산출해 안내"},{"title":"DTG 데이터 자동 전처리","desc":"방대한 원본 운행기록을 분할 저장하고 경도, 위도, 현재 시각 정보를 자동 추출하는 처리부"},{"title":"버스 운행 데이터베이스","desc":"처리 과정과 결과를 csv 형식으로 변환해 저장하여 버스 운행 관련 데이터베이스를 구축"}],"figFile":"10-2023-0159377.jpg","figureCaption":"공보 대표도면"},{"id":"p1020240067288","title":"이동 수단용 음주 운전 방지 장치 및 방법","field":"기계","status":"등록","regNo":"10-2925664","regDate":"2026.02.05","appNo":"10-2024-0067288","appDate":"2024.05.23","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2044.05.23","inventor":"이경순","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 전동 킥보드 등 이동 수단의 음주 운전을 원천적으로 차단하는 장치 및 방법에 관한 것으로, 전원 모듈·음주 측정 모듈·록커·시동 모듈·제어 모듈로 구성된다. 전원을 켠 뒤 알코올 감지 센서로 운전자의 음주를 측정하고 측정값이 기준값을 넘지 않을 때만 시동 버튼을 덮고 있던 록커를 해제해 시동을 걸 수 있게 하며, 지문·홍채 등 사용자 확인 모듈로 시동 전 1차, 주행 중 2차 운전자 인증을 수행한다.","features":[{"k":"특징","v":"제어 모듈의 운전 여부 판단부가 알코올 측정값과 기준값을 비교해 록커 액츄에이터를 제어하며, 록커가 시동 버튼을 커버링·오픈하는 방식으로 시동 가능 여부를 결정한다. 주행 개시 후 설정 시간이 지나면 록커가 다시 록킹되고, 1차·2차 운전자 정보가 불일치하면 시동을 자동으로 끈다."},{"k":"효과","v":"음주 상태에서는 이동 수단을 주행할 수 없어 음주 운전 사고를 근본적으로 방지할 수 있고, 주행 중 시동 버튼의 부주의한 조작도 막을 수 있다. 또한 타인이 대신 음주 측정을 하고 실제로는 음주한 운전자가 주행하는 편법 행위를 차단한다."}],"lvl":3,"comparison":[{"item":"음주 운전 차단","old":"전동 킥보드 등 이동 수단에 음주 상태 주행을 막는 유효한 수단이 없음","new":"음주 측정값이 기준값을 넘으면 록커가 시동 버튼을 덮어 시동을 차단"},{"item":"운전자 확인 절차","old":"측정한 사람과 실제 운전자가 다른지 확인하는 절차가 없음","new":"시동 전 1차, 주행 중 2차로 운전자를 확인해 일치 여부를 판단"},{"item":"주행 중 안전성","old":"주행 중 시동 버튼이 노출되어 부주의한 조작 위험이 있음","new":"주행 중 록커가 자동으로 록킹되어 시동 버튼 오조작을 방지"}],"applications":[{"title":"전동 킥보드 음주운전 방지","desc":"도로교통법상 차로 분류되는 전동 킥보드에 장착해 음주 상태의 주행을 원천적으로 차단하는 장치"},{"title":"공유 모빌리티 대여 관리","desc":"여러 이용자가 번갈아 사용하는 공유 이동 수단에서 사용자 확인과 음주 측정을 결합한 대여 관리"},{"title":"이동 수단 시동 잠금 장치","desc":"음주 측정값과 기준값 비교 결과에 따라 록커와 시동 모듈을 제어하는 시동 잠금 모듈"}],"figFile":"10-2024-0067288.jpg","figureCaption":"공보 대표도면"},{"id":"p1020220182960","title":"전동 회전식 탄성 세척솔","field":"기계","status":"등록","regNo":"10-2917984","regDate":"2026.01.21","appNo":"10-2022-0182960","appDate":"2022.12.23","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2042.12.23","inventor":"이장범","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 변기 등 각종 용품의 세척에 사용되는 전동 회전식 탄성 세척솔에 관한 것으로, 다수의 모가 식립된 솔부와 솔부로부터 일 방향으로 연장되는 손잡이부를 포함한다. 손잡이부에 매립된 모터 구동으로 솔부가 회전하고, 손잡이부는 일단과 타단 사이의 관절부에서 구부러지며 솔부의 형태도 외력에 따라 가변되어, 용품의 안쪽 부위와 굴곡·구석 부위까지 세척할 수 있다.","features":[{"k":"특징","v":"모는 내부에 에어가 충전된 튜브 등 탄성부재에 식립되어 외력에 따라 팽창·수축하며 형태가 변하고, 일정 곡률의 금속판 지지부재와 공기유동홀을 갖는 원형관 연결부재가 모터 회전력을 전달하며, 잠금구가 관절부의 회전을 단속한다."},{"k":"효과","v":"솔부가 자동으로 회전하여 반복 문지름의 번거로움과 사용자의 피로를 덜고 세척 시간을 단축하며, 손잡이의 구부러짐과 솔부의 변형으로 굴곡 부위 및 구석 부위에 긴밀히 접촉해 세척이 용이해진다."}],"lvl":3,"comparison":[{"item":"세척 동작 방식","old":"사용자가 솔부를 반복해 직접 문질러 닦아야 함","new":"손잡이에 매립된 모터 구동으로 솔부가 회전함"},{"item":"손잡이 구조","old":"손잡이가 곧게 이어져 안쪽과 구석에 닿기 어려움","new":"관절부가 회전해 손잡이를 구부릴 수 있음"},{"item":"솔부 형태 변화","old":"솔부 형태가 일정해 굴곡 부위에 일부만 접촉함","new":"탄성부재의 팽창과 수축으로 형태가 가변됨"}],"applications":[{"title":"위생 용품 세척 도구","desc":"변기 등 오물로 오염되는 생활 위생 용품을 세척하는 전동 세척 도구로 활용함"},{"title":"굴곡 구석 세척 기구","desc":"용품의 안쪽과 굴곡, 구석 부위를 밀착 세척하는 전용 세척 기구로 적용함"},{"title":"가정 사무실 청소 용품","desc":"가정과 사무실에서 각종 용품을 적은 힘으로 세척하는 청소 용품으로 상품화함"}],"figFile":"10-2022-0182960.jpg","figureCaption":"공보 대표도면"},{"id":"p1020230003187","title":"모터홀더, 이를 포함하는 전동변속장치, 이를 포함하는 자전거","field":"생활","status":"등록","regNo":"10-2916354","regDate":"2026.01.19","appNo":"10-2023-0003187","appDate":"2023.01.10","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2043.01.10","inventor":"이상헌","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 전동변속장치용 모터홀더와 이를 포함하는 전동변속장치 및 자전거에 관한 것으로, 모터를 자전거 프레임에 고정하는 홀더를 제1부재와 제2부재로 나누어 구성한다. 모터의 회전으로 뒷바퀴측 드레일러를 밀거나 당겨 체인을 이웃한 기어로 옮김으로써, 케이블 장력에 의존하던 기존 변속 방식의 한계를 보완한다.","features":[{"k":"특징","v":"제1부재는 모터를 고정하는 지지대와 프레임을 감싸는 제1트랜치를 갖고, 제2부재의 제2트랜치가 이와 맞물려 프레임을 감싸며 볼트로 체결된다. 모터 회전축에 연결된 변속부재가 회전하며 드레일러를 뒷바퀴 회전축 방향으로 밀어 변속을 수행하고, 제어부가 모터 동작을 제어한다."},{"k":"효과","v":"손쉽고 정확한 변속이 가능하며, 두 부재로 프레임을 감싸 조립하는 구조여서 기존 자전거에도 전동변속장치를 간단히 부착할 수 있다. 제어부가 자전거 상태에 따라 자동 변속하도록 구성할 수도 있다."}],"lvl":3,"comparison":[{"item":"변속 조작 방식","old":"변속스위치로 케이블을 당겨 드레일러를 움직이는 수동 조작","new":"모터 회전으로 변속부재가 드레일러를 이동시켜 전동 변속"},{"item":"변속 정확도","old":"기어 위치와 케이블 장력에 따라 변속이 제대로 되지 않음","new":"모터 구동으로 드레일러 이동량을 제어해 정확하게 변속함"},{"item":"기존차 장착성","old":"기존 자전거에 전동 변속 기능을 부착하기 어려움","new":"두 부재의 트랜치로 프레임을 감싸 기존 자전거에 손쉽게 부착"}],"applications":[{"title":"자전거 전동변속장치","desc":"모터와 변속부재로 드레일러를 이동시켜 전동으로 단을 바꾸는 자전거 변속장치"},{"title":"전동변속 모터홀더 부품","desc":"제1·제2부재의 트랜치가 자전거 프레임을 감싸 모터를 고정하는 홀더 부품"},{"title":"기존 자전거 개조 키트","desc":"기존 자전거의 프레임에 모터홀더를 체결해 전동변속 기능을 더하는 개조 키트"}],"figFile":"10-2023-0003187.jpg","figureCaption":"공보 대표도면"},{"id":"p1020230018323","title":"진동제어 및 조향제어가 가능한 스마트 대차","field":"건설","status":"등록","regNo":"10-2907672","regDate":"2025.12.30","appNo":"10-2023-0018323","appDate":"2023.02.10","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2043.02.10","inventor":"최창하","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 운반물의 쏠림을 감지해 스스로 자세와 주행 방향을 잡는 진동제어 및 조향제어가 가능한 스마트 대차에 관한 것으로, 배치부에 놓인 대상물의 무게 중심 정보를 근거로 제어부가 배치부의 무게 중심과 이동 방향을 제어해 대상물의 위치를 복원한다. 기계식 캐스터나 사용자 근력에 의존해 방향 전환이 어렵고 적재물이 쏠려 이탈하던 기존 대차의 문제를 해결한다.","features":[{"k":"특징","v":"밑판부의 로드셀형 무게 감지부와 마킹부·인식부가 대상물의 무게 중심과 쏠림 방향을 산출하고, 제어부가 지지부 신축으로 밑판에 경사면을 만들거나 이동 판부를 승강시켜 위치를 복원하며, 연결 프레임·조향 구동부·회전 이동부로 이루어진 전륜 조향부가 전륜의 조향각을 일괄 제어한다."},{"k":"효과","v":"복잡한 실내 공간에서도 대차의 이동 방향을 쉽게 바꿀 수 있고 운반 과정에서 진동과 쏠림 제어가 가능해 편의성이 높아지며, 대차에 큰 힘을 주지 않아도 되므로 비교적 힘이 약한 사용자도 물품을 용이하게 운반할 수 있다."}],"lvl":3,"comparison":[{"item":"조향 제어 방식","old":"기계식 캐스터나 사용자 근력에 의존해 방향을 전환","new":"무게 중심 정보로 전륜 조향각을 자동 제어해 방향 전환"},{"item":"대상물 쏠림 대응","old":"측방 가림막이 없어 운반 중 물품이 쏠려 이탈·추락","new":"무게 감지부와 지지부 신축으로 경사면을 만들어 표도면"},{"id":"p1020230184475","title":"전자기유도 전자펜 구동 및 위치결정용 센서보드, 상기 센서보드를 구비한 전자기유도 전자펜 구동 및 위치결정 장치","field":"전기·전자","status":"등록","regNo":"10-2903390","regDate":"2025.12.18","appNo":"10-2023-0184475","appDate":"2023.12.18","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2043.12.18","inventor":"유영기","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 전자기유도 전자펜 구동 및 위치결정용 센서보드와 이를 구비한 장치에 관한 것으로, 센서보드 표면을 동일폭의 12개 이상 세로경계로 구분하고 각 안테나패턴이 4개의 루프형상을 단일 도선으로 연결한 구조를 갖도록 구성한다. 동일 형상의 루프코일을 단순히 시프트해 중첩하면 감지구역 단부에서 전자펜이 1~2개 코일과만 상호작용해 여기 효율과 위치검출 정확도가 떨어졌던 문제를 해결한다.","features":[{"k":"특징","v":"세로선은 모두 센서보드 제1면에 두고 가로선 일부는 비아를 통해 제2면으로 우회시켜 도선 교차를 피하며, 도선 하나를 절단해 입력측과 출력측을 만든다. 선택 및 스위칭회로가 안테나패턴을 골라 제1주기에 교류전압을 인가하고 제2주기에 유도전압을 측정하는 스캔을 반복해 위치를 산출한다."},{"k":"효과","v":"감지구역의 모든 위치가 2개 이상의 안테나패턴에 둘러싸이도록 중첩 개수와 루프형상을 조절하고 양쪽 단부 패턴의 루프를 축소함으로써, 단부를 포함한 전체 면적에서 고른 출력으로 전자기파를 송출하고 전자펜 위치를 정확하게 검출할 수 있다."}],"lvl":3,"comparison":[{"item":"안테나패턴 구성","old":"동일 형상의 루프코일을 동일 피치로 시프트해 중첩 배치","new":"여러 세로선을 조합한 루프형상 안테나패턴을 복수 구비"},{"item":"단부 여기 효율","old":"감지구역 끝에서는 1~2개 코일만 전자기파를 송출해 효율 저하","new":"단부에서도 전자펜에 충분한 에너지를 전달하도록 구성"},{"item":"위치결정 정확도","old":"단부에서 하나의 루프코일로만 판단해 정확도가 낮음","new":"복수 패턴의 유도전압을 조합 분석해 위치 정확도 향상"}],"applications":[{"title":"태블릿 전자펜 입력장치","desc":"태블릿이나 스마트폰 등 스마트 전자기기의 사용자 입력 수단으로 쓰이는 전자기유도 전자펜"},{"title":"전자펜 위치결정 센서보드","desc":"전자기파를 송출하고 전자펜의 전자기파로 유도전압이 발생하는 안테나패턴을 구비한 센서보드"},{"title":"전자펜 구동 회로부","desc":"코일드라이버와 스위칭디바이스, 증폭기로 스캔동작을 수행해 유도전압을 감지하는 구동부"}],"figFile":"10-2023-0184475.jpg","figureCaption":"공보 대표도면"},{"id":"p1020240117695","title":"휠체어에 적합하게 사용될 수 있는 방석","field":"의료","status":"등록","regNo":"10-2900316","regDate":"2025.12.10","appNo":"10-2024-0117695","appDate":"2024.08.30","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2044.08.30","inventor":"남연교","transfer":"매매 · 라이센스","smk":false,"brief":false,"lvl":0},{"id":"p1020220081298","title":"엉겅퀴 추출물을 유효성분으로 포함하는 유방암의 개선, 예방 또는 치료용 조성물","field":"의료","status":"등록","regNo":"10-2891427","regDate":"2025.11.21","appNo":"10-2022-0081298","appDate":"2022.07.01","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2042.07.01","inventor":"김진우","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 엉겅퀴 추출물을 유효성분으로 포함하는 유방암의 개선·예방 또는 치료용 조성물에 관한 것으로, 고려엉겅퀴의 줄기와 잎을 1:0.3~1 중량비로 혼합해 초음파로 추출한 추출물을 사용한다. 유방암의 예방 또는 치료용 약학 조성물과 예방 또는 개선용 식품·건강기능식품 조성물로 제공되며, 멀미·구토나 용량 제한 독성 등 부작용이 큰 기존 화학요법제를 보완할 천연 소재를 목표로 한다.","features":[{"k":"특징","v":"고려엉겅퀴 줄기·잎 혼합물을 에탄올 수용액과 섞어 20~50kHz, 50~700W의 초음파로 40~90℃에서 5~60분 추출하며, 지표물질은 클로로겐산이다. 꽃·뿌리를 쓰거나 열수·용매 추출로 바꾸면 효과가 낮아지는 점에서 부위 배합비와 초음파 추출이 핵심이다."},{"k":"효과","v":"정상 신장세포에는 성장 저해가 없는 0.5㎎/㎖ 이하 농도에서 유방암세포 생존율과 이동성을 유의하게 낮췄고, AMPK-α·p53·Bax 발현을 각각 1.45배·1.43배·1.68배 증가시키고 Bcl-2 발현은 감소시켜 유방암 특이적 항암 활성을 보였다."}],"lvl":3,"comparison":[{"item":"치료 접근 수단","old":"외과적 절제술, 방사선조사, 화학요법에 의존하는 치료","new":"엉겅퀴 추출물을 유효성분으로 포함하는 천연물 조성물"},{"item":"부작용 부담","old":"전신성 화학요법은 멀미와 구토 등 심각한 부작용을 유발","new":"식품 조성물로도 쓸 수 있는 천연물 기반 항암 소재"},{"item":"작용 기전 방식","old":"세포 복제 또는 세포 대사를 붕괴시키는 방식에 의존","new":"세포증식·이동 억제와 AMPK-α·p53·Bax 발현 증가로 작용"}],"applications":[{"title":"유방암 예방·치료 약학 조성물","desc":"엉겅퀴 추출물을 유효성분으로 포함해 유방암을 예방 또는 치료하는 의약 조성물로 적용"},{"title":"유방암 개선 건강기능식품","desc":"유방암의 예방 또는 개선을 목적으로 하는 식품 조성물 및 건강기능식품 소재로 활용 가능"},{"title":"엉겅퀴 표준화 추출 소재","desc":"줄기와 잎을 1 대 0.3~1로 혼합해 초음파 추출하고 클로로겐산을 지표물질로 관리하는 소재"}],"figFile":"10-2022-0081298.jpg","figureCaption":"공보 대표도면"},{"id":"p1020230025255","title":"차량 실내 온도 조절이 가능한 공조시스템","field":"건설","status":"등록","regNo":"10-2888023","regDate":"2025.11.14","appNo":"10-2023-0025255","appDate":"2023.02.24","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2043.02.24","inventor":"윤충희","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 태양광 전원으로 주차 중 차량 실내 온도를 자동 조절하는 공조시스템에 관한 것으로, 차량 창틀에 부착하는 본체에 태양전지모듈과 태양전지배터리, 배기팬, 개폐식 차단판을 갖춘다. 실내 온도가 설정된 제1온도를 넘으면 실린더가 차단판을 밀어 열고 배기팬이 작동해, 하절기 햇빛에 데워진 차량 상층부 고온 공기를 외부로 신속히 배출한다.","features":[{"k":"특징","v":"제1온도 초과 시 배기팬이, 제2온도 초과 시 배기팬과 급기팬이 함께 10-2023-0002099","appDate":"2023.01.06","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2043.01.06","inventor":"황찬승","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 스마트 유모차에 관한 것으로, 영유아의 편의와 안전뿐 아니라 보호자의 사용 편의까지 함께 고려한 유모차를 제공한다. 손잡이의 지문인식 센서와 압력 센서, 바퀴의 브레이크와 모터, 좌석의 안전벨트 잠금모듈·온열 패드·카메라, GPS 모듈과 통신부, 이들을 제어하는 제어부로 구성되어 인증된 보호자만 유모차를 사용할 수 있도록 한다.","features":[{"k":"특징","v":"제어부는 지문 정보가 기 등록 정보와 일치할 때만 브레이크와 안전벨트 잠금을 해제하고, 손잡이 압력이 사라지면 자동으로 제동하며 압력이 임계치를 넘으면 모터로 바퀴를 회전시켜 오르막 주행을 보조하고, 좌석 영상과 위치 정보를 사용자 단말로 전송한다."},{"k":"효과","v":"지문 인증과 안전벨트 잠금으로 무단 사용과 영유아 이탈을 막고, 손 놓침 시 자동 제동으로 사고를 예방하며, 오르막 주행 보조와 온열·영상·위치 확인 기능으로 영유아의 안전과 보호자의 편의를 동시에 높인다."}],"lvl":3,"comparison":[{"item":"보호자 편의성","old":"영유아 편의·안전에 집중해 보호자를 위한 구성이 거의 없음","new":"압력 센서와 모터로 손잡이 힘에 따라 바퀴 회전을 보조함"},{"item":"제동 동작 방식","old":"보호자가 손으로 조작하는 수동 제동에 의존함","new":"손잡이 압력이 미측정되면 브레이크가 바퀴를 자동 제동함"},{"item":"사용자 인증","old":"별도의 인증 없이 누구나 유모차를 조작할 수 있음","new":"지문인식으로 보호자를 확인한 뒤 브레이크와 안전벨트를 해제"}],"applications":[{"title":"영유아 안전 유모차","desc":"지문인식과 안전벨트 잠금모듈로 보호자만 영유아를 태우고 내리게 하는 유모차"},{"title":"전동 보조 주행 장치","desc":"손잡이 압력 세기가 임계치를 넘으면 모터가 바퀴를 돌려 주행을 보조하는 전동 장치"},{"title":"원격 모니터링 육아기기","desc":"카메라와 GPS로 좌석 영상과 위치 정보를 사용자 단말에 전송하는 육아기기"}],"figFile":"10-2023-0002099.jpg","figureCaption":"공보 대표도면"},{"id":"p1020230005973","title":"복합소재를 이용한 탈부착식 배터리팩 하부 경량화 보호 장치","field":"전기·전자","status":"등록","regNo":"10-2876310","regDate":"2025.10.21","appNo":"10-2023-0005973","appDate":"2023.01.16","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2043.01.16","inventor":"강민수","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 복합소재를 이용한 탈부착식 배터리팩 하부 경량화 보호 장치에 관한 것으로, 배터리팩을 고정하는 제2틀부를 포함하는 지지부와 배터리팩 및 지지부를 연결하는 체결부재, 배터리팩을 외력으로부터 보호하는 커버부로 구성된다. 커버부는 수지 모재와 섬유강화금속 모재, 탄소 복합재 등 충격 흡수가 용이한 소재로 구비되며, 전기자동차 주행 중 하부 이물질에 의한 배터리팩 손상과 고중량 배터리팩의 교체 어려움을 해결하려는 기술이다.","features":[{"k":"특징","v":"배터리팩의 제1틀부와 지지부의 제2틀부를 체결부재로 연결하고, 와이어가 신축하는 조임부 또는 슬라이드 방식 고정 프레임의 가이드부로 다중 고정하며, 커버부에는 돌출된 완충부와 충격 시 외부로 인출되는 분말 형태의 인식부재를 둔다."},{"k":"효과","v":"배터리팩을 다중 고정해 위치 변화에 따른 전기자동차의 안전 문제를 해소하고, 가해지는 외력을 감소시켜 파손을 방지하며, 크기가 상이한 배터리팩도 동일 구조로 고정할 수 있어 차종 범용성과 탈부착 작업 편의성을 높인다."}],"lvl":3,"comparison":[{"item":"배터리팩 보호","old":"주행 중 튀는 이물질 등 외력에 배터리팩이 손상되어 화재 위험","new":"하면에 돌출된 완충부를 갖는 커버부가 외력을 감쇠시킴"},{"item":"탈부착 용이성","old":"고중량 배터리팩이라 교체 작업이 용이하지 않음","new":"체결공과 체결부재, 와이어 조임부로 손쉽게 탈부착함"},{"item":"장착 범용성","old":"차종에 따라 배터리팩 장착 구조가 달라 범용성이 낮음","new":"고정 프레임에 지지부를 슬라이드로 내장해 차종 제한 없이 장착"}],"applications":[{"title":"전기차 배터리팩 보호","desc":"복합소재 커버부로 배터리팩 하부를 감싸 주행 중 잔해물 충격을 막는 보호 장치"},{"title":"배터리 교환식 차량","desc":"체결부재와 조임부로 배터리팩을 떼어내 교체할 수 있는 배터리 교환식 차량 구조"},{"title":"차체 경량화 부품","desc":"복합소재 지지부와 커버부를 적용해 배터리팩 장착 구조의 중량을 줄이는 부품"}],"figFile":"10-2023-0005973.jpg","figureCaption":"공보 대표도면"},{"id":"p1020230150947","title":"커피박 효소분해물을 유효성분으로 포함하는 항염증용 조성물","field":"의료","status":"등록","regNo":"10-2876402","regDate":"2025.10.21","appNo":"10-2023-0150947","appDate":"2023.11.03","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2043.11.03","inventor":"김진우","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 커피박 효소분해물을 유효성분으로 포함하는 항염증용 조성물에 관한 것으로, 커피 열수 추출 공정의 잔사인 커피박을 셀룰라아제와 프로테아제를 포함하는 분해효소로 가수분해한 효소분해물을 유효성분으로 한다. 대부분의 염증 치료제가 합성물인 점을 고려해 보다 안전한 천연물로 염증을 억제하고자 한 것으로, 피부염 예방·개선용 화장료 조성물과 염증성 질환 예방·치료용 약학 및 건강기능식품 조성물로 제공된다.","features":[{"k":"특징","v":"분해효소로는 청국장에서 분리·동정한 바실러스 테퀼엔시스 SM18(기탁번호 BP1429751)의 조효소액을 사용하거나, 바실러스 라케니포르미스 유래 엔도 프로테아제와 아스퍼질러스 아큘레아투스 유래 셀룰라아제를 1:0.5~3 중량비로 혼합한 시판 효소를 사용해 커피박을 가수분해한다."},{"k":"효과","v":"커피박 열수초음파 추출물에 비해 총 폴리페놀 및 총 플라보노이드 함량이 약 1.3배, DPPH 라디칼 소거능이 약 1.8배 우수하고, LPS로 자극한 대식세포의 NO 생성과 IL-1β·IL-6·TNF-α 발현을 감소시켰다. 0.5% 이하 농도에서 세포 생존율이 유지되어 독성도 없다."}],"lvl":3,"comparison":[{"item":"유효성분 유래","old":"대부분의 염증 치료제가 합성물로 이루어져 있음","new":"커피 부산물인 커피박을 효소로 가수분해한 천연 소재"},{"item":"인체 안전성","old":"합성 약물이어서 인체에 안전한 천연물 대체 요구가 있음","new":"독성이 없는 것으로 확인된 커피박 효소분해물을 사용"},{"item":"항염증 작용","old":"과도한 염증반응을 조절할 항염증 약물이 필요","new":"IL-1β, IL-6, TNF-α 유전자 발현을 감소시켜 항염증"}],"applications":[{"title":"피부염 개선 화장료","desc":"커피박 효소분해물을 유효성분으로 포함해 피부염을 예방하거나 개선하는 화장료 조성물"},{"title":"염증성 질환 약학 조성물","desc":"관절염, 비염, 위염, 장염, 치주염 등 염증성 질환의 예방 또는 치료용 약학 조성물로 적용"},{"title":"커피박 재활용 소재화","desc":"발효식품에서 분리한 셀룰라아제와 프로테아제로 커피 부산물을 분해해 소재화하는 용도"}],"figFile":"10-2023-0150947.jpg","figureCaption":"공보 대표도면"},{"id":"p1020220125644","title":"미니 엘이디 장착 검사 방법","field":"전기·전자","status":"등록","regNo":"10-2868765","regDate":"2025.09.30","appNo":"10-2022-0125644","appDate":"2022.09.30","applicant":"주식회사 미르기술","coApplicant":false,"expiry":"2042.09.30","inventor":"박찬화","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 디스플레이 BLU에 실장된 미니 엘이디의 장착자세를 그림자를 이용해 검사하는 방법에 관한 것으로, 검사 대상의 좌측 상단과 우측 상단에 설치한 대향식 듀얼 조명으로 그림자를 형성하고 그 길이로 높이와 기울기를 산출한다. 사파이어와 확산 돌기 구조 때문에 반사광이 심하게 왜곡되어 기존 광학식 3D 측정이 어려웠던 문제를, 반사광 대신 그림자를 쓰는 방식으로 해결한다.","features":[{"k":"특징","v":"좌·우 조명의 입사각과 그림자 길이를 곱한 값(S×tanθ)으로 엘이디 윗면 네 꼭지점의 높이를 각각 구하고, 네 값의 평균을 대표 높이로 산출한다. X방향·Y방향 폭과 꼭지점 간 높이차로 X축·Y축 기울기 각을 측정하며, 미리 설정된 허용오차범위와 비교해 장착자세의 양호 또는 불량을 판정한다."},{"k":"효과","v":"BLU에 장착된 수천 내지 수만 개의 미니 엘이디의 장착 높이와 장착 기울기를 신속하게 검사해 정상범위를 벗어난 불량 미니 엘이디를 선별할 수 있다. 불량품을 바로 수정하게 되어 디스플레이의 화면 밝기를 균일하게 만들 수 있어 품질 향상을 이룰 수 있다."}],"lvl":3,"comparison":[{"item":"측정 기본 원리","old":"구조광을 영사해 반사광 이미지로 입체 형상을 계측","new":"대향식 듀얼 조명이 만든 그림자 길이로 높이를 산출"},{"item":"반사광 왜곡","old":"사파이어 정반사와 확산 돌기로 반사광이 심하게 왜곡","new":"왜곡된 반사광을 사용하지 않아 왜곡 영향을 받지 않음"},{"item":"검사 처리 속도","old":"백색광간섭계와 공초점 방식은 1회 측정 수가 적고 느림","new":"수천에서 수만 개 미니 엘이디를 신속하게 검사 가능"}],"applications":[{"title":"BLU 미니 엘이디 검사","desc":"넓은 PCB에 수천에서 수만 개 장착된 BLU 미니 엘이디의 장착 높이와 기울기를 검사"},{"title":"SMT 공정 품질관리","desc":"SMT 공정에서 생긴 기울어짐과 높이편차를 찾아 불량 미니 엘이디를 선별하고 수정"},{"title":"초대형 디스플레이 화소 검사","desc":"발광 화소로 쓰이는 미니 엘이디의 장착 자세를 검사해 화면 밝기의 균일도를 확보"}],"figFile":"10-2022-0125644.jpg","figureCaption":"공보 대표도면"},{"id":"p1020220181325","title":"유기 발광 소자의 광추출을 위한 광산란층 및 광산란층의 제조 방법","field":"전기·전자","status":"등록","regNo":"10-2865468","regDate":"2025.09.23","appNo":"10-2022-0181325","appDate":"2022.12.22","applicant":"선문대학교 산학협력단 · 주식회사 대기하이텍","coApplicant":true,"expiry":"2042.12.22","inventor":"박영욱","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 유기 발광 소자(OLED)의 광추출을 위한 광산란층 및 그 제조 방법에 관한 것으로, 베이스와 그 일면에 서로 이격된 복수의 마이크로 렌즈로 이루어진 층을 투명 기판의 발광면에 배치한다. 마이크로 렌즈 각각의 표면을 에칭해 복수의 나노 필라를 형성함으로써, 발광층에서 생성된 빛이 기판과 외부 공기의 굴절률 차이에 따른 전반사로 소자 내부에 고립되지 않고 외부로 추출되도록 한다.","features":[{"k":"특징","v":"반구형 마이크로 렌즈를 육각형 단위 패턴으로 반복 배치한 광산란층 전구체를 산소 플라즈마 1차 에칭과 CHF3 플라즈마 2차 에칭으로 순차 처리하여, 가시광의 보강 간섭과 굴절을 위한 90~780㎚ 범위의 높이와 폭을 갖는 나노 필라를 형성한다."},{"k":"효과","v":"광산란층을 적용하지 않은 소자 대비 외부 양자 효율이 최대 38% 향상되고 나노 필라가 없는 마이크로 렌즈 대비로도 최대 13% 높아지며, 시야각 분포까지 개선되어 유기 발광 표시 장치의 광 추출 효율을 높인다."}],"lvl":3,"comparison":[{"item":"광산란 구조","old":"층 간 굴절률 차이로 광이 전반사되어 고립됨","new":"마이크로 렌즈 표면에 나노 필라를 함께 형성함"},{"item":"광 추출 효율","old":"소자 내부에 갇히는 광이 많아 추출 효율이 낮음","new":"나노 필라의 산란으로 광 추출 효율을 높임"},{"item":"층 제조 방법","old":"기판과 소자의 계면을 평탄한 상태로 사용함","new":"전구체를 1차·2차 에칭해 나노 필라를 형성함"}],"applications":[{"title":"OLED 디스플레이 패널","desc":"유기 발광 표시 장치의 기판에 배치해 광 추출 효율을 높이는 광산란층으로 적용함"},{"title":"광산란층 제조 공정","desc":"마이크로 렌즈 전구체를 에칭해 나노 필라를 형성하는 광산란층 제조 공정에 활용함"},{"title":"마이크로 나노 광학 소재","desc":"마이크로 렌즈 표면에 나노 구조를 형성하는 광학 소재 가공 기술로 활용함"}],"figFile":"10-2022-0181325.jpg","figureCaption":"공보 대표도면"},{"id":"p1020230003573","title":"조도에 따라 작동하는 자동 지붕 차양 장치","field":"건설","status":"등록","regNo":"10-2865267","regDate":"2025.09.23","appNo":"10-2023-0003573","appDate":"2023.01.10","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2043.01.10","inventor":"이선순","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 조도에 따라 작동하는 자동 지붕 차양 장치에 관한 것으로, 한 쌍의 전방기둥과 후방기둥, 이를 잇는 상방보, 회전구동기와 풀리를 갖는 권취시스템, 와이어, 직물지붕, 광기전패널 및 제어부로 구성된다. 주변 조도에 따라 지붕을 덮는 정도가 자동으로 조정되어 야외 부스의 차양과 개방감을 함께 확보한다.","features":[{"k":"특징","v":"기둥 상단의 광기전패널이 태양광으로 권취시스템 구동 전력을 생산하고, 제어부가 그 발전량을 기준으로 회전구동기를 작동시켜 와이어가 풀리에 감기는 정도를 조절함으로써 와이어에 연결된 직물지붕을 펴거나 접는다. 상방보에 경사를 주고 와이어 끝에 무게추를 달아 이동을 원활하게 한다."},{"k":"효과","v":"태양광 발전량이 많아 햇빛이 강할 때는 천정을 완전히 덮어 그늘과 쉼터를 제공하고, 발전량이 적을 때는 천정을 개방해 이용자에게 다른 공간감을 주므로 별도 전원이나 조작 없이 환경에 맞춘 차양 운용이 가능하다."}],"lvl":3,"comparison":[{"item":"지붕 조정 방식","old":"고정된 지붕 형태로 햇빛 가림 정도를 조절할 수 없음","new":"권취시스템이 와이어를 감아 직물지붕을 덮는 정도를 조정함"},{"item":"작동 제어 방식","old":"측면 벽과 지붕 형태에 따라 햇빛 가림 정도가 달라짐","new":"제어부가 광기전패널의 전력 생산량에 따라 자동으로 작동"},{"item":"전력 공급 방식","old":"별도 전원 없이는 지붕 구동 장치를 운용하기 어려움","new":"기둥 상단의 광기전패널이 구동에 필요한 전력을 자체 공급"}],"applications":[{"title":"야외 간이 부스 지붕","desc":"전시·판매 부스의 천정을 덮거나 개방해 그늘과 쉼터를 제공하는 차양 지붕"},{"title":"가설 쉘터 차양","desc":"비상 시 신속히 설치하는 가설 쉘터에 적용해 조도에 따라 지붕을 자동 조정"},{"title":"태양광 연계 자립형 구조물","desc":"광기전패널로 생산한 전력만으로 회전구동기를 구동하는 에너지 자립형 구조물"}],"figFile":"10-2023-0003573.jpg","figureCaption":"공보 대표도면"},{"id":"p1020220187055","title":"격리형 배터리 관리시스템의 오차보상 전압 모니터링 장치","field":"전기·전자","status":"등록","regNo":"10-2863016","regDate":"2025.09.17","appNo":"10-2022-0187055","appDate":"2022.12.28","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2042.12.28","inventor":"오인열","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 격리형 배터리 관리시스템의 오차보상 전압 모니터링 장치에 관한 것으로, 스위치 보드와 제어부 보드가 물리적으로 분리된 구조에서 배터리 셀 전압을 정확하게 측정한다. 스위치 보드는 기준전압을 만드는 LDO 레귤레이터와 직렬 저항군, 셀별 MASC(multi analog switch with counter), 발광 다이오드로 구성되고 제어부 보드는 수광 다이오드로 전압값을 받는다.","features":[{"k":"특징","v":"MASC는 카운터와 디코더로 스위치를 순차 선택해 저항 단마다의 기준전압과 배터리 셀 전압을 차례로 입력받고, 상단 저항에서 얻은 전압으로 온도를 인식한 뒤 셀 전압과 가까운 기준전압들의 근접 비율로 셀 전압을 보정한다."},{"k":"효과","v":"소자의 공정 오차, 배터리 조립 오차, 온도 변화 및 양자화 오류가 보상된 셀 전압을 얻을 수 있고, 고전압 배터리로부터 저전압 제어부 보드를 완전히 격리해 보호함으로써 안전한 배터리 상태 제어가 가능하다."}],"lvl":3,"comparison":[{"item":"오차 보정 방법","old":"고가의 고비트 ADC로 양자화 오차를 줄여야 함","new":"기준전압과의 가까운 비율로 셀 전압을 보정함"},{"item":"오차 요인 대응","old":"공정과 조립 오차, 온도 변화로 전압 인식이 틀어짐","new":"공정·조립·온도 오차를 함께 보상해 측정함"},{"item":"격리 구조 완성도","old":"연결선이 배터리에 닿아 완벽히 격리되지 못함","new":"발광·수광 다이오드로 완전한 격리를 구현함"}],"applications":[{"title":"배터리 셀 전압 측정","desc":"공정과 조립, 온도 오차를 보상해 배터리 셀 전압을 정밀하게 측정하는 장치"},{"title":"격리형 배터리 관리","desc":"고전압 셀과 저전압 제어부 보드를 분리한 격리형 배터리 관리시스템에 활용함"},{"title":"저비용 전압 감시 회로","desc":"고비트 ADC 없이 기준전압 비교로 전압을 감시하는 저비용 회로 설계에 적용함"}],"figFile":"10-2022-0187055.jpg","figureCaption":"공보 대표도면"},{"id":"p1020200006827","title":"초전도 자기 특성 측정 장치 및 초전도 소재용 첨가 물질 평가 장치","field":"전기·전자","status":"등록","regNo":"10-2862007","regDate":"2025.09.16","appNo":"10-2020-0006827","appDate":"2020.01.17","applicant":"한국전력공사 · 선문대학교 산학협력단","coApplicant":true,"expiry":"2040.01.17","inventor":"이상헌","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 초전도 자기 특성 측정 장치 및 초전도 소재용 첨가 물질 평가 장치에 관한 것으로, 교류 전압이 인가되는 1차 코일과 그 주 자계가 통과하도록 감긴 2차 코일 사이에 대상 초전도체를 배치하고 2차 코일에 발생되는 전압을 측정한다. 벌크형 또는 박막형으로 제작되는 고온 초전도체의 자기적 특성을 액체 질소 온도 범위에서 측정할 수 있도록 한 기술이다.","features":[{"k":"특징","v":"YBa2Cu3O7-y 초전도체의 입계 약결합과 조셉슨 접합 네트워크 특성을 이용해, 인가 자기장으로 상전도 영역이 확장되면서 2차 코일에 유기되는 교류 전압의 크기로 자속 핀 고정 효과와 제조 양부를 판정하며, 주 자계에 직교하는 추가 자계를 인가하는 자계 발생기를 더 포함할 수 있다."},{"k":"효과","v":"두 개의 코일과 교류 전압계만으로 구성된 단순한 회로로 고가의 장비 없이 초전도체의 자기적 특성을 측정할 수 있고, 저 자기장 영역에서 급격한 전압 변화를 나타내어 고감도 자기 검출이 가능하므로 초전도 소재 개발과 생산 제품 평가에 유연하게 적용할 수 있다."}],"lvl":3,"comparison":[{"item":"측정 장비 규모","old":"초전도체 제작 장비보다 훨씬 대형의 평가 장비가 필요했다","new":"1차·2차 코일과 전압 측정기로 고가 장비 없이 측정한다"},{"item":"측정 감도 수준","old":"홀 효과나 자기 저항 자기회로는 측정 감도가 매우 작았다","new":"초전도체 입계 접합에 근거해 자기 변환이 크게 나타난다"},{"item":"소재 평가 기능","old":"경제적 평가 방안이 없어 연구와 생산 공정에 부담이 되었다","new":"판정부가 기준값과 비교해 첨가 물질의 유효성까지 평가한다"}],"applications":[{"title":"초전도 소재 연구","desc":"벌크형·박막형 고온 초전도체의 자기적 특성을 액체 질소 온도 범위에서 측정한다"},{"title":"초전도체 생산 검사","desc":"생산 공정에서 측정 전압값을 기준값과 비교해 초전도체가 유효하게 제조되었는지 판정한다"},{"title":"초전도 자석·소자 개발","desc":"초전도 벌크 재료, 자석, 소자 제작 기술과 병행하는 자기 측정 회로로 활용한다"}],"figFile":"10-2020-0006827.jpg","figureCaption":"공보 대표도면"},{"id":"p1020220140389","title":"담수 유래의 미세조류 추출물을 유효성분으로 함유하는 피부 주름, 피부 노화, 피부 창상 예방 또는 개선 또는 치료용 조성물","field":"의료","status":"등록","regNo":"10-2861959","regDate":"2025.09.16","appNo":"10-2022-0140389","appDate":"2022.10.27","applicant":"선문대학교 산학협력단 · 국립낙동강생물자원관","coApplicant":true,"expiry":"2042.10.27","inventor":"김진우","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 담수 유래 미세조류인 미코나스테스 속(Mychonastes sp.) 249-CDJ180227T(KCTC 14802BP)의 초음파 추출물을 유효성분으로 함유하는 조성물에 관한 것으로, 피부주름·피부노화 예방 또는 개선용 화장료 및 식품 조성물과 피부 창상 예방 또는 치료용 약학 조성물로 제공된다. 콜라겐 분해를 억제하면서 창상 치료 효과를 갖는 소재를 찾기 위해 국내 토착 담수 미세조류 4종을 분리·동정한 뒤 선정한 균주를 활용한다.","features":[{"k":"특징","v":"해당 미세조류와 추출용매인 물을 1:8 내지 15의 중량비로 혼합해 35~45kHz 진동수의 초음파기로 50~70℃에서 20~60분 동안 처리해 추출하며, 열수나 알코올 추출에 비해 유효성분이 많이 추출된다. 화장료 조성물에는 초음파 추출물이 0.001~2.0mg/ml 농도로 포함된다."},{"k":"효과","v":"폴리페놀·플라보노이드 함량이 높고 자외선 및 자유라디칼에 대한 항산화 효과와 콜라게네이즈 저해활성이 비교 균주보다 우수하며, 콜라겐 분해효소 MMP-1의 발현을 억제하고 SMAD-3와 COL1A1 발현을 활성화해 콜라겐 생성을 촉진한다. 섬유아세포의 이동성도 높여 창상 치료에 효과적이다."}],"lvl":3,"comparison":[{"item":"콜라겐 관리","old":"노화로 콜라겐 합성이 줄어 탄력이 떨어지고 주름이 형성","new":"MMP-1 억제와 SMAD-3·CoL1A1 활성화로 콜라겐 생성 촉진"},{"item":"피부 활성 검증","old":"미세조류의 피부에 대한 연구가 아직 미진한 상태","new":"폴리페놀·플라보노이드가 풍부한 균주의 항산화 활성 확인"},{"item":"소재 활용 방향","old":"미세조류를 주로 단백질·지질 공급 건강식품 소재로 이용","new":"담수 미세조류를 피부 재생과 창상 치료 소재로 활용"}],"applications":[{"title":"주름 개선 화장료 조성물","desc":"초음파 추출물을 0.1~2.0 mg/ml로 포함해 피부주름과 피부노화의 예방 또는 개선용 화장료"},{"title":"피부 창상 치료 약학 조성물","desc":"세포의 이동성을 촉진하는 상처치료 효과를 활용한 피부 창상 예방 또는 치료용 약학 조성물"},{"title":"피부 건강 식품 조성물","desc":"피부주름 또는 피부노화의 예방 또는 개선을 목적으로 하는 식품 조성물 소재로 활용"}],"figFile":"10-2022-0140389.jpg","figureCaption":"공보 대표도면"},{"id":"p1020220180770","title":"사이토크롬 P450 또는 이의 변이체 및 이의 용도","field":"의료","status":"등록","regNo":"10-2860075","regDate":"2025.09.10","appNo":"10-2022-0180770","appDate":"2022.12.21","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2042.12.21","inventor":"오태진","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 Streptomyces laurentii 유래 사이토크롬 P450 효소 CYP105D18 또는 이의 변이체 및 그 용도에 관한 것으로, 서열번호 1의 서열을 포함하는 효소가 스테로이드의 히드록실화 반응을 촉매한다. 테스토스테론, 메틸 테스토스테론, 난드롤론, 아드레노스테론, 안드로스텐디온과 같이 C-17에 측쇄가 없는 3-케토-4-엔 스테로이드를 하이드록실화 생성물로 전환한다.","features":[{"k":"특징","v":"산화환원 파트너 대신 과산화수소를 산소 서로게이트로 사용하는 퍼옥시게나제 활성과 높은 H2O2 내성을 가지며, 기질 접근 채널을 이루는 S63·F184 잔기를 구조 기반으로 치환하여 F184A 변이체를 확보하였다."},{"k":"효과","v":"테스토스테론을 2β-하이드록시 테스토스테론으로 위치특이적으로 전환하고, F184A 변이체는 야생형 대비 촉매 효율이 1.36배 증가하여 스테로이드 약물 변형을 위한 생체촉매와 P450 엔지니어링의 기반을 제공한다."}],"lvl":3,"comparison":[{"item":"산소 공급 방식","old":"과산화수소 사용 시 헴 산화로 효소가 불활성화됨","new":"과산화수소 내성이 높아 산소 대체 기질로 사용함"},{"item":"효소 발현성","old":"인간 유래 CYP는 발현과 용해도가 제한적이었음","new":"박테리아 유래 효소로 발현과 용해도를 확보함"},{"item":"전환 효율 개선","old":"야생형 효소의 스테로이드 전환 효율이 낮았음","new":"F184A 변이체로 촉매 효율을 1.36배 높였음"}],"applications":[{"title":"스테로이드 생물전환","desc":"테스토스테론과 난드롤론 등 스테로이드를 히드록실화하는 생물 전환 공정에 활용함"},{"title":"스테로이드 의약 원료","desc":"염증과 암, 알레르기 치료에 쓰이는 스테로이드 유도체 합성용 효소로 적용함"},{"title":"전세포 생체촉매 제조","desc":"효소 유전자를 도입한 재조합 미생물 기반의 전세포 생체촉매 제조에 활용함"}],"figFile":"10-2022-0180770.jpg","figureCaption":"공보 대표도면"},{"id":"p1020220180769","title":"스핑고모나스 에키노이데스 유래 신규 사이트크롬 P450 효소","field":"의료","status":"등록","regNo":"10-2858831","regDate":"2025.09.08","appNo":"10-2022-0180769","appDate":"2022.12.21","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2042.12.21","inventor":"오태진","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 스핑고모나스 에키노이데스(Sphingomonas echinoides) 유래 신규 사이토크롬 P450 효소 CYP101D5 및 그 용도에 관한 것으로, 플라보노이드의 히드록실화 또는 탈수소화 반응을 촉매하는 박테리아 유래 효소를 제공한다. 효소의 생화학적 특성과 3.2 Å 분해능의 결정 구조를 함께 규명하여, 기질 인식과 선택성의 구조적 근거를 제시하였다.","features":[{"k":"특징","v":"서열번호 1의 효소는 프티다레독신/프티다레독신 리덕타제를 산화환원 파트너로 사용해 β-이오논과 나린게닌·아피게닌을 히드록실화하고 α-이오논은 탈수소화하며, B/C 루프의 방향과 기질 결합 부위의 전하 분포가 기질 선택성을 좌우한다."},{"k":"효과","v":"나린게닌과 아피게닌에서 에리오딕티올과 루테올린을 생성하는 등 박테리아 CYP로는 드문 큰 기질의 히드록실화가 가능하고, 생물학적으로 중요한 화합물을 변경·생성하는 CYP 선택과 구조 기반 단백질 공학의 기초 정보를 제공한다."}],"lvl":3,"comparison":[{"item":"효소 구조 정보","old":"CYP의 기질 인식 규칙과 선택성이 밝혀지지 않음","new":"3.2Å 분해능 결정 구조로 기질 결합 잔기를 규명"},{"item":"촉매 반응 범위","old":"CYP101 계열은 주로 캄포어와 이오논 산화에 한정됨","new":"테르펜과 플라보노이드의 산화까지 범위를 확장함"},{"item":"반응 유형 다양성","old":"주로 모노 산소화 반응을 중심으로 연구되어 왔음","new":"히드록실화와 탈수소화 반응을 함께 촉매함"}],"applications":[{"title":"플라보노이드 생물전환","desc":"플라보노이드를 히드록실화하고 탈수소화해 활성 형태로 바꾸는 생물 전환에 활용함"},{"title":"테르펜 산화 생체촉매","desc":"테르펜 계열 화합물의 산화 반응을 촉매하는 박테리아 유래 생체촉매로 적용함"},{"title":"CYP 효소 선별 정보","desc":"생물학적으로 중요한 화합물을 변경하는 CYP를 선택하기 위한 구조 정보로 활용함"}],"figFile":"10-2022-0180769.jpg","figureCaption":"공보 대표도면"},{"id":"p1020240003559","title":"흡기근 운동 관리 시스템 및 방법","field":"소프트웨어","status":"등록","regNo":"10-2856313","regDate":"2025.09.02","appNo":"10-2024-0003559","appDate":"2024.01.09","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2044.01.09","inventor":"김진섭","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 흡기근(가로막, 바깥갈비사이근 등) 운동 관리 시스템 및 방법에 관한 것으로, 마스크에 장착된 흡기량 감지부와 흡기 압력 감지부, 손목에 착용한 스마트 워치에서 얻은 산소 포화도·흡기량·흡기 압력 데이터를 스마트폰을 통해 관리 서버로 전달해 AI 분석한다. 그 결과로 생성한 개도 조절 신호로 마스크 중앙커버 개구의 개도를 조절해 사용자의 흡기 저항 강도를 제어하는 기술이다.","features":[{"k":"특징","v":"중앙커버 후방의 개도 조절 장치가 구동부의 스위칭 동작으로 축을 중심으로 회전해 개구를 일부 또는 전부 여닫고, 그 후방 호흡 저항 터빈 편심 회전부의 회전수로 흡기 압력을 산출한다. 서버는 감지 데이터와 개도 조절 데이터로 학습된 기계학습모델에 입력해 개도 조절 신호를 생성한다."},{"k":"효과","v":"사용자의 호흡 상태에 맞는 흡기 저항 강도를 제공해 흡기근을 강화할 수 있다. 또한 산소 포화도가 설정 포화도 이하로 떨어지면 스마트 워치의 진동과 알람 음성으로 위험 상황을 알려 산소 부족에 따른 질식 사고를 예방할 수 있다."}],"lvl":3,"comparison":[{"item":"흡기 저항 조절","old":"마스크 개구가 고정되어 흡기 저항 강도를 조절할 수 없음","new":"개도 조절 장치가 중앙커버 개구의 개도를 회전 조절"},{"item":"호흡 상태 측정","old":"사용자의 산소 포화도나 흡기량을 감지하는 수단이 없음","new":"스마트워치와 마스크 센서가 산소포화도·흡기량 감지"},{"item":"운동 관리 방식","old":"흡기근 강화를 위한 체계적인 운동 관리 수단이 없음","new":"서버가 감지 데이터를 AI 분석해 저항 강도를 제어"}],"applications":[{"title":"호흡재활 의료기기","desc":"만성폐쇄성폐질환·제한성 폐질환 환자의 흡기근 근력과 근지구력을 높이는 호흡 재활 기기"},{"title":"감염 후유증 관리","desc":"코로나19 등 호흡기 감염 후 폐 기능이 저하된 사용자의 환기 능력 회복을 돕는 관리 서비스"},{"title":"중장년 폐기능 관리","desc":"30대 중반부터 약해지는 흡기근과 폐 조직 탄력성 저하에 대응하는 생활형 호흡 운동 관리"}],"figFile":"10-2024-0003559.jpg","figureCaption":"공보 대표도면"},{"id":"p1020220188275","title":"커피박 효소분해물을 유효성분으로 포함하는 피부미백 개선 및 자외선 차단용 조성물","field":"의료","status":"등록","regNo":"10-2855659","regDate":"2025.09.01","appNo":"10-2022-0188275","appDate":"2022.12.29","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2042.12.29","inventor":"김진우","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 커피박 효소분해물을 유효성분으로 포함하는 피부미백 개선 및 자외선 차단용 조성물에 관한 것으로, 커피 추출 후 남는 부산물인 커피박을 셀룰라아제와 프로테아제를 포함하는 분해효소로 가수분해하여 얻은 효소분해물을 활용한다. 화장료 조성물과 건강기능식품 형태로 제공되며, 화학적 합성 소재를 대체할 천연물 기반 복합 기능성 소재를 지향한다.","features":[{"k":"특징","v":"분해효소로는 청국장에서 분리한 바실러스 테퀼엔시스 SM18(기탁번호 BP1429751)의 조효소액이나 알칼라아제와 비스코자임을 1:0.5~3 중량비로 혼합한 시판 혼합효소를 사용하며, 이로 가수분해한 커피박 효소분해물이 티로시나아제를 저해하고 자외선을 흡수한다."},{"k":"효과","v":"독성이 없으면서 피부미백 개선과 자외선 차단에 효과적이고, 미백 관련 지표 유전자인 TRP-1과 TRP-2의 발현을 감소시켜 멜라닌 생성을 억제하므로 미백 효과가 우수하다. 커피 부산물의 고부가 자원화도 가능하다."}],"lvl":3,"comparison":[{"item":"유효성분 소재","old":"화학적 합성물이나 동물 유래 소재를 주로 사용","new":"커피박을 효소로 가수분해한 천연 유래 분해물을 사용"},{"item":"피부 안전성","old":"합성 성분의 피부 자극성 부작용으로 소비자 거부감이 큼","new":"커피박 효소분해물은 독성이 없어 피부 적용에 안전함"},{"item":"기능성 범위","old":"미백과 자외선 차단을 겸한 복합 기능 소재가 부족함","new":"TRP-1·TRP-2 발현을 줄여 미백과 자외선 차단을 동시에 구현"}],"applications":[{"title":"미백 기능성 화장료","desc":"커피박 효소분해물을 유효성분으로 배합해 멜라닌 생성을 억제하는 미백 화장품"},{"title":"자외선 차단용 조성물","desc":"자외선 차단 효과를 갖는 천연 유래 성분으로 선크림·에센스 등 제품에 적용"},{"title":"커피박 소재화 활용","desc":"커피박을 셀룰라아제·프로테아제로 가수분해해 기능성 화장품 원료로 활용하는 소재화 공정"}],"figFile":"10-2022-0188275.jpg","figureCaption":"공보 대표도면"},{"id":"p1020210164325","title":"멜라닌 생성 촉진용 조성물 및 이의 용도","field":"의료","status":"등록","regNo":"10-2855462","regDate":"2025.09.01","appNo":"10-2021-0164325","appDate":"2021.11.25","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2041.11.25","inventor":"김승영","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 7-아세톡시-4-메틸쿠마린(7A4MC)을 유효성분으로 포함하는 멜라닌 생성 촉진용 조성물에 관한 것으로, 멜라닌 생성을 촉진하여 백모 또는 백반증을 예방·개선·치료하기 위한 약학 조성물, 화장품 조성물 및 식품 조성물을 제공한다. 7A4MC는 4-메틸움벨리페론(4MUMB)을 아세틸화하여 얻은 합성 유도체로, 태닝제 또는 염모제 형태로도 활용할 수 있다.","features":[{"k":"특징","v":"B16F10 흑색종 세포에서 세포독성 없이 처리 농도에 의존적으로 멜라닌 생성을 촉진하며, 티로시나제(TYR) 활성을 증가시키고 MITF 발현을 높여 TRP-1, TRP-2, TYR 발현을 유도한다. 작용은 MAPK/JNK 경로의 상향 조절과 AKT 경로의 하향 조절을 통해 이루어진다."},{"k":"효과","v":"세포독성 없이 멜라닌 생성을 증가시켜 백모 또는 백반증 예방·개선·치료용 소재로 활용할 수 있으며, 부작용이 적은 무독성 멜라닌 생성 유도제로서 제약 및 화장품 산업에서 태닝제·염모제로 유용하게 사용할 수 있다."}],"lvl":3,"comparison":[{"item":"백모 개선 방식","old":"식물성·금속성·합성 염모제로 모발을 외부에서 착색","new":"멜라닌 생성을 촉진해 색소 재침착을 유도하는 조성물"},{"item":"유효성분 구성","old":"염모제 성분이나 효능이 미미한 쿠마린 유도체 4MH를 사용","new":"4MUMB을 아세틸화한 합성 유도체 7A4MC를 유효성분으로 사용"},{"item":"세포 안전성","old":"염모제의 화학작용으로 모발과 두피에 손상·자극 부작용 발생","new":"B16F10 세포에서 세포독성 없이 농도 의존적으로 작용"}],"applications":[{"title":"백모·백반증 치료 의약품","desc":"멜라닌 생성을 촉진하는 유효성분으로 백모 또는 백반증을 예방·개선·치료하는 약학 조성물로 활용할 수 있다"},{"title":"기능성 화장품·염모 제품","desc":"태닝제나 염모제 등 화장품 조성물에 적용해 백모와 백반증을 예방·개선하는 제품을 구성할 수 있다"},{"title":"건강기능식품 소재","desc":"7A4MC를 유효성분으로 포함하는 식품 조성물 형태로 백모 예방과 개선을 돕는 식품 소재로 쓸 수 있다"}],"figFile":"10-2021-0164325.jpg","figureCaption":"공보 대표도면"},{"id":"p1020230005974","title":"수소차 운행을 통해 생성된 물의 활용시스템","field":"전기·전자","status":"등록","regNo":"10-2853949","regDate":"2025.08.28","appNo":"10-2023-0005974","appDate":"2023.01.16","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2043.01.16","inventor":"강민수","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 수소차 운행을 통해 생성된 물의 활용시스템에 관한 것으로, 연료전지스택에서 수소와 산소의 반응 시 생성되는 물을 워터트랩과 워터탱크를 거쳐 저장한 뒤 차량 실내 가습에 사용한다. 콘솔박스 하측의 증기형성부와 콘솔박스 전방 및 후방에 마련된 증기배출부를 통해 앞좌석과 뒷좌석을 고르게 가습하며, 저장된 물을 워셔액 제조와 고압 세차, 정화 후 음용수 용도로도 활용한다.","features":[{"k":"특징","v":"증기형성부가 저장된 물을 수증기로 변환해 분배공간에 모으고, 좌석별 습도측정센서 값에 따라 제어모듈이 개폐구를 선택적으로 개방해 해당 관리영역에 가습을 집중하며, 워셔액모듈은 알약수용링을 회전시켜 워셔알약을 하나씩 토출한다."},{"k":"효과","v":"앞좌석과 뒷좌석 주변의 습도 조절이 효과적으로 이루어져 차량 실내 전체를 고르게 가습할 수 있고, 워셔액을 자체 형성해 주기적 보충 수고를 덜며, 세척모듈로 세차하거나 정화 및 음용모듈로 식수로 활용할 수 있다."}],"lvl":3,"comparison":[{"item":"가습 물 공급","old":"별도 가습장치에 물을 주기적으로 보충해야 해 불편함","new":"연료전지스택에서 생성된 물을 워터탱크에 저장해 바로 사용"},{"item":"가습기 설치 위치","old":"차량 후방 패키지트레이에 설치해 뒷좌석 위주로 가습됨","new":"운전석·조수석 사이 콘솔박스 하측에 증기형성부를 배치함"},{"item":"실내 가습 균일성","old":"앞좌석과 뒷좌석 사이에 습도 차이가 발생하는 문제가 있음","new":"콘솔박스 전방과 후방 증기배출부로 실내 전체를 고르게 가습"}],"applications":[{"title":"수소차 실내 가습 시스템","desc":"연료전지 반응으로 생성된 물을 수증기로 바꿔 차량 실내를 가습하는 시스템"},{"title":"생성수 회수·저장 모듈","desc":"연료전지스택에서 나오는 물을 워터탱크에 모아 차량 내에서 재활용하는 모듈"},
