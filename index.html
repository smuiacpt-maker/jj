d":"p1020160040958","title":"드론","field":"건설","status":"등록","regNo":"10-1853354","regDate":"2018.04.24","appNo":"10-2016-0040958","appDate":"2016.04.04","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2036.04.04","inventor":"고국원","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 장시간 비행이 가능한 드론에 관한 것으로, 프레임 가운데에 양력을 생성하는 1개의 메인 프로펠러를 두고 프레임 가장자리에는 기체의 자세와 이동 방향을 조절하는 복수의 서브 프로펠러를 메인 프로펠러의 회전축을 기준으로 서로 대칭되게 배치한 구조이다. 공중 부양 기능과 방향 전환 기능을 분리함으로써, 모든 프로펠러가 양력과 방향 전환을 동시에 담당하여 전력 소모가 컸던 기존 쿼드콥터의 짧은 비행 시간 문제를 해소한다.","features":[{"k":"특징","v":"메인 프로펠러는 화석 연료를 쓰는 내연 기관으로, 서브 프로펠러는 모터로 각각 구동되며, 각 서브 프로펠러는 메인 프로펠러와 서브 프로펠러의 회전 반경을 합한 값보다 큰 반지름의 가상 원 위에 등각도로 배치되어 간섭을 피한다. 메인 프로펠러는 동축 반전 모듈로 정·역 회전하는 두 프로펠러를 갖는다."},{"k":"효과","v":"방향 전환이 필요 없는 상황에서는 메인 프로펠러만 회전시켜 서브 프로펠러에서 낭비되는 전력 소모를 줄일 수 있고, 내연 기관 적용으로 배터리에 의한 비행 시간 제약이 완화되어 비행 시간이 대폭 증가하며, 동축 반전 구조로 회전 반력에 의한 기체 회전도 방지된다."}],"lvl":3,"comparison":[{"item":"추진 구조 방식","old":"복수의 프로펠러와 모터가 양력과 자세 제어를 함께 담당","new":"양력용 메인 프로펠러와 자세용 서브 프로펠러를 분리 배치"},{"item":"전력 소비 방식","old":"모든 프로펠러의 모터가 상시 구동되어 전력 소모가 큼","new":"방향 전환이 없을 때 메인 프로펠러만 회전시켜 낭비를 줄임"},{"item":"비행 동력원","old":"복수 모터와 배터리에 의존해 비행 시간이 매우 짧음","new":"모터 대신 내연 기관을 적용할 수 있어 장시간 비행 가능"}],"applications":[{"title":"장시간 체공 촬영 드론","desc":"양력과 자세 제어를 분담해 전력 낭비를 줄인 구조로, 넓은 지역을 한 번에 돌며 촬영해야 하는 임무용 비행체에 적용된다."},{"title":"내연기관 탑재 무인기","desc":"메인 프로펠러 중심의 특수 구조를 통해 모터 대신 내연 기관을 동력원으로 쓰는 무인 비행체 설계에 활용할 수 있다."},{"title":"원격 조종 비행 플랫폼","desc":"무선 전파로 유도되는 원격 조종 비행체에서 서브 프로펠러로 자세와 이동 방향을 조절하는 제어 플랫폼에 쓰인다."}],"figFile":"10-2016-0040958.jpg","figureCaption":"공보 대표도면"},{"id":"p1020170021737","title":"어깨 위팔 치료용 운동장치","field":"의료","status":"등록","regNo":"10-1850507","regDate":"2018.04.13","appNo":"10-2017-0021737","appDate":"2017.02.17","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2037.02.17","inventor":"홍지헌","transfer":"매매 · 라이센스","smk":false,"brief":false,"lvl":0},{"id":"p1020160160151","title":"삼중 도핑된 다결정 투광성 업컨버팅 알파사이알론 세라믹스 및 그 제조방법","field":"전기·전자","status":"등록","regNo":"10-1849020","regDate":"2018.04.09","appNo":"10-2016-0160151","appDate":"2016.11.29","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2036.11.29","inventor":"이수완","transfer":"매매 · 라이센스","smk":false,"brief":false,"lvl":0},{"id":"p1020160096943","title":"재난대응을 위한 스마트 웨어러블장치 및 이를 이용한 재난대응 시스템","field":"생활","status":"등록","regNo":"10-1848276","regDate":"2018.04.06","appNo":"10-2016-0096943","appDate":"2016.07.29","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2036.07.29","inventor":"박윤용","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 태풍, 홍수, 지진 등의 자연재해나 건물화재, 붕괴, 폭발, 선박침몰 같은 재난 상황에서 조난자를 신속하고 안전하게 대피시키기 위한 스마트 웨어러블장치 및 이를 이용한 재난대응 시스템에 관한 것이다. 센서부, 표시부, 음성출력부, 조명부, 통신부, 전원부, 제어부가 헬멧 형태의 착용부에 집적되어, 사용자는 별도의 장비나 도구를 휴대하지 않고도 현재 위치를 기준으로 안전한 대피 경로를 제공받는다. 착용부에는 전면마스크부와 유해가스를 정화하는 환기부, 목과 어깨를 덮는 보호덮개부가 형성된다.","features":[{"k":"특징","v":"초음파센서로 시야 확보가 어려운 상황에서도 장애물 유무를 파악하고, 비콘 기반 실내 위치기반 내비게이션으로 판단한 최적 대피경로를 눈 위치의 LCD, LED 디스플레이와 양쪽 귀의 스피커로 전달한다. IoT 재난대응 모니터링 시스템, GPS, IPS 및 재난통신망과 연동해 안내 경로가 막히면 새로운 경로를 안내한다."},{"k":"효과","v":"별도 장비 없이 현재 위치 기준의 안전한 대피 경로를 안내받아 신속한 대피가 가능해 인명피해를 최소화할 수 있다. 머리와 얼굴을 보호하면서 양손을 자유롭게 쓸 수 있고, 현재 위치와 상황을 외부로 전달해 구조대의 원활한 구조활동과 재난 초기의 선제적 대응이 가능하다."}],"lvl":3,"comparison":[{"item":"정보수신 장치 형태","old":"별도의 정보수신장치를 휴대해야 해 분실·파손 위험이 큼","new":"몸에 착용하는 웨어러블 형태로 별도 장비 휴대가 불필요함"},{"item":"보급 전제 조건","old":"스마트폰과 전용 애플리케이션 설치를 전제로 안내가 이뤄짐","new":"센서·표시·통신·조명부를 갖춘 전용 착용 장치로 동작함"},{"item":"대피 정보 전달","old":"지정된 대피경로가 막히면 다른 경로를 찾기 어려웠음","new":"감지 정보와 현재위치 기준 대피경로를 시각·음성으로 제공"}],"applications":[{"title":"재난 대피용 웨어러블","desc":"태풍, 지진, 건물화재, 붕괴, 선박침몰 등 재난상황에서 현재위치 기준의 안전한 대피 경로를 착용자에게 제공한다."},{"title":"무선 센서 네트워크 연동","desc":"위치센서와 초음파 센서, GPS·IPS 위치기반 시스템을 연동해 재난상황 정보를 수집하고 전달하는 체계에 쓰인다."},{"title":"구조활동 지원 재난통신","desc":"재난통신망으로 상황을 전달해 즉각적인 상황파악과 구조대의 원활한 구조활동을 지원하는 용도로 활용된다."}],"figFile":"10-2016-0096943.jpg","figureCaption":"공보 대표도면"},{"id":"p1020160062278","title":"다중 광학계를 이용한 복합 검사장치","field":"전기·전자","status":"등록","regNo":"10-1846949","regDate":"2018.04.03","appNo":"10-2016-0062278","appDate":"2016.05.20","applicant":"주식회사 미르기술 · 선문대학교 산학협력단","coApplicant":true,"expiry":"2036.05.20","inventor":"김기영","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 다중 광학계를 이용한 복합 검사장치에 관한 것으로, 모아레 방식·백색광 주사 간섭방식·공초점 방식 등 서로 다른 광학 측정 방식을 쓰는 둘 이상의 측정 시스템이 각기 다른 파장대역의 측정광을 시료에 동시에 조사하도록 구성된다. 각 측정 시스템은 자신이 조사한 파장대역의 반사광만 광학필터로 선택 투과시켜 영상을 획득하므로, 측정모드를 전환하지 않고도 서로 독립적인 동시 측정이 가능하다.","features":[{"k":"특징","v":"제1·제2 측정광 입력부가 적색과 청색 등 서로 다른 파장대역의 광을 조사하고, 해당 파장대역만 투과시키는 광학필터와 영상 획득부가 반사광 이미지를 분리해 얻으며, 컬러 이미지 센서 하나로 획득 영상을 파장별로 분리하는 간소화 구성도 제시된다. PC가 파장별 이미지에 각 측정 방식의 알고리즘을 적용해 3차원 형상을 분석한다."},{"k":"효과","v":"여러 종류의 광학 검사장치를 측정모드 변경 없이 동시에 구동할 수 있어 검사속도가 현저하게 향상되고, 구성이 간단하여 제조단가 측면에서도 우수한 3차원 광학식 형상 검사장치를 제공할 수 있다."}],"lvl":3,"comparison":[{"item":"측정 모드 전환","old":"블록필터와 기준거울을 기구로 이송해 측정 모드를 전환함","new":"파장대역별 광학필터로 기구 이송 없이 측정광을 분리함"},{"item":"측정 소요 시간","old":"측정법별로 순차 측정해 연산과 검사 속도가 지연됨","new":"서로 다른 파장의 측정광으로 측정해 측정 시간을 단축함"},{"item":"장치 구성과 단가","old":"간섭계마다 이송기구가 필요해 구성이 복잡하고 단가가 높음","new":"광학필터와 영상 획득부로 구성을 간단히 해 제조단가를 절감"}],"applications":[{"title":"전자회로기판 3D 외관검사","desc":"다양한 종류의 부품이 실장된 전자회로기판의 높이와 표면 형상을 한 장비에서 여러 측정법으로 검사하는 데 쓰인다."},{"title":"경면·투명체 형상 측정","desc":"모아레 방식으로 어려운 경면 반사면이나 투명 물체의 높이와 두께를 다른 측정 방식과 함께 측정할 수 있다."},{"title":"미세 구조 3차원 계측","desc":"미세 패턴이나 와이어 루프 높이처럼 단일 측정법으로는 얻기 어려운 미세 구조의 3차원 형상 계측 장비에 적용된다."}],"figFile":"10-2016-0062278.jpg","figureCaption":"공보 대표도면"},{"id":"p1020160180221","title":"미생물 변이체를 이용한 탁시폴린으로부터 아스틸빈의 제조방법","field":"의료","status":"등록","regNo":"10-1846368","regDate":"2018.04.02","appNo":"10-2016-0180221","appDate":"2016.12.27","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2036.12.27","inventor":"송재경","transfer":"매매 · 라이센스","smk":false,"brief":false,"lvl":0},{"id":"p1020160116296","title":"3차원 형상 측정용 미라우 타입 간섭렌즈 구조체","field":"전기·전자","status":"등록","regNo":"10-1843407","regDate":"2018.03.23","appNo":"10-2016-0116296","appDate":"2016.09.09","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2036.09.09","inventor":"김호환","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 3차원 형상 측정에 사용되는 미라우 타입 간섭렌즈 구조체에 관한 것으로, 간섭용 대물렌즈부재의 하부에 기준미러부재와 빔스플리터부재를 배치하고 이들을 열팽창 또는 열수축하는 열변형 지지부재로 지지한다. 온도 변화로 대물렌즈의 초점거리가 변하더라도 빔스플리터부재에서 기준미러부재까지의 광경로와 빔스플리터부재에서 빛의 초점까지의 광경로가 용이하게 일치되도록 보상하는 구조이다.","features":[{"k":"특징","v":"열변형 지지부재는 간섭용 대물렌즈부재의 열변형 시 증감하는 길이와 동일한 길이로 늘거나 줄어드는 열팽창 계수의 재질로 제조된다. 다른 실시예에서는 길이변화량 감지센서가 대물렌즈의 길이 변화를 감지하고 제어부가 지지대 승하강기기로 기준미러부재와 빔스플리터부재의 위치를 조정한다."},{"k":"효과","v":"작업자가 대물렌즈와 기준거울 간 거리를 수작업으로 맞출 필요가 없어 3차원 형상 측정 시간이 단축되고 생산성이 향상된다. 또한 광경로를 정확하게 일치시켜 작업자에 따른 측정값 차이와 주변 온도 변화에 따른 오차를 방지하고 측정값의 신뢰성을 높인다."}],"lvl":3,"comparison":[{"item":"광경로 보정 방식","old":"측정자가 대물렌즈와 기준거울 간 거리를 수작업으로 조절함","new":"열변형 지지부재가 열팽창·수축으로 간격을 자동 조절함"},{"item":"조정 소요 시간","old":"두 광경로를 일치시키는 데 많은 시간이 소요돼 효율이 저하됨","new":"온도 변화에 맞춰 간격이 보상되어 조정 작업이 불필요함"},{"item":"측정값 재현성","old":"위치 조정을 하는 작업자에 따라 측정값에 차이가 발생함","new":"대물렌즈와 동일한 길이로 변형되어 광경로가 항상 일치함"}],"applications":[{"title":"3차원 표면 형상 측정","desc":"간섭계 패턴을 생성하고 분석해 측정 대상물의 입체 형상을 얻는 3차원 표면 측정장치의 간섭렌즈로 적용된다."},{"title":"고배율 미라우 간섭렌즈","desc":"작업거리가 작은 10배 이상 고배율 조건에서 간섭을 일으키는 미라우 타입 간섭렌즈 구조체에 쓰인다."},{"title":"온도변화 보상 광학계","desc":"주변 온도 변화로 대물렌즈 길이가 변해도 초점위치와 간섭무늬 위치의 변화를 보상하는 광학 구조에 활용된다."}],"figFile":"10-2016-0116296.jpg","figureCaption":"공보 대표도면"},{"id":"p1020160073628","title":"폐열회수 및 신선공기유입형 내부온도 균일화 농산물 건조장치","field":"전기·전자","status":"등록","regNo":"10-1841447","regDate":"2018.03.19","appNo":"10-2016-0073628","appDate":"2016.06.14","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2036.06.14","inventor":"권영철","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 폐열회수 및 신선공기유입형 내부온도 균일화 농산물 건조장치에 관한 것으로, 외기를 가열한 온풍을 건조실 내부에 순환시켜 건조대상물을 건조하면서 내부 양측의 온도 및 습도에 따라 송풍방향을 시계 또는 반시계방향으로 전환하여 내부 온도를 균일하게 유지한다. 또한 건조에 사용된 후 배출되는 배열을 새로 유입되는 외기와 열교환시킨 뒤 배출시켜 폐열을 회수하여 재활용한다.","features":[{"k":"특징","v":"건조실 상단의 제1관로와 거기서 분기되어 건조실 내부와 연통되는 제2관로, 분기점에 설치된 brief":false,"summary":"본 기술은 휴대용 단말기의 케이스 구조체에 관한 것으로, 스마트폰이나 태블릿PC를 외부 충격으로부터 보호하는 케이스 본체를 상부 케이싱부재와 하부 케이싱부재로 나누고, 그 중 적어도 어느 한 측에 전원 콘센트와 결합되는 플러그부와 단말기 배터리를 충전할 수 있는 전원 충전부를 구비한다. 케이스 자체가 배터리 충전기기 역할을 하여 별도의 플러그나 전원 케이블을 따로 휴대하지 않아도 된다.","features":[{"k":"특징","v":"하부 케이싱부재는 플러그부와 제1연결단자를 갖는 제1케이싱 몸체부와 전원 충전부를 갖는 제2케이싱 몸체부로 분리되는 조립식 모듈이며, 제2케이싱 몸체부는 감아 보관하는 충전용 케이블, 무선충전 안테나부, 보조 배터리부 중 하나를 선택해 결합한다. 플러그부는 이동레일부와 회전판체·힌지체로 위치와 각도를 조절할 수 있다."},{"k":"효과","v":"휴대 중에 휴대용 단말기의 배터리를 간편하게 충전할 수 있어 사용자의 편의성과 만족감을 크게 향상시키고, 단말기 배터리뿐 아니라 보조배터리도 휴대 중에 간편하게 충전할 수 있으며, 플러그부가 이동·회전되어 주변 구조물의 방해를 받지 않고 콘센트에 꽂을 수 있다."}],"lvl":3,"comparison":[{"item":"충전 수단 휴대","old":"여분 배터리나 보조배터리를 사용자가 별도로 휴대해야 했음","new":"케이스 본체에 플러그부와 전원 충전부를 함께 구비함"},{"item":"사전 충전 필요성","old":"보조배터리를 미리 충전해 두어야만 사용할 수 있었음","new":"콘센트에 바로 결합되는 플러그부로 즉시 충전이 가능함"},{"item":"케이블 보관 방식","old":"플러그와 전원 케이블을 별도로 챙겨 휴대해야 했음","new":"충전용 케이블을 하부 케이싱 내부에 감아 보관하고 인출함"}],"applications":[{"title":"충전기 일체형 단말기 케이스","desc":"스마트폰과 테블릿PC를 외부 충격으로부터 보호하면서 콘센트 직결 충전까지 가능한 보호 케이스에 적용된다."},{"title":"조립식 모듈형 케이스 구조","desc":"상부와 하부 케이싱부재를 분리 결합하는 구조로, 충전기기를 조립식 모듈로 구성하는 케이스 설계에 쓰인다."},{"title":"일체형 배터리 기기 충전","desc":"배터리 교체가 불가능한 일체형 설계 제품에서 휴대 중 전원을 보충해야 하는 사용자용 충전 수단으로 활용된다."}],"figFile":"10-2016-0081378.jpg","figureCaption":"공보 대표도면"},{"id":"p1020160078743","title":"LCOS를 이용한 파장선택스위치에 적용되는 다위상 홀로그램 패턴 제작 방법 및 이를 이용한 파장선택스위치","field":"전기·전자","status":"등록","regNo":"10-1829649","regDate":"2018.02.09","appNo":"10-2016-0078743","appDate":"2016.06.23","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2036.06.23","inventor":"이용민","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 LCOS를 이용한 파장선택스위치에 적용되는 다위상 홀로그램 패턴 제작 방법 및 이를 이용한 파장선택스위치에 관한 것으로, 복수의 출력포트 위치에 대응하는 원본 이미지를 제작하고 각 원본 이미지로부터 홀로그램 패턴을 만든 뒤 이들을 병합하여 하나의 다위상 홀로그램 패턴을 제작한다. 이 패턴을 LCOS 소자에 디스플레이시켜 홀로그램 패턴 자체로 파장 선택 스위칭을 수행하도록 한 것이다.","features":[{"k":"특징","v":"원본 이미지는 Gerchberg-Saxton 알고리즘을 적용한 다위상 변조로 홀로그램 패턴화되며, 파장선택스위치는 하나의 입력포트와 복수의 출력포트를 갖는 광섬유 콜리메이터 어레이, 다중파장 광신호를 파장별로 분리하는 그레이팅, 파장별로 다른 각도로 반사시키는 LCOS 소자, 병합된 패턴을 표시하는 제어수단으로 구성된다."},{"k":"효과","v":"다위상 홀로그램 패턴을 LCOS 소자에 적용하면 홀로그램 패턴 자체로 파장 선택 스위칭이 가능하고, 파장선택스위치의 삽입손실과 크로스토크가 줄어들어 광효율을 극대화할 수 있으며, 이진 위상 변조에서 나타나던 이중상 생성 문제도 해소된다."}],"lvl":3,"comparison":[{"item":"빔 제어 패턴","old":"LCOS 소자에 그레이팅 패턴을 적용해 빔 방향을 제어함","new":"출력포트별 홀로그램을 병합한 다위상 홀로그램 패턴을 적용"},{"item":"크로스토크 저감","old":"블레이즈 회절격자와 디포커싱 파면 인코딩으로 빔을 분산시킴","new":"병합 패턴 자체로 파장별 광신호를 설정 출력포트로 반사시킴"},{"item":"광효율과 손실","old":"그레이팅 패턴은 입출력 간 광효율 측면에서 불리함","new":"삽입손실과 크로스토크를 줄여 광효율을 극대화함"}],"applications":[{"title":"ROADM 파장선택스위치","desc":"다중파장 광신호를 파장별로 임의의 출력포트로 전달하는 차세대 ROADM의 노드 스위칭 소자에 적용된다."},{"title":"LCOS 홀로그램 패턴 제작","desc":"Gerchberg-Saxton 알고리즘으로 원본 이미지를 다위상 변조해 LCOS 소자용 홀로그램 패턴을 제작하는 데 쓰인다."},{"title":"광섬유 다중파장 전송망","desc":"하나의 입력포트와 복수의 출력포트를 갖는 광섬유 정보전달망에서 파장별 전달 경로를 재설정하는 장비에 활용된다."}],"figFile":"10-2016-0078743.jpg","figureCaption":"공보 대표도면"},{"id":"p1020160112713","title":"하지근력 저하 환자용 재활운동기기","field":"의료","status":"등록","regNo":"10-1826439","regDate":"2018.01.31","appNo":"10-2016-0112713","appDate":"2016.09.01","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2036.09.01","inventor":"유재호","transfer":"매매 · 라이센스","smk":false,"brief":false,"lvl":0},{"id":"p1020160057980","title":"하이브리드 전기자전거","field":"생활","status":"등록","regNo":"10-1823364","regDate":"2018.01.24","appNo":"10-2016-0057980","appDate":"2016.05.12","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2036.05.12","inventor":"박용재","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 페달 답력과 전동모터를 함께 쓰는 하이브리드 전기자전거에 관한 것으로, 페달 크랭크와 회전축 사이에 결합되어 뒷바퀴 체인이 걸리는 체인링, 회전축의 회전과 별개로 도는 부체인링, 부체인링과 구동체인으로 연결된 전동모터, 구동체인을 옮기는 이송부, 전동모터를 제어하는 제어부로 구성된다. 구동체인을 체인링 측 또는 부체인링 측으로 이송시켜 전동모터의 구동력을 뒷바퀴로 전달하거나 차단한다.","features":[{"k":"특징","v":"체인링은 뒷바퀴와 체인으로 연결되는 외기어와 구동체인이 물리는 내기어로 이루어지고, 자전거 손잡이의 이송레버가 와이어로 이송체를 움직여 구동체인을 좌우로 옮긴다. 체인링 내부의 원웨이 스토퍼는 크랭크와 회전축이 정지한 상태에서도 체인링이 회전될 수 있게 한다."},{"k":"효과","v":"전동모터가 프레임에서 착탈 가능하여, 모터 고장이나 배터리 방전이 발생해도 구동체인을 부체인링 측으로 이송시켜 페달만으로 주행할 수 있고, 원웨이 스토퍼를 통해 전동 주행 중에는 페달을 지속적으로 밟지 않아도 되는 효과가 있다."}],"lvl":3,"comparison":[{"item":"동력 전달 방식","old":"후륜 회전중심의 모터나 종동 스프라켓으로 동력을 직접 전달","new":"구동체인을 체인링 내기어로 이송해 모터 동력을 뒷바퀴로 전달"},{"item":"페달 연동 여부","old":"모터로 동력을 전달할 때 페달이 결합된 크랭크도 함께 회전됨","new":"부체인링과 원웨이 스토퍼로 크랭크 회전 없이 모터만 구동"},{"item":"고장 시 대응","old":"모터 고장 시 분리하거나 교체하기 전에는 운행이 불편함","new":"이송부로 구동체인을 부체인링으로 옮겨 즉시 수동 운행 가능"}],"applications":[{"title":"하이브리드 전기자전거","desc":"배터리와 전동모터의 구동력과 사람의 답력을 함께 쓰되, 필요할 때 모터 연결을 끊고 수동으로 주행하는 자전거에 적용된다."},{"title":"경사지 주행 보조 이동수단","desc":"경사지가 많은 지형에서 노약자가 모터 구동력을 이용해 오랫동안 주행할 수 있도록 돕는 근거리 이동수단에 활용된다."},{"title":"모터 동력 단속 기구","desc":"구동체인을 체인링과 부체인링 사이로 이송해 회전축과 모터의 연결을 끊고 잇는 동력 단속 기구에 적용할 수 있다."}],"figFile":"10-2016-0057980.jpg","figureCaption":"공보 대표도면"},{"id":"p1020160040953","title":"광학식 손떨림 보정의 검사 장치 및 검사 방법","field":"전기·전자","status":"등록","regNo":"10-1819576","regDate":"2018.01.11","appNo":"10-2016-0040953","appDate":"2016.04.04","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2036.04.04","inventor":"고국원","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 카메라 모듈의 광학식 손떨림 보정(OIS) 성능을 검사하는 장치 및 방법에 관한 것으로, 제1 렌즈가 설치된 이동부와 이를 광축에 수직한 수평 방향으로 지지하는 고정부를 갖춘 카메라 모듈을 이격된 위치에서 광학식으로 촬영한다. 촬영된 검사 영상을 분석해 고정부에 대한 이동부의 변위를 검출함으로써 OIS 성능을 판별한다. OIS 기능이 탑재된 카메라 모듈의 양산 검사를 대상으로 한다.","features":[{"k":"특징","v":"촬영부의 제2 렌즈 광축을 검사 대상의 제1 렌즈 광축과 평행하게 두고, 검출부가 이동부의 제1 검사 특이점과 고정부의 제2 검사 특이점 간 거리 변화를 x·y 방향으로 나누어 측정한 뒤 전력당 변위가 기록된 룩업 테이블이나 기준 영상과 비교해 정상 여부를 판별한다."},{"k":"효과","v":"촬영부가 카메라 모듈과 접촉·연결되지 않아 검사가 끝난 모듈을 빼고 새 모듈을 투입하기 쉬워 검사 속도가 개선되며, 기준 영상 비교 방식을 쓰면 OIS 성능뿐 아니라 카메라 모듈의 조립 불량 여부까지 함께 판별할 수 있다."}],"lvl":3,"comparison":[{"item":"검사 대상 기능","old":"초점·이물질 테스트 중심으로 OIS 기능 검사는 부재","new":"카메라 모듈의 OIS 성능을 광학식으로 촬영해 검사"},{"item":"변위 측정 방식","old":"OIS 이동부의 변위를 측정하는 방안이 제시되지 않음","new":"검사 영상의 특이점 비교로 이동부 변위를 검출"},{"item":"검사 처리 속도","old":"전용 테스트 방안이 없어 OIS 성능 판별이 어려움","new":"이격 촬영 방식으로 모듈 투입·배출을 신속히 수행"}],"applications":[{"title":"카메라 모듈 OIS :true,"lvl":1},{"id":"p1020150107141","title":"위치정보 제공 기능을 구비한 실내 재난 통신 시스템 및 실내 재난 통신 방법","field":"소프트웨어","status":"등록","regNo":"10-1701292","regDate":"2017.01.24","appNo":"10-2015-0107141","appDate":"2015.07.29","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2035.07.29","inventor":"박윤용","transfer":"매매 · 라이센스","smk":false,"summary":"위치정보 제공 기능을 구비한 실내 재난 통신 시스템 및 방법. 무선전파통신 중 침수가 발생하면 음파통신으로 변경하는 다수의 무선네트워크노드로 로컬영역 통신서비스를 제공하고, 구조물 내 사용자 단말기에 위치정보를 제공한다.","brief":true,"lvl":1},{"id":"p1020160005576","title":"관절의 회전각을 통해 모션 매칭률을 산출하는 장치 및 그 방법","field":"소프트웨어","status":"등록","regNo":"10-1700214","regDate":"2017.01.20","appNo":"10-2016-0005576","appDate":"2016.01.15","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2036.01.15","inventor":"현훈범","transfer":"매매 · 라이센스","smk":false,"summary":"관절의 회전각을 통해 모션 매칭률을 산출하는 장치 및 방법. 관절 상부와 하부에 각각 위치해 3차원 위치 좌표값을 추출하는 제1·제2 센서부와, 두 좌표값을 토대로 관절 회전각 값을 산출하는 관절 회전각 산출부를 포함한다.","brief":true,"lvl":1},{"id":"p1020150107131","title":"무선네트워크부를 구비한 실내 재난 통신 시스템 및 실내 재난 통신 방법","field":"전기·전자","status":"등록","regNo":"10-1699435","regDate":"2017.01.18","appNo":"10-2015-0107131","appDate":"2015.07.29","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2035.07.29","inventor":"박윤용","transfer":"매매 · 라이센스","smk":false,"summary":"무선네트워크부를 구비한 실내 재난 통신 시스템 및 방법. 무선전파통신 중 침수가 발생하면 음파통신으로 변경하도록 두 통신을 선택적으로 수행하는 다수의 무선네트워크노드를 구비해, 선박이나 대형 건물 침수 상황에서도 통신 단절 없이 재난 통신을 수행한다.","brief":true,"lvl":1},{"id":"p1020150135762","title":"테이크 아웃 예약 주문 시스템 및 방법","field":"기계","status":"등록","regNo":"10-1690679","regDate":"2016.12.22","appNo":"10-2015-0135762","appDate":"2015.09.24","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2035.09.24","inventor":"김학수","transfer":"매매 · 라이센스","smk":false,"summary":"테이크 아웃 예약 주문 결제 방법 및 시스템. 가맹점 등록, 고객 위치 정보 수신, 거리가 가까운 순으로 가맹점 분류 및 정보 송신, 선택된 가맹점·상품·예상 방문 시간에 대한 예약 주문 요청 시 결제 요청, 결제 완료 상품에 대한 가맹점 예약 주문 전송 단계를 포함한다.","brief":true,"lvl":1},{"id":"p1020150136112","title":"의료폐기물 전용용기","field":"의료","status" ventor":"홍지헌","transfer":"매매 · 라이센스","smk":false,"summary":"관절 운동학을 기반으로 하는 모션 캡쳐 장치 및 방법. 사용자의 관절 상부에 부착되는 제1 센서, 관절 하부에 부착되는 제2 센서, 검출된 신호를 토대로 관절 및 분절 모션 데이터를 취득하는 모션 데이터 취득부, 이를 토대로 사용자의 모션을 인식하는 모션 인식부를 포함한다.","brief":true,"lvl":1},{"id":"p1020140154510","title":"도금 및 딤플이 복합된 하이브리드 타입 저마찰 부재 및 이를 구비한 자동차 엔진","field":"재료","status":"등록","regNo":"10-1663232","regDate":"2016.09.29","appNo":"10-2014-0154510","appDate":"2014.11.07","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2034.11.07","inventor":"이수완","transfer":"매매 · 라이센스","smk":false,"summary":"도금 및 딤플이 복합된 하이브리드 타입 저마찰 부재 및 이를 구비한 자동차 엔진. 전기도금으로 저마찰 특성을 갖는 도금층을 먼저 형성한 뒤 그 영역에 저마찰용 딤플 패턴을 복합적으로 형성시켜 저마찰 효과를 극대화했다.","brief":true,"lvl":1},{"id":"p1020140035409","title":"휴대용 표면처리장치","field":"재료","status":"등록","regNo":"10-1643736","regDate":"2016.07.22","appNo":"10-2014-0035409","appDate":"2014.03.26","applicant":"선문대학교 산학협력단 · 주식회사 엠브로지아","coApplicant":true,"expiry":"2034.03.26","inventor":"오주연","transfer":"매매 · 라이센스","smk":false,"summary":"휴대용 표면처리장치. 하우징, 미리 설정된 주파수의 진동을 발생시키는 액추에이터, 진동을 전달받아 구조물 표면에 반복적인 타격을 인가하는 타격 공구, 작업자가 인가하는 힘을 측정하는 힘 센서부, 측정 결과에 따라 액추에이터 전원을 차단하는 컨트롤러를 포함한다.","brief":true,"lvl":1},{"id":"p1020140127146","title":"신규한 뮤피로신 글리코시드 및 이의 제조방법","field":"화학","status":"등록","regNo":"10-1633897","regDate":"2016.06.21","appNo":"10-2014-0127146","appDate":"2014.09.23","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2034.09.23","inventor":"송재경","transfer":"매매 · 라이센스","smk":false,"summary":"화학식 1로 표시되는 뮤피로신 글리코시드, 이의 제조방법 및 항생제 용도에 관한 것이다.","brief":true,"lvl":1},{"id":"p1020140108613","title":"신규한 알파-망고스틴 글리코시드 유도체 및 이의 제조방법","field":"재료","status":"등록","regNo":"10-1621426","regDate":"2016.05.10","appNo":"10-2014-0108613","appDate":"2014.08.20","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2034.08.20","inventor":"송재경","transfer":"매매 · 라이센스","smk":false,"summary":"신규한 알파-망고스틴 글리코시드 유도체 및 이의 제조방법. 원-포트 효소 시스템을 이용해 간편하고 경제적으로 물 용해도 및 항균 활성이 우수한 신규 알파-망고스틴 글리코시드 유도체를 제조할 수 있다.","b 발명의 발현 카세트는 불완전 전사 과정에서 일어날 수 있는 문제와 mRNA 분해 문제를 해결하며 반복적 전사가 가능하여 유전자 발현이 향상된다. 정지코돈 생성 및 frame shift 문제가 발생하지 않아 다수의 유전자를 한꺼번에 재조합해야 하는 생합성에 유용하다.","brief":true,"lvl":1},{"id":"p1020130090842","title":"미세진동 및 대형구조물의 진동제어에 사용가능한 다용도 MR 댐퍼","field":"재료","status":"등록","regNo":"10-1472011","regDate":"2014.12.05","appNo":"10-2013-0090842","appDate":"2013.07.31","applicant":"알엠에스테크놀러지 · 선문대학교 산학협력단","coApplicant":true,"expiry":"2033.07.31","inventor":"이홍기","transfer":"매매 · 라이센스","smk":false,"summary":"본 발명은 미세진동 및 대형구조물의 진동제어에 사용 가능한 다용도 MR 댐퍼에 관한 것으로, 내부에 MR 유체를 충진하고 코일이 설치되는 코어의 형상을 다단으로 형성함과 동시에, MR 유체가 유동되는 오리피스 갭의 내주연에 자기장 및 압력이 증가될 수 있는 다수의 돌기부를 다양한 형태로 돌출 형성하여, 기존에 비해 자기장의 세기에 따라 높은 항복응력을 발생시켜 미세진동 및 대형 구조물 등 다양한 진동제어에 사용이 가능하다.","brief":true,"lvl":1},{"id":"p1020130047589","title":"전신 운동기구","field":"생활","status":"등록","regNo":"10-1437403","regDate":"2014.08.28","appNo":"10-2013-0047589","appDate":"2013.04.29","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2033.04.29","inventor":"양현석","transfer":"매매 · 라이센스","smk":false,"summary":"본 발명은 전신 운동기구에 관한 것으로, 사용자의 허리에 착용하는 허리착용구 및 이와 연결된 하나 이상의 신축성 있는 연결끈을 이용하여 탄성력을 이용한 운동효과를 극대화시킴과 동시에 하반신의 대퇴부나 상반신의 근력을 강화할 수 있는 종합적 전신운동이 가능한 운동기구에 관한 것이다.","brief":true,"lvl":1},{"id":"p1020130043125","title":"운동 보조 기구","field":"생활","status":"등록","regNo":"10-1437335","regDate":"2014.08.28","appNo":"10-2013-0043125","appDate":"2013.04.18","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2033.04.18","inventor":"양현석","transfer":"매매 · 라이센스","smk":false,"summary":"본 발명은 착용자의 발목에 착용되는 띠 형상의 벨트부 및 연결부를 포함하고 연결부의 일단에 벨트부가 연결되는 운동 보조 기구이다. 벨크로 타입의 벨트부와 연결부를 분리형으로 제작하여 고리로 연결되도록 함으로써 착용자가 용이하게 탈착 가능하고 부상의 위험을 최소화할 수 있으며, 착용자의 발목을 최대한 자유롭게 감싸게 되어 훈련의 편의성을 극대화하고 벨트부의 교체가 용이하다.","brief":true,"lvl":1},{"id":"p1020120073860","title":"미생물 변이체를 이용한 케르세틴에서 3―O―자일로실 케르세틴을 제조하는 방법","field":"바이오","status":"등록","regNo":"10-1434602","regDate":"2014.08.20","appNo":"10-2012-0073860","appDate":"2012.07.06","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2032.07.06","inventor":"송재경","transfer":"매매 · 라이센스","smk":false,"summary":"본 발명은 미생물 변이체를 이용한 케르세틴에서 3-O-자일로실 케르세틴을 제조하는 방법에 관한 것으로, UDP-자일로오스 생합성 경로와 관련된 효소를 코딩하는 유전자 및 글리코실트랜스퍼레이즈를 코딩하는 유전자가 도입되어 생산능을 가지는 미생물 변이체 및 이를 이용한 제조 방법에 관한 것이다. 생산된 3-O-자일로실 케르세틴은 항암효과가 있어 암치료 의약품으로 개발될 수 있으며, 노화방지·미백 및 항스트레스 효과가 있어 식품 및 화장용 조성물로 유용하다.","brief":true,"lvl":1},{"id":"p1020120114495","title":"거짓양성반응 방지 효과가 우수한 흰반점바이러스 검출용 피시알 양성대조구 제조 방법","field":"의료","status":"등록","regNo":"10-1433370","regDate":"2014.08.18","appNo":"10-2012-0114495","appDate":"2012.10.16","applicant":"선문대학교 산학협력단 · 대한민국","coApplicant":true,"expiry":"2032.10.16","inventor":"권세련","transfer":"매매 · 라이센스","smk":false,"summary":"본 발명은 거짓양성반응 방지 효과가 우수한 흰반점바이러스 검출용 PCR 양성대조구 제조 방법에 관한 것으로서, 암피실린 내성 유전자 및 파지 f1 영역 유전자를 포함하는 pGEM-T easy vector DNA를 주형으로 네스티드 중합효소 연쇄반응을 수행하고, 증폭된 PCR 산물을 pGEM-T easy vector에 클로닝하여 키메릭 플라스미드를 제조한다. PCR 오염으로 인한 거짓양성 반응을 구분하여 흰반점바이러스병의 정확한 진단이 가능하다.","brief":true,"lvl":1},{"id":"p1020130022157","title":"더블 어라인너를 구비한 초소형 컬럼","field":"전기·전자","status":"등록","regNo":"10-1417603","regDate":"2014.07.01","appNo":"10-2013-0022157","appDate":"2013.02.28","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2033.02.28","inventor":"김호섭","transfer":"매매 · 라이센스","smk":false,"summary":"본 발명은 초소형 컬럼에 관한 것으로, 입자빔의 원래 주사 경로와 리미팅어퍼쳐의 어퍼쳐 축이 이격된 경우 이를 보정하되 더블 어라인너들에 의해 리미팅어퍼쳐의 어퍼쳐로 입자빔의 경로가 정렬되게 하여 입자빔의 경로를 효율적으로 보정한다. 소스렌즈를 포함하는 초소형 컬럼에 있어서 소스렌즈는 입자빔의 경로를 보정하는 두 개 이상의 어라인너층을 포함하는 것을 특징으로 한다.","brief":true,"lvl":1},{"id":"p1020130010826","title":"초소형 전자 광학 칼럼","field":"전기·전자","status":"등록","regNo":"10-1415745","regDate":"2014.06.30","appNo":"10-2013-0010826","appDate":"2013.01.31","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2033.01.31","inventor":"오태식","transfer":"매매 · 라이센스","smk":false,"summary":"해상도를 높이고 고속 편향이 가능하며 시료 표면에서의 스캔 영역을 보다 크게 유지할 수 있고 제조상의 용이성을 확보한 초소형 전자 광학 컬럼에 관한 기술이 개시된다. 전계 전자 방출 원리를 이용하여 전자를 방출시키는 전자 방출원, 전자빔이 형성되게 하는 소스 렌즈부, 전자빔을 편향시키는 편향부 및 전자빔을 타겟에 집속시키는 집 수가 있다.","brief":true,"lvl":1},{"id":"p1020100018241","title":"양파 발효 음료의 제조방법","field":"식품","status":"등록","regNo":"10-1292085","regDate":"2013.07.26","appNo":"10-2010-0018241","appDate":"2010.02.26","applicant":"가천대학교 산학협력단 · 청강문화산업대학교 산학협력단 · 서울대학교산학협력단 · 이화여자대학교 산학협력단 · 선문대학교 산학협력단","coApplicant":true,"expiry":"2030.02.26","inventor":"장재권","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 초산 발효 균주를 이용한 양파 발효 음료의 제조방법에 관한 것으로, 저장성이 낮고 냄새가 강해 식품가공 선호도가 낮아 생산량의 상당 부분이 버려지던 양파의 새로운 소비 형태를 제시한다. 본 기술은 산 생성능이 우수한 아세토박터 트로피칼리스 균주를 양파 착즙액 또는 열수 추출액에 접종·발효시켜 양파 발효액을 만들고, 여기에 사과즙 등을 배합하여 기호도를 높인 발효 음료를 제조한다.","features":[{"k":"특징","v":"발효 대상액의 에탄올 농도를 3.5~4.9%, 글루코스 농도를 2.5~3.0%로 조절한 뒤 아세토박터 트로피칼리스 균주를 접종하고 27~33℃, 0.5~1.2vvm 통기, 300~700rpm 교반 조건에서 발효하며, 효모 추출물이나 옥수수 침지액을 발효 중 첨가해 산 생성능을 높인다."},{"k":"효과","v":"발효를 통해 양파의 항암활성과 혈전생성 억제능이 개선되고, 양조 식초 기준인 산도 4% 이상의 발효액을 단기간에 효율적으로 제조할 수 있으며, 사과즙·베타사이클로덱스트린·사과향 배합으로 양파 특유의 이취미를 제어해 기호도를 개선할 수 있다."}],"lvl":3,"comparison":[{"item":"양파 활용 형태","old":"향신료·조미용이나 스낵·분말 등 가공식품으로 주로 이용","new":"아세토박터 트로피칼리스로 초산 발효한 음료로 활용"},{"item":"저장성·부가가치","old":"저장성이 낮아 생산량 10~20%가 상품가치를 상실","new":"발효 음료로 가공해 소비 형태를 넓히고 기능성 부가"},{"item":"기능성·이취 제어","old":"양파 특유의 강한 냄새로 식품가공 선호도가 낮음","new":"열처리로 이취미를 제어하고 항암·혈전억제능 강화"}],"applications":[{"title":"양파 발효 식초 음료","desc":"아세토박터 트로피칼리스로 양파 착즙액을 발효해 산도 4% 이상의 음료를 제조"},{"title":"건강기능성 음료 개발","desc":"항암활성과 혈전생성 억제능이 강화된 양파 발효물을 활용한 기능성 음료 분야"},{"title":"양파 산지 가공·소비촉진","desc":"저장성이 낮아 폐기되는 양파를 발효 가공해 소비를 촉진하는 산지 가공 분야"}],"figFile":"10-2010-0018241.jpg","figureCaption":"공보 대표도면"},{"id":"p1020110106083","title":"선 집속된 전자빔 스포트를 형성하는 X-선관","field":"전기·전자","status":"등록","regNo":"10-1275149","regDate":"2013.06.10","appNo":"10-2011-0106083","appDate":"2011.10.17","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2031.10.17","inventor":"오태식","transfer":"매매 · 라이센스","smk":false,"summary":"본 발명은 선 집속된 전자빔 스포트를 형성하는 X-선관을 제공한다. 탄소계 재질의 평면형태 전자빔 방출원 또는 어레이형 방출원 구조로 형성된 X-선관은 음극부, 전자 방출을 유도하는 게이트 전극부, 집속을 유 /* ---------- helpers ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function norm(s){ return String(s||'').replace(/[^0-9a-zA-Z]/g,'').toLowerCase(); }
function nfc(s){ try{ return String(s==null?'':s).normalize('NFC'); }catch(e){ return String(s==null?'':s); } }
function hayOf(p){
  if (p._hay == null){
    p._hay = nfc([p.title, p.field, p.status, p.inventor, p.regNo, p.appNo,
      (p.tags||[]).join(' '), p.summary||'',
      (p.features||[]).map(function(f){ return f.k+' '+f.v; }).join(' '),
      (p.applications||[]).map(function(a){ return a.title+' '+a.desc; }).join(' '),
      (p.comparison||[]).map(function(c){ return c.item; }).join(' ')
    ].join(' ')).toLowerCase();
  }
  return p._hay;
}
function dnum(d){ return (d||'').replace(/[^0-9]/g,''); }
function sortKey(p){ return dnum(p.status==='등록' && p.regDate ? p.regDate : p.appDate); }
function byId(id){ for(var i=0;i<DB.patents.length;i++) if(DB.patents[i].id===id) return DB.patents[i]; return null; }
function statusClass(s){ return s==='등록' ? 'b-reg' : 'b-app'; }
function loadPicked(){ try{ return JSON.parse(localStorage.getItem('smk.picked')||'[]'); }catch(e){ return []; } }
function savePicked(){ try{ localStorage.setItem('smk.picked', JSON.stringify(picked)); }catch(e){} }
function toast(msg){
  var old = document.querySelector('.toast'); if(old) old.remove();
  var t = document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 2800);
}

/* ---------- filter ---------- */
function filtered(){
  var q = nfc(ui.q).trim().toLowerCase(), qn = norm(ui.q);
  var out = DB.patents.filter(function(p){
    if (ui.field !== '전체' && p.field !== ui.field) return false;
    if (ui.status !== '전체' && p.status !== ui.status) return false;
    if (ui.smkOnly && p.lvl < 2) return false;
    if (!q) return true;
    if (hayOf(p).indexOf(q) >= 0) return true;
    if (qn && (norm(p.regNo).indexOf(qn)>=0 || norm(p.appNo).indexOf(qn)>=0)) return true;
    return false;
  });
  out.sort(function(a,b){
    if (ui.sort==='title') return a.title.localeCompare(b.title,'ko');
    if (ui.sort==='group'){
      var d = FIELDS.indexOf(a.field) - FIELDS.indexOf(b.field);
      if (d) return d;
    }
    return sortKey(b) > sortKey(a) ? 1 : -1;
  });
  return out;
}
function countBy(key,val){
  return DB.patents.filter(function(p){
    if (key==='field') return p.field===val && (ui.status==='전체'||p.status===ui.status);
    return p.status===val && (ui.field==='전체'||p.field===ui.field);
  }).length;
}

/* ---------- list ---------- */
function cardHTML(p){
  var on = picked.indexOf(p.id) >= 0;
  return '<article class="card">'
    + '<button class="open" data-act="open" data-v="'+esc(p.id)+'">'
      + '<span class="card-top"><span class="field-tag">'+esc(p.field)+'</span>'
      + '<span class="badge '+statusClass(p.status)+'">'+esc(p.status)+'</span>'
      + (p.lvl===3 ? '<span class="badge b-smk">SMK 전문</span>'
   : p.lvl===2 ? '<span class="badge b-smk">SMK</span>'
   : p.lvl===1 ? '<span class="badge b-sum">요약</span>' : '') + '</span>'
      + '<h3>'+esc(p.title)+'</h3>'
      + '<span class="nums">'
        + (p.regNo ? '<span>등록 <b class="mono">'+esc(p.regNo)+'</b> · '+esc(p.regDate)+'</span>' : '')
        + '<span>출원 <b class="mono">'+esc(p.appNo)+'</b> · '+esc(p.appDate)+'</span>'

      + '</span></button>'
    + '<div class="card-foot">'
      + '<button class="cardlink'+(p.summary?'':' none')+'" data-act="open" data-v="'+esc(p.id)+'">'
        + (p.summary ? 'SMK 열어보기 ›' : '서지정보 보기 ›') + '</button>'
      + '<button class="pickbtn" data-act="pick" data-v="'+esc(p.id)+'" aria-pressed="'+on+'">'
        + (on ? '✓ 담음' : '관심 담기') + '</button>'
    + '</div></article>';
}
var PER_FIELD = 6;
function groupMode(){ return ui.sort==='group' && ui.field==='전체'; }
function gridHTML(rows){
  if (!groupMode()) return rows.map(cardHTML).join('');
  var by = {}, order = [];
  rows.forEach(function(p){
    if (!by[p.field]){ by[p.field] = []; order.push(p.field); }
    by[p.field].push(p);
  });
  return order.map(function(f){
    var list = by[f];
    return '<h3 class="fieldhead">'+esc(f)+'<span>'+list.length+'건</span>'
      + (list.length > PER_FIELD
          ? '<button class="fieldmore" data-act="field" data-v="'+esc(f)+'">전체 보기 ›</button>' : '')
      + '</h3>'
      + list.slice(0, PER_FIELD).map(cardHTML).join('');
  }).join('');
}
function resultsHTML(){
  var rows = filtered();
  return '<div class="wrap">'
    + '<div class="resultbar"><span><b>'+rows.length+'</b>건'
    + (groupMode() ? ' · 분야별 최신 '+PER_FIELD+'건씩 표시'
        : rows.length>ui.limit ? ' 중 '+Math.min(ui.limit,rows.length)+'건 표시' : '')+'</span>'
    + '<span>'+esc(DB.meta.source)+'</span></div>'
    + (rows.length
        ? '<div class="grid">'+gridHTML(groupMode() ? rows : rows.slice(0,ui.limit))+'</div>'
          + (!groupMode() && rows.length > ui.limit
              ? '<div class="morerow"><button class="btn plain" data-act="more">더 보기 <span class="mono">'

    + '</div>';
}

    + '<h1 class="hero-t">보유특허 기술이전</h1>'
    + '<p class="hero-s">찾고. 열어보고. 바로 문의하세요.</p>'
    + '<p class="hero-d">특허번호나 연구분야로 검색하면 기술요약자료(SMK)를 그 자리에서 확인할 수 있습니다.</p>'
    + '<div class="ctarow"><button class="btn" data-act="scroll" data-v="search">특허 찾아보기</button>'
    + '<a class="chev" href="#contact" data-act="inquiry">기술이전 문의</a></div>'
    + '<div class="stats">'
      + '<div class="stat"><b>'+DB.patents.length+'</b><span>이전 가능 특허</span></div>'
      + '<div class="stat"><b>'+nReg+'</b><span>등록 완료</span></div>'
      + '<div class="stat"><b>'+nField+'</b><span>연구분야</span></div>'
      + '<div class="stat"><b>'+nFull+'</b><span>SMK 전문</span></div>'
    + '</div></div></section>';

  h += '<section class="sec alt tight" id="search"><div class="wrap">'
    + '<div class="searchwrap"><div class="searchbox">'
      + '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.2-4.2"/></svg>'
      + '<input id="q" type="search" placeholder="특허번호, 명칭, 발명자, 키워드" value="'+esc(ui.q)+'" autocomplete="off" aria-label="특허 검색">'
      + '<button class="clearbtn" data-act="clearq" aria-label="검색어 지우기"'+(ui.q?'':' hidden')+'>✕</button>'
    + '</div></div>'
    + '<div class="toolrow"><div class="chipgroup"><span class="chiplabel">분야</span>'
    + fields.map(function(f){
        var c = f==='전체'
          ? DB.patents.filter(function(p){ return ui.status==='전체'||p.status===ui.status; }).length
          : countBy('field',f);
        return '<button class="chip" data-act="field" data-v="'+esc(f)+'" aria-pressed="'+(ui.field===f)+'">'
          + esc(f)+'<span class="c">'+c+'</span></button>';
      }).join('')
    + '</div></div>'
    + '<div class="toolrow"><div class="chipgroup"><span class="chiplabel">상태</span>'
    + STATUSES.map(function(s){
        var c = s==='전체'
          ? DB.patents.filter(function(p){ return ui.field==='전체'||p.field===ui.field; }).length
          : countBy('status',s);
        if (c===0 && s!=='전체') return '';
        return '<button class="chip" data-act="status" data-v="'+esc(s)+'" aria-pressed="'+(ui.status===s)+'">'
          + esc(s)+'<span class="c">'+c+'</span></button>';
      }).join('')
    + '<button class="chip" data-act="smk" aria-pressed="'+ui.smkOnly+'">SMK 제공<span class="c">'+nSmk+'</span></button>'
    + '</div>'
    + '<select class="sortsel" id="sort" aria-label="정렬 기준">'
      + '<option value="group"'+(ui.sort==='group'?' selected':'')+'>분야별 최신순</option>'
      + '<option value="new"'+(ui.sort==='new'?' selected':'')+'>전체 최신순</option>'
      + '<option value="title"'+(ui.sort==='title'?' selected':'')+'>명칭순</option>'
    + '</select></div>'
    + '<p class="fieldnote">기술 개요·특징·효과·비교표·적용분야와 대표도면은 특허 공보 전문을 근거로 작성·추출했습니다. 시장 동향은 별도 조사분에 한해 표시됩니다. 분야는 산학협력단 보유기술 분류를 따르며, 해당 정보가 없는 건은 명칭 기준 자동 분류입니다.</p>'
    + '</div></section>';

  h += '<section class="sec" id="results">' + resultsHTML() + '</section>';

  return h + contactHTML() + footHTML();
}

/* ---------- detail ---------- */
function detailHTML(p){
  var on = picked.indexOf(p.id) >= 0;
  var h = navHTML();

  h += '<section class="dhero"><div class="wrap mid">'
    + (p.tags && p.tags.length ? '<p class="hashes">'+p.tags.map(function(t){ return '#'+esc(t); }).join('')+'</p>' : '')
    + '<h1>'+esc(p.title)+'</h1>'
    + '<div class="pills"><span class="pill">'+esc(p.field)+'</span>'
      + '<span class="pill">'+esc(p.status)+'</span>'
      + '<span class="pill">'+esc(p.transfer)+'</span></div>'
    + '<p class="num">'+(p.regNo ? '등록 '+esc(p.regNo)+' · ' : '')+'출원 '+esc(p.appNo)+'</p>'
    + '</div></section>';

  h += '<div class="wrap backrow"><button class="backbtn" data-act="home">‹ 보유특허 목록</button></div>';

  var figSrc = p.figure || (p.figFile ? (DB.meta.imgBase || 'img/') + p.figFile : '');

  h += '<section class="sec"><div class="wrap narrow center">'
    + '<h2 class="sec-t">'+(p.summary ? '기술 개요' : '지식재산권 현황')+'</h2>'
    + '<p class="sec-s" style="margin-bottom:34px">'+esc(p.field)+' · '+esc(p.status)+'</p>'
    + (p.summary ? '<p class="lead">'+esc(p.summary)+'</p>' : '')
    + '<dl class="spec">'
      + (p.regNo ? row('등록번호','<span class="mono">'+esc(p.regNo)+'</span> · '+esc(p.regDate)) : '')
      + row('출원번호','<span class="mono">'+esc(p.appNo)+'</span> · '+esc(p.appDate))
      + row('출원인', esc(p.applicant))
      + row('대표발명자', esc(p.inventor))
      + row('연구분야', esc(p.field))
      + row('희망 이전 유형', esc(p.transfer))
      + row('권리만료 예상일', esc(p.expiry))
    + '</dl></div></section>';

  if (figSrc){
    h += '<section class="figstage"><div class="wrap mid"><figure>'
      + '<img src="'+figSrc+'" alt="'+esc(p.title)+' 대표도면" loading="lazy">'
      + (p.figureCaption ? '<figcaption>'+esc(p.figureCaption)+'</figcaption>' : '')
      + '</figure></div></section>';
  }

  if (p.features && p.features.length){
    h += '<section class="sec"><div class="wrap mid center">'
      + '<h2 class="sec-t">특징 및 효과</h2>'
      + '<div class="fx" style="text-align:left">'
      + p.features.map(function(f){
          return '<div class="tilebox"><h3>'+esc(f.k)+'</h3><p>'+esc(f.v)+'</p></div>'; }).join('')
      + '</div>'
      + (p.lvl===2 ? '<div class="notice"><b>상세 분석자료 준비 중</b>'
          + '<span>기존 기술 대비 개선점과 기술 적용 분야는 준비 중입니다. '
          + '해당 자료가 필요하시면 아래에서 문의해 주세요.</span></div>' : '')
      + '</div></section>';
  } else {
    h += '<section class="sec"><div class="wrap mid center">'
      + '<div class="notice"><b>'+(p.summary ? '상세 분석자료 준비 중' : '기술요약자료(SMK) 준비 중')+'</b>'
      + '<span>'+(p.summary
          ? '기존 기술 대비 개선점, 적용 분야, 시장 동향 등 상세 분석은 준비 중입니다. 기술 내용이 더 궁금하시면 아래에서 문의해 주세요.'
          : '이 특허는 공보를 확보하지 못해 서지정보만 제공하고 있습니다. 기술 내용이 궁금하시면 아래에서 문의해 주세요. 담당자가 공보 자료와 함께 안내해 드립니다.')
      + '</span></div>'
      + '</div></section>';
  }

  if (p.comparison && p.comparison.length){
    h += '<section class="sec alt"><div class="wrap mid center">'
      + '<h2 class="sec-t">기존 기술 대비 개선점</h2>'
      + '<div class="cmp" style="text-align:left">'
      + '<div class="hd"><span>항목</span><span>기존 기술</span><span>개발 기술</span></div>'
      + p.comparison.map(function(c){
          return '<div class="rw"><span class="it">'+esc(c.item)+'</span>'
            + '<span class="old">'+esc(c.old)+'</span><span class="new">'+esc(c.new)+'</span></div>'; }).join('')
      + '</div></div></section>';
  }

  if (p.applications && p.applications.length){
    h += '<section class="sec"><div class="wrap center">'
      + '<h2 class="sec-t">기술 적용 분야</h2>'
      + '<div class="apps" style="text-align:left">'
      + p.applications.map(function(a){
          return '<div class="tilebox"><h3>'+esc(a.title)+'</h3><p>'+esc(a.desc)+'</p></div>'; }).join('')
      + '</div></div></section>';
  }

  if (!(p.markets && p.markets.length) && p.lvl === 3){
    h += '<section class="sec alt"><div class="wrap mid center">'
      + '<div class="notice"><b>시장 동향 조사 예정</b>'
      + '<span>이 기술이 속한 시장의 규모와 성장 전망은 별도 조사 후 추가될 예정입니다. '
      + '먼저 필요하시면 문의해 주세요.</span></div></div></section>';
  }
  if (p.markets && p.markets.length){
    h += '<section class="sec alt"><div class="wrap center">'
      + '<h2 class="sec-t">시장 동향</h2>'
      + '<p class="sec-s">'+esc(p.outlook)+'</p>'
      + '<div class="market" style="text-align:left">'
      + p.markets.map(function(m){
          return '<div class="tilebox"><h3>'+esc(m.title)+'</h3>'
            + '<div class="mfig">'
              + '<span><span class="v">'+esc(m.from.v)+'<small>'+esc(m.unit)+'</small></span>'
              + '<span class="yr"> '+esc(m.from.y)+'</span></span>'
              + '<span class="to">→</span>'
              + '<span><span class="v">'+esc(m.to.v)+'<small>'+esc(m.unit)+'</small></span>'
              + '<span class="yr"> '+esc(m.to.y)+'</span></span>'
            + '</div>'
            + '<span class="cagr">'+esc(m.cagr)+'</span>'
            + '<p class="note">'+esc(m.note)+'</p></div>'; }).join('')
      + '</div></div></section>';
  }

  h += '<section class="sec center"><div class="wrap mid">'
    + '<h2 class="sec-t">이 기술, 이전받고 싶으신가요?</h2>'
    + '<p class="sec-s">관심 특허로 담아두면 여러 건을 한 번에 문의할 수 있습니다.</p>'
    + '<div class="ctarow">'
      + '<button class="btn" data-act="pick" data-v="'+esc(p.id)+'">'+(on?'✓ 관심 특허에 담음':'관심 특허 담기')+'</button>'
      + (p.pdf
          ? '<a class="btn ghost" href="'+esc(p.pdf)+'" target="_blank" rel="noopener">SMK PDF 내려받기</a>'
          : '<button class="btn ghost" disabled>SMK PDF 준비 중</button>')
    + '</div></div></section>';

  return h + contactHTML() + footHTML();
}
function row(k,v){ return '<div class="row"><dt>'+esc(k)+'</dt><dd>'+v+'</dd></div>'; }

/* ---------- selection bar ---------- */
function selbarHTML(){
  if (!picked.length) return '';
  var names = picked.map(function(id){ var p=byId(id); return p?p.title:''; }).filter(Boolean);
  return '<div class="selbar">'
    + '<span class="t">관심 특허 <b>'+picked.length+'</b>건 · '+esc(names[0])+(names.length>1?' 외 '+(names.length-1)+'건':'')+'</span>'
    + '<button class="clr" data-act="clearpick">비우기</button>'
    + '<button class="btn sm" data-act="inquiry">문의하기</button></div>';
}
function renderSelbar(){
  var old = document.querySelector('.selbar'); if (old) old.remove();
  var html = selbarHTML();
  if (html){ var d=document.createElement('div'); d.innerHTML=html; document.body.appendChild(d.firstChild); }
}

/* ---------- inquiry ---------- */
function formURL(){
  var base = FORM_URL;
  if (!base) return '';
  var sep = base.indexOf('?')>=0 ? '&' : '?';
  var qs = ['usp=pp_url'];
  picked.forEach(function(id){
    var p = byId(id); if (!p) return;
    var label = (p.regNo || p.appNo) + ' ' + p.title;
    qs.push(FORM_ENTRY + '=' + encodeURIComponent(label));
  });
  return base + sep + qs.join('&');
}
function openInquiry(){
  var url = formURL();
  if (url){ window.open(url,'_blank','noopener'); return; }
  showModal();
}
function showModal(){
  var c = DB.meta.contact;
  var list = picked.length
    ? '<div class="picked">'+picked.map(function(id){
        var p=byId(id); return p ? '· '+esc((p.regNo||p.appNo)+' '+p.title) : ''; }).join('<br>')+'</div>'
    : '';
  var d = document.createElement('div');
  d.className = 'modal-bg'; d.setAttribute('data-act','closemodal');
  d.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-label="기술이전 문의">'
    + '<h3>기술이전 문의</h3>'
    + '<p>문의 폼 주소가 아직 연결되지 않았습니다. 아래 연락처로 문의해 주세요.</p>'
    + list
    + '<dl class="spec" style="margin-top:0">'
      + row('담당자', esc(c.manager))
      + row('연락처','<span class="mono">'+esc(c.tel)+'</span>')
      + row('이메일','<span class="mono">'+esc(c.email)+'</span>')
    + '</dl>'
    + '<div class="modal-actions" style="margin-top:22px">'
      + '<button class="btn sm plain" data-act="copy" data-v="'+esc(c.email)+'">이메일 복사</button>'
      + '<button class="btn sm" data-act="closemodal">닫기</button></div></div>';
  document.body.appendChild(d);
}

/* ---------- render ---------- */
function render(keepScroll){
  var y = window.scrollY;
  app.innerHTML = (ui.view==='detail' && ui.current) ? detailHTML(ui.current) : listHTML();
  renderSelbar();
  if (keepScroll) window.scrollTo(0,y); else window.scrollTo(0,0);
}
/* 검색어 입력 시에는 결과 영역만 바꾼다 — 입력창을 다시 만들지 않아야 한글 조합이 끊기지 않는다 */
function updateResults(){
  var box = document.getElementById('results');
  if (!box || ui.view==='detail'){ render(true); return; }
  box.innerHTML = resultsHTML();
  var c = document.querySelector('.clearbtn');
  if (c){ if (ui.q) c.removeAttribute('hidden'); else c.setAttribute('hidden',''); }
}
function go(view, p){
  ui.view = view; ui.current = p || null;
  try{ location.hash = (view==='detail' && p) ? p.id : ''; }catch(e){}
  render(false);
}

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]'); if (!t) return;
  var act = t.getAttribute('data-act'), v = t.getAttribute('data-v');

  if (act==='closemodal'){ if (e.target===t) { var m=document.querySelector('.modal-bg'); if(m) m.remove(); } return; }
  if (act==='home'){ e.preventDefault(); go('list'); return; }
  if (act==='open'){ var p=byId(v); if(p) go('detail',p); return; }
  if (act==='inquiry'){ e.preventDefault(); openInquiry(); return; }
  if (act==='scroll'){ var el=document.getElementById(v); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); return; }
  if (act==='field'){ ui.field=v; ui.limit=36; render(true); return; }
  if (act==='status'){ ui.status=v; ui.limit=36; render(true); return; }
  if (act==='smk'){ ui.smkOnly=!ui.smkOnly; ui.limit=36; render(true); return; }
  if (act==='more'){ ui.limit+=36; render(true); return; }
  if (act==='clearq'){
    ui.q=''; ui.limit=36;
    var qn0 = document.getElementById('q');
    if (qn0){ qn0.value=''; qn0.focus(); }
    updateResults(); return;
  }
  if (act==='pick'){
    var i = picked.indexOf(v);
    if (i>=0){ picked.splice(i,1); toast('관심 특허에서 뺐습니다'); }
    else { picked.push(v); toast('관심 특허에 담았습니다'); }
    savePicked(); render(true); return;
  }
  if (act==='clearpick'){ picked=[]; savePicked(); render(true); return; }
  if (act==='copy'){
    var val = v;
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(val).then(function(){ toast('복사했습니다 · '+val); },
        function(){ toast(val); });
    } else { toast(val); }
    return;
  }
});
var imeOn = false;
document.addEventListener('compositionstart', function(e){ if (e.target.id==='q') imeOn = true; });
document.addEventListener('compositionend', function(e){
  if (e.target.id!=='q') return;
  imeOn = false;
  ui.q = e.target.value; ui.limit = 36; updateResults();
});
document.addEventListener('input', function(e){
  if (e.target.id!=='q') return;
  if (imeOn || e.isComposing) return;   /* 한글 조합 중에는 건드리지 않는다 */
  ui.q = e.target.value; ui.limit = 36; updateResults();
});
document.addEventListener('change', function(e){
  if (e.target.id==='sort'){ ui.sort = e.target.value; render(true); }
});
window.addEventListener('hashchange', function(){
  var id = location.hash.replace('#','');
  var p = id ? byId(id) : null;
  if (p){ ui.view='detail'; ui.current=p; } else { ui.view='list'; ui.current=null; }
  render(false);
});

/* ---------- boot ---------- */
(function(){
  var id = location.hash.replace('#','');
  var p = id ? byId(id) : null;
  if (p){ ui.view='detail'; ui.current=p; }
  render(false);
})();
})();
</script>

</body>
</html>
