으로 발췌해 판독"},{"item":"설비 비용·구조","old":"복수 검사 장치 사용 시 영상 처리 설비 비용과 구조가 복잡","new":"카메라 1대 이동 방식으로 설비를 단순화하고 비용을 절감"}],"applications":[{"title":"대형 부품 외관 검사","desc":"면적이 큰 대형 검사 대상물의 외관 불량 여부를 이동 촬영으로 정밀하게 판독"},{"title":"비전 검사 자동화 설비","desc":"검사 지그에 고정한 대상물을 카메라 왕복 이동으로 촬영하는 자동 비전 검사 설비"},{"title":"영상 기반 불량 판독","desc":"획득한 영상에서 마커 위치 좌표로 대상물 위치를 산출해 불량을 판독하는 시스템"}],"figFile":"10-2020-0140133.jpg","figureCaption":"공보 대표도면"},{"id":"p1020210110295","title":"다중 스케일 초해상도 영상처리 시스템 및 방법","field":"소프트웨어","status":"등록","regNo":"10-2505932","regDate":"2023.02.27","appNo":"10-2021-0110295","appDate":"2021.08.20","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2041.08.20","inventor":"이규중","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 다중 스케일 초해상도(SR) 영상처리 시스템 및 방법에 관한 것으로, 저해상도 입력 영상을 딥 컨볼루션 신경망의 입력으로 이용해 미리 학습된 다층 컨볼루션 층을 통해 서로 다른 스케일의 고해상도 영상으로 변환한다. 기존 MDSR 등은 해상도 변환을 위한 서브픽셀 셔플 처리를 각 해상도별로 따로 수행해 파라미터 수와 연산량이 증가하는 단점이 있었는데, 이를 일괄적으로 처리할 수 있도록 개선하였다.","features":[{"k":"특징","v":"입력부, MDSR 알고리즘 기반 초해상도 처리부, 출력부, 제어부로 구성되며, 서브픽셀 셔플 처리 시 최고 배율의 제곱에 대한 특징맵으로 해당 배율의 업스케일링을 수행하고 나머지 배율에 대해서는 Z축에 대하여만 1D 바이큐빅 다운스케일을 수행하여 각 업스케일링 계수에 대한 처리를 일괄 수행한다."},{"k":"효과","v":"해상도별로 병렬 처리하던 방식에 비해 파라미터 수와 연산처리량이 감소하여, 높은 연산처리 능력과 많은 메모리가 요구되어 성능이 높아질수록 비용이 증가했던 기존 DCNN·잔류 CNN 기반 초해상도 장치의 문제점을 해결하고, 간단한 구성과 저렴한 비용으로 고성능·고품질 결과물을 얻을 수 있다."}],"lvl":3,"comparison":[{"item":"연산 처리 부담","old":"높은 연산처리 능력과 많은 메모리 용량이 요구됨","new":"서브픽셀 셔플 시 해상도를 일괄 처리해 연산량을 감소"},{"item":"파라미터 수","old":"해상도 스케일별로 처리해 파라미터 수가 많고 구성이 복잡","new":"각 해상도를 일괄 처리해 파라미터 수와 구성을 간소화"},{"item":"처리 속도·성능","old":"SR 처리의 속도 및 성능 향상에 한계가 있었음","new":"간단한 구성과 저렴한 비용으로 고성능·고품질 결과 획득"}],"applications":[{"title":"UHD 영상 업스케일링","desc":"HD로 제작된 기존 컨텐츠를 4K·8K UHD 화질로 변환하는 비디오 업스케일링 영상처리 분야"},{"title":"디스플레이 화질 개선","desc":"4K·8K 디스플레이에서 저해상도 입력 영상을 고해상도로 복원하는 화질 개선 처리 분야"},{"title":"초해상도 영상처리 모듈","desc":"컨볼루션 신경망 기반의 다중 스케일 초해상도 연산을 수행하는 영상처리 장치 및 방법"}],"figFile":"10-2021-0110295.jpg","figureCaption":"공보 대표도면"},{"id":"p1020170112136","title":"항균 활성을 가지는 크리신 유도체 및 이를 포함하는 항균용 조성물","field":"의료","status":"등록","regNo":"10-2504101","regDate":"2023.02.22","appNo":"10-2017-0112136","appDate":"2017.09.01","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2037.09.01","inventor":"김승영","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 항균 활성을 가지는 크리신 유도체 및 이를 포함하는 항균용 조성물에 관한 것으로, 플라보노이드인 크리신의 특정 위치에 글루코스 또는 인산이 결합된 유도체를 유효성분으로 한다. 메티실린 내성 황색포도상구균(MRSA)을 포함하는 스태필로코커스 속과 바실러스 속 미생물에 항균 활성을 나타내어 항생제 내성균 대응 소재로 활용될 수 있다. 미생물 생물전환으로 합성된 세 종류의 크리신 유도체가 확인되었다.","features":[{"k":"특징","v":"식용 미생물을 이용한 생물전환 방법으로 크리신에서 유도체를 합성하며, 페디오코커스, 락토바실러스, 바실러스 아밀로리쿼파시언스 균체 현탁액에 크리신을 넣고 30℃에서 48시간 배양한 뒤 HPLC와 LC-MS로 세 종류의 유도체를 확인했다."},{"k":"효과","v":"크리신 자체는 최소억제농도(MIC)가 128㎍/㎖ 이상으로 항균 활성이 거의 없으나 크리신 유도체는 MIC 0.5~128㎍/㎖ 범위의 항균 활성을 보였고, 특히 유도체 1은 메티실린 민감성 및 내성 황색포도상구균에 대해 현저히 우수한 항균 활성을 나타냈다."}],"lvl":3,"comparison":[{"item":"항균 성분 종류","old":"페니실린·메티실린 등 기존 항생제를 사용하였음","new":"크리신에 글루코스 또는 인산을 도입한 유도체 사용"},{"item":"내성균 대응","old":"메티실린 내성 황색포도상구균에 약효가 듣지 않음","new":"메티실린 내성 균주에 대해서도 항균 활성을 나타냄"},{"item":"항균 활성 수준","old":"모체 화합물 크리신의 항균 활성은 제한적이었음","new":"크리신과 비교해 항균 활성이 우수하게 향상됨"}],"applications":[{"title":"내성균 대응 항균제","desc":"메티실린 내성 황색포도상구균 등 항생제 내성 세균을 겨냥한 신규 항균제 개발에 적용"},{"title":"감염 질환 치료 의약품","desc":"항균 효과가 필요한 질병의 예방 또는 치료용 약학 조성물의 유효성분으로 활용"},{"title":"살균·보존제 소재","desc":"미생물의 발육과 생활 기능을 억제하는 살균제·방부제 조성의 유효성분으로 적용"}],"figFile":"10-2017-0112136.jpg","figureCaption":"공보 대표도면"},{"id":"p1020230014657","title":"자동변속 시스템 및 이를 포함하는 자전거","field":"생활","status":"공개","regNo":"","regDate":"","appNo":"10-2023-0014657","appDate":"2023.02.03","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2043.02.03","inventor":"이상헌","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 자전거의 자동변속 시스템 및 이를 포함하는 자전거에 관한 것으로, 자전거 체인링의 회전을 감지하는 회전감지장치와 드레일러를 작동시켜 변속을 수행하는 변속장치, 회전감지장치로부터 정보를 수집해 변속장치의 동작을 제어하는 제어부로 구성된다. 길의 경사나 거칠기, 속도에 따라 사용자가 자신의 감각에 의존해 변속을 결정하면서 적절하지 않은 기어로 변속되는 문제를 해결하려는 기술이다.","features":[{"k":"특징","v":"체인링에 부착된 자석형 피감지부재를 자성감지센서가 읽어 1회전 소요 시간을 산출하고, 제어부가 이를 기준시간과 비교해 기준보다 짧으면 고단, 길면 저단으로 변속장치의 모터를 구동하며, 지연시간을 두어 신호 노이즈를 제거한다."},{"k":"효과","v":"속도나 길의 상태에 적합하도록 자동으로 변속이 이루어져 정확한 변속을 수행할 수 있고, 기존 자전거의 드레일러에 자동변속 시스템을 손쉽게 부착할 수 있어 별도의 개조 없이 자동변속 기능을 적용할 수 있다."}],"lvl":3,"comparison":[{"item":"변속 결정 방식","old":"경사·거칠기·속도를 사용자 감각에 의존해 변속을 결정","new":"체인링 1회전 소요 시간을 기준시간과 비교해 자동 결정"},{"item":"변속 적절성","old":"감각에 의존해 적절하지 않은 기어로 변속되는 문제가 있음","new":"소요 시간이 짧으면 고단, 길면 저단으로 상황에 맞춰 변속"},{"item":"변속 조작 방식","old":"변속스위치로 케이블을 당겨 수동으로 단을 조절함","new":"제어부가 변속장치로 드레일러를 작동시켜 자동 변속함"}],"applications":[{"title":"자전거 자동변속 시스템","desc":"체인링 회전 정보를 제어부가 판단해 드레일러를 작동시키는 자동변속 시스템"},{"title":"체인링 회전감지장치","desc":"자전거 체인링의 1회전 소요 시간을 감지해 변속 판단 정보를 제공하는 센서"},{"title":"기존 자전거 부착 키트","desc":"기존 자전거에 회전감지장치와 변속장치를 손쉽게 부착하는 자동변속 개조 키트"}],"figFile":"10-2023-0014657.jpg","figureCaption":"공보 대표도면"},{"id":"p1020200136682","title":"진피 추출물을 포함하는 자궁경부암 치료용 조성물","field":"의료","status":"등록","regNo":"10-2496331","regDate":"2023.02.01","appNo":"10-2020-0136682","appDate":"2020.10.21","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2040.10.21","inventor":"정혜진","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 진피(Citrus unshiu Markovich peel) 추출물을 유효성분으로 포함하는 자궁경부암 치료·예방용 약학적 조성물 및 예방·개선용 식품 조성물에 관한 것이다. 자궁경부암은 전세계 여성에서 두 번째로 흔한 암이지만 진행성 환자는 재발, 전이, 방사선·화학요법 내성으로 치료가 어려워 유망한 항암제 발굴이 필요하다는 점에 착안했다. 진피는 소화촉진 등 효능이 보고되었으나 자궁경부암 치료 용도는 공개된 바 없다.","features":[{"k":"특징","v":"진피를 에탄올로 추출한 뒤 클로로포름과 증류수 1:1로 분배해 얻은 비수용성 분획물(CECU)을 유효성분으로 하며, 헤스페리딘과 헤스페레틴을 포함한다. 이 조성물은 AKT·ERK 인산화를 하향 조절하고 p53·p21을 상향, 사이클린 B1·D1을 하향 조절하며 사멸 수용체 및 미토콘드리아 경로를 함께 활성화한다."},{"k":"효과","v":"암세포의 증식 및 전이를 억제하고 G2/M기 정지와 활성산소 비의존적 아포토시스를 유발하며, 종양구 형성과 Sox2, Nanog, Oct4, ALDH1A1, integrin a6, CD133 등 암줄기세포 마커 발현을 억제한다. 자궁경부암 세포주에 대해 정상 세포보다 더 민감하게 작용해 관련 의약 및 건강식품 분야에 활용될 수 있다."}],"lvl":3,"comparison":[{"item":"항암 치료 소재","old":"방사선 및 화학 요법에 의존해 진행성 자궁경부암을 치료","new":"진피 추출물 비수용성 분획물을 유효성분으로 하는 조성물"},{"item":"내성·재발 대응","old":"재발과 전이, 방사선·화학 요법 내성으로 치료가 어려움","new":"종양구 형성과 암줄기세포 마커 발현을 억제해 내성에 대응"},{"item":"세포 수준 작용 기전","old":"E6·E7 발현으로 아포토시스 회피와 세포 증식이 지속됨","new":"G2/M기 정지와 ROS 비의존 아포토시스를 유발해 증식 억제"}],"applications":[{"title":"자궁경부암 치료 조성물","desc":"진피 추출물을 유효성분으로 포함해 자궁경부암을 치료 또는 예방하는 약학적 조성물"},{"title":"암줄기세포 표적 소재","desc":"Sox2, Nanog, Oct4 등 암줄기세포 마커 발현을 억제하는 천연물 유래 항암 소재"},{"title":"건강식품 기능성 원료","desc":"자궁경부암 예방 또는 개선을 목적으로 하는 식품 조성물의 기능성 원료로 활용"}],"figFile":"10-2020-0136682.jpg","figureCaption":"공보 대표도면"},{"id":"p1020230007905","title":"현미 호분 추출물을 유효성분으로 포함하는 비만 및 당뇨의 개선, 예방 또는 치료용 조성물","field":"의료","status":"공개","regNo":"","regDate":"","appNo":"10-2023-0007905","appDate":"2023.01.19","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2043.01.19","inventor":"김진우","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 현미 호분 초음파 추출물을 유효성분으로 포함하는 비만 및 당뇨의 개선, 예방 또는 치료용 조성물에 관한 것으로, 쌀을 백미로 도정하는 과정에서 미강과 함께 제거되어 대부분 폐기되는 호분을 초음파로 추출해 활용한다. 호분 대신 미강이나 과피, 종피를 사용하는 경우에는 효과가 없거나 현저히 낮으며, 수득된 추출물은 약학 조성물과 식품 조성물, 건강기능식품으로 활용할 수 있다.","features":[{"k":"특징","v":"미강에서 분리한 호분을 물 또는 저급알코올 수용액과 혼합해 20~50 kHz 진동수와 50~700 W 파워의 초음파기로 40~90 ℃에서 5~60분 처리해 추출하며, 열수나 용매, 침지 추출 대비 유효성분 추출량과 효능이 높다."},{"k":"효과","v":"추출물이 리파아제와 알파글루코시다아제 억제 활성에서 orlistat 및 acarbose와 유사한 수준을 보이고, 농도 의존적으로 항당뇨 유전자와 단백질 발현을 증가시키며, 폐기되던 호분을 재활용해 처리비용도 줄일 수 있다."}],"lvl":3,"comparison":[{"item":"미강 활용 방식","old":"소재화가 어려워 쌀 도정 부산물인 미강이 대부분 동물사료로 쓰임","new":"현미 호분을 초음파 추출해 기능성 조성물 원료로 소재화함"},{"item":"소재 안정성","old":"지방 함량이 높아 lipase 산패로 미강 품질이 빨리 저하됨","new":"호분만 분리해 초음파 추출물 형태로 유효성분을 확보함"},{"item":"소재의 기대 용도","old":"항변비·피로회복 등 일반 영양 성분으로만 활용됨","new":"비만과 당뇨의 개선·예방·치료용 조성물로 활용함"}],"applications":[{"title":"당뇨 개선 기능성 식품","desc":"현미 호분 초음파 추출물을 함유해 당뇨의 개선과 예방을 돕는 기능성 식품"},{"title":"비만 예방 약학 조성물","desc":"현미 호분 추출물을 유효성분으로 하는 비만 예방 또는 치료용 약학 조성물"},{"title":"미강 부산물 고부가가치화","desc":"쌀 도정 부산물인 미강에서 호분을 분리해 식품·의약용 소재로 전환하는 활용"}],"figFile":"10-2023-0007905.jpg","figureCaption":"공보 대표도면"},{"id":"p1020230006994","title":"다층 구조를 갖는 다수 개의 홀 가공용 절삭유 주유 장치 및 이를 이용한 마이크로 홀 가공 방법","field":"기계","status":"공개","regNo":"","regDate":"","appNo":"10-2023-0006994","appDate":"2023.01.17","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2043.01.17","inventor":"이현섭","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 섬유 제조용 방사 노즐에 형성된 다층 구조의 다수 개 마이크로 홀을 가공할 때 필요한 절삭유를 정량으로 적소에 공급하는 주유 장치 및 이를 이용한 마이크로 홀 가공 방법에 관한 것으로, 스핀들에 연장 브라켓으로 장착된 주유기와 절삭유 탱크, 주유 제어기, 에어 콤프레셔, CNC 제어기로 구성된다. 직경 2mm에 깊이 20~25mm인 깊은 유입공 바닥까지 절삭유가 공급되지 않아 마이크로 드릴이 파손되는 문제를 해결한다.","features":[{"k":"특징","v":"CNC 제어기의 좌표 명령에 따라 주유기 니들이 각 유입공 중심에 위치해 하강하고, 주유 제어기가 에어 펄스 신호로 토출량을 제어해 절삭유를 정량 주입하며, 센터 가공과 유입공 가공, 절삭유 주입, 마이크로 홀 가공, 에어 니들을 이용한 절삭유 및 칩 제거 순으로 진행된다."},{"k":"효과","v":"절삭유를 적소에 정량 공급해 오일 낭비를 줄이면서 가공부위의 냉각 및 윤활 성능을 높여 마이크로 관통홀의 품질을 개선하고, 수작업 대비 주입량 편차와 미주유 홀을 없애 가공 시간을 대폭 단축할 수 있다."}],"lvl":3,"comparison":[{"item":"절삭유 공급 방식","old":"강제 송풍이나 작업자 수작업으로 유입공에 절삭유를 주유","new":"스핀들 축에 장착된 주유기 니들을 하강시켜 정량 공급"},{"item":"주유 정확성","old":"깊은 유입공 바닥까지 절삭유가 충분히 전달되지 않음","new":"니들이 유입공 내부로 내려가 적소에 정량의 절삭유를 공급"},{"item":"작업 시간·누락","old":"수천 개 홀을 수작업 주유해 시간이 길고 누락 홀이 발생","new":"주유를 자동화해 작업 시간을 줄이고 주유 누락을 방지함"}],"applications":[{"title":"섬유 방사 노즐 가공","desc":"수백~수천 개의 다층 관통홀을 갖는 섬유 제조용 방사 노즐의 홀 가공 공정"},{"title":"마이크로 홀 정밀가공","desc":"직경 0.2mm급 마이크로 홀을 마이크로 드릴로 가공하는 정밀 절삭 공정"},{"title":"CNC 밀링 주유 장치","desc":"CNC 밀링머신 스핀들 축에 장착해 절삭유를 정량 공급하는 주유 부속 장치"}],"figFile":"10-2023-0006994.jpg","figureCaption":"공보 대표도면"},{"id":"p1020200140138","title":"인공 지능 기반 영상 처리 장치","field":"소프트웨어","status":"등록","regNo":"10-2487033","regDate":"2023.01.05","appNo":"10-2020-0140138","appDate":"2020.10.27","applicant":"주식회사 미르메이트","coApplicant":false,"expiry":"2040.10.27","inventor":"고국원","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 인공지능에 기반하여 방문객의 영상을 처리하는 장치에 관한 것으로, 관광지나 행사장 출입구에서 방문객의 신원 정보와 얼굴 이미지를 사전 등록하고 현장 감시 카메라가 획득한 영상과 비교해 특정 인물을 찾아낸다. 바이러스 감염자가 발생하면 해당자와 같은 시간대·장소에 있던 주변 접촉자까지 신속히 파악해 대처할 수 있도록 구성된다. 방문객 등록부와 얼굴 인식부, 영상 처리부를 하나로 결합한 인공지능 기반 비전 검사 장치에 해당한다.","features":[{"k":"특징","v":"방문객 등록부와, 카메라부·저장부·매칭부·인증부로 이루어진 얼굴 인식부, 상시 촬영 감시 카메라부와 비접촉식 온도 측정부를 갖춘 처리부로 구성되며, 얼굴 매칭율 70% 이상은 매칭 성공, 50~70%는 재매칭으로 판정하고 시간별 픽셀 변화로 이동 물체를 추출한다."},{"k":"효과","v":"확진자의 신원 정보와 동선, 주변 접촉자를 신속·정확하게 파악해 감염 확산을 최소화할 수 있다. 또한 방문자 자동 등록과 수 집계, 체온 측정, 방문자 데이터 축적을 통해 빅데이터 기반의 지능적이고 효율적인 관광지 운영과 정보 관리를 지원한다."}],"lvl":3,"comparison":[{"item":"감염 경로 추적","old":"관광지나 행사장에서 감염 경로를 추적하기 어려운 문제","new":"등록된 얼굴 이미지와 현장 영상을 대조해 해당자를 파악"},{"item":"체온 이상 대응","old":"체온 이상자 발생 시 신원과 접촉자 확인 수단이 없음","new":"온도 측정부가 특정 온도 이상 감지 시 얼굴 매칭을 수행"},{"item":"영상 처리 방식","old":"정형화된 프로그램으로 현장 영상을 단순 감시하는 수준","new":"인공 지능 기반 처리부가 방문객 영상을 상시 비교 처리함"}],"applications":[{"title":"관광지 출입 영상 처리","desc":"관광지 출입 시 방문객 신원과 얼굴을 등록하고 현장 영상을 처리하는 장치"},{"title":"행사장 접촉자 파악","desc":"행사장에서 이벤트 발생 시 기 등록된 방문객 리스트와 대조해 접촉자를 파악"},{"title":"체온 측정 감시 시스템","desc":"온도 측정부로 특정 온도 이상을 감지하고 등록 얼굴 이미지와 매칭하는 시스템"}],"figFile":"10-2020-0140138.jpg","figureCaption":"공보 대표도면"},{"id":"p1020200109019","title":"구멍갈파래 추출물을 포함하는 비만의 개선, 예방 또는 치료용 조성물","field":"의료","status":"등록","regNo":"10-2485676","regDate":"2023.01.03","appNo":"10-2020-0109019","appDate":"2020.08.28","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2040.08.28","inventor":"김진우","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 구멍갈파래(Ulva pertusa Kjellman) 초음파 추출물을 유효성분으로 포함하는 비만의 개선·예방 또는 치료용 조성물에 관한 것으로, 약학 조성물과 식품 조성물로 제공된다. 아울러 반응표면분석법을 이용해 항비만 활성이 최적화된 구멍갈파래 초음파 추출물의 제조방법을 함께 제시한다.","features":[{"k":"특징","v":"구멍갈파래를 물 또는 저급알코올 혼합용매 중에서 20~50kHz, 50~700W의 초음파기로 20~85℃에서 5~30분간 추출하며, 총 플라보노이드 함량과 리파아제·α-글루코시다아제 활성 억제능의 2차 회귀식을 겹치기기법으로 분석해 추출시간 14.6분, 추출온도 56.3℃, 에탄올 50부피%를 공통 최적 조건으로 도출하였다."},{"k":"효과","v":"최적 조건의 추출물은 리파아제 활성 억제능 61.47%, α-글루코시다아제 활성 억제능 87.36%를 나타내어 초음파를 거치지 않은 에탄올·메탄올 추출물보다 월등하며, 비만과 이로 인해 유발되는 질환의 개선·예방에 건강기능식품 또는 약학 조성물로 활용될 수 있다."}],"lvl":3,"comparison":[{"item":"비만 치료 소재","old":"식욕억제제·흡수억제제 등 합성 비만치료제를 사용하였다","new":"구멍갈파래 초음파 추출물을 유효성분으로 포함한다"},{"item":"장기 섭취 부담","old":"장시간 섭취 시 무기력증과 성격변화 문제가 발생하였다","new":"천연물질 추출물을 이용해 비만 개선·예방·치료에 쓴다"},{"item":"활성 평가 지표","old":"식욕억제제, 대사항진제, 흡수억제제 등으로 유형이 나뉘었다","new":"리파아제와 α-글루코시다아제 활성 억제능을 함께 나타낸다"}],"applications":[{"title":"항비만 건강기능식품","desc":"구멍갈파래 초음파 추출물을 포함하는 비만 개선·예방용 식품 조성물로 활용한다"},{"title":"비만 치료 약학 조성물","desc":"천연물 유래 유효성분으로 비만의 예방 또는 치료용 약학 조성물을 개발하는 데 쓴다"},{"title":"해조류 추출 공정 최적화","desc":"반응표면분석법으로 추출 시간, 온도, 용매 농도의 최적 조건을 도출해 적용한다"}],"figFile":"10-2020-0109019.jpg","figureCaption":"공보 대표도면"},{"id":"p1020220189309","title":"김 추출물 또는 이의 생물전환물을 포함하는 간 기능 개선용 조성물","field":"의료","status":"공개","regNo":"","regDate":"","appNo":"10-2022-0189309","appDate":"2022.12.29","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2042.12.29","inventor":"김진우","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 김 추출물 또는 이의 생물전환물을 포함하는 간 기능 개선용 조성물에 관한 것으로, 김 원초를 마이크로파로 추출한 에탄올 추출물과 이를 미생물로 발효한 발효물을 유효성분으로 한다. 숙취 해소, 간 세포 보호, 알코올성 간 손상 보호 및 간독성 물질에 의한 간 손상 보호 용도의 조성물과 식품으로 제공된다.","features":[{"k":"특징","v":"마이크로파 출력 350~400W, 추출 온도 55~60℃, 에탄올 농도 40~60% 조건에서 김 원초의 폴리페놀·플라보노이드와 라디칼 소거능을 동시에 최대화하는 최적 추출을 수행하고, 바실러스 테퀼엔시스 SM18(기탁번호 BP1429751)로 발효해 주요 성분을 저분자화·증진시킨다."},{"k":"효과","v":"마이크로파 추출로 추출 시간을 줄이면서 생리활성물질을 최대화할 수 있고, 간세포에서 알코올 분해 효소인 ADH와 ALDH 발현을 높이고 TGF-β를 낮춤으로써 숙취 해소와 간세포 보호 효과를 기대할 수 있어 천연물 유래 간 기능 개선 소재로 활용 가능하다."}],"lvl":3,"comparison":[{"item":"유효성분 형태","old":"카테킨·플로로타닌이 배당체형으로 존재해 생체 이용률이 낮음","new":"김 추출물을 발효해 생물전환시킨 형태로 유효성분을 제공"},{"item":"주요 기대 효능","old":"김 성분의 항염·항균 등 일반적 생리활성 효능에 국한","new":"숙취 해소와 알코올성·간독성 손상 보호 등 간 기능 개선"},{"item":"소재 상품화","old":"김 기반 기능성 식품의 체계적 상품화 연구가 부족한 상황","new":"김 추출물과 발효물을 간 기능 개선용 조성물·식품으로 제품화"}],"applications":[{"title":"숙취 해소 건강기능식품","desc":"김 추출물 또는 발효물을 배합해 혈중 알코올 농도 감소를 돕는 숙취 해소 제품"},{"title":"간 기능 개선 소재","desc":"간 세포 보호와 알코올성 간 손상 보호를 목적으로 하는 기능성 원료 소재"},{"title":"해조류 활용 식품 개발","desc":"김이라는 어업자원을 원료로 간 기능 개선 식품을 개발하는 수산 소재 분야"}],"figFile":"10-2022-0189309.jpg","figureCaption":"공보 대표도면"},{"id":"p1020220187783","title":"태양광 발전 효율 향상을 위한 태양전지 모듈의 모니터링 시스템 및 방법","field":"전기·전자","status":"공개","regNo":"","regDate":"","appNo":"10-2022-0187783","appDate":"2022.12.28","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2042.12.28","inventor":"이용민","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 태양광 발전 효율 향상을 위한 태양전지 모듈 모니터링 시스템 및 방법에 관한 것으로, 다수의 태양전지 모듈마다 상태 측정부를 설치해 전압·전류·온도 및 전후방 이미지 데이터를 수집한다. 수집된 데이터를 모니터링 서버가 AI로 분석해 모듈별 성능 분석 결과를 사용자 단말에 실시간 제공하고, 이상 상태가 확인되면 해당 모듈에 대한 알람 신호를 생성해 전달한다.","features":[{"k":"특징","v":"모듈별 계측기와 전후방 카메라로 얻은 전압·전류·온도·이미지 데이터를 유무선 통신부를 통해 서버로 보내고, 동일 항목과 성능 분석 결과로 기계 학습된 인공신경망에 입력해 모듈별 성능을 판정한 뒤 이상 모듈에 대해 알람 데이터를 생성한다."},{"k":"효과","v":"태양전지 모듈의 상태를 모듈 단위로 객관적이고 정밀하게 분석해 제공하므로 상태 측정 정밀도가 높고, 문제가 발생한 모듈을 정확히 인지할 수 있어 신속한 후속 조치와 발전 효율 향상이 가능하다."}],"lvl":3,"comparison":[{"item":"고장 진단 범위","old":"누설 전류 발생, 과열 등 특정 문제에 한해서만 원인 분석 가능","new":"전압·전류·온도·전후방 이미지를 함께 측정해 모듈별로 진단"},{"item":"상태 분석 방식","old":"고장 여부의 즉각 검출에 그쳐 모듈별 성능 분석은 어려움","new":"측정 데이터로 기계 학습된 인공신경망이 모듈별 성능을 분석"},{"item":"결과 제공 방식","old":"검출 결과 통보 중심으로 모듈별 성능 정보 제공이 제한적","new":"성능 분석 결과를 실시간 제공하고 이상 시 알람 신호를 전송"}],"applications":[{"title":"태양광 발전소 운영 관리","desc":"다수 태양전지 모듈의 전압·전류·온도를 모듈별로 측정해 발전 설비를 실시간 관리"},{"title":"태양전지 모듈 고장 진단","desc":"전후방 이미지와 전기적 데이터를 인공신경망으로 분석해 이상 상태 모듈을 선별하는 진단 서비스"},{"title":"발전 설비 원격 모니터링 플랫폼","desc":"유·무선 통신부로 측정 데이터를 서버에 모으고 사용자 단말에 분석 결과와 알람을 제공"}],"figFile":"10-2022-0187783.jpg","figureCaption":"공보 대표도면"},{"id":"p1020210014991","title":"파리풀 캘러스 추출물의 바이오리노베이션에 의한 미백 조성물의 제조 방법","field":"바이오","status":"등록","regNo":"10-2481735","regDate":"2022.12.22","appNo":"10-2021-0014991","appDate":"2021.02.02","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2041.02.02","inventor":"김승영","transfer":"매매 · 라이센스","smk":false,"summary":"본 발명은 파리풀 캘러스 추출물의 바이오리노베이션에 의한 미백 조성물의 제조 방법에 관한 것으로, 천연물인 파리풀 캘러스의 미생물에 의한 생물전환을 통해 B16F10 흑색종 세포의 활성화를 억제(사멸, 공격성 완화 포함)시키고 멜라닌 합성을 저해하는 반응물을 생성함으로써 피부의 안정성을 높이고 부작용을 감소시키며 피부 미백에 도움을 주는 것을 목적으로 한다.","brief":true,"lvl":1},{"id":"p1020200175716","title":"소형 전기차","field":"건설","status":"등록","regNo":"10-2479189","regDate":"2022.12.19","appNo":"10-2020-0175716","appDate":"2020.12.15","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2040.12.15","inventor":"이경순","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 모터로 주행하는 소형 전기차에 관한 것으로, 화석연료 자동차의 샤시를 공유하는 대신 전기차에 특화된 샤시 및 구동부 체결 구조를 제시한다. 구동력을 제공하는 모터와 변속기로 이루어진 구동부, 변속기 양측에 연결되는 한 쌍의 등속 조인트, 각 등속 조인트에 연결되는 바퀴, 바퀴를 샤시에 연결하는 서스펜션을 포함한다. 적은 인원을 태우거나 소량 화물을 배달하는 용도에 최적화된 경량 전기차 구조이다.","features":[{"k":"특징","v":"모터·변속기·바퀴의 회전축을 모두 제1 축을 따라 서로 평행하게 배열하고, 구동부는 제1·제2 서브 프레임으로 샤시에 연결하며, 보강판과 수평 브라켓 사이에 댐퍼를 삽입하고 샤시는 연장봉이 육면체를 이루는 늑골 구조로 구성한다."},{"k":"효과","v":"평행축 구조로 유니버설 조인트를 생략하고 등속 조인트의 회동 각도 범위를 최소화해 부품 교환 주기를 늘릴 수 있다. 서브 프레임 분리만으로 구동부 유지 보수와 샤시 간 호환이 가능해 경량화와 함께 다품종 소량 생산에 적합한 설계 가변성을 확보한다."}],"lvl":3,"comparison":[{"item":"샤시 플랫폼","old":"화석연료 자동차의 샤시를 그대로 공유해 전기차에 적용","new":"전기차 특성에 맞춘 독자 샤시와 구동부 체결 구조를 설계"},{"item":"구동축 배치","old":"화석 연료차 설계를 따라 경량화와 무게 중심 배분이 불리","new":"모터·변속기·바퀴 회전축을 평행 배치해 강성과 경량화 확보"},{"item":"샤시 구조·생산성","old":"복잡한 형상의 모노코크 샤시로 대량 생산에 치우침","new":"연장봉이 육면체를 이루는 늑골 구조로 소량 생산에 대응"}],"applications":[{"title":"소형 전기차 샤시 플랫폼","desc":"모터로 주행하는 소형 전기차에 특화된 전용 샤시와 구동부 체결 구조 플랫폼"},{"title":"구동부 모듈 호환 설계","desc":"서브 프레임 형상만 변경해 다른 샤시에 동일 구동부를 장착하는 모듈 설계"},{"title":"다품종 소량 생산 차량","desc":"크기와 길이, 하중, 형상에 설계 가변성이 필요한 소량 생산 전기차 제작"}],"figFile":"10-2020-0175716.jpg","figureCaption":"공보 대표도면"},{"id":"p1020200137473","title":"진세노사이드 화합물 K의 함량이 증가된 발효 홍삼의 제조방법 및 이에 따른 발효 홍삼","field":"식품","status":"등록","regNo":"10-2479410","regDate":"2022.12.15","appNo":"10-2020-0137473","appDate":"2020.10.22","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2040.10.22","inventor":"서희재","transfer":"매매 · 라이센스","smk":false,"summary":"본 발명은 사포닌에 대해 생물전환능을 갖는 락토바실러스 펜토서스 KK18 균주를 이용하여 진세노사이드 화합물 K의 함량이 증가된 발효 홍삼을 제조하는 방법 및 이에 따른 발효 홍삼에 관한 것이다. 본 발명의 락토바실러스 펜토서스 균주는 식품학적으로 안전하고, 홍삼에 함유된 사포닌을 홍삼에는 미량으로만 존재하는 진세노사이드 화합물 K 및 F2로 생물전환시키는 능력이 뛰어나다. 특히, 진세노사이드 화합물 K의 함량이 현저히 증가한 발효 홍삼을 제조할 수 있게 한다. 본 발명의 발효 홍삼은 체내 흡수가 용이한 화합물 K를 다량 함유하고 있으므로, 건강기능식품 또는 식품 소재로 매우 유용하다.","brief":true,"lvl":1},{"id":"p1020200098682","title":"괭생이모자반 초음파 추출물을 유효성분으로 포함하는 조성물","field":"식품","status":"등록","regNo":"10-2479408","regDate":"2022.12.15","appNo":"10-2020-0098682","appDate":"2020.08.06","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2040.08.06","inventor":"김진우","transfer":"매매 · 라이센스","smk":false,"summary":"본 발명은 괭생이모자반 추출물을 유효성분으로 포함하는 화장료 조성물에 관한 것으로 괭생이모자반을 유효성분으로 포함함으로써, 항산화 효과가 우수하며, 피부 미백 및 피부 주름의 개선에 효과가 있다.","brief":true,"lvl":1},{"id":"p1020200117700","title":"연료전지용 전자 전달 증대장치 및 그 방법","field":"전기·전자","status":"등록","regNo":"10-2472813","regDate":"2022.11.28","appNo":"10-2020-0117700","appDate":"2020.09.14","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2040.09.14","inventor":"김학수","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 PWM 제어와 DC-DC 변환을 이용한 연료전지용 전자 전달 증대장치 및 그 방법에 관한 것으로, 연료전지로부터 DC 입력전압을 받는 전원 입력부와 이를 승압하는 1차 DC/DC 컨버터 출력부, 부하 정격에 맞춰 강압하는 2차 DC/DC 컨버터 출력부로 구성된다. 고분자 전해질 연료전지가 부하변동·온도변화·수소잔존량에 따라 전압 변동률이 30%에 이르고 저항·활성화·확산 분극 등 내부 손실로 효율이 저하되는 문제를 해결하고자 한다.","features":[{"k":"특징","v":"1차 및 2차 컨버터는 각각 커패시터, 인덕터, 병렬 FET 스위치, 정류 다이오드로 구성되고, 입력단과 출력단의 전압분압회로로 검출한 전압값을 제1·제2 PWM 제어부가 받아 펄스폭 변조 듀티 사이클을 조정해 FET 스위칭을 제어한다. 이를 통해 1차에서 40~50V로 승압하고 2차에서 12~24V로 안정 강압한다."},{"k":"효과","v":"승압과 강압을 반복해 부하보다 높은 전류를 사용함으로써 연료극에 공급된 수소에서 발생한 전자의 전달을 증대시켜 에너지 손실을 최소화하고 연료전지의 출력효율 최적화를 유도한다. 입력전압이 낮거나 불안정할 때도 컨버터 출력이 정격전압을 유지하므로 연료전지 전원을 안정적으로 부하측에 공급할 수 있다."}],"lvl":3,"comparison":[{"item":"전력 변환 구성","old":"단일 DC-DC 컨버터로 연료전지 출력전압을 변환하는 구성","new":"승압 1차와 2차 DC/DC 컨버터를 직렬 연결한 2단 구성"},{"item":"출력 전압 안정성","old":"온도·수소잔존량과 부하 변동으로 출력전압 레벨이 불안정","new":"입력·출력 전압을 검출해 PWM 듀티를 조정하여 정격 유지"},{"item":"전자 이동·효율","old":"저항·활성화·확산 분극 등 내부 손실로 효율이 저하됨","new":"승압·강압 반복으로 전류를 끌어와 연료전지 전자 이동 증대"}],"applications":[{"title":"고분자 전해질 연료전지","desc":"PEMFC 스택 출력의 전압 변동을 보상해 부하측에 안정적인 전력을 공급하는 전원 장치"},{"title":"연료전지 전력변환장치","desc":"발전용 및 주거·상업용 연료전지 시스템에 들어가는 DC-DC 컨버터와 출력 제어 모듈"},{"title":"수송·휴대용 연료전지","desc":"수송용 및 휴대용 연료전지 기기에서 기동 시 전압과 부하 변동에 대응하는 전원부"}],"figFile":"10-2020-0117700.jpg","figureCaption":"공보 대표도면"},{"id":"p1020200078459","title":"베르바민 및 아르사이리아플라빈 A를 포함하는 뇌암 치료, 개선 또는 예방용 조성물","field":"바이오","status":"등록","regNo":"10-2471741","regDate":"2022.11.23","appNo":"10-2020-0078459","appDate":"2020.06.26","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2040.06.26","inventor":"정혜진","transfer":"매매 · 라이센스","smk":false,"summary":"본 발명은 화학적 합성치사 상호작용(chemical synthetic lethality)을 나타내는 뇌암 치료용 조성물 등에 관한 것으로, 베르바민 및 아르사이리아플라빈 A 병용투여는 개별 성분과 비교해 암줄기 유사세포에 대한 상승적인 합성치사 상호작용이 있으며, 신경구체 형성도 현저하게 억제하며, 전이능력 억제 활성 역시 우수한 결과를 보이고 있는바 뇌암 치료, 예방 또는 개선 용도로 유용하게 이용될 수 있다.","brief":true,"lvl":1},{"id":"p1020200164483","title":"수평 유지 장치 및 이러한 수평 유지 장치를 구비한 무인 반송 차량","field":"기계","status":"등록","regNo":"10-2470312","regDate":"2022.11.21","appNo":"10-2020-0164483","appDate":"2020.11.30","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2040.11.30","inventor":"이지연","transfer":"매매 · 라이센스","smk":false,"summary":"본 발명은 경사로에서 각종 물품 운반시 수평 상태를 유지할 수 있도록 해주는 수평 유지 장치 및 이러한 수평 유지 장치를 구비한 무인 반송 차량에 관한 것이다. 회동되게 구비되는 제2 지지 프레임, 상기 제2 지지 프레임의 내부에서 회동되게 마련되는 지지판을 포함하고, 상기 제2 지지 프레임 또는 상기 지지판이 소정의 경사 상태에 있게 되면 수평 상태로 전환되게 하는 수평 유지 장치 및 이러한 수평 유지 장치를 구비하는 무인 반송 차량이 제공될 수 있다.","brief":true,"lvl":1},{"id":"p1020160053300","title":"편파 분할 듀플렉스 시스템에서의 채널 정보 획득 방법 및 그 장치","field":"전기·전자","status":"등록","regNo":"10-2469314","regDate":"2022.11.16","appNo":"10-2016-0053300","appDate":"2016.04.29","applicant":"한국전자통신연구원 · 선문대학교 산학협력단","coApplicant":true,"expiry":"2036.04.29","inventor":"노고산","transfer":"매매 · 라이센스","smk":false,"summary":"편파 분할 듀플렉스 시스템에서의 채널 정보 획득 방법 및 그 장치가 제공된다. 단말로부터 송신되는 상향링크 신호를 수신하되 하향링크 파일럿 신호를 포함한 서브캐리어와 겹치는 해당 서브캐리어에 널(null) 서브캐리어가 배치되어 있고, 널 서브캐리어에서 수신되는 신호를 이용하여 자기 간섭 채널을 추정한다. 이후 널 서브캐리어에 해당하는 신호를 제거하고, 남은 상향링크 신호의 파일럿 신호와 자기 간섭 채널 추정 결과를 토대로 상향링크 채널을 추정하여 채널 정보를 획득한다.","brief":true,"lvl":1},{"id":"p1020200117671","title":"외부 온라인 계정에 대한 활동가치 평가를 기반으로 하는 주식 거래 시스템","field":"소프트웨어","status":"등록","regNo":"10-2468220","regDate":"2022.11.14","appNo":"10-2020-0117671","appDate":"2020.09.14","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2040.09.14","inventor":"김학수","transfer":"매매 · 라이센스","smk":false,"summary":"본 발명은 외부 온라인 계정에 대한 활동가치 평가를 기반으로 하는 주식 거래 시스템 및 그 방법에 관한 것으로, 블로그·SNS·웹카페·멀티미디어 스트리밍 계정 중 하나 이상을 사업계정으로 하여 해당 계정에 대한 주식을 발행할 수 있도록 한다. 주식은 타 개인계정 사용자들의 조회수, 댓글, 좋아요 표시 등의 반응과 해당 사업계정의 사회적 영향력을 포함하는 가치평가를 통해 자체 주식거래소 상장 여부가 결정되며, 거래소는 활동 보상으로 채굴되는 가상화폐를 통화수단으로 사용한다.","brief":true,"lvl":1},{"id":"p1020200108646","title":"업컨버전 발광 특성을 갖는 란타넘족 도핑 사이알론 분말의 제조방법","field":"전기·전자","status":"등록","regNo":"10-2464842","regDate":"2022.11.03","appNo":"10-2020-0108646","appDate":"2020.08.27","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2040.08.27","inventor":"김태호","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 업컨버전 발광 특성을 갖는 란타넘족 도핑 사이알론 분말의 제조방법에 관한 것으로, 규소·알루미늄·질소 전구체를 포함하는 수용액과 Ho, Er, Tm, Yb 중 1종 이상의 란타넘족 원소 전구체 수용액을 혼합해 pH를 조절한 뒤, 마이크로파로 가열해 150~250℃에서 수열 반응시켜 사이알론을 합성하고 건조하는 방법이다.","features":[{"k":"특징","v":"마이크로파를 가열 수단으로 하는 수열 합성법을 적용해 란타넘족이 도핑된 SiAlON계 형광체를 저온에서 분말 형태로 직접 합성하며, 건조된 분말을 950~1100℃에서 추가 열처리해 결정성과 입도를 제어하여 발광 특성을 향상시킬 수 있다."},{"k":"효과","v":"1500℃ 이상의 고온 소결 후 분쇄하는 종래 공정과 달리 저온에서 빠르고 저렴하며 친환경적으로 분말 형태의 업컨버전 형광체를 곧바로 제조할 수 있어, 분쇄 공정에서 생기는 입자 표면 결함과 휘도 저하 문제를 해소할 수 있다."}],"lvl":3,"comparison":[{"item":"합성 공정 온도","old":"1500℃ 이상의 고온 소결 공정이 반드시 필요하였다","new":"마이크로파 수열 합성으로 150~250℃ 저온에서 합성한다"},{"item":"분말화 방식","old":"괴상 소결체를 분쇄해 적정 입도의 분말을 얻었다","new":"수열 합성과 건조를 거쳐 분말 형태로 곧바로 제조한다"},{"item":"형광체 휘도","old":"분쇄 시 입자 표면에 결함이 생겨 휘도가 저하되었다","new":"분쇄 공정이 없어 균일한 입도와 높은 휘도를 나타낸다"}],"applications":[{"title":"업컨버전 형광체 소재","desc":"Ho, Er, Tm, Yb이 도핑된 사이알론 업컨버전 형광체 분말 소재로 제조해 공급한다"},{"title":"저온 분말 합성 공정","desc":"마이크로파 수열 합성으로 질화물계 형광체 분말을 저온에서 제조하는 공정이다"},{"title":"녹색-적색 발광 재료","desc":"조성 제어로 녹색에서 적색까지 넓은 발광 파장을 내는 발광 재료에 활용한다"}],"figFile":"10-2020-0108646.jpg","figureCaption":"공보 대표도면"},{"id":"p1020200108644","title":"다운시프팅 발광 특성을 갖는 란타넘족 도핑 사이알론 분말의 제조방법","field":"화학","status":"등록","regNo":"10-2464841","regDate":"2022.11.03","appNo":"10-2020-0108644","appDate":"2020.08.27","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2040.08.27","inventor":"김태호","transfer":"매매 · 라이센스","smk":false,"summary":"본 발명은 규소·알루미늄·질소 전구체를 포함하는 제1 수용액과 Ce, Pr, Nd, Pm, Sm, Eu, Gd, Tb, Dy로부터 선택되는 1종 이상의 란타넘족 원소 전구체를 포함하는 제2 수용액을 혼합·교반하고 pH를 조절한 뒤, 마이크로파로 150~250도에서 수열 반응시켜 란타넘족 도핑 사이알론을 합성·건조하는 다운시프팅 발광 특성 분말의 제조방법이다. 고온 소결·분쇄 공정 없이 저온에서 친환경적으로 SiAlON계 다운시프팅 형광체 재료를 분말 형태로 제조할 수 있다.","brief":true,"lvl":1},{"id":"p1020200075168","title":"안트라퀴논 생합성 기능을 가지는 결명자 유래 유전자 및 이의 용도","field":"바이오","status":"등록","regNo":"10-2463948","regDate":"2022.11.02","appNo":"10-2020-0075168","appDate":"2020.06.19","applicant":"대한민국 · 선문대학교 산학협력단","coApplicant":true,"expiry":"2040.06.19","inventor":"강상호","transfer":"매매 · 라이센스","smk":false,"summary":"본 발명은 폴리케타이드합성효소(polyketide synthase) 활성을 가지는 결명자 유래 CHS-L 단백질 및 이의 유전자에 관한 것으로, 결명자 유래 CHS-L는 에모딘 전구체인 아트로크리손 카르복시산 또는/및 엔도크로신 안트론 생합성에 활성을 가져, 안트라퀴논(에모딘) 함량이 증진된 작물 개발 또는 에모딘 전구체 및 에모딘 생합성에 유용하게 활용 가능하다.","brief":true,"lvl":1},{"id":"p1020200187046","title":"광나무 추출물의 바이오리노베이션에 의한 미백 조성물 및 이의 제조 방법","field":"의료","status":"등록","regNo":"10-2463782","regDate":"2022.11.01","appNo":"10-2020-0187046","appDate":"2020.12.30","applicant":"주식회사 헬리오스 · 선문대학교 산학협력단","coApplicant":true,"expiry":"2040.12.30","inventor":"현광희","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 광나무 추출물의 바이오리노베이션에 의한 미백 조성물 및 그 제조 방법에 관한 것으로, 미생물 반응을 통해 광나무의 유효성분인 시린진 등을 생물전환시켜 B16F10 흑색종 세포의 활성화를 억제하고 멜라닌 합성을 저해하는 화합물을 생성한다. 미백 효과가 알려지지 않았던 광나무를 활용해 피부 안정성을 높이고 부작용을 줄인 미백 조성물을 제공하며, 제주에서 채취한 광나무와 제주 재래간장에서 분리한 균주를 소재로 삼는다.","features":[{"k":"특징","v":"광나무 잎을 70% 에탄올로 60도에서 3시간 주정추출해 감압 농축한 추출물과, 배양 후 원심분리한 바실러스 아미로리쿼파시엔스 펠렛의 PG 버퍼 현탁액을 30도에서 72시간 반응시켜 생물전환하고, 원심분리·여과·감압 농축으로 반응물을 수득한다."},{"k":"효과","v":"생물전환된 광나무 추출물은 기존 추출물보다 멜라닌 합성 저해율이 높고 농도 의존적으로 티로시나아제 활성을 최대 58% 억제하며 TRP-1과 티로시나아제 발현을 크게 감소시켜, 세포 독성 없이 화장품과 외용 약품의 미백 소재로 활용할 수 있다."}],"lvl":3,"comparison":[{"item":"미백 유효성분","old":"하이드로퀴논·아스콜빈산·코지산 등 합성 소재를 배합","new":"광나무 추출물을 미생물로 생물전환한 천연 유효성분 사용"},{"item":"피부 자극·부작용","old":"하이드로퀴논은 자극이 심하고 티올계는 불쾌한 냄새 발생","new":"천연물 기반으로 피부 안정성을 높이고 부작용을 감소함"},{"item":"소재 활용 범위","old":"광나무를 피부 미백을 위한 재료로 사용한 사례가 없었음","new":"광나무 추출물을 바이오리노베이션해 신규 미백 소재로 활용"}],"applications":[{"title":"미백 화장품 제형","desc":"스킨과 로션, 크림, 에센스, 팩, 폼 클렌징 등 화장품에 첨가되는 미백 조성물"},{"title":"피부미백 외용 약품","desc":"외용 연고와 같은 약품에 첨가해 피부 트러블 없이 사용하는 피부미백용 조성물"},{"title":"천연물 생물전환 소재","desc":"바실러스 아미로리쿼파시엔스와 반응시켜 광나무 유효성분을 전환하는 소재 제조"}],"figFile":"10-2020-0187046.jpg","figureCaption":"공보 대표도면"},{"id":"p1020200078461","title":"SR 140333 및 HBC를 포함하는 뇌암 치료, 개선 또는 예방용 조성물","field":"바이오","status":"등록","regNo":"10-2460578","regDate":"2022.10.25","appNo":"10-2020-0078461","appDate":"2020.06.26","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2040.06.26","inventor":"정혜진","transfer":"매매 · 라이센스","smk":false,"summary":"본 발명은 화학적 합성치사 상호작용을 나타내는 뇌암 치료용 조성물 등에 관한 것으로, HBC 및 SR 140333 병용투여는 개별 성분과 비교해 암줄기유사세포에 대한 상승적인 합성치사 상호작용이 있으며, 신경구체 형성도 현저하게 억제하고, 전이능력 억제 활성 역시 우수한 결과를 보이고 있어 뇌암 치료, 예방 또는 개선 용도로 유용하게 이용될 수 있다.","brief":true,"lvl":1},{"id":"p1020200078462","title":"푸라미딘 및 HBC를 포함하는 뇌암 치료, 개선 또는 예방용 조성물","field":"바이오","status":"등록","regNo":"10-2460579","regDate":"2022.10.25","appNo":"10-2020-0078462","appDate":"2020.06.26","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2040.06.26","inventor":"정혜진","transfer":"매매 · 라이센스","smk":false,"summary":"본 발명은 화학적 합성치사 상호작용을 나타내는 뇌암 치료용 조성물 등에 관한 것으로, HBC 및 푸라미딘 병용투여는 개별 성분과 비교해 암줄기유사세포에 대한 상승적인 합성치사 상호작용이 있으며, 신경구체 형성도 현저하게 억제하고, 전이능력 억제 활성 역시 우수한 결과를 보이고 있어 뇌암 치료·예방 또는 개선 용도로 유용하게 이용될 수 있다.","brief":true,"lvl":1},{"id":"p1020190153272","title":"홍삼 및 흑당을 포함하는 젤리의 제조방법 및 이에 따라 제조된 홍삼 및 흑당을 포함하는 젤리","field":"식품","status":"등록","regNo":"10-2450138","regDate":"2022.09.28","appNo":"10-2019-0153272","appDate":"2019.11.26","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2039.11.26","inventor":"서희재","transfer":"매매 · 라이센스","smk":false,"summary":"본 발명은 홍삼 및 흑당을 포함하는 젤리의 제조방법 및 이에 따라 제조된 젤리에 관한 것으로, (A) 홍삼분말과 물을 혼합하여 70~90도에서 추출하고, (B) 추출물을 여과해 홍삼박과 여과 추출물로 분리하며, (C) 여과 추출물에 증점제와 곤약을 첨가해 50~80도로 가열하면서 수화시키고, (D) 수화된 겔화물에 흑당을 첨가한 후 80~90도에서 균일하게 교반하여 겔화시켜 젤리를 수득한다. 홍삼 특유의 쓴맛이 가려지고 향이 흑당에 의해 부드럽게 변화되어 남녀노소 누구나 거부감 없이 섭취할 수 있다.","brief":true,"lvl":1},{"id":"p1020200086596","title":"흰민들레 꽃 추출물을 유효성분으로 함유하는 조성물","field":"바이오","status":"등록","regNo":"10-2449136","regDate":"2022.09.26","appNo":"10-2020-0086596","appDate":"2020.07.14","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2040.07.14","inventor":"김진우","transfer":"매매 · 라이센스","smk":false,"summary":"본 발명은 흰민들레 꽃 추출물을 유효성분으로 함유하는 화장료 조성물에 관한 것으로, 흰민들레 꽃을 유효성분으로 포함함으로써 항산화 효과가 우수하며 피부 미백 및 피부 주름 완화에 효과가 있다.","brief":true,"lvl":1},{"id":"p1020200140135","title":"세라믹 그린 시트 절단기용 블레이드 클리닝 장치","field":"기계","status":"등록","regNo":"10-2446487","regDate":"2022.09.20","appNo":"10-2020-0140135","appDate":"2020.10.27","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2040.10.27","inventor":"고국원","transfer":"매매 · 라이센스","smk":false,"summary":"본 발명은 세라믹 그린 시트 절단기용 블레이드 클리닝 장치에 관한 것으로서, 세척 대상물인 블레이드를 로딩하는 로딩 유니트, 로딩된 블레이드를 세척하기 위한 세척 유니트, 세척된 블레이드를 건조시키는 건조 유니트를 포함하고, 로딩·세척·건조 유니트가 일렬로 배열되며 블레이드는 직선 이동하면서 로딩 공정, 세척 공정 및 건조 공정을 수행한다.","brief":true,"lvl":1},{"id":"p1020210013361","title":"타이머 기능을 갖는 수도꼭지","field":"생활","status":"등록","regNo":"10-2444137","regDate":"2022.09.13","appNo":"10-2021-0013361","appDate":"2021.01.29","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2041.01.29","inventor":"이장범","transfer":"매매 · 라이센스","smk":false,"summary":"본 발명은 물공급관에 연결되되 상단과 하단 사이 일측에 제1개방구가 형성된 물유입관, 물유입관 상단부에 승강 가능하게 설치되되 제1개방구를 바라보는 일측에 제2개방구가 형성된 가동체, 물유입관을 부분적으로 감싸되 제1개방구와 연통하는 유로가 형성된 본체를 포함한다. 가동체가 승강하여 제2개방구가 제1개방구와 연통하면 수돗물이 유로로 유입되어 토출되고, 가동체가 자중에 의해 점차 하강하여 연통이 해제되면 물 토출이 자동으로 중단되는 타이머 기능을 갖는 수도꼭지에 관한 것이다.","brief":true,"lvl":1},{"id":"p1020200083158","title":"선형 광 조사기","field":"전기·전자","status":"등록","regNo":"10-2442691","regDate":"2022.09.06","appNo":"10-2020-0083158","appDate":"2020.07.07","applicant":"주식회사 라이트전자 · 선문대학교 산학협력단","coApplicant":true,"expiry":"2040.07.07","inventor":"유순재","transfer":"매매 · 라이센스","smk":false,"summary":"본 발명에 따른 선형 광 조사기는 회로 배선을 따라 복수의 관통홀을 가지는 인쇄 회로 기판 및 인쇄 회로 기판의 일 면 상에서 두 개의 관통홀마다 개별적으로 삽입되어 회로 배선과 전기적으로 접속하는 복수의 자외선 발광 다이오드(UV LED) 램프를 포함하는 광원 모듈을 구비하고, 복수의 자외선 발광 다이오드 램프는 인쇄 회로 기판 상에 적어도 두 층으로 적층된다.","brief":true,"lvl":1},{"id":"p1020200078505","title":"애완동물용 샤워 부스","field":"생활","status":"등록","regNo":"10-2441501","regDate":"2022.09.02","appNo":"10-2020-0078505","appDate":"2020.06.26","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2040.06.26","inventor":"최주열","transfer":"매매 · 라이센스","smk":false,"summary":"애완동물이 목욕 시 몸의 물을 털어도 사람에게 물이 튀지 않고 건조 시에도 털이 공기 중에 날리지 않도록 방지하는 애완동물용 샤워 부스가 제공된다. 펼쳐지거나 접히는 비닐, 반달 원주형태로 절개되며 돌출부가 연장되는 절개부, 건조 시 공기 분출 및 털을 걸러내는 그물망, 그물망을 개폐하는 개폐부, 머리 노출 토시, 방수 토시, 비닐이 펼쳐질 때 바닥으로부터 이격되게 하는 삽입 부재, 비닐을 펼치거나 접는 조작부를 포함한다.","brief":true,"lvl":1},{"id":"p1020200093911","title":"나르제니신 A1 유도체를 포함하는 항혈관신생용 조성물","field":"바이오","status":"등록","regNo":"10-2440647","regDate":"2022.09.01","appNo":"10-2020-0093911","appDate":"2020.07.28","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2040.07.28","inventor":"정혜진","transfer":"매매 · 라이센스","smk":false,"summary":"본 발명은 신규 화합물인 나르제니신 A1 유도체를 포함하는 항혈관신생용 조성물 등에 관한 것으로, 본 발명의 컴파운드 9는 in vitro 테스트 결과 혈관신생을 억제하는 효과가 뛰어나고 VEGFR2 매개 다운스트림 신호 경로 및 MMP-2/MMP-9 발현을 하향 조절하는 효과가 있으며 HIF-1α 및 VEGF 발현 또한 우수하게 억제하므로 혈관신생과 관련된 질환의 치료, 개선 또는 예방에 유용하게 이용될 수 있다.","brief":true,"lvl":1},{"id":"p1020200108647","title":"온도 센서용 α-사이알론 세라믹스 및 그 제조방법","field":"화학","status":"등록","regNo":"10-2440648","regDate":"2022.09.01","appNo":"10-2020-0108647","appDate":"2020.08.27","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2040.08.27","inventor":"김태호","transfer":"매매 · 라이센스","smk":false,"summary":"본 발명은 업컨버전 또는 다운시프팅 발광 특성을 갖는 온도 센서용 α-사이알론 세라믹스에 대한 것으로서, 본 발명에 따른 온도 센서용 α-사이알론 세라믹스는 고온(100℃ 이상), 고압, 고부식성, 높은 전자기 간섭 환경 등의 가혹한 환경에서도 정확하고 안정적으로 작동할 수 있는 형광 기반 비접촉식 센서의 온도 센싱 소재로서 유용하게 사용될 수 있다.","brief":true,"lvl":1},{"id":"p1020200140134","title":"복수의 카메라부가 구비된 비전 검사 장치","field":"전기·전자","status":"등록","regNo":"10-2439941","regDate":"2022.08.31","appNo":"10-2020-0140134","appDate":"2020.10.27","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2040.10.27","inventor":"고국원","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 복수의 카메라부가 구비된 비전 검사 장치에 관한 것으로, 지지대에 고정되는 복수의 카메라부, 이들과 접속되는 스위치부, 영상 이미지를 획득하는 비전 처리부, 제어부, 검사 대상물을 안치·지지하는 검사 지그를 포함한다. 고정된 1대의 카메라로는 2차 전지용 대면적 극판처럼 검사 면적이 커질 때 초점 심도를 벗어나 초점이 맞지 않고 형상 왜곡이 심해지는 문제를 복수 카메라 분담 촬영으로 해결한다.","features":[{"k":"특징","v":"제1·제2 카메라부가 검사 대상물을 동시에 촬영하고 스위치부가 영상 신호를 비전 처리부로 통합 전달하며, 비전 처리부는 검사 지그 프레임에 배치된 복수 마커의 위치 좌표값을 기준으로 각 영상을 하나의 단일 이미지로 통합한다. 촬영 영역이 겹치는 중첩 영역에서는 동일 지점의 좌표값을 양쪽 마커로 각각 산출해 비교한다."},{"k":"효과","v":"마커 좌표값과 복수 영상의 조합으로 검사 대상물의 가장자리 위치를 정확히 파악해 면적이 커져도 신속·정확하게 불량을 판별하고, 단일 이미지화로 작업자의 대상물 인식률과 작업성을 높인다. 일부 카메라가 고장나면 스위치부가 해당 카메라를 차단해 나머지 카메라만으로 검사를 계속할 수 있고, 가이드 돌기와 바이스로 지그를 간편히 정렬·고정한다."}],"lvl":3,"comparison":[{"item":"카메라 구성","old":"고정 상태의 카메라 1대로 검사 대상물 전체를 촬영함","new":"지지대에 고정된 복수 카메라부를 스위치부로 전환 촬영"},{"item":"초점·왜곡 문제","old":"검사 면적이 커지면 초점 심도를 벗어나 형상 왜곡이 심화","new":"복수 영상을 통합해 단일 이미지화한 뒤 기준과 비교 판별"},{"item":"검사 지그 정렬","old":"작업자가 검사 지그의 위치를 수동으로 맞춰 고정해야 함","new":"가이드 돌기로 y축을 자동 정렬하고 바이스로 간편히 고정"}],"applications":[{"title":"대면적 제품 비전 검사","desc":"면적이 큰 검사 대상물을 복수의 카메라로 분할 촬영해 불량을 신속하게 판별"},{"title":"마커 기반 위치 산출","desc":"검사 지그 프레임부의 마커 위치 좌표값으로 검사 대상물 가장자리 위치를 산출"},{"title":"자동 외관 검사 라인","desc":"복수 영상을 통합한 단일 이미지를 기준 검사 이미지와 비교하는 자동 검사 라인"}],"figFile":"10-2020-0140134.jpg","figureCaption":"공보 대표도면"},{"id":"p1020200151366","title":"하지 재활용 보행기","field":"생활","status":"등록","regNo":"10-2436820","regDate":"2022.08.23","appNo":"10-2020-0151366","appDate":" 다"}],"figFile":"10-2022-0034479.jpg","figureCaption":"공보 대표도면"},{"id":"p1020200109018","title":"레드비트 발효 추출물을 유효성분으로 함유하는 자외선 차단, 블루라이트 차단 및 미백용 가지는 조성물","field":"의료","status":"등록","regNo":"10-2370528","regDate":"2022.02.28","appNo":"10-2020-0109018","appDate":"2020.08.28","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2040.08.28","inventor":"김진우","transfer":"매매 · 라이센스","smk":false,"brief":false,"lvl":0},{"id":"p1020190130079","title":"콩나물부산물 효소분해물을 유효성분으로 포함하는 조성물","field":"의료","status":"등록","regNo":"10-2370532","regDate":"2022.02.28","appNo":"10-2019-0130079","appDate":"2019.10.18","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2039.10.18","inventor":"김진우","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 콩나물부산물 효소분해물을 유효성분으로 포함하는 조성물에 관한 것으로, 콩나물 재배 및 가공 과정에서 대부분 폐기되던 머리, 뿌리, 껍질 등의 부산물을 단백질 분해효소로 가수분해하여 얻은 분해물을 이용한다. 연간 생산 콩나물의 1~1.2배에 달하는 부산물의 폐기 비용과 환경오염 문제를 해결하면서, 항산화 및 항균 효과가 우수한 기능성 소재를 얻어 식품 조성물, 천연 방부제 또는 사료 첨가제로 사용할 수 있다.","features":[{"k":"특징","v":"청국장에서 분리하여 동정한 바실러스 테퀼엔시스 SM18(기탁번호 BP1429751)의 조효소액을 단백질 분해효소로 사용하며, 40~80℃ 열풍으로 건조한 콩나물 부산물과 효소를 1:2~20의 고액비로 혼합해 가수분해하여 펩타이드를 생산한다."},{"k":"효과","v":"상업효소인 알칼라아제 대비 총 폴리페놀 함량과 DPPH 라디칼 소거능이 1.3배 이상 증가하고, 녹농균과 대장균 등 그람 음성균에 대해 90~100%의 성장 저해율을 나타내어, 화학 방부제를 대체하는 안정성 높은 천연 항균·항산화 기능성 소재로 활용할 수 있다."}],"lvl":3,"comparison":[{"item":"보존제 소재","old":"파라벤 등 화학 방부제를 사용해 인체 유해성 우려가 있다","new":"콩나물 부산물 효소분해물을 유효성분으로 하는 천연 방부제"},{"item":"소재 안정성","old":"천연 활성물질은 색취와 안정성 저하로 상용화가 어려웠다","new":"항균·항산화 활성과 안정성이 뛰어난 기능성 소재로 제공된다"},{"item":"부산물 처리","old":"콩나물 부산물은 대부분 폐기되어 비용과 환경오염을 유발","new":"단백질 분해효소로 가수분해해 고부가가치 기능성 소재로 전환"}],"applications":[{"title":"천연 식품 보존제","desc":"화학 방부제를 대체하는 항균 보존제로 식품 조성물에 첨가해 변질과 부패를 억제하는 데 쓴다"},{"title":"화장품·의약품 소재","desc":"천연 항균성을 지닌 소재로 화장품, 의약품, 건강기능식품에 배합해 항산화·항균 기능을 부여한다"},{"title":"기능성 사료 첨가제","desc":"콩나물 부산물 효소분해물을 사료 첨가제로 적용해 항균성과 항산화 기능을 함께 부여한다"}],"figFile":"10-2019-0130079.jpg","figureCaption":"공보 대표도면"},{"id":"p1020200008033","title":"안경 김서림 방지용 황사 마스크","field":"생활","status":"등록","regNo":"10-2363753","regDate":"2022.02.11","appNo":"10-2020-0008033","appDate":"2020.01.21","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2040.01.21","inventor":"이장범","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 안경 김서림 방지용 황사 마스크에 관한 것으로, 통기가 자유로운 외측 원단의 내면 측에 초미세먼지를 걸러내는 제1필터와 제2필터를 배치한 구조이다. 두 필터에는 간격을 둔 복수의 통공이 서로 겹치지 않도록 형성되어, 숨을 내쉴 때는 통공이 열려 날숨이 쉽게 빠져나가고 숨을 들이쉴 때는 통공이 닫혀 초미세먼지 유입이 차단된다.","features":[{"k":"특징","v":"제1필터와 제2필터의 통공이 서로 엇갈리게 배치되어, 외기 유입 시에는 두 필터가 상호 밀착되며 통공 개방이 차단되고, 날숨 배출 시에는 두 필터가 외측으로 부풀며 상호 이격되어 통공이 완전히 개방되는 수동형 밸브 구조로 동작한다."},{"k":"효과","v":"들숨에서는 통공을 통한 초미세먼지 유동이 방지되어 필터링 성능이 유지되고, 날숨에서는 숨 배출이 원활해져 마스크와 안면 사이 틈으로 새어 오르는 숨이 줄어 사용자 안경의 김서림을 방지할 수 있다."}],"lvl":3,"comparison":[{"item":"필터 구성 구조","old":"외측 원단 내면에 초미세먼지 필터 한 겹을 배치하였다","new":"통공이 서로 겹치지 않는 제1·제2필터를 이중으로 배치한다"},{"item":"숨 배출 성능","old":"필터가 숨 배출을 간섭해 틈으로 숨이 상부로 유동하였다","new":"숨 배출 시 두 필터가 이격되어 통공이 완전 개방된다"},{"item":"안경 김서림","old":"새어 나온 숨으로 안경에 김이 서려 시야 확보가 곤란했다","new":"통공으로 숨이 바로 배출되어 안경 김 서림이 방지된다"}],"applications":[{"title":"보건용 황사 마스크","desc":"초미세먼지 농도가 높은 날 외출 시 착용하는 황사·초미세먼지용 마스크에 적용한다"},{"title":"안경 착용자용 마스크","desc":"안경 착용자가 김 서림 없이 시야를 확보하도록 설계한 마스크 제품으로 상품화한다"},{"title":"다층 필터 구조 설계","desc":"통공 위치를 어긋나게 배치한 이중 필터 구조를 호흡 방향별 개폐 필터에 응용한다"}],"figFile":"10-2020-0008033.jpg","figureCaption":"공보 대표도면"},{"id":"p1020200117781","title":"자화를 이용한 반도체-강자성체 코팅막의 제조방법","field":"전기·전자","status":"등록","regNo":"10-2360354","regDate":"2022.02.04","appNo":"10-2020-0117781","appDate":"2020.09.14","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2040.09.14","inventor":"김학수","transfer":"매매 · 라이센스","smk":false,"brief":false,"lvl":0},{"id":"p1020200083925","title":"모발 퍼머용 필름 및 이를 이용한 퍼머 시술 방법","field":"의료","status":"등록","regNo":"10-2359462","regDate":"2022.02.03","appNo":"10-2020-0083925","appDate":"2020.07.08","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2040.07.08","inventor":"김정희","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 모발에 웨이브를 형성하기 위한 모발 퍼머용 필름 및 이를 이용한 퍼머 시술 방법에 관한 것으로, 티오글리콜산·시스테인·시스테아민 등 퍼머용 환원제를 PVA, PEG, CMC 등의 생분해성 고분자에 담지한 필름이다. 생분해성 고분자가 물을 흡수하면 환원제가 필름 외부로 방출되어 모발이 연화되므로, 모발에 환원제를 직접 도포할 필요가 없다.","features":[{"k":"특징","v":"필름을 모발 길이에 맞춰 절단해 모발에 덧대고 로드 등 퍼머용 성형부재에 함께 말아 고정한 뒤 수분을 공급하면, 30~60분의 연화 단계에서 환원제가 방출되고 이후 브롬산염 또는 과산화수소수를 도포해 10~20분간 중화하여 웨이브를 고정한다."},{"k":"효과","v":"환원제를 직접 도포하지 않아 약액이 두피에 닿아 생기는 자극과 손상을 막고, 성형과 연화 단계를 동시에 수행해 시술시간을 단축하며, 고분자 조성에 따라 물에 대한 용해 정도와 필름 유지 시간을 조절해 시술 편의성을 높일 수 있다."}],"lvl":3,"comparison":[{"item":"환원제 적용 방식","old":"액체·젤 형태의 환원제를 모발에 직접 도포하였다","new":"환원제를 생분해성 고분자에 담지한 필름을 모발에 덧댄다"},{"item":"두피 손상 방지","old":"환원제가 두피에 떨어져 자극과 염증을 유발하였다","new":"환원제를 직접 도포하지 않아 두피 손상을 방지한다"},{"item":"시술 조건 조절","old":"절연시트 기구로는 환원제에 의한 두피 손상을 막지 못했다","new":"필름의 용해 정도와 형태 유지 시간으로 시술 시간을 조절"}],"applications":[{"title":"미용실 퍼머 시술","desc":"필름을 모발 길이에 맞춰 절단해 성형부재에 고정하는 퍼머넌트 웨이브 시술에 쓴다"},{"title":"모발용 화장품 소재","desc":"환원제 농도와 부재료 성분을 달리한 다양한 필름 제품으로 퍼머용 소재를 공급한다"},{"title":"생분해성 고분자 응용","desc":"PVA, PEG, CMC, PLGA 등 생분해성 고분자에 약제를 담지해 방출하는 제형에 적용한다"}],"figFile":"10-2020-0083925.jpg","figureCaption":"공보 대표도면"},{"id":"p1020190145204","title":"홍지네 고사리 추출 방법","field":"식품","status":"등록","regNo":"10-2360107","regDate":"2022.02.03","appNo":"10-2019-0145204","appDate":"2019.11.13","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2039.11.13","inventor":"김승영","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 홍지네 고사리 미백 조성물 및 홍지네 고사리 추출 방법에 관한 것으로, 홍지네 고사리(Dryopteris erythrosora) 추출물을 유효성분으로 함유하여 멜라닌 생성을 억제하고 항산화를 활성화하며 세포 생존율을 높인다. 피부 자극성이 심한 하이드로퀴논이나 산화되기 쉬운 아스콜빈산 등 종래 미백 성분의 문제를 피부 트러블 없는 천연 소재로 대체하는 것을 목적으로 한다.","features":[{"k":"특징","v":"홍지네 고사리 건조 원물 100g에 에탄올 1.8~2.2L를 혼합해 55~65℃에서 2시간30분~3시간30분 동안 1차 가열 추출하고 상온에서 16~20시간 2차 추출한 뒤, 고형물을 여과하고 감압 농축하여 유효성분을 얻는 방식이다."},{"k":"효과","v":"아스콜빈산 비교군보다 DPPH 및 ABTS 라디칼 소거능과 멜라닌 생성 억제 효과가 우수하고 세포 생존율도 높아, 스킨, 로션, 크림, 에센스, 팩, 외용 연고 등에 0.01~25중량%로 첨가하면 자외선에 노출되어도 피부 미백이 오랫동안 유지된다."}],"lvl":3,"comparison":[{"item":"미백 유효성분","old":"하이드로퀴논, 아스콜빈산 등 합성 티로시나제 저해 물질","new":"홍지네 고사리 추출물을 유효성분으로 하는 천연 미백 소재"},{"item":"피부 안전성","old":"하이드로퀴논은 자극이 심해 배합량을 극소량으로 제한하였다","new":"천연물 추출물이어서 피부 트러블 없이 사용할 수 있다"},{"item":"제형 안정성","old":"아스콜빈산은 산화되기 쉬워 변색과 변취가 발생하였다","new":"주정 추출과 여과·감압 농축으로 배합에 적합한 농축물을 얻는다"}],"applications":[{"title":"피부 미백 화장료","desc":"스킨, 로션, 크림, 에센스, 팩, 폼 클렌징 등 화장품에 첨가해 피부 미백 효과를 부여한다"},{"title":"과색소 침착 개선","desc":"멜라닌 생합성을 억제해 기미, 주근깨 등 피부 과색소 침착증 개선용 소재로 활용한다"},{"title":"미백용 외용 의약품","desc":"외용 연고와 같은 약품 형태의 피부미백용 조성물에 첨가해 미백 기능을 부여한다"}],"figFile":"10-2019-0145204.jpg","figureCaption":"공보 대표도면"},{"id":"p1020190165684","title":"율피 추출물을 유효성분으로 함유하는 자외선 차단용 화장료 조성물","field":"의료","status":"등록","regNo":"10-2358319","regDate":"2022.01.27","appNo":"10-2019-0165684","appDate":"2019.12.12","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2039.12.12","inventor":"김진우","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 율피 추출물을 유효성분으로 함유하는 자외선 차단용 화장료 조성물에 관한 것으로, 밤의 속껍질인 율피를 추출용매 하에서 초음파 처리하여 얻은 추출물을 이용한다. 다수의 페놀성 수산기를 지닌 축합형 탄닌이 다량 함유된 율피 추출물이 UVA와 UVB를 높게 흡수하므로, 인체에 무해한 천연물 기반의 자외선 차단 기능성 화장품 소재로 사용할 수 있으며 건강기능식품에도 적용 가능하다.","features":[{"k":"특징","v":"율피와 추출용매를 1:10~30의 중량비로 혼합해 20~50kHz의 진동수와 50~700W 파워의 초음파기로 50~90℃에서 20~80분 동안 처리하여 추출하며, 추출용매로는 아세톤, 무수 에탄올 또는 무수 메탄올이 사용된다."},{"k":"효과","v":"증류수 추출물에 비해 자외선 흡수능이 높고 티로시나제 저해능과 콜라게나제 저해능, DPPH 항산화능이 모두 우수하며 세포 생존율 90% 이상으로 세포 독성이 없어, 화장수, 로션, 영양 크림, 에센스, 마스크 팩 등 다양한 화장료에 적용할 수 있다."}],"lvl":3,"comparison":[{"item":"차단 유효성분","old":"다양한 SPF·PA 등급의 기존 자외선 차단 제품을 사용하였다","new":"밤의 부산물인 율피 추출물을 유효성분으로 함유한다"},{"item":"추출 공정 방식","old":"열수 추출이나 마이크로파 추출로는 차단 효과가 미미하였다","new":"용매 중 20~50kHz 초음파로 20~80분 처리해 유효성분을 추출"},{"item":"부가 기능성","old":"자외선 차단 지수를 중심으로 기능이 평가되어 왔다","new":"티로시나제·콜라게나제 저해능과 항산화능을 함께 나타낸다"}],"applications":[{"title":"자외선 차단 화장품","desc":"자외선 차단크림, 로션, 에센스, 파운데이션 등 유화·가용화 제형 화장품에 배합한다"},{"title":"항산화 건강기능식품","desc":"율피 추출물을 분말 형태로 가공해 항산화 기능을 갖는 건강기능식품에 사용한다"},{"title":"밤 부산물 고부가 활용 "10-2333196","regDate":"2021.11.25","appNo":"10-2021-0063537","appDate":"2021.05.17","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2041.05.17","inventor":"안기환","transfer":"매매 · 라이센스","smk":false,"brief":false,"lvl":0},{"id":"p1020190145147","title":"미생물 유래 글루코실트랜스퍼라제 및 이를 이용한 스테로이드 글리코사이드의 합성방법","field":"의료","status":"등록","regNo":"10-2333190","regDate":"2021.11.25","appNo":"10-2019-0145147","appDate":"2019.11.13","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2039.11.13","inventor":"오태진","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 미생물 유래 글루코실트랜스퍼라제 및 이를 이용한 스테로이드 글리코사이드의 합성방법에 관한 것으로, 북극 토양에서 분리된 극지 미생물 테리바실러스 유래의 UDP-글루코실트랜스퍼라제(UGT-1)를 이용해 스테로이드의 C-17 하이드록실기를 글리코실화한다. 이를 통해 친수성 스테로이드인 테스토스테론 β-D-글루코사이드 및 난드롤론 β-D-글루코사이드를 제조한다.","features":[{"k":"특징","v":"서열번호 2의 아미노산 서열을 포함하는 UDP-글루코실트랜스퍼라제와 UDP-글루코오스를 사용하여 35℃에서 3시간 동안 반응시켜 기질의 말단 하이드록실기에 O-글루코오스를 결합시키며, 테스토스테론과 난드롤론에서 98% 이상의 전환율을 나타낸다."},{"k":"효과","v":"제조된 글루코사이드는 글루코오스가 결합되지 않은 테스토스테론 및 난드롤론에 비해 세포 독성이 낮고 세포 생존력과 세포 ATP를 증가시키는 신경 보호 효과를 보여, 중풍, 치매, 알츠하이머병, 헌팅턴병, 파킨슨병 등 신경 세포 손상 질환의 치료제로 사용될 수 있다."}],"lvl":3,"comparison":[{"item":"스테로이드 성상","old":"친유성인 테스토스테론 에스테르 유도체 중심으로 연구되었다","new":"C-17 하이드록실기를 글리코실화한 친수성 스테로이드를 제조"},{"item":"합성 공정 효율","old":"당의 하이드록실기를 다루는 복잡한 과정에 수율도 낮았다","new":"효소 반응으로 테스토스테론·난드롤론을 98% 이상 전환시킨다"},{"item":"신경세포 효과","old":"글루코오스가 결합되지 않은 테스토스테론·난드롤론 형태","new":"세포 생존력과 ATP를 높여 뇌신경세포 보호 효과를 나타낸다"}],"applications":[{"title":"남성호르몬 보충 소재","desc":"친수성 스테로이드 형태로 테스토스테론 결핍 질환의 대체 요법용 소재 개발에 활용한다"},{"title":"뇌신경세포 보호 의약품","desc":"중풍, 치매, 알츠하이머병, 헌팅턴병, 파킨슨병 등 신경세포 손상 질환 치료제 개발에 적용한다"},{"title":"효소 기반 생물전환 공정","desc":"극지 미생물 유래 글루코실트랜스퍼라제로 스테로이드 글리코사이드를 생산하는 공정에 쓴다"}],"figFile":"10-2019-0145147.jpg","figureCaption":"공보 대표도면"},{"id":"p1020200029513","title":"발차기 훈련용 필름을 이용한 발차기 훈련 장치","field":"생활","status":"등록","regNo":"10-2332201","regDate":"2021.11.24","appNo":"10-2020-0029513","appDate":"2020.03.10","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2040.03.10","inventor":"양현석","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 발차기 훈련용 필름을 이용한 발차기 훈련 장치에 관한 것으로, 타격에 의해 자유롭게 휘어지며 진동음을 발생시키는 필름부재와 이 필름을 장착하는 필름 장착부재, 장착부재를 벽·문 등의 지지체에 탈부착하는 필름 부착부재로 구성된다. 필름을 타격할 때 나는 소리로 훈련에 대한 흥미를 유발하도록 한 장치이다.","features":[{"k":"특징","v":"필름부재로는 파열음이 큰 X레이 필름을 사용할 수 있고, 자석이나 흡착판으로 지지체에 부착하며 각도 조절용 힌지부로 설치 각도를 조절한다. 필름 고정부 양측의 제1·제2스프링부재와 소리감지센서·전자석 지그부가 연동해 타격 후 필름의 진동과 소리를 증폭시킨다."},{"k":"효과","v":"타격음으로 훈련 흥미와 훈련자의 만족도를 높이고, 도우미 없이 원하는 시간에 개인 훈련이 가능해 편의성과 훈련 효율이 향상되며, 필름 각도를 조절해 다양한 자세의 발차기 훈련을 수행할 수 있다."}],"lvl":3,"comparison":[{"item":"훈련 보조 인력","old":"연습용 판이나 타격 미트를 잡아줄 도우미가 필요하였다","new":"자석이나 흡착판으로 문·벽면에 설치해 혼자서 훈련한다"},{"item":"타격 피드백","old":"쿠션 재질이어서 타격 소리가 둔탁하고 거의 나지 않았다","new":"필름 진동으로 타격 소리가 발생해 훈련 흥미를 유발한다"},{"item":"훈련 자세 대응","old":"허공 발차기는 발목이나 무릎 관절에 손상을 주었다","new":"힌지부로 필름 각도를 조절해 다양한 자세로 훈련한다"}],"applications":[{"title":"무술 도장 훈련 교구","desc":"태권도, 합기도, 특공무술 등 발차기 단련이 필요한 도장의 훈련 장치로 활용한다"},{"title":"개인용 홈 트레이닝","desc":"문이나 벽면에 부착해 도우미 없이 원하는 시간에 발차기 훈련을 수행하도록 한다"},{"title":"자동 복귀 훈련 장치","desc":"소리감지센서와 전자석 지그로 타격 후 필름을 초기 위치로 되돌리는 데 적용한다"}],"figFile":"10-2020-0029513.jpg","figureCaption":"공보 대표도면"},{"id":"p1020210137095","title":"발달장애를 가진 피훈련자 맞춤형 운동프로그램 컨텐츠 제공 방법","field":"의료","status":"공개","regNo":"","regDate":"","appNo":"10-2021-0137095","appDate":"2021.10.15","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2041.10.15","inventor":"유재호","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 발달장애를 가진 피훈련자에게 맞춤형 운동프로그램 컨텐츠를 제공하는 방법에 관한 것으로, 선택된 훈련 컨텐츠를 디스플레이를 통해 증강현실로 구현하고 이를 수행하는 피훈련자의 모션 변화로부터 인지 역량과 신체 역량을 산출한다. 산출된 역량은 서버로 전송되어 개인건강기록에 누적되며, 치료 또는 보호를 담당하는 유관련자가 입력한 추가 정보까지 반영해 개인에게 최적화된 운동프로그램 컨텐츠를 생성하여 다시 제공한다.","features":[{"k":"특징","v":"증강현실 디바이스의 3D 깊이 카메라로 모션을 측정해 상지 강도·상지 유연도·하지 균형도의 신체 역량과 지각력·기억력·주의집중력이 필요한 문제의 정답 선택으로 인지 역량을 수치화하고, 클라우드 서버의 통합 개인건강기록(PHR)에 누적 저장해 처방에 활용한다."},{"k":"효과","v":"개인 상태에 맞는 맞춤형 운동프로그램을 제공해 발달장애인의 인지능력과 신체능력을 향상시킬 수 있고, 의료전문가와 보호자뿐 아니라 환자 본인도 건강기록을  이를 포함하는 항염용 조성물","field":"의료","status":"등록","regNo":"10-2259832","regDate":"2021.05.27","appNo":"10-2019-0113050","appDate":"2019.09.11","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2039.09.11","inventor":"김승영","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 포르모노네틴 유도체인 포르모노네틴 7-O-포스페이트 및 이를 유효성분으로 포함하는 항염용 조성물에 관한 것으로, 바실러스 아밀로리퀘파시엔스 균주를 이용한 생물전환법으로 포르모노네틴으로부터 유도된 신규 화합물이다. 염증 반응에 의한 산화질소, 프로스타글란딘, 염증전 사이토카인의 생성을 저해하는 활성을 가지므로 식품, 화장료, 약학 조성물 형태의 항염 소재로 활용된다.","features":[{"k":"특징","v":"미생물의 효소적 기능을 이용한 인산화 반응으로 포르모노네틴에 인산기를 도입한 구조이며, LPS로 자극된 RAW 264.7 세포에서 iNOS 및 COX-2의 발현과 MAPK, NF-κB 관련 단백질의 발현을 저해하는 방식으로 작용한다."},{"k":"효과","v":"모체 화합물인 포르모노네틴에 비해 세포 생존능과 산화질소 생성 저해 활성이 우수하며, PGE2와 IL-1β, IL-6의 생성도 유의적으로 저해하므로 식품, 화장료, 약학 조성물 등 다양한 제형의 항염 소재로 활용할 수 있다."}],"lvl":3,"comparison":[{"item":"유효성분 형태","old":"콩과 식물에서 분리된 포르모노네틴을 그대로 이용하였다","new":"생물전환으로 인산기를 도입한 포르모노네틴 7-O-포스페이트"},{"item":"소재 제조 방식","old":"미생물 발효나 효소처리로 구조 변화를 유도하는 수준","new":"바실러스 아밀로리퀘파시엔스 균주로 전구물질을 인산화한다"},{"item":"기능성 발현","old":"에스트로겐 유사 효과 중심으로 알려진 이소플라본 소재","new":"산화질소·프로스타글란딘·염증전 사이토카인 생성을 저해"}],"applications":[{"title":"항염 기능성 식품","desc":"용액·분말·과립·정제·캡슐 등 제형의 식품 조성물과 식품 첨가제로 항염 기능성을 부여한다"},{"title":"항염 화장료 조성물","desc":"크림·로션·겔·파운데이션 등 국소 적용 제형에 배합해 염증 완화용 화장품으로 활용한다"},{"title":"항염 의약품 개발","desc":"경구 또는 비경구 투여용 약학 조성물로 제제화해 염증 예방·치료 목적의 의약품에 적용한다"}],"figFile":"10-2019-0113050.jpg","figureCaption":"공보 대표도면"},{"id":"p1020190078888","title":"자력을 이용한 격파용 패널","field":"기계","status":"등록","regNo":"10-2258416","regDate":"2021.05.25","appNo":"10-2019-0078888","appDate":"2019.07.01","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2039.07.01","inventor":"양현석","transfer":"매매 · 라이센스","smk":false,"summary":"자력을 이용한 격파용 패널. 서로 맞붙어 하나의 격파용 패널을 형성하는 제1·제2 타격용 패널체와 이들을 자력으로 맞붙은 상태로 유지시키는 자석체를 포함한다. 타격으로 분리된 뒤 다시 자력으로 부착해 재활용할 수 있어 송판 구매 부담을 절감한다.","brief":true,"lvl":1},{"id":"p1020200008035","title":"해양 쓰레기 수거 및 재생 처리용 다기능 선박","field":"기계","status":"등록","regNo":"10-2257043","regD  이용한 용접 후처리 장치","field":"기계","status":"등록","regNo":"10-2240125","regDate":"2021.04.08","appNo":"10-2019-0144976","appDate":"2019.11.13","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2039.11.13","inventor":"편영식","transfer":"매매 · 라이센스","smk":false,"summary":"UNSM을 이용한 용접 후처리 장치. UNSM본체, 전후진을 안내하는 LM가이드를 포함해 작업자가 파지할 수 있는 손잡이를 갖는 파지부재, 양 단부가 본체와 파지부재에 지지되는 가압부재를 포함해 건 형상으로 구현되어 휴대가 용이하며, 용접 후 토우와 열영향부의 균열·변형을 예방한다.","brief":true,"lvl":1},{"id":"p1020190121003","title":"가변 추진 유니트가 장착된 드론","field":"메카트로닉스","status":"등록","regNo":"10-2225256","regDate":"2021.03.03","appNo":"10-2019-0121003","appDate":"2019.09.30","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2039.09.30","inventor":"고국원","transfer":"매매 · 라이센스","smk":false,"summary":"가변 추진 유니트가 장착된 드론. 고정익을 가지는 비행 동체에 착탈 가능하게 결합되는 가변 추진 유니트를 포함하며, 비행 모드 시 공기 저항을 줄이도록 간격이 좁혀지게 회동하는 제1 가변 추진부와 양력·추력을 발휘하도록 회동하는 제2 가변 추진부로 이루어진다.","brief":true,"lvl":1},{"id":"p1020190098308","title":"CYP154C8 효소를 이용한 스테로이드의 탄소-탄소 결합 절단을 위한 생물전환 방법","field":"의료","status":"등록","regNo":"10-2223742","regDate":"2021.02.26","appNo":"10-2019-0098308","appDate":"2019.08.12","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2039.08.12","inventor":"오태진","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 CYP154C8 효소를 이용한 스테로이드의 탄소-탄소 결합 절단 생물전환 방법에 관한 것으로, 프레드니손, 프레드니솔론, 코르티손, 히드로코르티손 등의 스테로이드 기질에서 17번 탄소와 20번 탄소 사이의 C-C 결합을 절단하여 17-케토스테로이드를 생성한다. 스테로이드를 기질로 C-C 결합 절단 반응을 촉매하는 것이 확인된 최초의 박테리아성 사이토크롬 P450 효소를 활용한 기술이다.","features":[{"k":"특징","v":"페레독신 및 페레독신 환원효소를 이용한 NADPH 의존성 시스템, 또는 다이아세톡시요오드벤젠이나 과산화수소 산화제의 존재 하에서 반응이 수행되며, C21 위치의 순차적 히드록시화를 거쳐 측쇄를 절단하는 방식으로 pH 4~10, 20~40℃ 조건에서 진행된다."},{"k":"효과","v":"기존 NADH 의존성 시스템에서 얻어지던 모노-히드록시화 생성물 외에 디-히드록시화물과 C-C 결합 절단물까지 다양한 생성물을 확보할 수 있어, 방부제, 제약화합물, 살충제, 생물 연료, 생물학적 복원 등 광범위한 분야의 약물 개발 방법으로 활용될 수 있다."}],"lvl":3,"comparison":[{"item":"기질 적용 범위","old":"세균 유래 CYP의 C-C 결합 절단은 지방산 기질에 한정되었다","new":"프레드니손 등 스테로이드의 C17-C20 탄소 결합을 절단한다"},{"item":"반응 구동 시스템","old":"NADH와 푸티다레독신에 의존하는 산화·환원 시스템을 사용","new":"NADPH-페레독신계 또는 PIDA·과산화수소 산화제로 반응 구동"},{"item":"생성물 다양성","old":"종래 시스템에서는 모노-히드록시화 생성물만 확인되었다","new":"디히드록시화물, 산화물, C-C 절단물 등 다양한 생성물 확보"}],"applications":[{"title":"스테로이드 의약품 합성","desc":"프레드니손·코르티손 등 스테로이드를 생물전환해 제약 화합물과 신규 유도체를 합성하는 공정에 활용한다"},{"title":"생물학적 복원·생분해","desc":"효소 촉매 탄소-탄소 결합 절단 반응을 이용해 물질의 생물학적 복원 및 생분해 공정에 적용한다"},{"title":"정밀화학 소재 생산","desc":"유기 합성 경로를 통해 방부제, 살충제, 생물 연료용 화학물질 제조에 응용할 수 있다"}],"figFile":"10-2019-0098308.jpg","figureCaption":"공보 대표도면"},{"id":"p1020210017641","title":"과속방지턱을 이용한 전기 생산 장치","field":"기계","status":"공개","regNo":"","regDate":"","appNo":"10-2021-0017641","appDate":"2021.02.08","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2041.02.08","inventor":"이장범","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 차량이 과속방지턱을 통과할 때 발생하는 가압력을 이용해 전기를 생산하는 장치에 관한 것으로, 과속방지턱에 설치된 가압유닛이 받은 압력을 연결유닛으로 발전유닛에 전달해 전기를 생성하고 저장유닛에 축전한다. 가압유닛·발전유닛·연결유닛·저장유닛과 이들의 작동을 제어하는 컨트롤러로 구성되며, 감속 기능만 하던 과속방지턱에 별도 연료나 공해물질 없이 발전 기능을 부여한다.","features":[{"k":"특징","v":"가압유닛은 쇼크업 쇼바와 쇼바 커버로 된 충격흡수부재를 갖추고, 연결배관 내부의 유동유체가 압력을 발전유닛의 작동부재에 전달해 피스톤 운동으로 기계적 에너지를 만들며 발전기가 이를 전기로 변환하고, 압전소자와 컨트롤러가 함께 구성된다."},{"k":"효과","v":"차량 통과 시의 압력만으로 전기를 생성해 축전기에 저장하고 전력선을 통해 도로 인근 가로등이나 신호등에 공급할 수 있어, 별도 동력원과 연료가 필요한 기존 발전 설비의 비용과 연소가스 등 환경오염 문제를 줄일 수 있다."}],"lvl":3,"comparison":[{"item":"발전 동력원","old":"별도의 연료나 물 등 에너지원이 필요하고 공해물질이 발생","new":"차량이 과속방지턱을 통과할 때의 가압력을 동력으로 사용"},{"item":"과속방지턱 기능","old":"콘크리트가 충전된 본체로 차량 감속 기능만 수행함","new":"가압유닛과 발전유닛을 결합해 감속과 전기 생산을 함께 수행"},{"item":"설비 규모·비용","old":"풍력·수력·화력 발전은 대형 설비로 구축 비용이 과다함","new":"도로 과속방지턱에 설치해 축전기에 전기를 저장하고 공급"}],"applications":[{"title":"도로 압력 발전 설비","desc":"차량 통과 시의 압력을 유동유체로 전달해 발전기를 작동시키는 도로 발전 설비"},{"title":"가로등 전력 공급","desc":"학교 주변 도로와 이면도로의 가로등에 축전된 전기를 공급해 운영 비용 절감"},{"title":"과속방지턱 일체형 장치","desc":"급커브 도로와 사고 위험 구간의 과속방지턱에 발전 기능을 부가한 일체형 장치"}],"figFile":"10-2021-0017641.jpg","figureCaption":"공보 대표도면"},{"id":"p1020200112770","title":"열증착기용 필라멘트 히터","field":"전기·전자","status":"등록","regNo":"10-2216166","regDate":"2021.02.08","appNo":"10-2020-0112770","appDate":"2020.09.04","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2040.09.04","inventor":"박영욱","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 유기 발광 다이오드 등 유기 전자 소자 제작용 열증착기에 사용되는 필라멘트 타입 히터에 관한 것으로, 유기재료를 수용하는 도가니의 외면을 에워싸는 코일 형상을 가지되 용기 부위별로 코일 턴수를 가변시킨 구조이다. 기존 히터는 도가니 하단부나 측면부 재료가 먼저 승화되어 상단부 고체 유기재료가 비산하거나 상대적으로 저온인 도가니 상단에 재료가 달라붙어 막히는 문제가 있었다. 본 기술은 적은 비용으로 이러한 문제를 개선해 공정 수율을 높이고자 한다.","features":[{"k":"특징","v":"도가니를 상단부·중단부·하단부로 구분하고 상단부를 에워싸는 코일 턴수를 중단부나 하단부보다 많게 하거나 하단부에서 상단부로 갈수록 턴수가 증가하도록 하여, 동일 두께 필라멘트의 감김 횟수와 코일 피치만으로 발열체를 상단에 집중시켜 온도 분포를 조절한다. 퍼널 형상 개구부를 에워싸는 코일은 도가니를 떠받치는 받침대 역할도 한다."},{"k":"효과","v":"도가니 상단 온도가 상대적으로 높아져 상단 재료부터 승화되므로 유기재료 비산과 승화 재료의 재증착에 의한 도가니 막힘을 방지한다. 실험에서 종래 1000nm 증착 후 약 5mm의 측면 증착 성장이 관찰된 반면 본 기술은 5000nm 증착 후에도 0.1mm 이하에 불과했고, 증착 박막 신뢰도 향상과 고용량 도가니 적용, 예열·전체 공정 시간 단축을 기대할 수 있다."}],"lvl":3,"comparison":[{"item":"코일 권선 방식","old":"도가니 외면에 균일한 턴수의 코일을 감아 간접 가열하는 방식","new":"용기 부위별로 코일 턴수와 피치를 달리해 상단부를 집중 가열"},{"item":"유기재료 비산","old":"하단·측면 재료가 먼저 승화되어 상단 고체 재료가 날리는 현상","new":"상단 턴수를 늘려 상부부터 가열되도록 해 재료 비산을 방지"},{"item":"도가니 막힘 현상","old":"온도가 낮은 도가니 상단부에 재료가 달라붙어 상단이 막히는 문제","new":"상단부 코일 피치를 좁혀 상단 온도를 높여 막힘 현상을 억제"}],"applications":[{"title":"OLED 유기박막 증착","desc":"유기 발광 다이오드 등 유기 전자 소자 제작을 위한 열증착기 증발원 가열 히터로 적용"},{"title":"유기 전자소자 공정장비","desc":"진공 챔버 내 증발원 도가니를 간접 가열하는 필라멘트 타입 히터 부품으로 공급 가능"},{"title":"고용량 도가니 증착 공정","desc":"재료 종류에 무관하게 고용량 도가니를 적용해 로딩 공정을 단순화하는 증착 라인"}],"figFile":"10-2020-0112770.jpg","figureCaption":"공보 대표도면"},{"id":"p1020200008034","title":"신발 미끄럼 방지 장치","field":"생활","status":"등록","regNo":"10-2208414","regDate":"2021.01.21","appNo":"10-2020-0008034","appDate":"2020.01.21","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2040.01.21","inventor":"이장범","transfer":"매매 · 라이센스","smk":false,"brief":false,"lvl":0},{"id":"p1020200003501","title":"도시락 용기용 손잡이 구조체 및 이를 포함하는 도시락 용기","field":"생활","status":"등록","regNo 라이센스","smk":true,"brief":false,"summary":"본 기술은 갈색거저리 유충을 가수분해하여 얻은 펩타이드를 유효성분으로 포함하는 혈행 개선용 조성물에 관한 것으로, 심혈관 질환의 주요 원인인 혈전과 혈액순환 장애를 완화하는 천연 소재를 제공한다. 아스피린 등 기존 항혈소판 약물의 지혈 과다 억제·소화기 장애 같은 부작용을 피하면서, 혈행 개선용 약학 조성물과 혈전 질환 예방·치료제 및 건강기능식품으로 활용된다.","features":[{"k":"특징","v":"청국장에서 분리한 B. subtilis FP18 균주의 단백질 분해효소로 탈지 밀웜 단백질을 가수분해해 2.0kDa 이하, 아미노산 12개 이하의 저분자 펩타이드를 생산하며, 이 펩타이드가 인슐린 저항성을 감소시키고 혈중 지질 농도를 낮춘다."},{"k":"효과","v":"랫트 급여 시험에서 고지방 식이군의 중성지방이 47.3에서 19.0mg/dl로 크게 감소하고 총콜레스테롤도 낮아지며 HDL 콜레스테롤은 증가하여, 심근경색·뇌졸중 등 혈관 질환의 예방 또는 완화가 기대된다."}],"lvl":3,"comparison":[{"item":"펩타이드 공급원","old":"합성 펩타이드나 유전자 변형 미생물 유래를 사용","new":"갈색거저리 유충을 가수분해해 얻은 천연 펩타이드 사용"},{"item":"생체 안전성","old":"유전자 변형 미생물 유래 소재에 대한 부담이 있었음","new":"천연 원료 유래로 생체 안전성이 높게 확보됨"},{"item":"혈행 관리 접근","old":"생활방식과 식습관 개선 중심의 예방에 의존하였음","new":"저분자 펩타이드 섭취로 혈행 개선 기능성을 부여함"}],"applications":[{"title":"혈행 개선 약학 조성물","desc":"갈색거저리 유충 유래 펩타이드를 유효성분으로 하는 혈행 개선용 약제에 적용"},{"title":"혈전 질환 예방·치료제","desc":"혈전 질환의 예방 또는 치료 용도 약학 조성물의 유효성분으로 활용하는 분야"},{"title":"혈행 개선 건강기능식품","desc":"혈행 개선을 표방하는 건강기능식품의 기능성 원료로 배합하여 제품화에 활용"}],"figFile":"10-2018-0156739.jpg","figureCaption":"공보 대표도면"},{"id":"p1020190072227","title":"구강 모니터링 장치 및 구강 모니터링 방법","field":"의료","status":"등록","regNo":"10-2201816","regDate":"2021.01.06","appNo":"10-2019-0072227","appDate":"2019.06.18","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2039.06.18","inventor":"황찬승","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 치아에 장착해 입 안의 휘발성 황화합물을 측정하고 그 결과를 단말기로 보내 구강 건강 상태를 확인하는 구강 모니터링 장치 및 방법에 관한 것이다. 가스 크로마토그래피나 탁상형 구취측정기는 고가이거나 병원을 직접 방문해야 하는 제약이 있었는데, 본 기술은 착용형 장치로 병원 방문 없이 구취와 건강 상태를 모니터링할 수 있게 하며, 치아 부착 집게형과 마우스피스형 두 가지 형태로 구성된다.","features":[{"k":"특징","v":"구강에 위치하는 본체 어셈블리에 멤브레인 필터와 반도체 가스 센서로 구성된 구취가스 측정부재, 무선 송신기, 배터리를 설치해 암모니아·황화수소·메틸멜캅탄의 종류와 농도를 측정하고, 단말기가 기준값과 비교해 건강 상태를 분석·표시한다."},{"k":"효과","v":"별도의 병원 방문 없이 간편하게 착용해 사용할 수 있어 편의성과 휴대성이 향상되고, 치아에 장착한 상태로 수면 중 측정하면 센서에 충분한 양의 날숨이 공급되어 정확한 측정이 가능하며 결과는 스펙트럼 패턴으로 제시된다."}],"lvl":3,"c ant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2038.10.08","inventor":"김진우","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 기호성이 증진된 곤충 유충 오일의 제조방법에 관한 것으로, 갈색거저리 유충(밀웜) 등에서 추출한 오일에 산 처리, 요소 처리, 흡착제 처리를 순차적으로 적용해 색도 물질과 불쾌취를 제거하는 탈색 공정이다. 종래 밀웜 오일에 잔류하던 알데히드와 저급 지방산을 줄여 화장품 원료 및 식품 소재로 쓸 수 있는 고순도 오일을 제공한다. 요소를 이용한 탈산 공정으로 폐수 발생도 최소화한다.","features":[{"k":"특징","v":"유기용매 추출 또는 압착으로 오일을 얻은 뒤 60~90℃의 황산 등 산으로 수용성 색도 물질을 탈검하고, 60~70℃에서 요소로 탈산 결정화하여 지방산을 분리하며, 활성백토·규산마그네슘·활성탄 등 흡착제를 60~90℃에서 1~2시간 반응시켜 색소와 중금속을 제거하고 항산화 물질을 첨가한다."},{"k":"효과","v":"흡광도(460nm)가 0.844에서 0.135로 낮아져 투명도가 크게 개선되고 포화지방산이 24.8%에서 15.3%로 감소하며, 관능평가에서 탈취와 점성 감소, 기호도가 현저히 향상되었다. 수산화나트륨 대신 요소를 쓰므로 폐수 발생이 적고 산가 0.5~0.7의 고품질 오일을 얻는다."}],"lvl":3,"comparison":[{"item":"정제 공정 구성","old":"밀웜 오일에 대한 탈색 공정이 존재하지 않았음","new":"산·요소 처리와 흡착제 반응을 순차 적용해 정제함"},{"item":"불쾌취와 색도","old":"알데히드와 저급 지방산이 잔류해 특유의 불쾌취 발생","new":"탁도·색도와 불쾌취가 최소화된 고순도 오일을 수득"},{"item":"생체 적용 적합성","old":"잔류 성분으로 생체 적용에 부적합한 문제가 있었음","new":"산가를 0.5~0.7로 낮추고 산화 안정성까지 확보함"}],"applications":[{"title":"화장품용 고급 오일 소재","desc":"보습과 피부 재생 효과를 지닌 곤충 유충 유래 오일을 화장료 소재로 공급하는 분야"},{"title":"피부 기능성 화장료","desc":"식물성 폴리페놀을 더한 오일을 피부 미백·주름 개선·항균 기능성 화장료에 적용"},{"title":"식용곤충 소재 산업화","desc":"대량 사육이 가능한 갈색거저리 유충을 고부가 기능성 오일 원료로 가공하는 분야"}],"figFile":"10-2018-0119734.jpg","figureCaption":"공보 대표도면"},{"id":"p1020190011724","title":"차량용 안전시트","field":"생활","status":"등록","regNo":"10-2137663","regDate":"2020.07.20","appNo":"10-2019-0011724","appDate":"2019.01.30","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2039.01.30","inventor":"홍기순","transfer":"매매 · 라이센스","smk":false,"summary":"차량용 안전시트. 시트쿠션에 상하 이동 가능하게 연결되는 등받이와 헤드레스트, 등받이 상부 양측에 틸팅 가능하게 결합되어 탑승자의 어깨를 감싸는 안전바, 양측면에 설치되어 복부를 선택적으로 감싸는 한 쌍의 복부벨트를 포함한다.","brief":true,"lvl":1},{"id":"p1020180149997","title":"고효율의 연속식 미세조류 배양시스템","field":"바이오","status":"등록","regNo":"10-2134885","regDate":"2020.07.10","appNo":"10-2018-0149997","appDate":"2018.11.28","applicant":"선문대학교 산학협력단 · 씨이비티 주식회사","coAppli 매 · 라이센스","smk":false,"summary":"아로마 발향기. 아로마 오일과 허브 오일을 주축으로 하는 아로마 향을 발향해 사용자의 수면을 유도하고 집중력을 향상시키거나 스트레스를 해소할 수 있도록 하며, 휴대가 가능해 다양한 장소에서 사용할 수 있다.","brief":true,"lvl":1},{"id":"p1020180100341","title":"투사 매핑 장치","field":"기계","status":"등록","regNo":"10-2089501","regDate":"2020.03.10","appNo":"10-2018-0100341","appDate":"2018.08.27","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2038.08.27","inventor":"강문호","transfer":"매매 · 라이센스","smk":false,"summary":"투사 매핑 장치. 대상 물체 상에 투사되는 설정 형상의 패치를 생성하는 패치부, 복수의 패치를 결합하는 결합부, 결합 패치에 이미지를 내삽하는 이미지부를 포함한다.","brief":true,"lvl":1},{"id":"p1020180069106","title":"세이프티 인덕션 시스템","field":"소프트웨어","status":"등록","regNo":"10-2083999","regDate":"2020.02.26","appNo":"10-2018-0069106","appDate":"2018.06.15","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2038.06.15","inventor":"최문종","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 사용자와 조리물의 상태를 센서로 감지해 인덕션을 자동 제어하는 세이프티 인덕션 시스템에 관한 것으로, 인덕션 모듈, 수동제어 모듈, 자동제어 모듈, 데이터수집 모듈 및 환풍 모듈로 구성된다. 사용자의 연령과 부재, 음식 온도, 사용 시간을 파악해 인덕션 동작과 출력을 조절하고 환풍 모듈을 자동으로 작동시켜 안전한 조리 환경을 유지한다. 가정에서 쓰이는 조리기기의 안전성을 높이기 위한 제어 시스템이다.","features":[{"k":"특징","v":"카메라 또는 적외선 센서가 사용자의 신장, 걸음걸이 패턴, 신체비율을 측정하면 자동제어 모듈이 기준값과 비교해 연령을 판정하고 소아로 판정되면 동작을 차단하며, 온도 센서가 측정한 용기·음식 온도와 작동시간을 근거로 인덕션 출력을 높이거나 낮춘다."},{"k":"효과","v":"어린이 사용으로 인한 사고와 청소 시 화상을 예방하고, 사용자 부재 시 출력을 낮추거나 전원을 차단해 음식이 타는 것을 막으면서 전기 소모를 줄일 수 있다. 음식 온도를 일정하게 유지하고 증기·냄새를 자동 환기하여 조리 환경의 안전성과 편의성이 향상된다."}],"lvl":3,"comparison":[{"item":"인덕션 제어 방식","old":"사용자가 직접 조작하는 수동 제어에 의존하였음","new":"센서 데이터를 받아 동작과 온도를 자동으로 제어함"},{"item":"안전 감지 범위","old":"넘침 감지 등 제한된 상황만 감지하는 수준이었음","new":"사용자 연령과 부재, 음식 온도까지 감지해 제어"},{"item":"환풍 모듈 연동","old":"사용자가 환풍 장치를 별도로 조작해야 하였음","new":"사용자 감지나 조작에 따라 환풍 모듈을 자동 작동"}],"applications":[{"title":"가정용 안전 인덕션","desc":"어린이 사용과 사용자 부재를 감지해 사고를 예방하는 가정용 조리기기에 적용"},{"title":"조리 공간 환기 시스템","desc":"조리 중 발생하는 증기와 냄새를 감지에 연동해 환기하는 주방 설비에 활용"},{"title":"스마트 주방 가전 제어","desc":"카메라·적외선·온도 센서 데이터를 이용한 주방 가전 자동제어 모듈에 적용"}],"figFile":" "expiry":"2038.09.05","inventor":"송재경","transfer":"매매 · 라이센스","smk":false,"summary":"안트라퀴논-O-글루코시드 생산용 재조합 미생물 및 이를 이용한 생산 방법. 바실러스 리체니포미스 DSM 13 유래 글라이코실전이효소(YjiC)가 도입된 재조합 대장균을 이용한 생체내 전환 방법으로 환경 친화적이고 저렴하게 안트라퀴논 유도체를 생산할 수 있다.","brief":true,"lvl":1},{"id":"p1020180074573","title":"이종 금속재료의 용접방법 및 용접장치","field":"기계","status":"등록","regNo":"10-2071223","regDate":"2020.01.22","appNo":"10-2018-0074573","appDate":"2018.06.28","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2038.06.28","inventor":"권영철","transfer":"매매 · 라이센스","smk":false,"summary":"이종 금속재료의 용접방법 및 용접장치. 물성이 서로 다른 금속부재를 맞닿게 배치해 용접라인을 형성하고, 용접라인 상에 금속분말을 도포한 뒤 고주파 가열로 예열하여 상호 융점이 상이한 이종 금속재료를 빠르고 신뢰성 있게 용접한다.","brief":true,"lvl":1},{"id":"p1020170179407","title":"교육용 음악교육 장치","field":"기계","status":"등록","regNo":"10-2071560","regDate":"2020.01.22","appNo":"10-2017-0179407","appDate":"2017.12.26","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2037.12.26","inventor":"박용재","transfer":"매매 · 라이센스","smk":false,"summary":"교육용 음악교육 장치. 구슬, 경사면이 형성된 수용판, 8개의 통로를 제공하며 하부면에 구슬 통과를 인지하는 센서가 설치된 구분통로, 구분통로 끝단에서 구슬이 센서를 통과하면 회전하는 레버를 포함해 해당 음이 발생되도록 구성된다.","brief":true,"lvl":1},{"id":"p1020170023812","title":"커피박 추출물을 유효성분으로 포함하는 항노화용 화장료 조성물","field":"의료","status":"등록","regNo":"10-2068736","regDate":"2020.01.15","appNo":"10-2017-0023812","appDate":"2017.02.22","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2037.02.22","inventor":"김진우","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 커피 추출 후 남는 폐기물인 커피박의 추출물을 유효성분으로 포함하는 항노화용 화장료 조성물에 관한 것으로, 추출 조건을 최적화해 폴리페놀 등 피부 개선 유효성분의 함량을 현저히 높인 천연 소재 기술이다. 항산화용, 주름 개선용, 항노화용 화장료로 제공되며 유연화장수, 영양크림, 에센스, 앰플, 팩 등 다양한 제형으로 제형화할 수 있다. 커피 가공 과정에서 버려지는 폐기물을 고부가 화장품 소재로 재활용하는 기술이다.","features":[{"k":"특징","v":"반응표면법으로 추출 변수를 최적화하여, 항산화용은 40~60%(w/w) 에탄올과 90~110℃ 조건에서, 주름 개선용은 90~100%(w/w) 에탄올과 45~65℃ 조건에서 초음파 추출함으로써 폴리페놀 함량과 콜라게네이즈 저해 활성을 각각 극대화한다."},{"k":"효과","v":"최적 조건의 추출물은 폴리페놀 함량과 콜라게네이즈 저해 활성이 비교예보다 현저히 높게 나타났고, 섬유아세포·멜라닌형성세포·각질세포에서 세포 독성이 확인되지 itle":"커피박 발효 추출물을 유효성분으로 포함하는 화장료 조성물","field":"의료","status":"등록","regNo":"10-1989874","regDate":"2019.06.11","appNo":"10-2017-0023813","appDate":"2017.02.22","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2037.02.22","inventor":"김진우","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 커피 추출 후 남는 커피박을 미생물로 발효시켜 얻은 발효 추출물을 유효성분으로 포함하는 피부 미백용 화장료 조성물에 관한 것으로, 연간 수백만 톤씩 폐기되는 자원을 기능성 화장품 소재로 활용하는 기술이다. 발효 과정을 통해 미백 활성 성분과 폴리페놀 함량을 높였으며, 유연화장수, 영양크림, 에센스, 팩 등 다양한 제형으로 제형화할 수 있다. 발효를 거치지 않은 추출물에 비해 티로시나아제 저해 활성이 크게 높아진다.","features":[{"k":"특징","v":"바실러스 서브틸리스, 스키조사카로마이세스 폼베, 사카로마이세스 칼스버겐시스 균주를 커피박에 접종해 30℃에서 72시간 발효시킨 뒤 여과·동결건조하여 발효 추출물을 수득하며, 발효 과정에서 생리활성물질이 저분자화되어 피부 침투능이 개선된다."},{"k":"효과","v":"세 균주의 발효 추출물은 티로시나아제 저해 활성이 30.5~36.1%로 양성대조군인 코직산과 동등한 수준이었고 폴리페놀 함량도 미발효 추출물의 2배 이상으로 높게 나타나, 세포 독성 없이 우수한 피부 미백 효과를 기대할 수 있다."}],"lvl":3,"comparison":[{"item":"미백 활성 소재","old":"하이드로퀴논·코직산 등 합성 미백 성분을 사용하였음","new":"커피박을 미생물로 발효시킨 천연 유래 추출물을 사용"},{"item":"제형 안정성","old":"제형 중에서 분해되어 착색이나 이취가 발생할 수 있었음","new":"천연 발효 추출물 기반으로 안정적인 배합이 가능해짐"},{"item":"유효성분 함량","old":"커피박을 그대로 추출해 활성 성분 함량이 제한적이었음","new":"균주 접종 발효로 미백·항산화 활성 성분 함량을 크게 증대"}],"applications":[{"title":"피부 미백 화장료","desc":"커피박 발효 추출물을 영양크림·에센스·앰플·팩 등에 배합한 미백 기능성 화장품 제품에 적용"},{"title":"발효 화장품 원료","desc":"바실러스·효모 등 균주 발효 공정을 이용한 발효 화장품 원료의 생산 및 공급 분야에 활용"},{"title":"커피 부산물 업사이클링","desc":"커피 추출 후 남는 커피박을 발효 소재로 전환하여 활용하는 부산물 업사이클링 분야에 적용"}]},{"id":"p1020170141095","title":"신규한 알리자린 알콕시드 유도체 및 그 용도","field":"의료","status":"등록","regNo":"10-1985865","regDate":"2019.05.29","appNo":"10-2017-0141095","appDate":"2017.10.27","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2037.10.27","inventor":"송재경","transfer":"매매 · 라이센스","smk":false,"summary":"신규한 알리자린 알콕시드 유도체, 이의 제조방법 및 이를 포함하는 암 치료용 약학적 조성물. 글리코실전달효소 및 메틸전이효소 유전자가 도입된 재조합 미생물로 다양한 안트라퀴논 유도체 제조가 가능하며, 신규 유도체는 항암활성을 가져 의약 분야에서 유용하다.","brief":true,"lvl":1},{"id":"p1020180076641","title":"고유수용성 감각을 이용한 운동 장치를 제어하는 장치 및 그 방법","field":"기계","status":"등록", rison":[{"item":"미백 원료 범위","old":"닥나무추출물·알부틴 등 고시된 원료에 의존하였음","new":"해당화·장미꽃 추출물로 포지티브리스트 제약 없이 사용"},{"item":"원료 안정성","old":"코지산은 불안정성과 피부 부작용으로 사용이 제한적","new":"식물 추출물 기반으로 부작용 부담이 적은 조성 구현"},{"item":"유효성분 조성","old":"단일 미백 성분을 중심으로 조성이 구성되었음","new":"장미꽃·해당화 추출물에 아스코빌팔미테이트를 보조 배합"}],"applications":[{"title":"미백 기능성 화장료","desc":"장미꽃·해당화 추출물과 아스코빌팔미테이트를 배합한 미백 기능성 화장품 제품에 적용"},{"title":"식물 추출물 원료 제조","desc":"음건과 환류냉각·감압여과를 조합한 식물 미백 추출물의 제조·공급 분야에 활용"},{"title":"색소 침착 개선 제품","desc":"기미·주근깨 등 멜라닌 과잉 침착의 완화를 겨냥한 스킨케어 제품 개발에 적용"}],"figFile":"10-2017-0067049.jpg","figureCaption":"공보 대표도면"},{"id":"p1020170023811","title":"갈색거저리 추출물을 유효성분으로 포함하는 화장료 조성물","field":"의료","status":"등록","regNo":"10-1971257","regDate":"2019.04.16","appNo":"10-2017-0023811","appDate":"2017.02.22","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2037.02.22","inventor":"김진우","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 갈색거저리(Tenebrio molitor) 추출물을 유효성분으로 포함하는 피부 미백용 화장료 조성물에 관한 것으로, 타이로시네이즈 저해 활성을 갖는다. 갈색거저리는 사육이 용이하고 단백질 함량이 풍부한 곤충이나 피부 미용 용도의 연구가 없던 소재로, 본 기술은 그 추출물에 피부 미백 활성을 가지는 유효성분이 다량 함유되어 있음을 확인하고 이를 천연 기능성 화장품 소재로 활용한 것이다.","features":[{"k":"특징","v":"건조해 분말화한 갈색거저리를 90~100%(w/w) 농도의 에탄올로 60~80도에서 초음파 추출하며, 반응표면법으로 최적화한 결과 추출온도 71.4도, 추출시간 58.2초, 에탄올 98.5%에서 타이로시네이즈 저해율이 최대로 산출되었다. 화장수, 크림, 에센스, 앰플, 팩, 파우더 등으로 제형화된다."},{"k":"효과","v":"실시예의 타이로시네이즈 저해 활성은 101.5~109.0%로 기존 미백 소재인 코직산(106.1%)과 아스코르빈산(102.8%)에 비견되거나 더 높았고, 섬유아세포와 멜라닌형성세포, 각질세포 시험에서 세포 독성이 확인되지 않았다. 천연 원료의 유효성분을 함유해 피부 건강에 유익하고 미백 효과가 우수하다."}],"lvl":3,"comparison":[{"item":"미백 유효성분","old":"아스코르빈산, 하이드로퀴논, 코직산, 알부틴 등을 사용함","new":"갈색거저리 추출물을 유효성분으로 포함해 미백에 사용함"},{"item":"생체 안전성","old":"생체 내 안전성이나 효능이 불명확해 사용이 제한되었음","new":"기능성과 함께 생체 안전성이 우수한 화장료 조성물을 제공"},{"item":"원료 조달성","old":"식물 추출물 등 기존 천연 원료에 주로 의존해 왔음","new":"사육이 용이해 대량증식이 가능한 갈색거저리를 원료로 함"}],"applications":[{"title":"피부 미백 화장료","desc":"타이로시네이즈 저해 활성을 갖는 갈색거저리 추출물을 유효성분으로 하는 피부 미백용 화장료에 적용된다."},{"title":"천연물 기능성 화장품","desc":"여러 화학물질에 의한 피부 자극을 줄이기 위한 천연 재료 기반 기능성 화장품 원료로 활용할 수 있다."},{"title":"다양한 화장품 제형화","desc":"화장수, 수분·영양크림, 에센스, 앰플, 젤, 클렌징폼, 팩, 스프레이, 파우더 등으로 제형화해 적용된다."}],"figFile":"10-2017-0023811.jpg","figureCaption":"공보 대표도면"},{"id":"p1020170075608","title":"제니스테인 유도체","field":"바이오","status":"등록","regNo":"10-1969641","regDate":"2019.04.10","appNo":"10-2017-0075608","appDate":"2017.06.15","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2037.06.15","inventor":"김승영","transfer":"매매 · 라이센스","smk":false,"summary":"제니스테인 유도체. 신규 유도체는 다양한 세균에 대해 항균 활성이 우수하며 항생제 저항성 세균에 대한 항균용 조성물로 유용하게 활용할 수 있다.","brief":true,"lvl":1},{"id":"p1020160180222","title":"신규한 제니스테인 글리코시드 유도체, 이를 포함하는 약학적 조성물 및 그 제조방법","field":"바이오","status":"등록","regNo":"10-1966882","regDate":"2019.04.02","appNo":"10-2016-0180222","appDate":"2016.12.27","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2036.12.27","inventor":"송재경","transfer":"매매 · 라이센스","smk":false,"summary":"신규한 제니스테인 글리코시드 유도체, 이를 포함하는 약학적 조성물 및 제조방법. 다양한 제니스테인 유도체 제조가 가능하며, 신규 유도체는 항암활성과 향상된 물 용해성을 가져 의약 분야에서 유용하게 사용될 수 있다.","brief":true,"lvl":1},{"id":"p1020170095513","title":"발목 운동 기구","field":"생활","status":"등록","regNo":"10-1965683","regDate":"2019.03.29","appNo":"10-2017-0095513","appDate":"2017.07.27","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2037.07.27","inventor":"유재호","transfer":"매매 · 라이센스","smk":false,"summary":"발목 운동 기구. 고정용 밑판, 밑판 상면에 일단이 부착 고정되는 스프링 부재, 스프링 부재 타단에 탈착 가능하게 설치되는 부착용 발판으로 구성되어 발목의 근력과 균형능력을 증진시킨다. 부착용 판 교체로 하나의 장비로 여러 기능을 수행할 수 있어 제작 비용도 줄일 수 있다.","brief":true,"lvl":1},{"id":"p1020180102720","title":"시편의 온도를 제어하면서 타격하여 특성을 측정하는 시편특성 측정장치","field":"전기·전자","status":"등록","regNo":"10-1955439","regDate":"2019.02.28","appNo":"10-2018-0102720","appDate":"2018.08.30","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2038.08.30","inventor":"문태용","transfer":"매매 · 라이센스","smk":false,"summary":"시편의 온도를 제어하면서 타격하여 특성을 측정하는 시편특성 측정장치. 거치유닛, 타격유닛, 측정유닛에 더해 장치본체를 수용하며 시편의 온도를 변화시키는 온도 조절유닛을 포함해, 온도에 따른 공진진동수 변화로 시편 특성을 파악한다.","brief":true,"lv 930","regDate":"2018.12.31","appNo":"10-2018-0113568","appDate":"2018.09.21","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2038.09.21","inventor":"정호빈","transfer":"매매 · 라이센스","smk":false,"brief":false,"lvl":0},{"id":"p1020180113479","title":"실린더 형상에 대한 IET 기법을 이용한 동탄성 측정방법","field":"기계","status":"등록","regNo":"10-1935932","regDate":"2018.12.31","appNo":"10-2018-0113479","appDate":"2018.09.21","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2038.09.21","inventor":"주혜원","transfer":"매매 · 라이센스","smk":false,"brief":false,"lvl":0},{"id":"p1020170014923","title":"스마트 전기 방충망 제어 장치 및 그 방법","field":"생활","status":"등록","regNo":"10-1935266","regDate":"2018.12.28","appNo":"10-2017-0014923","appDate":"2017.02.02","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2037.02.02","inventor":"양정훈","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 전기 감전을 이용해 해충을 퇴치하는 전기 방충망을 제어하는 장치 및 방법에 관한 것으로, 전기 방충망에 인체 접근 감지부, 액체 접촉 감지부, 미세먼지 농도 측정부, 충격 감지부와 제어부를 구비한다. 제어부는 인체 감지 신호와 액체 감지 신호의 발생 여부에 따라 방충망의 전원 공급을 제어하며, 방충망의 동작 상태 정보와 수치화한 미세먼지 농도 정보를 통신부를 통해 사용자 단말에 전송한다.","features":[{"k":"특징","v":"인체 접근 감지부는 인체가 방출하는 적외선 파장을 특정 대역만 통과시키는 필터로 검출하고, 빗물 감지 센서가 액체의 흐름과 건조도를 검출해 건조가 완료되면 전원을 다시 공급한다. 평소에는 설정 주기마다 설정 시간만 통전시켜 배터리 소모를 줄이며, 가속도 센서와 기울기 센서로 기준 기울기 초과를 감지하면 침입 신호를 생성한다."},{"k":"효과","v":"방충망 근처에서 사람의 움직임이 감지되거나 방충망이 물에 노출되면 전원을 차단해 감전 사고와 그에 따른 안전사고의 발생을 예방할 수 있다. 충격이나 기울기 변화를 사용자 단말로 전달해 창문을 통한 외부침입자 발생이나 방충망 손상 여부를 쉽게 파악할 수 있고, 미세먼지 농도 정보로 즉각 대처할 수 있다."}],"lvl":3,"comparison":[{"item":"해충 퇴치 방식","old":"조밀한 메시로 해충 침입을 물리적으로 차단하는 데 그침","new":"전기 감전을 이용해 방충망에서 해충을 직접 퇴치함"},{"item":"안전사고 방지","old":"전기 감전식 퇴치장치는 유인된 해충 제거에만 초점을 둠","new":"인체·액체·충격 감지 센서로 위험 상황에 전원을 차단함"},{"item":"부가 정보 제공","old":"해충 차단 기능만 수행하고 주변 환경 정보는 제공하지 않음","new":"미세먼지 농도를 측정해 통신 모듈로 사용자 단말에 전달함"}],"applications":[{"title":"스마트 전기 방충망","desc":"창문과 출입문에 설치해 전기 감전으로 해충을 퇴치하면서 안전을 위해 전원을 제어하는 방충망에 적용된다."},{"title":"가정·사무실 해충 관리","desc":"바퀴벌레, 개미, 진드기, 모기, 파리 등 생활 해충의 침입을 차단해야 하는 실내 공간 관리에 활용된다."},{"title":"미세먼지 정보 알림","desc":"미세먼지 센서로 측정한 농도를 사용자 단말 어플리케이션에 표시해 주변 환경 정보를 알리는 데 쓰인다."}],"figFile":"10-2017-0014923.jpg","figureCaption":"공보 대표도면"},{"id":"p1020170061391","title":"인터넷 기반의 마을공동체 교육과정연계 기숙사 학생선발 시스템 및 학생선발 방법","field":"소프트웨어","status":"등록","regNo":"10-1931430","regDate":"2018.12.14","appNo":"10-2017-0061391","appDate":"2017.05.18","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2037.05.18","inventor":"김홍석","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 대학교 기숙사 학생 선발을 학생자치조직인 마을공동체 교육과정과 연계하여 인터넷 기반으로 진행하는 시스템 및 학생선발 방법에 관한 것으로, 성적과 거주지 거리에 주로 의존해온 기존 선발 방식을 보완한다. 학생이 직접 마을공동체 교육과정을 제안하고 희망하는 공동체에 입촌을 신청하는 형식으로 기숙사 신청과 선발이 이루어진다. 선정 결과 공개와 입촌 신청, 촌장과 입촌자의 상호 평가까지 하나의 시스템 화면에서 처리된다.","features":[{"k":"특징","v":"관리서버가 화면 제공부, 사용자 접수부, 설정부, 성적정보 확인부, 자격 심사부, 등록부, 자동평가부, 선정부, 목록 열람부, 마을공동체 배정부, 평가부로 구성되며, 등록된 희망마을공동체 정보를 키워드별 가중치 분석으로 자동평가한 뒤 정성평가 결과를 합산해 촌장과 마을공동체를 선정한다."},{"k":"효과","v":"우수한 교육과정의 제시 여부가 자동으로 평가되어 선발 절차가 객관화·자동화되고, 학생이 스스로 필요한 프로그램을 선정하고 참여하는 형태로 기숙사 선발이 이루어져 기숙사의 교육공동체 기능을 강화할 수 있다."}],"lvl":3,"comparison":[{"item":"학생 선발 기준","old":"성적과 거주지까지의 거리를 주된 기준으로 선발하였음","new":"제안된 교육과정 내용을 평가해 촌장과 입촌자를 선발"},{"item":"평가 처리 방식","old":"선발 절차의 자동화가 이루어지지 않아 처리에 한계","new":"키워드 분석 자동평가와 정성평가 점수를 합산하여 선정"},{"item":"기숙사 운영 연계","old":"기숙사 공실 예약 등 공간·재정 관리에 초점이 있었음","new":"자치 단위인 촌과 교육과정을 연계한 공동체 운영을 지원"}],"applications":[{"title":"대학 기숙사 선발 시스템","desc":"촌장·입촌자 공모와 자동평가·정성평가를 결합한 대학 기숙사생 선발 운영에 적용"},{"title":"학생자치 공동체 운영","desc":"마을공동체 단위의 교육과정 등록과 상호 평가를 지원하는 학생자치 활동 관리에 활용"},{"title":"교육과정 연계 평가 플랫폼","desc":"제안서 키워드 분석 자동평가와 정성평가를 합산하는 교육 프로그램 선발 플랫폼에 적용"}],"figFile":"10-2017-0061391.jpg","figureCaption":"공보 대표도면"},{"id":"p1020170055261","title":"사중 도핑된 업컨버팅 알파사이알론 세라믹스 및 그 제조방법","field":"전기·전자","status":"등록","regNo":"10-1923311","regDate":"2018.11.22","appNo":"10-2017-0055261","appDate":"2017.04.28","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2037.04.28","inventor":"이수완","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 이터븀, 어븀, 홀뮴, 툴륨이 사중 도핑된 업컨버팅 알파사이알론 세라믹스 및 그 제조방법에 관한 것으로, 980nm 적외광을 조사하면 청색·녹색·적색 영역에서 모두 발광하여 백색광 특성을 나타내는 투광성 세라믹 소재이다. 고온 안정성과 높은 강도를 유지하면서 적외광 투과 특성도 우수해 백색 발광다이오드와 적외선 투과창에 응용될 수 있다. 세라믹스 성형체와 그 성형체를 제조하는 방법이 함께 제시된다.","features":[{"k":"특징","v":"(Yb,Er,Tm,Ho)xSi12-m-nAlm+nOnN16-n 조성의 알파사이알론을 90wt% 이상 포함하며, 알파-실리콘나이트라이드와 희토류 산화물 및 AlN 분말을 혼합·압축한 뒤 질소분위기에서 1800~1950℃, 25~30MPa 핫프레스 방식으로 소성해 두께 200~300㎛의 성형체로 제조한다."},{"k":"효과","v":"네 원소를 함께 도핑해 CIE 색좌표 (0.38, 0.45)의 근접 백색광을 얻으므로 기존 청색LED 기반 백색광보다 청색 성분이 적어 눈의 피로를 줄이고 별도 형광체층이 필요 없으며, 1500nm에서 70~80%의 투과도와 기존 투광성 세라믹스보다 높은 경도·파괴인성을 나타낸다."}],"lvl":3,"comparison":[{"item":"백색광 구현 방식","old":"청색 LED에 황색형광체를 적용해 백색광을 얻었음","new":"사중 도핑 세라믹스 자체가 청·녹·적 발광으로 백색광 구현"},{"item":"청색광 부담","old":"청색 LED 광으로 눈의 피로·불면 등 불쾌감 우려가 있었음","new":"청색광 성분이 적어 눈의 피로 등 불쾌감을 줄일 수 있음"},{"item":"기계적 물성","old":"YAG·Y2O3 등 상업용 투광성 세라믹스 수준의 경도와 인성","new":"소결 알파사이알론으로 경도와 파괴인성이 더 높게 확보됨"}],"applications":[{"title":"청색광 저감 백색 LED","desc":"별도 형광체층 없이 백색광을 내는 발광다이오드 소재로 적용하여 청색광 부담을 낮춤"},{"title":"적외선 투과창 소재","desc":"1500nm 파장대 광투과도가 높고 강도가 우수한 적외선 투과창 부재 용도로 활용"},{"title":"고온용 투광성 세라믹스","desc":"고온 안정성과 높은 경도·파괴인성이 요구되는 광학용 투광성 세라믹 부품에 활용"}],"figFile":"10-2017-0055261.jpg","figureCaption":"공보 대표도면"},{"id":"p1020160126839","title":"어븀과 툴륨이 공동도핑된 다결정 투광성 업컨버팅 알파사이알론 세라믹스 및 그 제조방법","field":"전기·전자","status":"등록","regNo":"10-1923273","regDate":"2018.11.22","appNo":"10-2016-0126839","appDate":"2016.09.30","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2036.09.30","inventor":"이수완","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 어븀과 툴륨을 공동 도핑한 다결정 투광성 업컨버팅 알파사이알론 세라믹스 및 그 제조방법에 관한 것으로, (Tm,Er)xSi12-m-nAlm+nOnN16-n으로 표시되는 알파사이알론 결정구조를 포함하는 성형체이다. 두께 0.2mm일 때 3000nm 파장의 적외광 투과도가 80% 이상이며, 실온에서 980nm 광을 조사하면 554nm, 678nm, 803nm 파장에서 업컨버전이, 1530nm 파장에서 다운컨버전 발광이 발생한다.","features":[{"k":"특징","v":"알파-실리콘나이트라이드와 Er2O3, Al2O3, Tm2O3, AlN 분말을 혼합해 압축성형한 뒤 질소 분위기에서 1700~1900도, 25~30MPa의 핫프레스 방식으로 소성해 제조한다. 툴륨과 어븀의 몰비는 1:5~5:1, 두 성분 농도의 합은 약 3mol%, 성형체 두께는 200~500um 범위가 바람직하다."},{"k":"효과","v":"소결된 성형체는 경도 20GPa 이상, 파괴인성 5.18MPa m1/2 이상으로 YAG, Y2O3 등 기존 상업적 광학 활성 다결정질 투광성 세라믹스보다 높은 기계적 특성을 나타낸다. 가시광 영역의 흡수 밴드를 통해 감응화된 업컨버전 발광을 기대할 수 있고, 1530nm 다운컨버전은 근적외광 통신 윈도우 등에 응용할 수 있다."}],"lvl":3,"comparison":[{"item":"업컨버전 호스트","old":"산화물과 옥시플루오라이드 유리를 업컨버전 호스트로 사용함","new":"어븀과 툴륨을 공동 도핑한 알파사이알론 결정구조를 사용"},{"item":"화학·기계적 성질","old":"유리 기반 물질은 화학 안정성과 기계적 성질이 불량함","new":"경도와 파괴인성이 YAG, 이트리아 세라믹보다 높게 나타남"},{"item":"광 변환 특성","old":"기존 업컨버전 물질은 적용 분야가 제한되는 한계가 있었음","new":"980nm 광에서 554·678·803nm 업컨버전 발광이 발생함"}],"applications":[{"title":"태양전지 윈도우 소재","desc":"적외선 영역의 광을 수집해 고에너지 파장으로 변환하는 업컨버전 특성을 이용한 태양전지 윈도우 소재로 쓰인다."},{"title":"3D 디스플레이 발광소재","desc":"투광성 다결정 세라믹의 업컨버전 발광 특성을 이용해 3차원 디스플레이용 발광 소재로 적용할 수 있다."},{"title":"고온용 투광성 세라믹","desc":"고온에서도 높은 강도와 경도를 유지하는 사이알론의 특성을 활용한 투광성 광학 세라믹 부재로 활용된다."}],"figFile":"10-2016-0126839.jpg","figureCaption":"공보 대표도면"},{"id":"p1020170164514","title":"표면 처리된 적층 제조 물품의 제조방법","field":"기계","status":"등록","regNo":"10-1921281","regDate":"2018.11.16","appNo":"10-2017-0164514","appDate":"2017.12.01","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2037.12.01","inventor":"편영식","transfer":"매매 · 라이센스","smk":false,"brief":false,"lvl":0},{"id":"p1020170083600","title":"몰래 카메라 감지 장치","field":"전기·전자","status":"등록","regNo":"10-1918855","regDate":"2018.11.08","appNo":"10-2017-0083600","appDate":"2017.06.30","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2037.06.30","inventor":"경종수","transfer":"매매 · 라이센스","smk":false,"brief":false,"lvl":0},{"id":"p1020160150570","title":"국부가열 및 초음파 나노크리스탈 표면개질을 이용한 표면처리방법","field":"기계","status":"등록","regNo":"10-1910467","regDate":"2018.10.16","appNo":"10-2016-0150570","appDate":"2016.11.11","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2036.11.11","inventor":"편영식","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 대형 디젤엔진의 크랭크축이나 대형 기어, 베어링, 금형 등 대형 부품의 필요한 부분에만 열처리를 행해 강도를 향상시키는 표면처리방법에 관한 것으로, 국부가열 기술과 초음파 나노크리스탈 표면개질(UNSM) 기술을 융복합한 것이다. 대상물 준비, 국부가열 처리, UNSM 수행, 마감처리의 단계로 구성되어 동일한 장비에서 연속된 공정으로 국부가열과 표면처리 공정을 처리한다.","features":[{"k":"특징","v":"UNSM은 초음파 장치에 부착된 수 mm 직경의 볼이 초당 4만 회까지 표면을 타격하는 미세 냉간 단조 방식으로, 표면에 나노스킨을 형성해 열처리 시 발생한 결함을 제거하고 인장잔류응력을 압축잔류응력으로 변화시킨다. 열처리부와 표면개질부를 일렬로 배치하고 그 사이에 쿨러를 설치해 이송 중 대상물을 냉각한다."},{"k":"효과","v":"검증실험에서 국부가열과 UNSM을 함께 적용하면 표면거칠기는 Ra 0.52um에서 0.22um로, 마찰계수는 0.78에서 0.64로 감소하고 표면경도는 514HV에서 629HV로 증가했다. 별도의 추가 장비와 공정 없이 저렴한 비용으로 단시간에 대상물의 기계적 특성과 성능, 수명을 모두 향상시킬 수 있다."}],"lvl":3,"comparison":[{"item":"공정 구성 방식","old":"열처리 후 표면개질 사후처리가 전혀 고려되지 않았음","new":"동일 장비에서 국부가열과 UNSM을 연속 공정으로 처리함"},{"item":"잔류응력 상태","old":"열처리 후 대상물 표면에 형성된 인장잔류응력이 남음","new":"초음파 표면개질로 인장잔류응력을 압축잔류응력으로 전환"},{"item":"가열 온도 조건","old":"높은 경도의 상을 얻기 위해 가열 후 적정 속도로 냉각함","new":"기존보다 낮은 온도로 가열하고 탄소성변형 에너지를 부가"}],"applications":[{"title":"대형 기계부품 표면처리","desc":"대형 디젤엔진 크랭크축, 대형 기어, 베어링처럼 전체 열처리가 어려운 부품의 필요 부위 처리에 적용된다."},{"title":"금형공구류 표면개질","desc":"프레스 금형과 철강·제지·반도체 디스플레이 산업의 롤 등 금형공구류의 내마모성과 수명 향상에 쓰인다."},{"title":"피로강도 향상 공정","desc":"표면경도를 높이고 압축잔류응력을 형성해 마모율을 줄이면서 피로강도를 상승시키는 공정에 활용된다."}],"figFile":"10-2016-0150570.jpg","figureCaption":"공보 대표도면"},{"id":"p1020160040939","title":"지능형 인삼 재배 장치","field":"식품","status":"등록","regNo":"10-1907636","regDate":"2018.10.05","appNo":"10-2016-0040939","appDate":"2016.04.04","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2036.04.04","inventor":"고국원","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 인삼 재배 환경을 제어해 재배를 자동화하는 지능형 인삼 재배 장치에 관한 것으로, 재배 정보를 수집하는 센서 유니트, 물과 영양분 등 생장 자원을 공급하는 공급 유니트, 공급량을 제어하는 제어 유니트, 원거리에서 재배 상태를 확인하는 모니터링 유니트로 구성된다. 최장 6년에 이르는 인삼 재배 기간의 환경 관리를 자동화하는 것이 목적이다. 센서 유니트의 구동 전력은 차양막에 설치한 솔라 패널로 얻을 수 있다.","features":[{"k":"특징","v":"토양 PH·수분·온도 센서와 습도·지상 온도 센서, 모니터링 카메라가 측정값을 보내면 제어 유니트가 토양 및 지상 수분 공급부, 환풍부, 냉각수 지하 관정부를 제어하며, 차양막의 솔라 패널로 구동 전력을 얻고 휴대 단말부에서 수동·자동 재배 환경 설정이 가능하다."},{"k":"효과","v":"센서·공급·제어 유니트의 연동으로 인삼 재배에 최적화된 환경을 자동으로 형성할 수 있고, 모니터링 유니트를 통해 재배 상태와 현황을 원거리에서 쉽게 파악하고
