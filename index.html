레이부 및 제어부를 포함한다. 기존 기술은 감지한 상황을 운전자에게 경보하는 데 집중해 이동 수단 외부에 표시하는 수단은 거의 없었다.","features":[{"k":"특징","v":"모듈러 유니트는 거리·이동 상태·경로·주변 상황 유니트가 착탈 가능한 오픈 아키텍처 구조로 상호 연계되며, 메시지 처리부는 장착된 유니트의 수와 종류에 따라 화면을 분할하거나 시간 순차로 정보를 나열한다. 디스플레이부는 이동 수단의 전면·측면·후면에 구비되어 문자와 음성으로 출력한다."},{"k":"효과","v":"거리 센서 측정값을 기준값 구간별 경보 문구로 표시하고 방향 지시등을 보조하거나 내비게이션 기반의 근미래 운행 상태를 미리 알려 운전자와 보행자 간 소통을 가능하게 하며, 이동 수단 간에 메시지를 연쇄 전파해 국소적 이벤트 정보를 신속히 전달할 수 있다."}],"lvl":3,"comparison":[{"item":"정보 전달 대상","old":"감지 결과를 이동 수단 내부의 경보 알람으로만 전달","new":"가공된 메시지를 이동 수단 외부에서 인식하도록 출력"},{"item":"센서 구성 방식","old":"감지 센서가 이동 수단에 고정되어 기능 확장이 제한적","new":"기능별 모듈러 유니트를 호환 착탈하는 오픈 아키텍처"},{"item":"보행자 소통 방식","old":"방향지시등 등 기존 수단으로는 의도 전달이 어려움","new":"디스플레이와 스피커로 정지, 좌우, 긴급 상황을 안내"}],"applications":[{"title":"차량 외부 정보 표시 장치","desc":"차량 전방, 측방, 후방에 마련되어 다른 운전자와 보행자에게 정지, 좌우, 긴급을 알리는 장치"},{"title":"자율주행로봇 상태 표시","desc":"자율주행로봇이 자체 상황과 주변 이벤트 발생을 외부에 표시해 충돌을 방지하는 정보 출력"},{"title":"초음파 거리 감지 모듈","desc":"초음파 센서로 주변 차량과의 거리를 측정하고 측정값과 경보 메시지를 주변에 송출하는 모듈"}],"figFile":"10-2023-0127616.jpg","figureCaption":"공보 대표도면"},{"id":"p1020230189233","title":"주행 및 보행이 가능한 모빌리티","field":"의료","status":"등록","regNo":"10-2833525","regDate":"2025.07.09","appNo":"10-2023-0189233","appDate":"2023.12.22","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2043.12.22","inventor":"이경순","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 주행 및 보행이 가능한 모빌리티에 관한 것으로, 본체부 양측에 회전 가능하게 결합된 2개의 링크와 각 링크 및 바퀴를 구동하는 모터를 갖춘 관절 구조의 제1~제4 레그부를 배치해, 평지에서는 바퀴로 주행하고 계단이나 험로에서는 4족 보행 모드로 전환해 이동한다. 재난·사고 현장처럼 사람이 접근하기 어려운 곳에 진입할 이동 수단이 필요하다는 점에서 출발하였다.","features":[{"k":"특징","v":"보행 시 전방의 제1·제2 레그부가 링크를 접었다 펴며 길이를 늘려 높은 곳에 바퀴를 걸치고, 후방의 제3·제4 레그부가 링크 사이각을 좁히며 본체부를 밀어 전진시킨다. 초음파·틸트·카메라 센서와 레이저 스캐너, GPS로 주변을 감지하고 메인 제어부의 객체 추적부가 스켈레톤 영상 비교로 추적 객체를 선정한다."},{"k":"효과","v":"평지 주행과 장애물 보행을 모두 수행해 사고 현장에서 접근이 어려운 곳 없이 이동하며 구조 대상 확인 등 현장 정보를 사용자 단말기로 전송할 수 있다. 엘리베이터 없는 계단식 주택에서도 짐을 옮길 수 있어 택배 로봇 등 자율주행 운반 용도로도 활용된다."}],"lvl":3,"comparison":[{"item":"지형 이동 방식","old":"바퀴 주행 수단만으로는 험로와 장애물 통과가 어려움","new":"바퀴 주행과 관절 레그 보행을 모드 전환해 이동"},{"item":"장애물 대응","old":"장애물이 많은 현장에는 이동 수단 진입이 제한됨","new":"링크와 모터로 레그를 회전시켜 장애물을 넘어 이동"},{"item":"현장 접근성","old":"사람이 접근하기 어려운 곳의 상황 확인이 곤란","new":"접근이 어려운 곳까지 진입해 현장 정보를 전송"}],"applications":[{"title":"재난 현장 탐색 로봇","desc":"사고 현장에서 사람이 접근하기 어려운 곳에 진입해 구조 대상 유무를 확인하고 전송하는 용도"},{"title":"험로 주행 보행 모빌리티","desc":"평지에서는 바퀴로 주행하고 험로나 장애물에서는 관절 레그 보행으로 전환해 이동하는 기체"},{"title":"자율주행 택배 로봇","desc":"특정 임무를 수행하도록 설정해 자율 주행하면서 목적지까지 택배 물품을 배달하는 용도"}],"figFile":"10-2023-0189233.jpg","figureCaption":"공보 대표도면"},{"id":"p1020220081301","title":"차가버섯 생물전환 발효물을 유효성분으로 함유하는 항산화 조성물","field":"의료","status":"등록","regNo":"10-2833511","regDate":"2025.07.09","appNo":"10-2022-0081301","appDate":"2022.07.01","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2042.07.01","inventor":"김진우","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 차가버섯을 초음파로 추출한 뒤 효소로 발효시킨 차가버섯 초음파 발효 추출물을 유효성분으로 함유하는 항산화 조성물에 관한 것으로, 일반적인 유기용매 추출이나 고온 추출에서 발생하는 용매 잔류 독성과 유효성분 열분해로 인한 수율 감소 및 생리활성 손실 문제를 피하면서 항산화능을 높이는 데 목적이 있다. 동일한 추출물을 항산화용 건강기능식품과 항산화용 화장료 조성물에도 적용할 수 있도록 구성하였다.","features":[{"k":"특징","v":"차가버섯과 용매를 혼합해 20~50kHz 진동수, 50~700W 파워의 초음파로 50~90℃에서 5~60분간 추출하고, 그 추출물에 바실러스 리케니포르미스 유래 엔도 프로테아제(프로타맥스)와 아스퍼질러스 오리자에 유래 엑소 프로테아제(플라보자임)를 1:0.8~1.8 중량비로 혼합한 효소를 접종해 발효시킨다."},{"k":"효과","v":"초음파와 효소 발효 처리로 지표물질 시링산과 총 폴리페놀 함량, DPPH 라디칼 소거능이 단독 처리 대비 현저히 높아져 활성산소로부터 발생하는 질병에 효과가 있고, 유효성분 흡수가 용이하며 독성이 없다. 1등급 미만 차가버섯도 활용할 수 있어 폐기량을 줄이고 농가 소득을 높일 수 있다."}],"lvl":3,"comparison":[{"item":"추출 공정 방식","old":"유기용매 잔류와 고온 열분해로 수율과 생리활성이 손실","new":"초음파로 추출한 뒤 효소로 발효시켜 구조적 변화 유도"},{"item":"원료 활용도","old":"1등급만 약용으로 쓰고 나머지는 폐기하거나 차로 사용","new":"1등급 미만 차가버섯도 원료로 활용해 폐기량을 줄임"},{"item":"흡수와 활성","old":"추출물의 항산화능과 흡수율을 높이는 처리 수단이 없음","new":"엔도·엑소 프로테아제 혼합효소 발효로 항산화능과 흡수 증대"}],"applications":[{"title":"항산화 건강기능식품","desc":"활성산소로부터 발생하는 동맥경화, 당뇨병 등 질병에 대응하는 항산화용 건강기능식품 소재"},{"title":"항산화 화장료 조성물","desc":"독성이 없고 항산화능이 우수해 활성산소로 인한 피부 조직 손상을 막는 화장료 조성물"},{"title":"저등급 차가버섯 자원화","desc":"폐기되거나 차로만 쓰이던 1등급 미만 차가버섯의 사용처를 넓혀 농가소득 증대에 기여"}]},{"id":"p1020210119087","title":"CYP154C3s 효소를 이용한 스테로이드의 하이드록시화 생물전환 방법","field":"의료","status":"등록","regNo":"10-2823387","regDate":"2025.06.17","appNo":"10-2021-0119087","appDate":"2021.09.07","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2041.09.07","inventor":"오태진","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 CYP154C3s 효소를 이용한 스테로이드의 하이드록시화 생물전환 방법에 관한 것으로, 스테로이드 C16-하이드록시라제인 CYP154C3-1 또는 CYP154C3-2를 이용하여 스테로이드의 16번 탄소를 하이드록시화시키는 단계를 포함한다. 대상 스테로이드는 아드레노스테론, 안드로스테네디온, 코르티손, 하이드로코르티손, 난드로론, 프레드니솔론, 프레드니손, 프로게스테론, 테스토스테론 등이며, 이 방법으로 얻어진 스테로이드도 함께 제공한다.","features":[{"k":"특징","v":"CYP154C3-1과 CYP154C3-2는 스트렙토마이세스 유래 시토크롬 P450으로, 여러 스테로이드 중 프로게스테론에 대한 친화성이 가장 높아 각각 Kd 0.25~0.30 μM과 0.35~0.46 μM을 나타내며, 최적 활성 pH는 7.0~7.8, 최적 활성 온도는 30~37℃이다."},{"k":"효과","v":"서로 다른 스테로이드에 대한 기질 유연성을 보이면서 특징적인 생성물 형성 패턴을 나타내므로, 다양한 생물학적 용도를 위한 변형된 스테로이드 생산에 좋은 후보가 될 수 있는 장점이 있다."}],"lvl":3,"comparison":[{"item":"전환 대상 물질","old":"효소 생물전환이 진세노사이드 등 일부 성분에 국한됨","new":"CYP154C3-1 또는 3-2로 스테로이드 16번 탄소를 전환"},{"item":"반응 선택성","old":"스테로이드 C16 위치를 선택적으로 전환하는 수단이 없음","new":"스테로이드 C16-하이드록시라제로 위치 선택적 전환 수행"},{"item":"기질 유연성","old":"적용 기질이 제한되어 변형 스테로이드 생산이 어려움","new":"프로게스테론 등 여러 스테로이드에 기질 유연성을 보임"}],"applications":[{"title":"변형 스테로이드 생산","desc":"다양한 생물학적 용도를 위한 변형 스테로이드를 효소 반응으로 생산하는 생물전환 분야"},{"title":"스테로이드 의약 원료","desc":"코르티손·프레드니손·테스토스테론 등 스테로이드계 의약 원료의 하이드록시화 전환"},{"title":"P450 효소 소재 개발","desc":"화장품 및 약학적 가치가 있는 화합물을 생산하는 시토크롬 P450 효소 활용 분야"}],"figFile":"10-2021-0119087.jpg","figureCaption":"공보 대표도면"},{"id":"p1020210185126","title":"스마트 도어 제어 방법","field":"소프트웨어","status":"등록","regNo":"10-2822782","regDate":"2025.06.16","appNo":"10-2021-0185126","appDate":"2021.12.22","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2041.12.22","inventor":"황찬승","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 스마트 도어 제어 방법에 관한 것으로, 거주자 단말로부터 일회용 인증이미지 요청을 수신해 인증이미지를 생성하고, 외부인 단말로 전송한 뒤 입력된 이미지와의 일치 여부를 판단하여 출입문 개방신호를 생성하는 단계를 포함한다. 거주자가 부재중일 때도 택배·배달기사나 지인에게 출입문을 열어줄 수 있도록 한 것이다.","features":[{"k":"특징","v":"일회용 인증이미지는 바코드 또는 QR코드 형태로, 사용되거나 일정 시간이 지나면 삭제되며 재생성은 거주자 승인을 거친다. 불일치 시 거주자·관리실 단말에 알림을, 개방 시 관리실에 모니터링 요청을 보내고, 평상시 적외선으로 영상을 획득하다 이상 움직임이나 초인종 감지 시 가시광선으로 전환한다."},{"k":"효과","v":"별도 하드웨어 없이 보급된 스마트폰만으로 출입문 개폐를 수행해 구성이 단순하고, 비대면 배달 증가 상황에서 효율적인 출입문 개폐와 건물 보안성을 함께 확보한다. 적외선 기반 영상 획득으로 전력 소모를 줄이고 야간 벌레 유인도 방지한다."}],"lvl":3,"comparison":[{"item":"출입 인증 수단","old":"키패드 비밀번호나 지문·얼굴 등 생체 정보로 인증","new":"거주자 요청으로 생성한 일회용 인증이미지로 인증"},{"item":"장치 구성 비용","old":"생체 인증 센서를 부착해야 하므로 생산단가가 올라감","new":"보급된 스마트폰을 이용해 별도 하드웨어가 필요 없음"},{"item":"외부인 출입 처리","old":"배달·택배 기사에게 출입문 비밀번호를 알려주어야 함","new":"외부인 단말로 일회용 인증이미지를 전송해 개방 처리"}],"applications":[{"title":"공동주택 현관 출입 통제","desc":"거주자가 부재중일 때도 출입문을 열어주면서 비밀번호 노출 없이 보안성을 유지하는 데 활용된다"},{"title":"배달·택배 출입 인증","desc":"배달기사나 택배기사의 단말로 일회용 인증이미지를 보내 해당 방문에 한해 출입문을 개방할 수 있다"},{"title":"스마트폰 기반 도어락","desc":"별도 하드웨어 없이 보급된 스마트폰으로 인증이미지를 주고받아 출입문을 제어하는 도어락에 적용된다"}],"figFile":"10-2021-0185126.jpg","figureCaption":"공보 대표도면"},{"id":"p1020230050956","title":"유기성 폐기물 아임계 가수분해 시스템 및 그 방법","field":"화학","status":"등록","regNo":"10-2821188","regDate":"2025.06.11","appNo":"10-2023-0050956","appDate":"2023.04.18","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2043.04.18","inventor":"김학수","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 유기성 폐기물 아임계 가수분해 시스템 및 그 방법에 관한 것으로, 아임계 수역 조건의 구형 가수분해 반응기 내부로 초음파를 조사해 가축분뇨·의료·수산·생활 폐기물을 분해하고 그 고상분을 팰릿 형태 고형연료로 자원화한다. 원료 공급부, 수증기 공급부, 반응결과물 분리부, 고형연료 제조부와 이들을 제어하는 제어부로 구성된다. 반응기 내부로 20~30 kHz의 초음파를 조사해 가수분해 효율을 끌어올리는 점이 핵심이다.","features":[{"k":"특징","v":"구형 반응기를 상·하 및 4분할한 8개 영역에 초음파 발생모듈을 배치해 조사 순서·시간·세기 조합의 패턴으로 초음파를 쏘고, 제어부가 각 구성요소의 파라미터 값을 실시간 측정해 딥러닝으로 파라미터 패턴 정보를 학습한 인공 신경망 기반 최적 파라미터 값 도출모델로 최적 조사 패턴을 산출·제어한다."},{"k":"효과","v":"초음파 캐비테이션 충격파로 분해효율을 높여 가수분해 사이클을 단축하고 요구 반응온도·압력을 낮춰 시간과 에너지를 절약하며, 반응압력 저하로 반응기 두께를 줄여 설비 비용도 아끼고, 설정 목표값을 관리자의 상시 모니터링 없이 자동으로 유지할 수 있다. y":"본 기술은 자동차 차륜의 캠버각을 조정할 수 있는 모빌리티 너클에 관한 것으로, 조향 장치와 연결되어 차륜의 이동 방향을 결정하면서 동시에 캠버각을 조정할 수 있는 너클 구조를 제공한다. 바디부에 형성되는 링크부와 바디부를 각도 이동시키는 판부를 갖는 고정부, 그리고 링크부와 고정부를 연결하는 삽입 체결부로 구성되며, 맥퍼슨 스트럿 등 구조 변경이 까다로워 캠버각 조정이 불가능한 서스펜션에도 적용할 수 있도록 설계되었다.","features":[{"k":"특징","v":"링크부의 배치부에 톱니 형태의 제1삽입홈과 제2삽입홈을 형성하고, 링크부를 고정부의 배치홈을 따라 이동시킨 뒤 삽입 체결부를 쐐기 방식으로 끼워 위치를 고정하며, 스토퍼와 상하 고정부재, 고정위치 조정부로 다중 고정한다."},{"k":"효과","v":"구조 변경에 따른 캠버각 조정이 불가능한 서스펜션에도 적용되어 범용성을 극대화하고, 타이어 편마모를 억제해 수명을 늘리며, 안정적인 코너링 유도와 핸들 조작력 향상, 앞차축 휨 완화 및 롤링 방지 효과를 얻을 수 있다."}],"lvl":3,"comparison":[{"item":"캠버각 조정성","old":"맥퍼슨 스트럿 등 서스펜션 구조에서는 조정이 불가능함","new":"링크부와 고정부를 삽입 체결부로 연결해 각도를 조정함"},{"item":"각도 설정 방식","old":"제조사 초기 설정값을 유지하며 사용자 조정이 금지됨","new":"배치홈과 삽입홈을 따라 링크부를 이동시켜 원하는 각도로 설정"},{"item":"고정 안정성","old":"구조 변경으로 조정하면 차량의 타 성능 저하가 우려됨","new":"스토퍼와 상하 고정부재, 완충부재로 조정 위치를 안정 고정"}],"applications":[{"title":"자동차 조향 너클 부품","desc":"타이로드와 연결되어 차륜의 이동 방향을 결정하는 캠버각 조정형 너클 부품"},{"title":"휠 얼라인먼트 정비","desc":"자동차 입고 시 원하는 캠버각을 획득·설정하는 얼라인먼트 정비 작업 분야"},{"title":"타이어 편마모 억제","desc":"트레드 내외측 유효반경 차이로 생기는 타이어 편마모를 억제하는 주행 부품 용도"}],"figFile":"10-2023-0005971.jpg","figureCaption":"공보 대표도면"},{"id":"p1020220185159","title":"운동용 냉온 보관 박스","field":"기타","status":"등록","regNo":"10-2812082","regDate":"2025.05.20","appNo":"10-2022-0185159","appDate":"2022.12.27","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2042.12.27","inventor":"양현석","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 운동용 냉온 보관 박스에 관한 것으로, 상면이 개폐부로 개폐되고 내부에 단열재가 구비되어 외부와의 열교환이 차단된 단열 박스부와, 그 내부 공간을 뜨거운 물품용 핫존과 차가운 물품용 쿨존으로 구분하는 공간 구분용 벽체부를 포함한다. 종래 아이스 박스와 달리 온찜질팩·뜨거운 음료와 얼음·차가운 음료·냉찜질팩을 하나의 박스에 구분해 보관할 수 있다.","features":[{"k":"특징","v":"공간 구분용 벽체부에 장착된 열전소자가 흡열면으로 쿨존을 냉각하고 방열면으로 핫존을 가열하며, 핫존 내 자외선 살균기기, 공기 통과구멍이 형성된 물품 보관용 바스켓과 벨크로 고정 구조, 젤 디스펜서부 및 테이핑용 테이프 케이스부를 함께 구비한다."},{"k":"효과","v":"뜨겁게 보관할 물품과 차갑게 보관할 물품을 필요에 따라 즉시 선택해 사용할 수 있어 운동 기능 향상에 도움을 주고, 마우스피스 등의 살균과 스포츠 젤·테이핑 테이프의 사용 편의성을 크게 높인다."}],"lvl":3,"comparison":[{"item":"내부 공간 구성","o  절단해 대량 생산이 가능"}],"applications":[{"title":"복합재료 보강재 절단 공정","desc":"사출성형이 어려운 섬유 형태 보강재를 균일한 길이로 절단해 복합재료 제조에 공급하는 공정 장비"},{"title":"섬유 보강재 대량 생산 설비","desc":"연속체 형태의 섬유 가닥을 권취·권출하며 절단해 미세 길이의 보강재를 대량으로 생산하는 설비"},{"title":"종횡비 조절 절단 장비","desc":"커터 위치 조정부로 절단 간격을 조절해 보강재의 종횡비를 원하는 값으로 맞추는 절단 장비"}],"figFile":"10-2023-0023067.jpg","figureCaption":"공보 대표도면"},{"id":"p1020220113849","title":"전자파 차폐 성능 측정 장치에 활용되는 지그","field":"전기·전자","status":"등록","regNo":"10-2810401","regDate":"2025.05.15","appNo":"10-2022-0113849","appDate":"2022.09.08","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2042.09.08","inventor":"윤종환","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 전자파 차폐 성능 측정 장치에 활용되는 지그에 관한 것으로, 제1하우징과 제2하우징, 그 사이에 구비되는 원형 조리개 구조물, 조리개 구조물에 접촉되는 시료로 구성된다. 전자파 차폐 측정에서 주파수 대역에 따라 시료 크기가 달라져 측정할 때마다 지그를 교체해 새로 부착해야 하는 번거로움을 해소하고, 시료 크기에 맞춰 가변되는 통합 지그를 제공하는 것을 목적으로 한다.","features":[{"k":"특징","v":"원형 조리개 구조물은 서로 겹쳐 개별 회전축으로 회전하는 복수 개의 블레이드로 구성되며, 각 블레이드의 연결레일과 연결고정부의 상대 이동으로 외경 15.875~133.096mm, 내경 7~76.2mm 범위에서 크기가 변한다. 지그는 동축 선로 구조이면서 내부도체가 불연속적이고, 내부도체에는 크기가 다른 중심 결합 모듈을 탈착한다."},{"k":"효과","v":"하나의 통합 지그로 30MHz~1.5GHz 대역과 1.5GHz~10GHz 대역 등 서로 다른 주파수 대역에 대응하는 여러 크기의 시료에 대한 차폐 성능 측정이 가능하다. 시료 크기가 바뀔 때마다 지그를 교체해 새로 부착할 필요가 없어 전자파 차폐 측정의 편의성이 높아진다."}],"lvl":3,"comparison":[{"item":"시료 대응 범위","old":"시료 크기마다 별도 지그를 써서 통합 활용이 어려움","new":"원형 조리개 구조물로 시료 크기에 맞춰 내경을 가변"},{"item":"지그 가변 구조","old":"고정된 크기의 치구로 특정 규격 시료만 측정 가능","new":"겹쳐진 복수 블레이드를 각각 회전시켜 내·외경을 변경"},{"item":"내부도체 구성","old":"내부도체가 고정되어 시료 크기 변화에 대응하지 못함","new":"여러 크기의 중심 결합 모듈을 탈착 가능하게 구성"}],"applications":[{"title":"복합재료 차폐효과 측정","desc":"전기적 특성을 이론으로 예측할 수 없는 플라스틱과 복합재료의 차폐효과를 측정하는 데 적용"},{"title":"EMI 차폐 소재 평가","desc":"상용, 산업용, 군용 기기에 쓰이는 전자파 차폐 소재의 차폐효과를 정량화하는 데 활용"},{"title":"통합형 측정 지그 모듈","desc":"다양한 주파수 영역대와 시료 크기에 하나로 대응하는 동축 선로형 측정 지그 모듈"}],"figFile":"10-2022-0113849.jpg","figureCaption":"공보 대표도면"},{"id":"p1020230023916","title":"의료 및 미용을 위한 플라즈마 및 OLED 결합 융복합 전자약 패치","field":"의료","status":"등록","regNo":"10-2810345","regDate":"2025.05.14","appNo":"10-2023-0023916","appDate":"2023.02.22","applicant":"선문대학교 산학협력단 · 가천대학교 산학협력단","coApplicant":true,"expiry":"2043.02.22","inventor":"권정현","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 플라즈마와 OLED를 한 장에 결합한 의료 및 미용용 융복합 전자약 패치에 관한 것으로, 기판 위에 OLED 구조물과 광량 향상 기능성 절연층, 플라즈마 구조물을 순차 적층한 구조를 갖는다. 플라즈마는 피부 표면을 살균하고 피부 장벽을 열어 약물 침투를 돕지만 깊이 침투가 어렵고, 빛은 진피까지 닿지만 살균력이 부족한 한계를 서로 보완하도록 구성했다.","features":[{"k":"특징","v":"플라즈마 구조물은 제1 플라즈마 전극층·고전압 절연층·제2 플라즈마 전극층으로 이루어지고, 제어장치에 따라 OLED 빛을 내보내는 제1모드, 대기와 작용해 플라즈마를 발생시키는 제2모드, 두 모드 동시 동작을 선택할 수 있다. 전극은 투명 또는 패턴 전극으로 빛 투과율을 확보하며 전체 구조는 유연·신축성 패치형으로 제작된다."},{"k":"효과","v":"플라즈마의 피부 표면 살균과 장벽 해제로 피부 개선 등 미용 효과를 얻고 치료 약물의 과다 사용에 따른 부작용을 줄일 수 있으며, OLED 광학 치료로 진피 이상 깊은 부위까지 처치가 가능해 치료 시너지 효과를 낼 수 있다."}],"lvl":3,"comparison":[{"item":"치료 자극 방식","old":"광 치료는 레이저 광 조사기 중심의 단일 자극만 제공","new":"OLED 광과 플라즈마를 선택 또는 동시 구동하는 복합 자극"},{"item":"침투 깊이 대응","old":"플라즈마는 표면 살균만 되고 피부 내부 침투가 어려움","new":"플라즈마로 장벽을 열고 OLED 광으로 진피 이상까지 처치"},{"item":"광원 폼팩터","old":"기존 LED 광원은 유연·투명·면광원 구현에 한계가 있음","new":"유연 폴리머나 직물 기판의 OLED로 신축성 패치형 구현"}],"applications":[{"title":"피부 질환 광치료 패치","desc":"저출력·광역동·광열 치료로 각질을 넘어 진피 이상까지 처치해 피부 질환을 개선하는 부착형 전자약"},{"title":"약물 침투 보조 기기","desc":"플라즈마 활성종으로 피부 장벽을 열어 약물 침투 효율을 높이고 약물 과다 사용과 부작용을 줄이는 기기"},{"title":"미용 피부 살균 디바이스","desc":"대기 중 산소·질소 활성종으로 피부상재균을 살균해 피부를 개선하는 착용형 미용 디바이스"}],"figFile":"10-2023-0023916.jpg","figureCaption":"공보 대표도면"},{"id":"p1020220113676","title":"적혈구막을 이용한 산소를 전달할 수 있는 골유도성 나노입자","field":"화학","status":"등록","regNo":"10-2808953","regDate":"2025.05.13","appNo":"10-2022-0113676","appDate":"2022.09.07","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2042.09.07","inventor":"이충성","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 적혈구막을 이용해 산소를 전달할 수 있는 골유도성 나노입자에 관한 것으로, 산소운반체를 코어에, 적혈구 세포막과 헤지호그 신호전달계 활성화제를 쉘에 포함하는 코어-쉘 구조의 나노적혈구다. 조직공학용 하이드로겔 내부가 산소 공급 부족으로 저산소 상태가 되어 이식 세포의 생존과 골 형성 분화가 제한되는 문제를 해결하기 위해, 해당 나노입자와 이를 포함하는 하이드로겔, 골 유도용 및 골 손실 예방·치료용 조성물을 제공한다.","features":[{"k":"특징","v":"산소운반체로 퍼플루오로카본(퍼플루오로옥틸브로마이드)을, 헤지호그 신호전달계 활성화제로 20S-하이드록시콜레스테롤을 사용하며, 산소운반체를 포함한 적혈구 세포막에 활성화제를 첨가하고 유화시켜 제조한다. 적혈구 세포막 중 단백질과 활성화제의 농도비는 1:0.5 내지 1:2로 한다."},{"k":"효과","v":"탈산소수에서 우수한 산소 전달능을 보여 하이드로겔 내 HIF-1α 발현을 낮추고 캡슐화된 세포의 생존과 증식을 개선하며, 헤지호그 신호 활성화로 ALP, Runx2, OCN 발현과 칼슘 침착을 높인다. 마우스 두개관 결손 모델에서 신생골 면적과 골 부피 밀도, 골 미네랄 밀도가 가장 높게 나타났다."}],"lvl":3,"comparison":[{"item":"산소 공급 방식","old":"하이드로겔 내 대량 수송 제한으로 저산소 상태가 발생","new":"산소운반체를 담은 적혈구막 나노입자로 산소를 전달"},{"item":"담체 구성 구조","old":"PFC나 실리콘 오일 등 산소 벡터를 단독으로 적용","new":"적혈구 세포막이 코어를 감싼 코어-쉘 구조 나노입자"},{"item":"골 형성 기능","old":"산소 공급에 그쳐 골 형성 분화를 유도하는 수단이 없음","new":"헤지호그 신호전달계 활성화제로 뼈 형성을 함께 촉진"}],"applications":[{"title":"뼈 조직공학 하이드로겔","desc":"3D 하이드로겔에서 간엽계 전구세포의 생존과 골 형성 활성을 높이는 나노 시스템으로 적용"},{"title":"골 손실 예방·치료 조성물","desc":"나노입자를 유효성분으로 포함해 골 손실을 예방 또는 치료하는 조성물로 활용할 수 있음"},{"title":"골 유도용 이식 소재","desc":"줄기세포 이식 후 저산소증 유도에 의한 악영향을 막아 골 유도를 촉진하는 이식 소재"}],"figFile":"10-2022-0113676.jpg","figureCaption":"공보 대표도면"},{"id":"p1020220169264","title":"유도 훈련용 장치","field":"생활","status":"등록","regNo":"10-2808762","regDate":"2025.05.13","appNo":"10-2022-0169264","appDate":"2022.12.07","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2042.12.07","inventor":"양현석","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 유도 훈련용 장치에 관한 것으로, 도복 상의부와 그 상의부에 장착되는 탄성 밴드부를 포함한다. 도복 상의의 등 뒷부분에 밴드 장착부를 두어 탄성 밴드를 끼우고 기둥이나 벽면 지지 구조물에 고정함으로써, 대련 상대 선수가 없어도 반대쪽으로 당겨지는 힘을 받으며 메치기 등의 기술을 자세 교정과 함께 훈련할 수 있다. 인형 더미로는 당겨지는 힘을 구현할 수 없고 기둥에 묶은 고무튜브만으로는 어느 자세에서 힘을 줄지 알기 어려웠던 점을 개선한 것이다.","features":[{"k":"특징","v":"등커버부·앞커버부·소매부에서 불필요한 부분을 제거한 도복 상의부에 제1·제2밴드 장착부와 어깨밴드 장착부를 봉재선으로 두고, 구조물에 고정되는 고정용 탄성밴드부재, 소매 형태 손잡이부재가 달린 손잡기용 탄성밴드부재, 양 어깨 연결용 탄성밴드부재와 밴드 지지 고정부를 조합한다."},{"k":"효과","v":"훈련 시 자세 교정이 가능하고 개인 훈련에서 근력과 도복 깃을 잡는 악력을 동시에 향상시켜 실제 상대선수와 훈련하는 효과에 최대한 가까운 훈련이 가능하며, 근력·순발력·민첩성·유연성을 높여 개인 훈련 효율을 크게 증대시킨다."}],"lvl":3,"comparison":[{"item":"훈련 보조 수단","old":"인형 더미나 기둥에 묶은 appNo":"10-2022-0111429","appDate":"2022.09.02","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2042.09.02","inventor":"계중읍","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 웨어러블 로봇의 줄꼬임 구동기 등에 적용되어 압축과 인장이 반복되는 와이어를 비틀면서 인장 시험하는 와이어의 트위스트 인장 시험기에 관한 것으로, 상부·중간·하부 프레임으로 된 시험기 프레임과 서보모터, 테스트 지그로 구성된다. 트위스팅을 가하지 않는 기존 인장 시험기와 달리 와이어를 꼬인 상태에서 인장력과 변위를 측정해 소재별 와이어의 수명을 정확히 평가하는 것을 목적으로 한다.","features":[{"k":"특징","v":"서보모터가 상부 와이어 고정구를 회전시켜 와이어를 트위스트하면 하부 와이어 고정구와 상하 구동 지지봉이 함께 상하로 움직이고, 상하 지지봉 프레임에 고정된 비접촉식 마그네틱 센서와 LVDT가 압축·이완 거리를 측정한다. 하단 무게추 장착부로 하중을 가하며 완충 스프링과 시료 장착 지지 실린더를 함께 둔다."},{"k":"효과","v":"와이어에 트위스팅을 가하면서 인장력을 측정할 수 있어 모노필라멘트, PE 합사 등 웨어러블 로봇에 적용 가능한 다양한 소재 와이어의 수명을 정확하게 측정할 수 있다. 완충 스프링으로 와이어 절단 시 하부 고정구와 지지봉을 안정적으로 유지하고, 시료 장착 지지 실린더로 와이어 장착과 제거가 쉬워진다."}],"lvl":3,"comparison":[{"item":"시험 하중 방식","old":"인장 또는 변형량 등 단일 하중 조건만 가해 평가","new":"서보모터로 트위스팅을 가하면서 인장력을 함께 측정"},{"item":"변위 측정 방식","old":"추 중량에 따른 변형량을 신장계나 측정유닛으로 측정","new":"LVDT 거리 측정 센서로 상하 구동 지지봉의 변위를 측정"},{"item":"시료 취급 편의","old":"와이어 절단 시 고정구 보호와 시료 착탈 수단이 미비","new":"완충 스프링과 시료 장착 지지 실린더로 보호와 착탈 용이"}],"applications":[{"title":"웨어러블 로봇 와이어 평가","desc":"압축과 인장이 반복되는 웨어러블 로봇 구동 와이어의 수명을 정확하게 측정하는 데 적용"},{"title":"필라멘트 소재 인장시험","desc":"모노필라멘트와 PE합사 멀티필라멘트 등 다양한 소재 와이어의 인장시험 장비로 활용"},{"title":"와이어 내구성 시험 설비","desc":"트위스트와 인장을 동시에 가하는 테스트 지그를 갖춘 설비로 와이어 내구성 평가에 사용"}],"figFile":"10-2022-0111429.jpg","figureCaption":"공보 대표도면"},{"id":"p1020220180768","title":"세균성 사이토크롬 P450 또는 이의 변이체 및 이의 용도","field":"의료","status":"등록","regNo":"10-2795733","regDate":"2025.04.09","appNo":"10-2022-0180768","appDate":"2022.12.21","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2042.12.21","inventor":"오태진","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 Streptomyces sp. 유래 세균성 사이토크롬 P450 효소 CYP105A5 또는 이의 변이체 및 그 용도에 관한 것으로, 서열번호 1의 서열을 포함하는 효소가 플라보노이드의 생물 전환 반응을 촉매한다. 비오카닌 A의 O-탈메틸화와 다이제인·게니스테인·나린게닌의 위치 선택적 하이드록실화를 확인하여, 수용성과 안정성이 낮은 플라보노이드를 다양하게 옥시기능화할 수 있음을 입증하였다.","features" lse,"expiry":"2043.02.27","inventor":"양현석","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 유도 도복용 바지와 이를 포함하는 여성 유도 도복에 관한 것으로, 착용 시 허리 사이즈를 조절할 수 있도록 바지 양 측에 형성되는 옆단 트임을 가려 신체 노출을 방지하는 구조를 제시한다. 다리 삽입부와 끈통과부를 갖는 도복 하의부, 허리 착용용 끈부, 옆단 트임을 덮는 트임 커버부로 구성되며, 여성 체형에 맞춰 상의 허리 라인을 조절하는 띠부도 함께 포함한다.","features":[{"k":"특징","v":"옆단 트임에는 봉제로 장착되는 트임 덮개 천부재나 암수 벨크로 테이프, 암수 스냅단추를 적용해 개방 부위를 덮거나 닫으며, 도복 상의부 안쪽 등 커버부에는 연속 주름, 매듭, 단추구멍 방식으로 길이를 조절할 수 있는 허리 라인용 띠부를 봉재로 고정한다."},{"k":"효과","v":"옆단 트임으로 인한 신체 노출을 막아 착용 시 불편함을 방지하고 특히 여성 착용자의 만족도를 크게 높이며, 상의 허리 라인을 줄이는 구조로 훈련 중 상의가 풀리는 것을 최소화해 훈련 효율과 경기력 향상을 기대할 수 있다."}],"lvl":3,"comparison":[{"item":"옆단 트임 처리","old":"허리끈 노출용 옆단 트임이 그대로 개방되어 있음","new":"트임 커버부가 옆단 트임의 개방 부분을 덮어 가림"},{"item":"신체 노출 방지","old":"트임으로 신체 일부가 노출되어 착용자가 불편함을 느낌","new":"트임 덮개 천부재로 노출을 막아 착용 불편함을 방지"},{"item":"커버 결합 방식","old":"트임을 막는 별도의 결합 수단 없이 끈만 조여 착용","new":"봉제 덮개와 벨크로 테이프·스냅단추로 탈부착 결합"}],"applications":[{"title":"여성용 유도 도복 바지","desc":"허리 사이즈는 끈으로 조절하면서 옆단 트임을 가려 신체 노출 불편을 없앤 여성 착용자용 도복 바지"},{"title":"유도 경기·훈련 복장","desc":"훈련이나 시합 중 옆단 트임을 통한 노출 걱정 없이 착용할 수 있는 유도 경기용 상하의 세트"},{"title":"트임 커버 적용 운동복","desc":"허리끈으로 사이즈를 조절하는 옆단 트임 구조 하의에 덮개나 벨크로 커버를 적용하는 운동 의류"}],"figFile":"10-2023-0025912.jpg","figureCaption":"공보 대표도면"},{"id":"p1020230054007","title":"초전도 벌크 제작용 몰드","field":"전기·전자","status":"등록","regNo":"10-2793484","regDate":"2025.04.04","appNo":"10-2023-0054007","appDate":"2023.04.25","applicant":"한국전력공사 · 선문대학교 산학협력단","coApplicant":true,"expiry":"2043.04.25","inventor":"이상헌","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 금속 파우더를 압착 가공해 초전도 벌크를 제작하는 몰드에 관한 것으로, 베이스부와 그에 장착되는 로드부, 로드부를 감싸며 내부 공간에 파우더를 수용하는 중공형 메인바디부, 메인바디부 내부에서 슬라이드 이동하며 파우더를 가압하는 실린더부를 포함한다. 가압과 동시에 로드부가 벌크관통공을 형성하는 구조다. 성형된 초전도 벌크는 YBCO 단결정 벌크체로, 기계적 취성 보강을 위한 관통공을 갖춘 형태로 얻어진다.","features":[{"k":"특징","v":"베이스관통부는 중심의 제1관통부와 두 개의 가상 환형부를 따라 균등 간격으로 배치된 제2·제3관통부로 이루어져 로드부 위치를 잡고 스톱퍼부가 이탈을 막으며, 실린더몸체부에 베이스관통부와 대향되게 뚫린 실린더관통부에 로드부가 삽입되어 가압 이동을 안내한다."},{"k":"효과 ":"특징","v":"혼합물은 벼 캘러스와 새싹보리를 1:2~1:20 중량비로 배합하고 락토바실러스 람노서스균으로 발효한 뒤 초고압 추출하며, 조성물 전체 중량의 0.0001~20 중량%로 포함되어 MMP-1 발현 억제, 프로콜라겐 타입 I 발현 촉진, 티로시나제 활성 및 멜라닌 합성 저해 용도로 작용한다."},{"k":"효과","v":"단독 발효 추출물이나 비발효 혼합 추출물보다 DPPH 라디칼 소거능, 티로시나제 저해율, 멜라닌 합성 억제, 프로콜라겐 생성 촉진과 MMP-1 억제 효과가 우수하고, 세포독성과 인체 첩포 자극이 없어 안전하게 사용할 수 있다."}],"lvl":3,"comparison":[{"item":"유효성분 원료","old":"각종 화학성분을 기능성 성분으로 사용해 왔음","new":"벼 캘러스와 새싹보리 혼합 발효 추출물을 사용"},{"item":"피부 자극성","old":"화학성분으로 피부 보호력과 재생력이 저하됨","new":"천연물 유래 발효 추출물로 피부에 안전하게 작용"},{"item":"원료 가공 방식","old":"식물 원료를 그대로 추출해 화장료에 적용함","new":"람노서스균 발효 후 초고압 추출로 제조함"}],"applications":[{"title":"미백 기능성 화장품","desc":"티로시나제 활성과 멜라닌 합성을 저해하는 피부미백 기능성 화장료 제품에 적용함"},{"title":"주름 개선 화장료","desc":"MMP-1 발현을 억제하고 프로콜라겐 발현을 촉진하는 주름 개선 화장품에 활용함"},{"title":"항산화 식품 소재","desc":"DPPH 라디칼 소거 활성을 활용한 항산화 기능성 식품 조성물의 소재로 적용함"}]},{"id":"p1020230066321","title":"하이브리드 사용자 클러스터로의 동시 전송을 위한 다중안테나 기반 비직교 다중접속 시스템","field":"전기·전자","status":"등록","regNo":"10-2783885","regDate":"2025.03.14","appNo":"10-2023-0066321","appDate":"2023.05.23","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2043.05.23","inventor":"신창용","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 하나의 셀 중심 사용자 단말과 다수의 셀 경계 사용자 단말로 구성된 하이브리드 클러스터에 기지국이 동시에 데이터 스트림을 전송하는 다중안테나 기반 비직교 다중접속(NOMA) 시스템에 관한 것으로, 기지국 송신기와 셀 중심·셀 경계 단말 수신기의 구성을 규정한다. 기존 NOMA 기법은 사용자당 하나의 데이터 스트림만 전송하거나 셀 중심·셀 경계 사용자 각 한 명으로 이루어진 하나의 클러스터만 지원할 수 있는 한계가 있었다.","features":[{"k":"특징","v":"기지국은 셀 중심용과 셀 경계용 데이터 스트림별로 송신 전력을 할당하고 셀 경계 스트림 간 간섭을 제거하는 프리코더를 적용한 뒤 두 스트림을 가산해 다중안테나로 송신하며, 셀 중심 단말은 화이트닝 필터를 갖춘 SIC부로 셀 경계 스트림을 복원·제거한 후 수신 빔포밍과 MIMO 심볼 검출로 자신의 데이터를 복원한다."},{"k":"효과","v":"하나의 클러스터에 셀 중심 단말과 다수의 셀 경계 단말을 동시 지원하여 전송률 성능을 향상시킬 수 있고, 기지국 프리코더와 셀 경계 단말의 수신 빔포머를 결합 설계함으로써 스트림 간 간섭 제거와 함께 셀 경계 단말의 수신 신호 전력도 높일 수 있다."}],"lvl":3,"comparison":[{"item":"주파수 자원 활용","old":"직교 자원을 사용자별로 분리 할당해 방대한 자원이 필요","new":"동일 주파수를 중복 할당하는 비직교 다중접속으로 효율 향상"},{"item":"클러스터 구성","old":"셀 중심 1명과 셀 경계 1명으로 사용자 클러스터를 구성","new":"셀 중심 1명과 다수 p1020230025911","title":"훈련용 여성 유도 도복","field":"생활","status":"등록","regNo":"10-2781962","regDate":"2025.03.11","appNo":"10-2023-0025911","appDate":"2023.02.27","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2043.02.27","inventor":"양현석","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 여성 체형에 맞춘 훈련용 여성 유도 도복에 관한 것으로, 남녀 구분 없이 사이즈별로만 제조되어 여성이 입으면 도복이 맞지 않고 활동이 불편하며 훈련 중 상의가 자주 풀리던 문제를 해결한다. 도복 상의부 안쪽 허리 라인에 봉재로 고정되고 양쪽 단부를 서로 연결할 수 있는 허리 라인용 띠부를 두어 허리 둘레를 착용자 체형에 맞게 줄일 수 있도록 했다.","features":[{"k":"특징","v":"허리 라인용 띠부는 등 커버부 안쪽면에 가로로 봉재 고정되고, 연속된 주름 구조나 양쪽 여유 길이부의 매듭, 또는 띠 고정용 단추부와 복수의 단추구멍으로 길이를 조절한다. 상의에는 허리 라인 형성용 곡선부를 두고, 하의 다리 삽입부에는 벨크로 테이프를 두어 무릎 아래 길이를 조절한다."},{"k":"효과","v":"여성이 착용했을 때 활동의 불편함이 줄어 자연스러운 동작으로 훈련 효율이 높아지고, 훈련 중 상의가 풀어지는 것을 최소화해 운동 수행 능력과 경기 운영 능력, 나아가 경기력을 향상시킬 수 있다."}],"lvl":3,"comparison":[{"item":"성별 체형 반영","old":"남녀 구분 없이 사이즈별로만 제조되어 체형 반영이 없음","new":"가슴·골반 발달과 작은 체구를 고려한 허리 라인 구조 적용"},{"item":"허리 라인 조절","old":"허리 라인 조절 수단이 없어 여성 착용 시 활동이 불편","new":"안쪽 허리 라인용 띠부와 곡선부로 허리 라인을 줄임"},{"item":"상의 풀림 방지","old":"옷깃을 잡는 기술이 많아 훈련 중 상의가 자주 풀어짐","new":"띠부를 앞쪽에서 매듭이나 단추로 고정해 풀림을 최소화"}],"applications":[{"title":"여성 선수용 유도 도복","desc":"여성의 신체 구조에 맞춰 허리 라인을 조절해 훈련 시 자연스러운 동작과 훈련 효율을 높이는 경기용 도복"},{"title":"유도 훈련용 의류","desc":"훈련 중 상의가 풀어지는 것을 줄여 운동 수행 능력과 경기 운영 능력을 유지하는 훈련 전용 도복"},{"title":"체형 맞춤 무도복","desc":"훈련자의 신체 크기에 맞게 조절되는 띠부와 단추구멍 구조를 적용한 맞춤형 무도 수련복"}],"figFile":"10-2023-0025911.jpg","figureCaption":"공보 대표도면"},{"id":"p1020230136441","title":"구기자순을 이용한 구기자순 차의 제조방법","field":"식품","status":"등록","regNo":"10-2781257","regDate":"2025.03.10","appNo":"10-2023-0136441","appDate":"2023.10.13","applicant":"선문대학교 산학협력단 · 함지박","coApplicant":true,"expiry":"2043.10.13","inventor":"이상철","transfer":"매매 · 라이센스","smk":false,"brief":false,"lvl":0},{"id":"p1020220150241","title":"내부 키패드를 활용한 도어록 보안 장치","field":"소프트웨어","status":"등록","regNo":"10-2780148","regDate":"2025.03.07","appNo":"10-2022-0150241","appDate":"2022.11.11","applicant":"선문대학교 산학협력단","co 치만 자극하며, 산소포화도가 한계치에 이르면 호흡 보조 모드로 전환한다."},{"k":"효과","v":"흡기와 호기를 구분한 진동 주파수·세기 조절과 폐 영역별 선택적 자극을 통해 환자 상태에 맞는 효율적인 객담 배출을 유도하고 체위배담법 자세와 병행할 수 있다. 또한 작동 중 산소포화도 저하로 인한 호흡곤란 발생을 방지할 수 있다."}],"lvl":3,"comparison":[{"item":"진동 제어 방식","old":"흡기와 호기의 구분 없이 지속적인 진동을 일괄 적용","new":"PPG 센서의 혈류량 정보로 호기·흡기를 판단해 진동 제어"},{"item":"자극 범위 제어","old":"가슴우리 전체를 자극해 필요한 공기 통로만 자극 불가","new":"조끼의 복수 위치를 선택 진동시켜 필요한 폐 영역만 자극"},{"item":"호흡 보조 기능","old":"환자의 산소포화도 변화에 대응하는 보조 기능이 없음","new":"산소포화도에 따라 호기 압박과 흡기 확장을 돕는 보조 모드"}],"applications":[{"title":"고빈도 흉벽진동요법 기기","desc":"타진법·진동법을 수기로 적용하던 흉부물리치료를 대체해 호기 시 5~20Hz 진동으로 객담 배출을 유도"},{"title":"객담 배출 환자 관리","desc":"폐렴·패혈증 등으로 스스로 호흡이 곤란한 환자의 기관지에 누적된 객담을 제거해 세균 감염을 예방"},{"title":"호흡 재활 보조 장치","desc":"산소포화도가 떨어질 때 호기에는 폐를 천천히 압박하고 흡기에는 확장을 돕는 호흡 보조 용도"}],"figFile":"10-2022-0049018.jpg","figureCaption":"공보 대표도면"},{"id":"p1020220014767","title":"용기 내용물 절약형 뚜껑","field":"기계","status":"등록","regNo":"10-2779570","regDate":"2025.03.06","appNo":"10-2022-0014767","appDate":"2022.02.04","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2042.02.04","inventor":"이장범","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 내용물이 일정량 이하로 남은 용기에 결합해 잔량까지 모두 사용할 수 있게 하는 용기 내용물 절약형 뚜껑에 관한 것으로, 용기의 뚜껑 나사산에 결합되는 원통형 연질부재, 연질부재 외면에 구비되는 복수의 경질부재, 경질부재 상단의 마개로 구성된다. 용기를 뒤집어 사용하면 내용물이 중력에 의해 토출구 쪽으로 모여, 겔 형태 내용물이 소량 남으면 쓰기 어려웠던 기존 뚜껑의 한계를 해소한다.","features":[{"k":"특징","v":"실리콘 등 연질부재가 끼워 맞춤으로 지름이 가변되어 여러 규격의 뚜껑 나사산에 결합되고, ABS 등 경질부재가 이를 보강하며 하단의 키로 체결해 뒤집은 용기를 지지하고, 연질부재 내면의 토출공간과 토출구를 통해 모인 잔량을 배출한다."},{"k":"효과","v":"용기에 남은 내용물을 남김없이 사용할 수 있어 낭비를 줄이고, 마개가 연질·경질부재에 각각 대응하는 제1·제2부재로 나뉘어 지름이 달라져도 내용물 누출을 막아 다양한 용기에 호환 적용할 수 있다."}],"lvl":3,"comparison":[{"item":"잔량 사용성","old":"내용물이 일정량 이하로 남으면 토출구로 사용이 어려움","new":"뚜껑 나사산에 결합해 남은 내용물을 모두 사용 가능"},{"item":"뚜껑 결합 구조","old":"용기 나사선에 토출구가 있는 뚜껑을 결합하는 구조","new":"원통형 연질부재와 복수의 경질부재, 마개로 구성"},{"item":"선행 기술 목적","old":"튜브 용기와 캡 결합구조는 내용물 혼합이 주목적","new":"용기를 뒤집어 중력으로 내용물을 모아 쓰도록 구성"}],"applications":[{"title":"화장품 용기 title":"구기자순 추출물을 이용한 고추장의 제조방법","field":"의료","status":"등록","regNo":"10-2767721","regDate":"2025.02.10","appNo":"10-2022-0156299","appDate":"2022.11.21","applicant":"선문대학교 산학협력단 · 청양고추랜드농업회사법인주식회사","coApplicant":true,"expiry":"2042.11.21","inventor":"이상철","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 구기자순 추출물을 이용한 고추장의 제조방법에 관한 것으로, 구기자 순을 열수 추출한 추출물에 엿기름 가루를 담가 구기자 엿기름물을 만들고 현미찹쌀을 혼합해 당화한 뒤 농축하여 조청을 제조하며, 조청에 소금과 메줏가루를 넣어 혼합하고 식힌 다음 고춧가루와 구기자 순 추출물을 첨가해 숙성시킨다. 주로 열매만 사용되던 구기자에서 순을 활용하는 가공 기술이다.","features":[{"k":"특징","v":"구기자 순과 물을 1:5 비율로 100℃에서 35분 추출하고, 추출물과 엿기름 가루를 8:1로 20℃에서 2시간 담근 뒤 현미찹쌀을 혼합해 55℃에서 6시간 당화하고 78 Brix로 농축하며, 고춧가루와 구기자 순 추출물을 배합해 20~25℃에서 3개월 숙성시키는 제조조건을 최적화하였다."},{"k":"효과","v":"기존 고추장보다 맛과 풍미가 우수하고 황색포도상구균·대장균 등 유해 미생물과 이산화탄소·알코올 생성 균주인 지고사카로마이세스 룩시에 대한 항균 활성이 높으며, 방부제 처리 없이도 보관·유통 중 넘침 현상을 억제하여 품질안정성을 높일 수 있다."}],"lvl":3,"comparison":[{"item":"원료 활용 범위","old":"구기자 열매만 차나 청 형태로 가공해 사용함","new":"활용이 적던 구기자 순을 추출해 주원료로 사용함"},{"item":"넘침 억제 방법","old":"방부제를 넣거나 주정처리로 넘침을 억제함","new":"구기자순 추출물 배합으로 방부제 없이 억제함"},{"item":"제조 공정 조건","old":"메주 자연 발효에 의존해 집집마다 품질이 달라짐","new":"추출·당화·숙성 조건을 최적화해 품질을 안정화함"}],"applications":[{"title":"전통 장류 제조 공정","desc":"구기자순 추출물을 배합한 고추장을 생산하는 전통 장류 제조 공정에 그대로 적용함"},{"title":"고기능성 조미식품","desc":"항균 활성과 맛·풍미를 함께 보강한 고기능성 발효 조미식품을 개발하는 데 활용함"},{"title":"구기자 부산물 이용","desc":"열매 외에 버려지던 구기자 순을 식품 원료로 되살리는 지역 특산물 가공에 적용함"}]},{"id":"p1020250015885","title":"부식·침식·마모·온도 감지 기능형 Ni-P계 상향변환 스마트 코팅층 및 이를 포함하는 센싱 시스템","field":"소프트웨어","status":"공개","regNo":"","regDate":"","appNo":"10-2025-0015885","appDate":"2025.02.07","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2045.02.07","inventor":"김태호","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 부식·침식·마모 및 온도 변화를 실시간으로 감지하는 Ni-P계 상향변환 스마트 코팅층과 이를 포함하는 센싱 시스템에 관한 것이다. 무전해 니켈-인 합금 매트릭스에 상향변환 입자를 균일하게 분산시켜, 적외선을 조사하면 가시광선을 방출하여 손상 상태와 온도 변화를 광학적 신호로 전달한다. 서로 다른 감지 메커니즘이 필요했던 기존 손상 감지 기술을 단일 시스템으로 통합한 것이다.","features":[{"k":"특징","v":"Yb/Er:NaYF4 등 희토류 도핑 tions":[{"title":"미니엘이디 본딩 검사","desc":"한 기판에 수백에서 수만 개 본딩된 미니엘이디의 발산면 자세를 측정해 불량을 판정"},{"title":"디스플레이 부품 검사 장비","desc":"들뜸이나 기울어짐 같은 본딩자세 불량을 정확하게 감지하는 디스플레이 부품 검사 장비"},{"title":"인라인 높이·틸팅 측정","desc":"스테이지를 등속도로 이동시키며 상면의 평균높이와 틸팅각도를 측정하는 인라인 검사"}],"figFile":"10-2022-0143002.jpg","figureCaption":"공보 대표도면"},{"id":"p1020250013769","title":"색상 분류 시스템의 적분구 설계 방법 및 그 방법에 의해 설계된 적분구","field":"소프트웨어","status":"공개","regNo":"","regDate":"","appNo":"10-2025-0013769","appDate":"2025.02.04","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2045.02.04","inventor":"유동주","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 색상 분류 시스템에 사용되는 적분구의 설계 방법과 그 방법으로 설계된 적분구에 관한 것이다. 색상센서의 감도 특성과 초점 거리로 측정대상과의 이격거리를 정하고, 측정대상 형상을 반영해 적분구 내경과 측정점·목표점을 결정한 뒤, 입사광이 목표점에 모이도록 곡면 배플 형상을 조정한다. 저가형 센서로도 색도계의 45도 입사·0도 측정 원리를 구현해 높은 측정 정확도를 확보하는 것을 목표로 한다.","features":[{"k":"특징","v":"배플은 두 끝점과 두 제어점으로 정의되는 3차 베지어 곡선의 회전체 형상을 가지며, 제어점을 조정해 입사광이 배플과 적분구 내면에서 반복 반사되어 목표점에 도달하도록 광선 경로를 최적화한다. 내부 표면은 290~700nm에서 반사율 95% 이상인 이산화티타늄계 티타늄 화이트로 코팅한다."},{"k":"효과","v":"종래 평면 배플에 비해 조도와 휘도가 향상되어 측정 대상의 색상 정보가 센서에 효과적으로 전달되며, 12가지 녹색 계열 샘플 실험에서 평균 74.065%의 RGB 유사도를 달성하였다. 3D 프린팅으로 제작이 용이하고 코팅 내구성이 우수해 실용성과 경제성을 함께 확보한다."}],"lvl":3,"comparison":[{"item":"배플 형상 설계","old":"평면 배플은 광원의 직접광을 차단하는 데 그치는 한계가 있음","new":"3차 베지어 곡선 회전체의 곡면 배플로 입사광을 목표점에 집광"},{"item":"센서 비용 구조","old":"고성능 색상 센서 도입은 비용 대비 효율성이 적절하지 않음","new":"기하학적 제약 설계로 저가형 센서로도 우수한 측정 성능 확보"},{"item":"내부 반사 코팅","old":"내부 표면을 높은 반사율 재질로 코팅한다는 수준에 그쳤음","new":"티타늄 화이트 코팅으로 290~700nm에서 95% 이상 반사율 확보"}],"applications":[{"title":"소형 타원면체 색상 분류","desc":"소형 타원면체 측정에 최적화된 적분구를 적용해 색상을 분류하는 시스템에 쓰인다"},{"title":"저가형 색상센서 장비","desc":"고성능 센서 없이도 일관된 측정 환경을 확보해야 하는 색상 측정 장비 설계에 적용된다"},{"title":"적분구 광학부품 제작","desc":"3D 프린팅과 티타늄 화이트 코팅으로 곡면 배플 적분구를 제작하는 광학부품 분야에 활용된다"}],"figFile":"10-2025-0013769.jpg","figureCaption":"공보 대표도면"},{"id":"p1020220046060","title":"자외선을 차단할 수 있는 투명 구조체","field":"기계","status":"등록","regNo":"10-2761151","regDate":"2025.01.23","appNo":"10-2022-0046060","appDate":"2022.04.14","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2042.04.14","inventor":"권정현","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 가시광은 투과시키면서 자외선을 선택적으로 차단하는 투명 구조체에 관한 것으로, 굴절률이 서로 다른 제1 박막과 제2 박막을 교호적으로 반복 적층한 자외선 차단막과 그 면에 적층된 상전이 방지막을 포함한다. 수분과 산소까지 차단할 수 있어 유기전자소자용 투명 패시베이션막이나 투명 전극, 차량용 투명 썬팅 필름으로 활용할 수 있다. 수분·산소 차단이나 전도 기능만 수행했던 기존 봉지막·전극과 달리 광학적 기능을 함께 부여한 구조이다.","features":[{"k":"특징","v":"자외선 차단막은 굴절률 차이가 0.4 이상인 무기 산화막·질화막을 ALD 또는 CVD로 교대 적층한 DBR 필터로 동작하며, Al2O3층과 SiO2 상전이 방지막의 계면에 형성되는 부식 방지층이 내부 잔류응력을 낮춘다. 차단막이 중립축에 놓이도록 양면에 동일 두께의 플라스틱층을 코팅한다."},{"k":"효과","v":"자외선 파장대역 투과율 5% 이하, 가시광 80% 이상의 선택적 광투과성과 높은 수분·산소 배리어 성능을 동시에 확보해 유기 전자소자의 수명과 효율 향상에 기여한다. 또한 투명성을 유지하는 차량용 썬팅 필름으로 운전자 시야 확보와 실내 온도 상승 억제, 피부 광노화 예방에 활용될 수 있다."}],"lvl":3,"comparison":[{"item":"차단 대상 범위","old":"수분과 산소를 막는 배리어 기능에만 한정된 봉지막","new":"수분·산소와 함께 태양광 자외선까지 선택적으로 차단"},{"item":"가시광 투명성","old":"자동차 유리의 짙은 썬팅으로 차단해 시야 투명성이 저하","new":"가시광은 투과시키고 자외선만 막아 높은 투명성 유지"},{"item":"박막 구조 방식","old":"단일 기능의 봉지막 또는 전극막을 개별적으로 적용","new":"굴절률 차 0.4 이상 박막을 교호 적층한 DBR과 상전이 방지막"}],"applications":[{"title":"플렉시블 OLED 봉지막","desc":"수분·산소와 자외선에 취약한 웨어러블 OLED의 발광 수명과 효율 저하를 막는 맞춤형 기능성 봉지막"},{"title":"유기태양전지 보호막","desc":"야외에서 태양광에 직접 노출되는 유기태양전지의 신뢰성과 안정성을 높이는 최적화 기능성 막"},{"title":"차량용 투명 썬팅 필름","desc":"자외선을 차단해 피부 광노화와 차량 내부 온도 상승을 막으면서 운전 시야 투명성을 확보"}],"figFile":"10-2022-0046060.jpg","figureCaption":"공보 대표도면"},{"id":"p1020250010385","title":"전자펜 위치 측정 시스템","field":"전기·전자","status":"공개","regNo":"","regDate":"","appNo":"10-2025-0010385","appDate":"2025.01.23","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2045.01.23","inventor":"유영기","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 전자펜 위치 측정 시스템에 관한 것으로, 잉크 토출과 전자기파 출력이 동시에 가능한 전자펜과 필기면을 제공하면서 전자기파로 필기 위치를 측정하는 센서보드로 구성된다. 전자펜의 필기팁이 실제로 종이에 쓴 지점과 센서보드가 감지하는 코어팁 좌표 사이에 생기는 오프셋을 보정해 필기지점의 위치를 정확히 측정하도록 한 것이다. 전자기유도 방식으로 좌표를 입력하면서 실제 필기가 가능한 리필심 전자펜에 적용된다.","features":[{"k":"특징","v":"센서보드의 감지표면 또는 그 위에 놓인 종이판 일측에 위치가 미리 알려진 보정점을 표시해 두고, 사용자가 보정점에 필기팁을 접촉해 필기하면 제어부가 코어팁 위치를 측정해 보정점 위치와의 오프셋을 계산하며, 이후 감지되는 코어팁 위치를 그 오프셋만큼 보정한다. 복수 회 측정값의 평균으로도 오프셋을 구할 수 있다."},{"k":"효과","v":"리필심 교체나 종이판 변경, 펜을 쥐는 각도 차이 등으로 달라지는 오프셋을 주기적으로 또는 원하는 시점에 보정할 수 있어 필기지점 좌표를 정확하게 측정할 수 있고, 좌표 입력 정확도가 높아져 사용자가 필기와 좌표 입력 사이의 이질감 없이 원하는 내용을 정확히 입력할 수 있다."}],"lvl":3,"comparison":[{"item":"필기 구현 방식","old":"센서보드 표면에 펜팁을 접촉시켜 전자기파만 발신하였음","new":"잉크를 토출하는 필기팁을 두어 종이판에 실제 필기가 가능"},{"item":"좌표 보정 기능","old":"감지된 코어팁 위치를 그대로 좌표로 사용해 오차가 발생함","new":"보정점 필기로 오프셋을 계산해 이후 측정 위치를 보정"},{"item":"필기지점 정확도","old":"필기지점과 코어팁 감지 위치가 어긋나 정확히 일치하지 않음","new":"오프셋 보정으로 실제 필기지점의 위치를 정확하게 측정"}],"applications":[{"title":"전자펜 입력 센서보드","desc":"전자펜이 발신하는 전자기파를 감지해 필기 좌표를 측정하는 센서보드 설계와 제조에 적용된다"},{"title":"종이 필기 디지털화","desc":"감지표면 위에 놓인 종이판에 잉크로 필기한 내용을 좌표로 변환해 기록하는 데 쓰인다"},{"title":"필기 좌표 보정 모듈","desc":"보정점과 오프셋 계산을 이용해 전자펜 입력장치의 좌표 오차를 보정하는 제어부에 활용된다"}],"figFile":"10-2025-0010385.jpg","figureCaption":"공보 대표도면"},{"id":"p1020250010386","title":"샤프펜슬이 일체화되며 절전기능을 지원하는 전자기유도 전자펜 및 전자펜 좌표 측정 시스템","field":"전기·전자","status":"공개","regNo":"","regDate":"","appNo":"10-2025-0010386","appDate":"2025.01.23","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2045.01.23","inventor":"유영기","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 샤프펜슬이 일체화되며 절전기능을 지원하는 전자기유도 전자펜 및 좌표 측정 시스템에 관한 것으로, 센서보드가 발신한 제1전자기파로 여기된 전자펜의 공진회로가 제2전자기파를 되돌려 보내 필기 지점의 좌표를 측정한다. 볼펜심을 결합한 기존 전자펜과 달리 언제든 지울 수 있는 연필심으로 실제 필기를 하면서 좌표를 입력할 수 있고, 필기하는 동안에만 공진회로가 자동으로 켜지도록 설계되었다.","features":[{"k":"특징","v":"외부몸체 내부에 전방을 향한 탄성으로 지지된 내부몸체가 샤프펜슬구조체와 페라이트코어에 감긴 코일의 공진회로, 절전스위치를 구비한다. 필기 시 샤프펜슬구조체가 후방으로 유동하면서 링형지지대에 눌린 절전스위치가 공진회로를 온시키고, 필기가 중단되면 탄성으로 복귀하며 오프시킨다."},{"k":"효과","v":"지울 수 있는 연필심 필기와 전자기유도 방식 좌표 입력을 동시에 구현하고, 필기하지 않을 때는 전자펜이 센서보드에 감지되지 않아 원치 않는 입력을 방지한다. 또한 센서보드도 절전 상태로 전환되어 소비전력을 절감할 수 있다."}],"lvl":3,"comparison":[{"item":"필기 수단 구성","old":"전자펜은 페라이트코어와 공진회로만 갖춰 실제 필기는 불가함","new":"노크로 연필심을 밀어내는 샤프펜슬구조체를 내부에 일체화"},{"item":"전력 소모 방식","old":"절전스위치가 없어 필기하지 않을 때도 공진회로가 켜져 있음","new":"필기 시 구조체 유동으로 절전스위치가 공진회로를 온 오프"},{"item":"페라이트코어 구조","old":"페라이트 코어가 본체 앞쪽에 배치되고 코일만 감겨 있었음","new":"중공 대롱 형태 코어로 연필심이 통과해 전방으로 돌출"}],"applications":[{"title":"디지털 필기 입력장치","desc":"센서보드와 상호작용해 필기 좌표를 측정하는 전자기유도 전자펜 제품에 적용된다"},{"title":"학습용 필기 기록 시스템","desc":"연필심으로 종이에 실제 필기하면서 그 좌표를 함께 기록하는 학습 기기에 활용할 수 있다"},{"title":"저전력 전자펜 설계","desc":"필기 동작에만 공진회로를 켜는 절전스위치 구조로 전자펜의 소비전력을 줄이는 데 쓰인다"}],"figFile":"10-2025-0010386.jpg","figureCaption":"공보 대표도면"},{"id":"p1020250009613","title":"PWM IC의 주파수 조절 회로","field":"전기·전자","status":"공개","regNo":"","regDate":"","appNo":"10-2025-0009613","appDate":"2025.01.22","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2045.01.22","inventor":"강민수","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 아날로그 회로에서 PWM 주파수를 조절하기 위해 PWM IC의 주파수 조절 핀에 연결되는 주파수 조절 회로에 관한 것으로, 제1~제3 저항과 옵토커플러, 연산증폭기로 구성된다. 주파수 조절 기능이 있는 PWM IC가 우주용 부품으로는 존재하지 않고 별도의 주파수 조절용 IC를 추가하면 회로가 복잡해지는 문제를 간단한 구성으로 해결한다. 주파수 조절 핀에 인가되는 저항값을 바꾸는 방식으로 주파수를 제어한다.","features":[{"k":"특징","v":"주파수 조절 핀에 연결된 제1저항과 옵토커플러 포토트랜지스터의 이미터에 연결된 제2저항이 병렬 합성저항을 이루고, 연산증폭기 출력과 제3저항이 옵토커플러 LED 전류를 조절해 포토트랜지스터의 개폐량을 바꾼다. 개폐량이 클수록 합성저항이 작아져 주파수가 변하며, 블록킹 다이오드가 역방향 전류를 차단한다."},{"k":"효과","v":"아날로그 회로에서 별도의 주파수 조절용 IC를 추가하지 않고 저항과 옵토커플러, 연산증폭기만의 간단한 회로 구성으로 PWM IC의 주파수를 조절할 수 있으며, 연산증폭기를 출력 전압·전류가 궤환되는 PID 제어기로 구성해 피드백 제어에도 적용할 수 있다."}],"lvl":3,"comparison":[{"item":"주파수 조절 방식","old":"디지털 회로는 마이크로컨트롤러를 통해 주파수를 제어하였음","new":"옵토커플러 포토트랜지스터의 개폐량으로 저항값을 바꿔 조절"},{"item":"회로 구성 복잡도","old":"주파수 조절용 IC를 추가하면 회로 설계가 복잡해졌음","new":"저항 세 개와 옵토커플러, 연산증폭기만으로 간단하게 구성"},{"item":"부품 수급 가능성","old":"주파수 조절 기능 PWM IC는 우주용 부품으로 존재하지 않음","new":"조절 기능이 없는 PWM IC의 주파수 조절 핀에 연결해 사용"}],"applications":[{"title":"아날로그 전력변환 회로","desc":"마이크로컨트롤러 없이 아날로그 회로에서 PWM 주파수를 조절하는 전력변환 회로에 적용된다"},{"title":"우주용 전자부품 설계","desc":"주파수 조절 기능 PWM IC가 없는 우주용 부품 환경에서 주파수 조절 기능을 구현하는 데 쓰인다"},{"title":"PID 제어 전원장치","desc":"연산증폭기로 출력 전압과 전류를 궤환하는 PID 제어 전원장치의 주파수 제어에 활용된다"}],"figFile":"10-2025-0009613.jpg","figureCaption":"공보 대표도면"},{"id":"p1020250009431","title":"고령자를 위한 무릎각도 측정기구 및 무릎각도 측정방법","field":"의료","status":"공개","regNo":"","regDate":"","appNo":"10-2025-0009431","appDate":"2025.01.22","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2045.01.22","inventor":"남연교","transfer":"매매 · 라이센스","tags":["고령자","무릎관절","관절가동범위","재활측정"],"summary":"본 기술은 무릎을 중심으로 하는 다리의 꺾임 각도를 정확하게 측정하기 위한 고령자용 무릎각도 측정기구 및 측정방법에 관한 것임. 전문치료사가 표시해 둔 표식에 따라 제1줄자와 제2줄자를 다리의 해당 위치에 정확히 고정할 수 있어, 측정기구를 무릎관절의 축에 맞게 설치할 수 있도록 하는 것을 목적으로 함.","features":[{"k":"특징","v":"제1연장팔, 회동지지부를 중심으로 회동 가능하게 연결된 제2연장팔, 두 연장팔 사이의 회동각도를 측정해 나타내는 각도측정 표시부를 기본 구성으로 함. 여기에 회동지지부에서 이격된 위치의 제1연장팔에 설치되어 종아리 또는 허벅지 둘레를 측정하는 제1줄자와, 제2연장팔에 설치되어 나머지 하나의 둘레를 측정하는 제2줄자를 포함하는 것이 특징임."},{"k":"효과","v":"줄자로 다리 둘레를 재면서 동시에 측정기구를 무릎관절 축에 맞춰 고정할 수 있어, 측정자가 바뀌거나 반복 측정을 하더라도 기구의 설치 위치가 흔들리지 않음. 이를 통해 무릎 꺾임 각도를 정확하고 일관되게 측정할 수 있음."}],"outlook":"무릎 관절가동범위 측정은 재활 경과를 판단하는 기본 지표이지만, 일반 각도계는 관절 축 정렬이 측정자의 감각에 좌우되어 같은 대상을 재측정해도 값이 달라지는 한계가 있음. 본 기술은 줄자를 이용한 위치 고정 구조를 각도계에 결합해, 전문치료사가 표시한 표식 그대로 재현 가능한 측정을 가능하게 함.","comparison":[{"item":"기구 설치","old":"측정자가 눈대중으로 관절 축을 맞춤","new":"표식에 따라 줄자로 위치를 고정해 관절 축에 정렬"},{"item":"재현성","old":"측정자와 측정 시점에 따라 값이 달라짐","new":"동일 위치 재현으로 반복 측정값의 일관성 확보"},{"item":"측정 항목","old":"꺾임 각도만 측정","new":"각도와 함께 종아리·허벅지 둘레를 동시 측정"}],"markets":[{"title":"세계 관절가동범위 각도계 시장","unit":"만 달러","from":{"y":"2024","v":"930"},"to":{"y":"2032","v":"1,380"},"cagr":"CAGR 4.9%","note":"2024년 930만 달러에서 2032년 1,380만 달러 규모로 전망됨. 기구 자체는 소규모 시장이나, 재활 측정 프로토콜과 묶인 소모·교체 수요가 꾸준함. (출처: Intel Market Research)"},{"title":"세계 재활기기 시장","unit":"억 달러","from":{"y":"2026","v":"219.6"},"to":{"y":"2035","v":"349.1"},"cagr":"CAGR 5.74%","note":"2026년 219.6억 달러에서 2035년 349.1억 달러로 성장이 전망됨. 고령화에 따른 근골격계 재활 수요가 성장을 견인함. (출처: Precedence Research)"}],"applications":[{"title":"노인복지관·보건소 건강측정","desc":"고령자 대상 정기 건강측정과 낙상 위험 선별 프로그램에서 무릎 가동범위를 표준화된 방식으로 기록"},{"title":"정형외과·재활의학과 임상평가","desc":"인공관절 치환술과 무릎 수술 전후의 회복 경과를 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 감전사고 방지를 위한 전기자동차 충전시스템 및 방법에 관한 것으로, 비나 눈으로 충전 커넥터나 전원플러그에 습기가 있는 경우 이를 감지해 충전전류를 차단하고 충전기를 연결하기 전에 사용자에게 감전 위험을 미리 알린다. 감전위험 알림이 없어 물기 있는 상태에서 충전기를 연결·분리하다 사고가 나는 것을 막을 수 없었던 기존 충전기의 한계를 해결하려는 기술이다.","features":[{"k":"특징","v":"충전커넥터가 구비된 충전기 본체에 습기감지센서·습도센서로 구성된 센서부와 알림부, 통신부, 데이터베이스부, 제어부를 두어, 제어부가 센서데이터로 감전위험을 판단하면 충전전류를 차단하고 차량 및 커넥터 디스플레이, 스피커, 사용자 단말기로 알린다. 온도센서를 추가해 이상발열·화재 시 전원을 차단하며, 딥러닝 기반 판단도 가능하다."},{"k":"효과","v":"전기자동차에 충전기를 연결하거나 분리할 때 습기로 인한 감전위험을 미연에 방지할 수 있어 충전 시 안전사고로 인한 불필요한 인명 및 재산 피해를 효과적으로 막을 수 있고, 충전소 관리시스템과 연동해 다수 충전기의 감전위험과 이상 발생을 모니터링할 수 있다."}],"lvl":3,"comparison":[{"item":"습기 감지 기능","old":"충전 시 습기를 감지하는 기능이 없어 감전 위험을 알 수 없었음","new":"충전기 본체 각 부분에 습기감지센서나 습도센서를 설치해 감지"},{"item":"위험 알림 방식","old":"감전 위험에 대한 알림이나 안내가 사용자에게 제공되지 않았음","new":"차량과 커넥터의 디스플레이, 스피커, 사용자 단말기로 알림 전달"},{"item":"충전전류 제어","old":"물기가 있는 상태로 연결해도 충전이 그대로 수행되었음","new":"습기가 감지되면 충전전류를 차단해 감전사고를 미연에 방지"}],"applications":[{"title":"전기자동차 충전기","desc":"실외에 설치되는 전기자동차 충전기에 습기 감지와 알림, 전류 차단 기능을 더해 감전을 방지한다"},{"title":"공공 충전 인프라 운영","desc":"눈이나 비가 잦은 환경의 공공 충전소에서 이용자 감전사고를 예방하는 안전 관리 수단으로 쓰인다"},{"title":"충전 안전 알림 서비스","desc":"통신부와 사용자 단말기를 연계해 충전기의 습기 상태와 감전 위험을 알리는 서비스에 적용된다"}],"figFile":"10-2025-0009282.jpg","figureCaption":"공보 대표도면"},{"id":"p1020250008655","title":"폐당근잎을 활용한 항염증 미스트 제조 방법","field":"의료","status":"공개","regNo":"","regDate":"","appNo":"10-2025-0008655","appDate":"2025.01.21","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2045.01.21","inventor":"최효정","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 농업 폐기물로 간주되던 폐당근잎을 활용해 항염증 효과를 갖는 친환경 미스트를 제조하는 방법에 관한 것으로, 폐당근잎에서 유효 성분인 플라보노이드 글리코사이드를 추출해 피부 염증 완화 및 진정용 미스트 조성물로 만든다. 자원 순환과 농업 폐기물의 고부가가치화를 도모하면서 민감한 피부에도 쓸 수 있는 천연 유래 화장품 원료를 제공한다. 플라보노이드를 함유한 당근잎의 잠재적 활용 가능성에 주목한 기술이다.","features":[{"k":"특징","v":"폐당근잎을 세척·절단해 크기를 균질화한 뒤 열에 의한 성분 손상을 줄이도록 30~50°C에서 물과 에탄올 혼합 용매로 60~120분간 추출하고, 여과·농축으로 플라보노이드 글리코사이드를 분리·정제한 다음 보습제와 점도 조절제를 넣어 안정화한다. 미세 분무 캡이나 e":"","appNo":"10-2025-0006264","appDate":"2025.01.15","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2045.01.15","inventor":"이장범","transfer":"매매 · 라이센스","smk":false,"brief":false,"lvl":0},{"id":"p1020250003219","title":"백오프 동작영역에서의 출력 레벨 향상과 효율 개선을 위한 도허티 전력 증폭기","field":"전기·전자","status":"공개","regNo":"","regDate":"","appNo":"10-2025-0003219","appDate":"2025.01.09","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2045.01.09","inventor":"오인열","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 백오프 동작영역에서의 출력 레벨 향상과 효율 개선을 위한 도허티 전력 증폭기에 관한 것으로, 캐리어 증폭기와 출력정합회로(OMN)가 접속된 캐리어 라인에 피킹 증폭기, OMN, 90도 위상 변경용 QWT가 접속된 하나 또는 복수의 피킹 라인을 병렬 연결한 구조다. 종래 도허티 전력 증폭기는 캐리어 라인의 QWT가 백오프 영역에서 신호 손실과 전력을 소비해 저출력 신호에서 효율이 떨어지는 문제가 있었다.","features":[{"k":"특징","v":"QWT를 캐리어 라인이 아닌 피킹 라인에 접속해 피킹 증폭기 출력 신호의 위상을 90도 변경함으로써 캐리어 증폭기와 피킹 증폭기 사이의 위상을 보상하며, 저전력에서는 캐리어 증폭기만, 고전력에서는 피킹 증폭기가 함께 활성화되어 출력을 보조한다."},{"k":"효과","v":"고전력 입력에서는 종래 증폭기와 동등한 출력과 효율을 유지하면서 6dB 백오프 상태에서는 종래 도허티 전력 증폭기보다 높은 출력값과 효율값을 보여, 백오프 동작영역에서의 출력 레벨과 전력 효율을 개선할 수 있다."}],"lvl":3,"comparison":[{"item":"QWT 접속 위치","old":"캐리어 라인에 QWT를 접속하는 일반적인 도허티 증폭기 구조","new":"피킹 라인에 QWT를 접속해 피킹 증폭기 출력 신호 위상을 90도 변경"},{"item":"백오프 효율","old":"백오프 동작영역에서 QWT가 신호 손실과 전력을 소비해 효율이 저하","new":"백오프 동작영역에서 출력 레벨 향상과 전력 효율 개선을 함께 달성"},{"item":"라인 확장성","old":"두 개의 증폭기로 저출력과 고출력 신호를 증폭하는 구조에 한정","new":"캐리어 라인에 복수 개의 피킹 라인을 병렬 연결하는 구성도 제공"}],"applications":[{"title":"RF 전력 증폭기","desc":"높은 효율성과 선형성이 요구되는 RF 대역 전력 증폭기 설계에 적용하는 분야"},{"title":"무선통신 송신단","desc":"무선 통신 시스템에서 백오프 동작영역의 전력 효율을 개선하는 송신 증폭 단"},{"title":"다단 도허티 구조","desc":"복수의 피킹 라인을 병렬로 연결해 출력 레벨을 높이는 다중 도허티 증폭기 구성"}],"figFile":"10-2025-0003219.jpg","figureCaption":"공보 대표도면"},{"id":"p1020230139504","title":"초전도 벌크 자석 및 이의 제조 방법","field":"전기·전자","status":"등록","regNo":"10-2754616","regDate":"2025.01.09","appNo":"10-2023-0139504","appDate":"2023.10.18","applicant":"한국전력공사 · 선문대학교 산학협력단","coApplicant":true,"expiry":"2043.10.18","inventor":"이상헌","transfer":"매매 · 라이센스","smk":false,"brief":false,"lvl":0},{"id":"p1020250003474","title":"멀티셀 시스템에서 다수 사용자 동시 전송방법 및 장치","field":"소프트웨어","status":"공개","regNo":"","regDate":"","appNo":"10-2025-0003474","appDate":"2025.01.09","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2045.01.09","inventor":"신창용","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 멀티셀 환경에서 하나의 기지국이 셀 중심 사용자와 복수의 셀 경계 사용자에게 동일한 주파수 자원으로 데이터를 동시에 전송하는 다중안테나 기반 비직교 다중접속 방법 및 장치에 관한 것으로, 셀 중심 사용자에게는 다수의 데이터 스트림을, 각 셀 경계 사용자에게는 하나의 데이터 스트림을 결합하여 보낸다. 인접 셀 간섭이 존재하는 환경에서 기존 비직교 다중접속 방식의 한계를 극복하고 주파수 효율을 높이는 것을 목표로 한다.","features":[{"k":"특징","v":"기지국은 셀 중심 사용자의 MIMO 채널 정보를 특이값 분해해 스트림별 송신전력할당 행렬을 정하고, 셀 경계 사용자 간 간섭을 제거하는 프리코더 행렬과 전송률을 최대화하는 송신전력할당 행렬을 결정하며, 셀 경계 단말은 간섭 대비 신호 비를 최대화하는 수신 빔포밍 벡터를 반복 과정으로 설계해 적용한다."},{"k":"효과","v":"인접 셀의 간섭이 존재하는 멀티셀 환경에서도 간섭을 최소화하면서 셀 중심 사용자와 다수의 셀 경계 사용자에게 데이터를 동시에 전송할 수 있어, 주파수 자원을 늘리지 않고도 시스템의 주파수 효율과 총합 전송률을 향상시킬 수 있다."}],"lvl":3,"comparison":[{"item":"간섭 제거 범위","old":"클러스터 간 간섭만 제거하고 인접 셀 간섭은 고려하지 못함","new":"프리코더 행렬로 셀 경계 단말 간 간섭과 인접 셀 간섭을 함께 제거"},{"item":"데이터 스트림 수","old":"클러스터의 각 사용자에게 다수 데이터 스트림 전송이 불가함","new":"셀 중심 단말에 복수 스트림, 경계 단말에 각 1개 스트림을 전송"},{"item":"주파수 효율","old":"직교 다중접속 기반으로 주파수 자원 증설 없이는 용량 확대에 한계","new":"동일 주파수 자원 중첩 할당과 송신전력할당 행렬 설계로 효율 향상"}],"applications":[{"title":"차세대 이동통신 기지국","desc":"멀티셀 환경 기지국의 하향링크 전송에 적용해 셀 중심 단말과 경계 단말에 동시 전송하여 주파수 효율을 높인다"},{"title":"비직교 다중접속 통신장비","desc":"중첩 코딩과 프리코딩을 사용하는 비직교 다중접속 송수신 장비의 전력할당 및 프리코더 설계 모듈로 구현된다"},{"title":"대용량 무선 데이터 서비스","desc":"가상현실, 메타버스, 사물인터넷 등 트래픽이 급증하는 무선 서비스의 다수 사용자 동시 수용에 활용된다"}],"figFile":"10-2025-0003474.jpg","figureCaption":"공보 대표도면"},{"id":"p1020250003475","title":"허약 또는 거동 불편 환자의 구강케어를 위한 신체 지지용구","field":"의료","status":"공개","regNo":"","regDate":"","appNo":"10-2025-0003475","appDate":"2025.01.09","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2045.01.09","inventor":"최용금","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 허약하거나 거동이 불편한 환자의 구강케어를 돕는 신체 지지용구에 관한 것으로, 환자의 가슴이나 등을 탄력적으로 받쳐 엎드린 자세 또는 앉은 자세를 안정적으로 유지하게 하는 쿠션부재를 기본 구조로 한다. 쿠션부재 내부에는 구강케어용 정수를 담는 제1수통과 케어 과정에서 나오는 오수를 받는 제2수통이 함께 배치되어 자세 지지와 물 공급·배출을 한 기구에서 처리한다.","features":[{"k":"특징","v":"제1수통과 제2수통에는 각각 쿠션부재 외부로 이어지는 제1호스와 제2호스가 연결되고, 제1호스 끝단의 빨대로 정수를 환자 구강에 공급하며 제2호스 끝단의 물받이부재로 양치물 등 오수를 받아 수통으로 유입시킨다. 쿠션 커버 표면에는 요철이 형성되어 피부 접촉면의 통기를 돕는다."},{"k":"효과","v":"환자가 편안하고 안전한 자세를 유지한 상태에서 구강케어를 받을 수 있고, 정수 공급과 오수 처리의 번거로움이 줄어 요양보호사나 간병인의 상시 도움 없이도 구강케어가 수월해지며, 커버의 요철 통기로 장시간 지지 시 욕창 등 피부 손상을 예방할 수 있다."}],"lvl":3,"comparison":[{"item":"신체 지지 방식","old":"일반 쿠션으로 기울어짐만 막아 케어 중 자세 유지가 불안정함","new":"쿠션부재로 가슴 또는 등을 지지해 엎드림, 앉은 자세를 안정 유지"},{"item":"정수 오수 처리","old":"정수 공급과 오수 수용 수단이 없어 별도 용기와 인력이 필요함","new":"제1수통과 제2수통, 호스에 빨대와 물받이를 연결해 급수와 배수"},{"item":"보조 인력 의존도","old":"요양보호사나 간병인의 상시 도움 없이는 구강케어가 어려움","new":"고정구와 결속구로 용구를 고정해 도움 없이도 자세 유지가 가능"}],"applications":[{"title":"요양시설 구강케어","desc":"요양시설에 거주하는 허약 노인 환자의 구강 건강관리 시 신체를 지지해 안전하게 케어하도록 돕는다"},{"title":"방문 구강위생 서비스","desc":"거동이 불편한 환자를 방문해 구강케어를 실시할 때 자세 지지와 정수 공급, 오수 수용을 함께 제공한다"},{"title":"간병 돌봄 보조용품","desc":"허약 환자의 가슴 또는 등을 지지하는 자세유지 쿠션으로 간병 및 돌봄 현장에서 활용할 수 있다"}],"figFile":"10-2025-0003475.jpg","figureCaption":"공보 대표도면"},{"id":"p1020250001720","title":"초음파 어레이 마이크로니들 및 그 제조 방법","field":"의료","status":"공개","regNo":"","regDate":"","appNo":"10-2025-0001720","appDate":"2025.01.06","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2045.01.06","inventor":"여홍구","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 초음파 어레이 마이크로니들 및 그 제조 방법에 관한 것으로, 복수의 마이크로니들이 형성된 마이크로니들 어레이와 각 마이크로니들 또는 특정 마이크로니들에 선별적으로 초음파를 발생시키는 pMUT(압전 미세가공 초음파 트랜스듀서) 어레이를 포함한다. 종래 마이크로니들은 확산 등 수동적 전달에 의존해 흡수율이 낮고 진피층까지 약물이 도달하지 못하며 모든 니들이 동시에 작동해 특정 영역 전달이 어려웠다.","features":[{"k":"특징","v":"pMUT 어레이는 각 마이크로니들 하부의 압전층, 상·하부 전극층, 절연층, 공진 주파수를 결정하는 기판으로 구성되며 AC 전원이나 RF 신호를 인가해 초음파를 발생시키고, 마이크로몰드에 저용해성 용액을 경화한 뒤 반전된 pMUT 어레이를 부착해 제조한다."},{"k":"효과","v":"복수의 마이크로니들 중 개별 니들 또는 특정 니들에만 선별적으로 초음파를 발생시킬 수 있어, 약물이 필요한 부위에만 선택적으로 전달하면서 환자의 진피층까지 주입할 수 있고, 이를 통해 치료 효과를 le":"10-2022-0187782.jpg","figureCaption":"공보 대표도면"},{"id":"p1020240198563","title":"상하 높낮이 조절가능 휠체어","field":"의료","status":"공개","regNo":"","regDate":"","appNo":"10-2024-0198563","appDate":"2024.12.27","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2044.12.27","inventor":"남연교","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 상하 높낮이 조절가능 휠체어에 관한 것으로, 본체를 형성하는 메인프레임, 사용자가 앉는 좌석부, 좌석부를 상하로 이동시키는 승강수단을 갖춘 높낮이 조절부, 메인프레임 양 측면의 다수 바퀴로 구성된다. 기존 높이조절 휠체어는 대부분 위쪽으로만 조절되어 침상 등 높은 곳으로의 이동은 쉬우나 바닥 등 낮은 곳으로의 이동이 어렵고, 전동형이거나 별도 장비 부착으로 무겁고 부피가 커 소아환자가 쓰기 어려웠다.","features":[{"k":"특징","v":"높낮이 조절부는 슬라이딩 방식 다단 구조체와 구동수단으로 이루어져 각 단이 최하단에 완전히 삽입되도록 구성되어 바닥 높이까지 낮출 수 있고, 좌석과 일체인 이동등받이와 고정등받이의 이중 등받이로 승강 중 뒤로 넘어지는 것을 방지한다."},{"k":"효과","v":"휠체어보다 높은 곳은 물론 낮은 곳으로도 편리하게 이동할 수 있어 사용 환자에게 가장 어려운 동작인 휠체어에서 바닥으로의 이동을 독립적으로 수행할 수 있고, 일상생활의 범위를 넓혀 사회생활의 자발적 참여를 유도할 수 있다."}],"lvl":3,"comparison":[{"item":"높이 조절 범위","old":"기존 높이조절 휠체어는 위쪽 방향으로만 조절되는 경우가 대부분","new":"다단 구조체가 최하단까지 삽입되어 상하 양방향 높낮이 조절이 가능"},{"item":"구동·무게 구성","old":"전동형이거나 별도 장비를 부착해 무게가 무겁고 부피가 커짐","new":"수동형 휠체어 형태에 승강수단을 적용해 사용자가 직접 수동 조절"},{"item":"낮은 곳 이동","old":"침상 이동은 비교적 쉬우나 바닥 등 낮은 곳으로의 이동이 매우 어려움","new":"좌석을 바닥 높이까지 낮춰 휠체어에서 바닥으로 독립 이동이 가능"}],"applications":[{"title":"소아용 수동 휠체어","desc":"근력이 약한 소아환자가 보호자 도움 없이 사용할 수 있는 높낮이 조절 휠체어"},{"title":"재활·이승 보조기구","desc":"침상과 바닥 등 높이가 다른 곳으로 환자가 독립적으로 옮겨 앉도록 돕는 보조기구"},{"title":"장애인 생활 보조","desc":"거동이 불편한 환자와 노약자의 일상생활 범위를 넓히고 자발적 사회 참여를 유도"}],"figFile":"10-2024-0198563.jpg","figureCaption":"공보 대표도면"},{"id":"p1020210191484","title":"바이러스성출혈성패혈증 예방용 불활화 백신 조성물 및 이를 이용한 바이러스성출혈성패혈증의 예방방법","field":"의료","status":"등록","regNo":"10-2748878","regDate":"2024.12.26","appNo":"10-2021-0191484","appDate":"2021.12.29","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2041.12.29","inventor":"권세련","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 바이러스성출혈성패혈증(VHS) 예방용 불활화 백신 조성물 및 이를 이용한 예방방법에 관한 것으로, 바이러스성출혈성패혈증 바이러스(VHSV)와 과산화수소, 또는 과산화수소로 불활화된 VHSV를 포함하는 백신 조성물과 이를 넙치 등 어류에 투여하는 예방방법을 제공한다. 항원성이 변형되는 기존 포르말린 불활화 백신의 한계를 개선한 것이다.","features":[{"k":"특징","v":"0.3~2%(v/v) 과산화수소를 처리하면 1~2일차부터 VHSV의 감염력이 완전히 소실되는 반면, RT-PCR과 웨스턴 블롯 결과 핵산과 단백질(G·N·P·M)은 변성되지 않아 에피토프가 보존된다. 담체나 어주번트를 추가할 수 있고 넙치에 100㎕/fish 복강 주사로 투여한다."},{"k":"효과","v":"넙치 공격접종 실험에서 생존율 96~97%(상대생존율 94.4%)로 시판 백신(28.3%)보다 월등히 높은 방어력을 보였고, 어주번트 없이도 인터페론 유도 유전자(Mx, ISG15)와 T세포 관련 유전자 발현을 유의하게 증가시켜 어류 VHS용 신규 백신으로 활용 가능성이 높다."}],"lvl":3,"comparison":[{"item":"불활화 처리제","old":"포르말린으로 바이러스를 불활화해 백신을 제작","new":"0.3~2%(v/v) 과산화수소로 바이러스를 불활화"},{"item":"항원성 보존","old":"포르말린이 단백질과 핵산을 가교해 에피토프를 변형","new":"낮은 농도로 핵산과 단백질을 변성시키지 않고 불활화"},{"item":"방어 효능 확인","old":"항원성 변성으로 충분한 면역원성을 주지 못할 가능성","new":"넙치 공격접종 실험에서 생존율 96~97%를 확인"}],"applications":[{"title":"어류 양식용 백신","desc":"넙치 등 양식 어류에 투여해 바이러스성출혈성패혈증을 예방하는 불활화 백신으로 활용할 수 있다"},{"title":"수산 질병 방역","desc":"저수온기에 발병하는 VHS로 인한 양식장 폐사와 경제적 손실을 줄이는 방역 수단으로 쓸 수 있다"},{"title":"과산화수소 불활화 기술","desc":"항원의 핵산과 단백질을 변성시키지 않는 과산화수소 불활화 방식을 백신 제조 공정에 적용할 수 있다"}],"figFile":"10-2021-0191484.jpg","figureCaption":"공보 대표도면"},{"id":"p1020240195798","title":"방선균 유래 신규 탈메틸화 효소","field":"의료","status":"공개","regNo":"","regDate":"","appNo":"10-2024-0195798","appDate":"2024.12.24","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2044.12.24","inventor":"오태진","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 방선균 아미콜라톱시스 마구센시스 KCCM40447 유래 신규 탈메틸화 효소에 관한 것으로, 벤조산 유도체의 O-탈메틸화를 촉매하는 시토크롬 P450 효소 CYP199A35와 그 산화환원 파트너 페레독신-NAD(P) 환원효소를 제공한다. 리그닌 등 방향족 화합물은 고리 절단 전 O-탈메틸화가 필수적이며, 기존 탈메틸화 효소는 공기 산화에 민감해 정제와 특성 분석에 제약이 있었다.","features":[{"k":"특징","v":"CYP199A35 유전자는 4-하이드록시벤조에이트 수송체 유전자와 인접해 보존되어 있고 환원효소와 함께 2성분 전자전달 시스템을 이루며, 파라 O-메틸 치환 벤조산 유도체인 4-메톡시벤조산(4MB)과 4-메톡시신남산(4MCA)의 O-탈메틸화에 특이적이다."},{"k":"효과","v":"4MB와 4MCA를 각각 4HB와 4-하이드록시신남산으로 효율적으로 전환하며 비생리적 파트너(Pdr/Pdx)를 쓰면 촉매 효율이 약 3.5배 높아져, 재조합 미생물·전세포 생체촉매로 방향족 오염물질의 생체 정화와 고부가 화학물질 생산에 활용할 수 있다."}],"lvl":3,"comparison":[{"item":"전자 전달 구성","old":"대부분의 박테리아 CYP 매개 O-탈메틸화 효소는 3성분 시스템을 사용","new":"CYP199A35와 페레독신 환원효소로 이루어진 2성분 시스템으로 전자 전달"},{"item":"기질 선택성","old":"바닐레이트 탈메틸화 효소는 p-메톡시벤조에이트를 선호하지 않음","new":"4-메톡시벤조산염과 4-메톡시신남산의 O-탈메틸화에 특이적 활성"},{"item":"효소 안정성","old":"기존 탈메틸화 효소는 활성이 공기 산화에 민감해 정제와 특성 분석에 제한","new":"2성분과 3성분 산화환원 파트너를 모두 사용해 우수한 촉매 효율 확보"}],"applications":[{"title":"방향족 오염물 정화","desc":"식물 분해와 석유 폐기물에서 발생하는 방향족 오염 물질의 생물학적 정화에 적용"},{"title":"리그닌 유래 소재화","desc":"리그닌 유래 아릴 메틸 에테르를 탈메틸화해 고부가 화학물질의 빌딩 블록 생산"},{"title":"벤조산 유도체 전환","desc":"효소를 벤조산 유도체와 반응시켜 파라 위치 O-메틸기를 제거하는 탈메틸화 공정"}],"figFile":"10-2024-0195798.jpg","figureCaption":"공보 대표도면"},{"id":"p1020240195797","title":"신규 트레할라제 효소 및 이의 용도","field":"의료","status":"공개","regNo":"","regDate":"","appNo":"10-2024-0195797","appDate":"2024.12.24","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2044.12.24","inventor":"오태진","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 저온 적응형 베리오보락스 sp. PAMC28711 유래 신규 재조합 트레할라제 효소 및 이의 용도에 관한 것으로, α,α-트레할로스를 분해해 포도당을 생성하는 두 효소 Vtre37(GH37 계열)과 Vtre15(GH15 계열)를 제공한다. 단일 균주에 서열 유사성이 없는 두 계열의 트레할라제 유전자가 함께 존재하는 사례는 보고된 바 없었고, 박테리아 유래 트레할라제의 가용성이 제한적이었던 한계를 해결한다.","features":[{"k":"특징","v":"Vtre37과 Vtre15의 최적 pH는 모두 6.0이고 최적 온도는 각각 60℃와 40℃이며, 부위 지정 돌연변이로 Vtre37은 D280·E469, Vtre15는 E389·E554가 촉매 부위임을 확인했고 Vtre37의 촉매 효율은 Vtre15의 300배 이상이었다."},{"k":"효과","v":"트레할로스를 포도당으로 가수분해해 효모의 당 소비를 늘려 에탄올 수율을 높일 수 있고, Vtre37은 10% 에탄올과 산성 pH에서 안정해 에탄올 발효 공정에 적용 가능하며, 발리도옥실아민 A에 경쟁적으로 억제되어 트레할라제 억제제 스크리닝에도 쓸 수 있다."}],"lvl":3,"comparison":[{"item":"효소 확보 가능성","old":"곰팡이와 고세균 트레할라제만 일부 보고되고 박테리아 유래는 매우 드묾","new":"남극 유래 Variovorax 균주에서 GH15·GH37 트레할라제를 확보"},{"item":"촉매 부위 규명","old":"트레할라제의 두 결합 부위 역할만 알려지고 촉매 잔기는 미확인","new":"D280A·E469A와 E389A·E554A 돌연변이로 촉매 부위 기여 확인"},{"item":"에탄올 생산 활용","old":"발효 중 생성된 트레할로스가 남아 최종 에탄올 수율 향상이 제한됨","new":"에탄올 내성을 가진 Vtre37이 발효 말기 트레할로스까지 가수분해"}],"applications":[{"title":"연료 에탄올 생산","desc":"발효 과정에서 생성되는 트레할로스를 가수분해해 에탄올 수율을 높이는 용도"},{"title":"트레할로스 분해 효소","desc":"알파,알파-트레할로스를 포도당 혼합물로 가수분해하는 산업용 트레할라제 효소로 활용"},{"title":"트레할라제 억제제 탐색","desc":"발리도옥실아민 A에 의한 억제 특성을 활용해 특정 트레할라제 억제제를 선별"}],"figFile":"10-2024-0195797.jpg","figureCaption":"공보 대표도면"},{"id":"p1020240195796","title":"신규 p-하이드록시벤조에이트 하이드록실라제 및 이의 용도","field":"의료","status":"공개","regNo":"","regDate":"","appNo":"10-2024-0195796","appDate":"2024.12.24","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2044.12.24","inventor":"오태진","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 아쓰로박터 sp. PAMC25564 유래 신규 재조합 p-하이드록시벤조에이트 하이드록실라제(PHBH) 및 이의 용도에 관한 것으로, 4-하이드록시벤조에이트(4HB)를 프로토카테츄에이트(PCA)로 전환하는 ortho-수산화를 촉매하는 효소다. 그룹 A 플라보단백질 모노옥시게나제에는 표준 NAD(P)H 결합 도메인이 없어 조효소 결합 잔기와 올리고머 형태가 불명확했던 문제를 규명하였다.","features":[{"k":"특징","v":"결정 구조와 다각광산란 분석으로 92.6 kDa의 기능성 이량체임을 확인했고, A/B 계면을 파괴하는 S378W 돌연변이는 단량체화되어 FAD를 잃고 활성이 소실되었으며, R50·R273·S166은 NAD(P)H 결합에, E44는 조효소 특이성 결정에 중요한 잔기로 확인되었다."},{"k":"효과","v":"NADH와 NADPH를 모두 활용하면서 NADH를 선호하는 조효소 다용도성을 입증해 다양한 생리적 조건에서 기능할 수 있음을 보였고, 재조합 미생물과 전세포 생체촉매로 4HB의 PCA 전환 등 산업 및 환경 응용에 활용할 수 있다."}],"lvl":3,"comparison":[{"item":"올리고머 구조","old":"많은 PHBH가 호모다이머로 알려져 기능적 조립 형태가 불명확","new":"결정학적 비대칭 단위에서 기능적 사량체 조립체와 이량체 계면을 결정"},{"item":"조효소 특이성","old":"대부분의 PHBH가 NADPH 특이성을 보여 NADH 선호 효소 연구가 제한적","new":"NADH와 NADPH를 모두 활용하며 NADH를 선호하는 조효소 다용도성 확인"},{"item":"결합 잔기 규명","old":"그룹 A 플라보단백질에는 표준 NAD(P)H 결합 도메인이 없어 잔기가 불명확","new":"R50과 R273, S166, E44를 결합과 특이성 결정 잔기로 식별"}],"applications":[{"title":"방향족 화합물 분해","desc":"리그닌 유래 방향족 화합물을 분해하는 과정에서 4-하이드록시벤조에이트를 수산화"},{"title":"환경 오염 생물정화","desc":"방향족 오염 물질의 생체 정화에 활용할 수 있는 플라보단백질 모노옥시게나제 효소"},{"title":"전세포 생체촉매","desc":"효소나 이를 코딩하는 핵산을 포함하는 재조합 미생물을 전세포 생체촉매로 이용"}],"figFile":"10-2024-0195796.jpg","figureCaption":"공보 대표도면"},{"id":"p1020240192227","title":"사용자 단말에 기반한 줄넘기 동작 인식 및 분석하는 어플리케이션을 운용하는 장치 및 그 방법","field":"생활","status":"공개","regNo":"","regDate":"","appNo":"10-2024-0192227","appDate":"2024.12.20","applicant":"안인숙 · 선문대학교 산학협력단","coApplicant":true,"expiry":"2044.12.20","inventor":"양현석","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 사용자 단말에 기반한 줄넘기 동작 인식 및 분석 어플리케이션을 운용하는 장치 및 그 방법에 관한 것으로, 카메라 동작 수행부, 사용자 위치 조정부, 줄넘기 동작 시작 메시지 출력부, 줄넘기 촬영 영상 획득부, 줄넘기 촬영 영상 분석부를 포함한다. 올바르지 못한 자세의 줄넘기가 무릎 관절 손상이나 발목 부상을 유발할 수 있는 문제에 대응해, 촬영 영상만으로 줄넘기 동작을 인식하고 분석한다.","features":[{"k":"특징","v":"어플리케이션이 활성화되면 카메라를 셀카 모드로 전환해 사용자 위치를 기준 범위로 조정한 뒤 촬영하고, 모션 추적 알고리즘으로 줄 속도·줄 회전 모양·점프 특징·관절 위치와 각도를 수집해 횟수 카운팅, 실패 판별, 기술 패턴 구별, 점프 주기와 리듬 분석을 수행한다."},{"k":"효과","v":"신체 주요 관절 위치를 추적해 줄넘기 동작의 정확성과 인식성을 높이고, 음성 피드백과 리듬에 맞는 배경 음악, 시각화된 운동 정보를 제공해 훈련 몰입도와 흥미를 높이며, 추가 센서나 장비 없이 사용자 단말만으로 동작 데이터를 인식할 수 있다."}],"lvl":3,"comparison":[{"item":"동작 측정 수단","old":"줄넘기 기구나 별도 센서·장비에 의존해 운동 상태를 파악","new":"추가 센서나 장비 없이 사용자 단말 카메라와 모션 추적 알고리즘으로 촬영"},{"item":"자세 분석 기능","old":"횟수 측정 위주로 사용자의 관절 위치나 자세 밸런스 분석이 어려움","new":"관절 위치와 각도, 발 위치, 줄 회전 모양 등 동작 데이터를 수집·분석"},{"item":"실시간 피드백","old":"잘못된 자세로 운동해 무릎·발목 부상 위험이 있어도 교정이 어려움","new":"동작 정확도가 허용 범위를 벗어나면 실시간 음성 피드백을 제공"}],"applications":[{"title":"줄넘기 운동 분석 앱","desc":"사용자 단말에서 촬영 영상으로 줄넘기 횟수와 실패 동작, 기술 패턴을 분석"},{"title":"자세 교정 트레이닝","desc":"관절 위치와 각도 분석으로 올바른 줄넘기 자세를 유도하여 관절 부상 위험을 낮춤"},{"title":"운동 정보 시각화","desc":"줄넘기 횟수와 시간, 칼로리 소모량, 배경 음악 동기화 정도를 시각화해 제공"}],"figFile":"10-2024-0192227.jpg","figureCaption":"공보 대표도면"},{"id":"p1020240189953","title":"스트렙토마이세스 유래 PET 가수분해효소 및 이의 용도","field":"의료","status":"공개","regNo":"","regDate":"","appNo":"10-2024-0189953","appDate":"2024.12.18","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2044.12.18","inventor":"오태진","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 스트렙토마이세스 sp. W2061 유래 재조합 폴리에틸렌 테레프탈레이트(PET) 가수분해효소 및 이의 용도에 관한 것으로, Ser-Asp-His를 활성 부위로 포함하고 Gly-X-Ser-X-Gly 세린 가수분해효소 모티프를 갖는 효소다. 기존 물리·화학적 PET 재활용은 에너지 소비가 크고 유해 부산물을 만들며 알려진 PET 가수분해효소의 분해 활성도 약한 한계가 있어, 미생물 유래 효소를 이용한 친환경 생분해 수단을 제공한다.","features":[{"k":"특징","v":"분자량 50.31 kDa, 등전점 5.84의 α/β 가수분해효소로 대장균에서 이종 발현·정제했으며, 최적 pH 7.0과 40℃ 조건에서 PET 모델 기질 BHET의 에스테르 결합 하나를 가수분해해 MHET를 생성하는 것을 HPLC와 LC-MS로 확인했다."},{"k":"효과","v":"분자 도킹과 분자동역학 시뮬레이션에서 효소-BHET 복합체가 안정적으로 형성되어 tor":"김지헌","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 외부 기온에 따라 온도가 자동 조절되고 이어폰을 함께 쓸 수 있는 발열 귀마개에 관한 것이다. 보온 소재만으로는 혹한기 보온성이 부족하고 실내에서는 더워 벗었다 다시 착용해야 하는 기존 방한 귀마개의 번거로움과, 귀마개 착용 상태에서 이어폰 사용이 불편하고 통증을 유발하는 문제를 함께 해결한다. 충전지 전원으로 작동하며 배터리 잔량도 확인할 수 있다.","features":[{"k":"특징","v":"귀덮개부 내부에 발열과 흡열이 모두 가능한 펠티에 소자를 넣고, 온도 감지 센서값에 따라 제어부가 0℃ 이하에서는 발열, 0~10℃에서는 정지, 10℃ 이상에서는 흡열로 전환하며, 충전지부가 전원을 공급하고 잔량은 LED로 표시된다."},{"k":"효과","v":"기온에 맞춰 자동으로 온도가 조절되므로 실내에서도 불편함 없이 착용할 수 있어 벗고 다시 쓰는 번거로움이 최소화되고, 귀덮개의 중공부와 태엽식 전선 권취부를 통해 귀마개를 쓴 채로 이어폰을 간편하게 사용할 수 있다."}],"lvl":3,"comparison":[{"item":"보온 구현 방식","old":"귀마개 재질의 보온성에만 의존하는 수준이었음","new":"펠티에 소자로 발열과 흡열을 선택해 온도를 조절"},{"item":"외부 온도 대응","old":"실내외 이동 시 벗고 다시 착용해야 하는 번거로움","new":"감지 온도에 따라 발열·정지·흡열이 자동 전환됨"},{"item":"이어폰 사용성","old":"귀를 막아 이어폰 사용이 번거롭고 통증을 유발함","new":"중공부에 이어폰부를 두어 착용 상태로 사용 가능"}],"applications":[{"title":"자동 온도 조절 귀마개","desc":"외부 온도를 감지해 발열과 흡열을 자동 전환하는 방한 귀마개 제품에 적용"},{"title":"이어폰 일체형 방한용품","desc":"귀마개를 착용한 상태로 음악 감상과 동영상 시청이 가능한 방한용품에 활용"},{"title":"펠티에 소자 착용형 기기","desc":"발열과 흡열이 모두 가능한 펠티에 소자를 적용한 착용형 온도 조절 기기에 활용"}],"figFile":"10-2019-0068207.jpg","figureCaption":"공보 대표도면"},{"id":"p1020210110290","title":"비디오 압축 성능 향상 장치 및 방법","field":"기계","status":"등록","regNo":"10-2745105","regDate":"2024.12.17","appNo":"10-2021-0110290","appDate":"2021.08.20","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2041.08.20","inventor":"이규중","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 비디오 압축 성능 향상 장치 및 방법에 관한 것으로, 노이즈가 섞인 입력 영상에서 양자화 파라미터가 작을수록 노이즈까지 압축되어 비트레이트가 급증하는 문제를 해결한다. RDO(율-왜곡 최적화) 코스트의 라그랑주 승수를 입력 영상의 노이즈에 맞춰 조정한 뒤 단위 블록을 다시 부호화하는 방식이며, 명령어를 저장하는 메모리와 이를 실행하는 프로세서를 갖춘 장치 형태로도 구현된다.","features":[{"k":"특징","v":"입력 영상을 단위 블록으로 나눠 RDO 코스트로 최적 모드를 정해 부호화한 다음, 노이즈 표준편차와 블록 사이즈를 반영한 수식으로 라그랑주 승수 조정값을 산출해 재부호화하는 방식이며, 노이즈 레벨이 임계치를 넘을 때 조정이 적용된다."},{"k":"효과","v":"라그랑주 승수를 크게 설정하면 비트레이트가 감소하는 반면 최대신호 대 잡음비의 변동은 작아 율-왜곡 커브가 개선되므로, 노이즈가 더해진 영상에 대한 압축 성능을 효과적으로 높일 수 있다."}],"lvl":3,"co 6311.jpg","figureCaption":"공보 대표도면"},{"id":"p1020240185666","title":"다축 회전 플랫폼을 포함하는 디스플레이의 시야각 측정장치 및 측정방법","field":"전기·전자","status":"공개","regNo":"","regDate":"","appNo":"10-2024-0185666","appDate":"2024.12.13","applicant":"선문대학교 산학협력단 · 주식회사 대기하이텍","coApplicant":true,"expiry":"2044.12.13","inventor":"박영욱","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 다축 회전 플랫폼을 포함하는 디스플레이의 시야각 측정장치 및 측정방법에 관한 것으로, 측정샘플이 장착되는 측정샘플장착유닛, 측정기기가 결합되는 측정기기장착유닛, 제1·2·3방향으로 위치를 이동시키는 위치구동부, 제1방향 회전축을 중심으로 위치구동부를 회전시키는 제1방향회전구동부를 포함한다. 기존 고니어미터 방식은 단축 회전에 의존해 다축 측정과 수평면 회전 측정이 어렵고 자동 측정장비는 수억원에 이르는 고가였으나, 본 기술은 다양한 발광축에서 비등방성 시야각을 용이하게 측정하도록 구성된다.","features":[{"k":"특징","v":"측정샘플홀더를 제2방향 회전축 중심으로 회전 제어한 뒤 제1방향회전구동부로 제1방향 회전축 중심으로 회전시켜 시야각을 측정하며, 기기홀더에 고정된 카메라 렌즈와 분광방사휘도계로 스펙트럼·휘도 등 발광특성 파라메터를 각도별로 측정한다."},{"k":"효과","v":"OLED 등 면발광 소자를 다양한 발광축에서 용이하게 측정할 수 있고 디스플레이의 비등방성 시야각을 간편하면서 정확하게 측정할 수 있으며, 측정거리 및 초점 조절을 통해 측정대상 발광면의 면적 조절이 가능하다."}],"lvl":3,"comparison":[{"item":"측정 축 구성","old":"고니어미터는 기판 회전이나 계측장비 단축 회전에 의존해 다축 측정이 곤란","new":"다축 회전 플랫폼으로 제1·제2방향 회전축과 3방향 위치 이동을 함께 구동"},{"item":"수평면 회전 측정","old":"다양한 회전축의 기판에서 이루어지는 수평면 회전의 측정이 어려움","new":"측정샘플홀더를 제2방향 회전축으로 돌린 뒤 제1방향 회전축으로 회전 측정"},{"item":"장비 규모·비용","old":"2m 반경을 회전하며 자동 측정하는 장비는 수억원대 고가 자동화 설비","new":"베이스 위 샘플·측정기기 장착유닛 구성으로 측정거리와 초점을 조절"}],"applications":[{"title":"디스플레이 시야각 측정","desc":"비등방성 시야각을 갖는 LCD와 프로젝션 디스플레이의 360도 입체각 발광 특성 측정"},{"title":"면발광 소자 평가","desc":"다양한 발광축에서 OLED 등 면발광 소자의 발광 특성을 측정하는 평가 장비로 활용"},{"title":"분광 휘도 계측","desc":"분광방사휘도계를 사용해 스펙트럼과 휘도 등 발광 특성 파라미터를 각도별로 측정"}],"figFile":"10-2024-0185666.jpg","figureCaption":"공보 대표도면"},{"id":"p1020240181430","title":"양자점을 포함하는 탈부착형 필름 및 그 제조방법","field":"전기·전자","status":"공개","regNo":"","regDate":"","appNo":"10-2024-0181430","appDate":"2024.12.09","applicant":"선문대학교 산학협력단 · 주식회사 대기하이텍","coApplicant":true,"expiry":"2044.12.09","inventor":"박영욱","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 디스플레이 소자에 탈부착되는 광기능성 필름에 관한 것으로, 실리콘 탄성체 수지층에 양자점을 분산시켜 형성한 양자점 탈부착형 필름 및 그 제조방법을 제공한다. 양자점 색변환층이 디바이스 제작공정 중에 일체형으로 형성되어 사용환경에 따라 필름을 제거하거나 교체할 수 없었던 기존 방식의 제약을 해소하고, 디스플레이의 유지 보수와 성능 조정을 가능하게 하는 것을 목적으로 한다.","features":[{"k":"특징","v":"수지층은 단층구조 또는 복합층구조의 실리콘 탄성체인 폴리다이메틸실록세인(PDMS)으로 이루어지고, 그 위에 스핀코팅으로 양자점을 고르게 분산 코팅한 뒤 경화시켜 필름 형태로 제조하며, 분산된 양자점의 산란특성을 이용해 색변환 필름 또는 광추출 필름으로 사용된다."},{"k":"효과","v":"디스플레이 제조공정과 무관하게 제조할 수 있고 탈부착이 편리해 활용성이 높아지며, PDMS의 뛰어난 유연성과 내구성 덕분에 반복적인 탈부착에도 양자점 분산에 따른 고효율 색변환 및 광추출 기능을 그대로 유지할 수 있다."}],"lvl":3,"comparison":[{"item":"필름 결합 방식","old":"양자점 색변환층을 디바이스 제작공정 중에 형성하는 필름 일체형 구조","new":"실리콘 탄성체 수지층에 양자점을 분산시킨 탈부착형 광기능성 필름"},{"item":"유지·교체 가능성","old":"디스플레이에서 필름 제거나 교체가 불가능해 유지보수와 성능 조정이 어려움","new":"필요에 따라 탈부착이 용이해 디스플레이 유지보수와 성능 조정이 가능"},{"item":"제조 공정 시점","old":"잉크젯이나 스핀코팅으로 디바이스 제작공정 중에만 색변환층을 형성","new":"PDMS 수지층에 양자점을 스핀코팅해 디스플레이 공정과 무관하게 제조"}],"applications":[{"title":"양자점 색변환 필름","desc":"디스플레이 소자에 부착해 고휘도 구현과 고색 재현을 돕는 색변환 필름으로 적용"},{"title":"광추출 기능성 필름","desc":"양자점 분산에 따른 고효율 광추출 기능을 제공하는 탈부착·교체형 광기능성 필름"},{"title":"디스플레이 성능조정","desc":"사용 환경에 따라 필름을 탈부착·교체하여 디스플레이의 발광 특성을 조정하는 용도"}],"figFile":"10-2024-0181430.jpg","figureCaption":"공보 대표도면"},{"id":"p1020240165566","title":"퍼옥시게나제 변이체 및 이의 용도","field":"의료","status":"공개","regNo":"","regDate":"","appNo":"10-2024-0165566","appDate":"2024.11.19","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2044.11.19","inventor":"오태진","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 퍼옥시게나제 변이체 및 이의 용도에 관한 것으로, 스트렙토마이세스 라우렌티 유래 CYP105D18 퍼옥시게나제에서 N-말단 기준 87, 235, 239, 348 위치의 아미노산을 치환한 변이체를 제공한다. 과산화수소 내성 메커니즘의 구조적·생화학적 특징을 규명하고, 과산소화 활성과 테스토스테론에 대한 위치 특이성에 아미노산 치환이 미치는 역할을 확인하였다. 변이체를 포함하는 재조합 미생물과 전세포 생체촉매도 함께 제공한다.","features":[{"k":"특징","v":"변이체는 스테로이드 히드록실화를 촉매하여 테스토스테론을 2β-하이드록시테스토스테론 또는 안드로스텐디온으로 변환하며, Q348은 과산화수소 노출 시 안정성에 중요한 잔기이고 T239A 치환은 퍼옥시게나제를 모노옥시게나제로, T239E 치환은 생성물을 안드로스텐디온으로 전환시킨다."},{"k":"효과","v":"값비싼 NAD(P)H 전자전달 시스템 없이 과산화수소를 이용한 스테로이드 전환이 가능하며, 과산화수소를 직접 쓰는 대신 요소 과산화수소 부가물이나 포도당 산화효소/포도당 시스템으로 생성하면 전환율과 촉매 효율 최적화","desc":"반응표면분석법으로 마이크로파 파워, 추출시간, 에탄올 농도를 최적화해 수율을 높이는 공정"}],"figFile":"10-2022-0081300.jpg","figureCaption":"공보 대표도면"},{"id":"p1020220113848","title":"엘리베이터 착상 제어 시스템","field":"소프트웨어","status":"등록","regNo":"10-2721383","regDate":"2024.10.21","appNo":"10-2022-0113848","appDate":"2022.09.08","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2042.09.08","inventor":"윤종환","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 엘리베이터 케이지 바닥면과 승장 바닥면 사이의 단차를 자동으로 보정하는 엘리베이터 착상 제어 시스템에 관한 것으로, 메인로프가 연결되는 상부 프레임, 케이지와 상부 프레임을 연결하는 위치 조정 장치, 착상 오차를 감지하는 센서 장치로 구성된다. 탑승객 승하차에 따른 부하량 변동으로 로프의 탄성이 변해 발생하는 착상 오차를 감지하고 상부 프레임과 케이지 간 거리를 조절해 케이지 높이를 보정한다.","features":[{"k":"특징","v":"적외선 근접, 이미지, 라이다, 초음파 센서 등으로 착상 오차를 감지하고 케이지 내부를 복수 영역으로 나눈 기울기 측정 장치로 편심을 판별한다. 각 영역의 위치 조정 모듈은 구동부가 회전기어를 돌려 두 열의 연결로프를 꼬거나 풀어 거리를 조절하며, 편심이 없으면 통합 제어, 발생하면 개별 제어한다."},{"k":"효과","v":"케이지 위치를 자동으로 감지하고 보상해 승장 바닥면과의 단차를 지속적으로 예방함으로써 승객이 걸려 넘어지는 안전사고를 막고 착상 정밀도를 높일 수 있다. 특정 영역에 쏠림(편심)이 발생하는 경우 영역별 개별 위치 보상으로 기울어짐 현상을 억제한다."}],"lvl":3,"comparison":[{"item":"착상 오차 보정","old":"부하량 변동에 따른 로프 탄성 변화로 단차가 그대로 발생","new":"센서로 착상 오차를 감지해 케이지의 높이를 보정"},{"item":"케이지 연결 구조","old":"메인로프에 케이지가 직접 연결된 고정 구조","new":"상부 프레임과 케이지를 위치 조정 장치로 연결한 구조"},{"item":"쏠림 보정 대응","old":"케이지 특정 영역의 편심과 기울어짐을 보정할 수 없음","new":"영역별 위치 조정 모듈을 개별 제어해 기울어짐 억제"}],"applications":[{"title":"승객용 엘리베이터 제어","desc":"승장 바닥면과 케이지 바닥면의 단차를 보정해 승하차 시 발이 걸리는 사고를 예방"},{"title":"화물용 엘리베이터","desc":"사람이나 물자를 옮기는 과정에서 부하량 변동으로 생기는 착상 오차를 보정하는 데 활용"},{"title":"케이지 수평 유지 모듈","desc":"연결로프와 회전기어, 구동부로 영역별 높이를 보상해 케이지의 수평을 유지하는 모듈"}],"figFile":"10-2022-0113848.jpg","figureCaption":"공보 대표도면"},{"id":"p1020220177151","title":"반도체 제조용 웨이퍼 이송로봇","field":"전기·전자","status":"등록","regNo":"10-2717294","regDate":"2024.10.10","appNo":"10-2022-0177151","appDate":"2022.12.16","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2042.12.16","inventor":"계중읍","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 반도체 제조용 웨이퍼 이송로봇에 관한 것으로, 승강모터·감속기와 업다운 샤프트를 갖는 바디에 제1링크, 제2링크, 웨이퍼를 잡는 핑거가 달린 암부재를 순차 회동 가능하게 연결한 회전형 관절 구조를 가진다. 내부 케이블의 배선 경로를 회전 관절 중심축으로부터 이격 배치하여 케이블의 비틀림과 인장으로 인한 내구성 저하 문제를 개선한다. 종래 로봇은 케이블을 조인트 중심축으로 배선해 단선이 잦았다.","features":[{"k":"특징","v":"업다운 샤프트 상부에 케이블홈이 형성된 축커버를, 제1링크에 케이블삽입공이 형성된 케이블안내구를 두어 케이블이 중심축에서 벗어나 선회하게 하고, 케이블은 각 감속구동부의 측면을 따라 암부재 센서까지 배선된다. 스토퍼의 호 형상 가이드홈이 제1링크의 회전범위를 제한한다."},{"k":"효과","v":"케이블의 비틀림·인장에 따른 피로하중을 최소화하고 꼬임과 단선을 방지해 케이블 기대수명을 늘리며, 감속구동부 중심축을 중실형으로 구성해 제조원가를 절감한다. 측면 배선으로 배선 작업이 쉬워지고, 메탈 벨로우즈를 설치하면 작동부를 진공 하에서 구동할 수 있다."}],"lvl":3,"comparison":[{"item":"케이블 배선 경로","old":"케이블이 회전 조인트의 중심축을 따라 배선됨","new":"배선 경로를 회전 관절 중심축에서 이격해 배치함"},{"item":"케이블 내구성","old":"비틀림과 인장 피로로 심선이 조기에 단선됨","new":"케이블이 선회만 하여 꼬임과 단선을 방지함"},{"item":"감속부 중심축","old":"중공 구조 중심축이라 가공이 어렵고 고가임","new":"가공이 쉬운 중실형 구조로 제조원가를 절감함"}],"applications":[{"title":"반도체 웨이퍼 이송","desc":"웨이퍼 제조와 반도체 공정에서 웨이퍼를 정확한 위치로 옮기는 이송 장비에 적용함"},{"title":"진공 환경 반송 장비","desc":"링크와 바디 사이에 메탈 벨로우즈를 적용해 진공 하에서 작동하는 반송 장비로 활용"},{"title":"다관절 산업용 로봇","desc":"회전형 관절과 내부 배선을 갖춘 다관절 산업용 로봇의 관절 구조 설계에 적용함"}],"figFile":"10-2022-0177151.jpg","figureCaption":"공보 대표도면"},{"id":"p1020240137002","title":"극지 미생물 유래 신규 수은 환원효소","field":"의료","status":"공개","regNo":"","regDate":"","appNo":"10-2024-0137002","appDate":"2024.10.08","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2044.10.08","inventor":"오태진","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 극지 미생물 유래 신규 수은 환원효소 및 이의 용도에 관한 것으로, 남극 토양에서 분리한 Gelidibacter salicanalis PAMC21136의 수은 저항성(mer) 오페론에 속하는 수은 환원효소 GbsMerA를 확인하고 그 활성과 결정 구조, 촉매 메커니즘 및 수은 해독 가능성을 규명한 것이다. 효소 자체와 이를 포함하는 수은 제거용 조성물, 재조합 미생물 및 전세포 생체촉매를 제공한다.","features":[{"k":"특징","v":"GbsMerA는 NADPH의 산화를 동반하여 수은 이온을 금속 수은으로 환원하며 pH 7.0·60℃에서 최대 활성 474.7 μmol/min/mg을 나타낸다. 결정 구조 분석을 통해 기존 MerA의 Cys-Cys 모티프 대신 Tyr437′와 Asp47이 금속 전달에 관여하고 Tyr174가 NADPH 결합의 게이트로 작용함을 확인하였다."},{"k":"효과","v":"GbsMerA를 발현한 이종 숙주세포는 효소가 없는 숙주보다 수은 독성에 대한 저항성이 높아 억제 영역이 크게 감소하였으며, 이를 통해 환경 중 수은 제거를 위한 유전자 조작 균주 및 생물학적 정화 소재로 활용할 inventor":"황현하","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 이색성 염료와 액정을 혼합·캡슐화한 액정캡슐층을 적용하여 계조표현이 가능한 디밍 기능을 갖는 스마트 윈도우에 관한 것으로, 서로 대향하는 투명기판과 그 내측의 전극부, 전극부 사이의 액정캡슐층으로 액정셀을 구성한다. 기존 전기변색소자가 표시면적이 커질수록 응답속도가 느려져 대면적 적용에 한계가 있었던 문제를 해결하고자, 인가전압에 따라 광투과율을 연속적으로 가변시킬 수 있도록 설계되었다.","features":[{"k":"특징","v":"액정캡슐층은 액정과 이색성 염료로 구성된 액정캡슐과 바인더로 형성되며, 전압 비인가 시 액정분자가 무작위로 배열되어 염료가 빛을 흡수해 암(Dark) 상태가 되고, 전압 인가 시 액정과 염료가 전계 방향으로 배향되어 빛이 투과하는 명(Bright) 상태로 전환된다."},{"k":"효과","v":"염료의 흡수 파장대역을 선택·조합하여 다양한 색상의 계조표현과 원하는 색상 구현이 가능하며, 액정의 빠른 반응속도에 따라 스위칭 시간이 단축되어 광투과율 조절속도가 향상되는 효과가 있다."}],"lvl":3,"comparison":[{"item":"디밍 소자 방식","old":"전기화학적 산화환원 반응으로 색이 변하는 전기변색소자를 적용","new":"액정과 이색성 염료를 캡슐화한 액정캡슐층으로 액정셀을 구성"},{"item":"대면적 응답속도","old":"표시면적이 커질수록 응답속도가 급격히 느려져 대면적 적용에 한계","new":"액정의 빠른 반응속도로 스위칭 시간이 줄어 대면적에도 적용 가능"},{"item":"계조·색상 구현","old":"전압 인가 여부에 따라 색을 띠거나 소멸하는 단순 변색에 머무름","new":"이색성 염료의 흡수파장 대역을 선별·조합해 다양한 색상의 계조 표현"}],"applications":[{"title":"건축용 스마트 윈도우","desc":"전압에 따라 광투과율을 가변시켜 건물 창유리의 태양광 유입과 실내 밝기를 조절하는 창호에 적용"},{"title":"자동차 미러·차창","desc":"자동차 미러나 차창의 광투과도와 반사도를 조절하는 용도에 액정캡슐 디밍 기능을 적용"},{"title":"디밍형 표시 패널","desc":"액정캡슐층의 전압별 투과율 가변 특성을 이용한 고분자 분산형 액정표시장치 등 디밍 소자"}],"figFile":"10-2024-0134557.jpg","figureCaption":"공보 대표도면"},{"id":"p1020210140348","title":"외부 광 추출용 양자점 함유한 외부 산란층을 포함하는 유기발광소자","field":"전기·전자","status":"등록","regNo":"10-2715661","regDate":"2024.10.04","appNo":"10-2021-0140348","appDate":"2021.10.20","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2041.10.20","inventor":"박영욱","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 외부 광 추출 효율을 높이고 시야각을 넓힌 유기발광소자(OLED)에 관한 것으로, 기판층 하단에 주름 구조의 외부 산란 구조막과 복수의 산란 입자체로 이루어진 외부 산란층을 형성하고 그 내부에 양자점체를 분산시킨다. 이를 통해 기판과 공기 사이 계면에 갇히는 빛을 산란시키고 세기를 키워 외부로 발광시키며, 마이크로 렌즈 어레이 구조에서 나타나는 색상 변화와 좁은 시야각 문제를 함께 개선한다.","features":[{"k":"특징","v":"외부 산란 구조막은 PMMA 조성물을 기판층에 스핀 코팅·경화한 뒤 이온 식각해 요철을 형성한 투명 나노 구조체에 ZnO를 스퍼터링 증착해 평탄한 주름 구조로 변경한 것이고, 분산된 양자점체는 유기 발광층과 동일한 파장 영역의 빛을 방출하며 평탄화 부재의 true,"brief":false,"summary":"본 기술은 지능형 스마트 방범 도어 출입 관리 시스템에 관한 것으로, 공동 현관문 출입을 위해 세대를 호출하는 방문자 단말기, 호출된 세대의 사용자 단말기로 방문자 정보를 전송하는 출입 관리 서버, 개방 요청을 전송하는 사용자 단말기를 포함한다. 방문자 정보는 1회용 출입 코드를 통해 확인되어 공동 주택의 출입 통제를 강화한다.","features":[{"k":"특징","v":"출입 관리 서버가 1회용 QR 형태의 출입 코드를 생성해 방문자 단말기에 제공하고, 공동 현관문의 인식부에서 세대 정보와 매칭되면 현관문을 개방한다. 세대 현관문에는 CCTV 영상 획득부와 인체 동작 감지 센서, 원격 제어 도어록 유니트를 두고, 인식 실패나 이상 행동 시 SOS 처리부로 경비실에 알린다."},{"k":"효과","v":"세대 거주자 부재 시에도 택배·배달원의 출입을 허용하면서 공용 비밀번호 노출 문제를 근본적으로 해결한다. 공동 현관문과 세대 현관문의 2중 안전 장치로 작동하고, 이상 행동 감지 시 경비실 신고 등 후속 조치가 가능해 공동 주택의 보안 수준을 대폭 향상시킨다."}],"lvl":3,"comparison":[{"item":"방문자 인증 수단","old":"공동 비밀번호나 인증 카드키 입력으로 현관문을 개방","new":"방문자마다 발급되는 1회용 출입 코드로 신원을 확인"},{"item":"거주자 부재 대응","old":"거주자 부재 시 외부인과 카드 미소지 거주자는 출입 제한","new":"관리 서버가 사용자 단말기와 연결해 원격 개방 요청을 처리"},{"item":"보안 단계 구성","old":"공동 현관문 통과 후 세대 현관문의 확인 절차가 미비","new":"영상과 인체 동작 감지로 세대 현관문까지 2중 확인"}],"applications":[{"title":"공동주택 출입 보안 시스템","desc":"아파트 공동 현관문에 1회용 출입 코드 인식부를 두어 신원이 확인된 방문자만 출입하도록 관리할 수 있다"},{"title":"택배·배달 출입 관리","desc":"급증하는 택배와 배달 방문자에게 1회용 출입 코드를 발급해 공용 비밀번호 노출 없이 출입을 허용한다"},{"title":"세대 현관 방범 장치","desc":"초인종이 눌리면 영상 정보와 인체 동작 감지 센서로 방문자를 확인하고 이상 행동 시 경비실에 연락한다"}],"figFile":"10-2021-0174070.jpg","figureCaption":"공보 대표도면"},{"id":"p1020240131236","title":"새싹보리 초음파 추출물을 유효성분으로 포함하는 당뇨의 개선, 예방 또는 치료용 조성물","field":"의료","status":"공개","regNo":"","regDate":"","appNo":"10-2024-0131236","appDate":"2024.09.27","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2044.09.27","inventor":"김진우","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 새싹보리 초음파 추출물을 유효성분으로 포함하는 당뇨의 개선·예방 또는 치료용 조성물에 관한 것으로, 약학 조성물과 식품 조성물로 제공된다. 추출물은 물, 탄소수 1~4의 저급알코올 또는 이들의 혼합용매로 추출되며, 혼합용매로는 20~99 부피%의 메탄올 또는 에탄올 수용액이 사용된다. 당뇨를 개선·예방 또는 치료할 수 있으므로 건강기능식품이나 약학 조성물로 활용될 수 있다.","features":[{"k":"특징","v":"새싹보리를 추출용매와 혼합해 20~50 kHz 진동수와 50~700 W 파워의 초음파기로 40~90도에서 5~60분 처리해 추출하며, 열수·용매·침지 추출로는 유효성분이 소량만 추출되어 효과가 떨어진다. 50 부피% 메탄올 초음파 추출물이 가장 우수했다."},{"k":"효과","v":"총 폴리페놀·플라보노이드 함량과 DPPH·AB  두피 및 모발을 살균하고 이물질을 제거하는 두피 관리 기기 분야"},{"title":"광 자극 신경조절","desc":"빛 자극으로 신경세포 네트워크의 활성을 조절하는 뇌신경조절 연구 및 임상 응용"}],"figFile":"10-2021-0080045.jpg","figureCaption":"공보 대표도면"},{"id":"p1020240123969","title":"김 원초 초음파 추출물을 유효성분으로 함유하는 골성장 촉진 또는 골질환의 개선, 예방 또는 치료용 조성물","field":"의료","status":"공개","regNo":"","regDate":"","appNo":"10-2024-0123969","appDate":"2024.09.11","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2044.09.11","inventor":"김진우","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 김 원초(참김, Porphyra tenera) 초음파 추출물을 유효성분으로 함유하는 골성장 촉진 또는 골질환의 개선·예방·치료용 조성물에 관한 것으로, 약학 조성물과 식품 조성물로 제공된다. 대상 골질환은 골다공증, 파세트 골질환, 구루병, 골연화증, 신성골이영양증, 류머티스성 및 퇴행성 골질환을 포함한다. 추출물은 조골세포 분화를 증진하고 파골세포 형성을 억제하는 것으로 확인되었다.","features":[{"k":"특징","v":"추출물은 물이나 탄소수 1~4의 저급알코올 또는 혼합용매 하에서 50~700 W 초음파기로 20~85도에서 10~60분 처리해 얻으며, 주요 물질로 isorhamnetin이 확인되었다. 열수나 알코올 단독 추출, 참김 이외의 김 종을 사용하면 효과가 낮을 수 있다."},{"k":"효과","v":"조골세포 분화 지표인 COL1A1과 ALP 발현을 유의하게 증가시키고 파골세포 관련 OSCAR, TRAP 발현을 저해하여, 성장기 아동·청소년의 뼈 성장 촉진과 골밀도가 낮은 성인의 골밀도 개선에 도움을 줄 수 있고 건강기능식품이나 약학 조성물로 활용 가능하다."}],"lvl":3,"comparison":[{"item":"유효 소재 종류","old":"비스포스포네이트, 칼시토닌, 에스트로겐 등 합성의약품 제제","new":"김 원초 초음파 추출물을 유효성분으로 하는 천연물 유래 소재"},{"item":"부작용 부담","old":"식도염, 위궤양, 오심 등의 부작용 사례가 보고되고 있음","new":"천연물 유래 추출물로 부작용 부담을 경감한 소재로 활용"},{"item":"골 대사 작용","old":"골밀도 저하 억제를 위해 합성 제제 투여에 의존해 왔음","new":"COL1A1·ALP 발현을 높이고 OSCAR·TRAP 발현을 저해"}],"applications":[{"title":"성장기 골성장 촉진 식품","desc":"성장기 어린이와 청소년의 조골세포 분화를 증진해 성장판 확장과 뼈 성장을 돕는 식품"},{"title":"골다공증 개선 건강식품","desc":"골밀도가 낮은 성인의 골 중 미네랄 농도를 높여 골밀도 개선에 활용하는 건강기능식품"},{"title":"골질환 치료 약학 조성물","desc":"골다공증과 구루병, 골연화증 등 골질환의 예방 또는 치료에 쓰이는 약학 조성물"}],"figFile":"10-2024-0123969.jpg","figureCaption":"공보 대표도면"},{"id":"p1020200010386","title":"미세먼지 제거기능을 가진 방충망","field":"생활","status":"등록","regNo":"10-2706434","regDate":"2024.09.09","appNo":"10-2020-0010386","appDate":"2020.01.29","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2040.01.29","inventor":"황찬승","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 미세먼지 제거기능을 가진 방충망에 관한 것으로, 창틀에 삽입 및 분리되는 프레임부와 이물질을 걸러내는 망부, 그리고 망부 둘레의 상·하 양측에 각각 배치된 (-)·(+) 대전부로 구성된다. 공기 중에 포함된 미세먼지만 전기 입자를 띄게 한 뒤 극성에 따라 대전부에 흡착시켜 제거하는 방충망이다.","features":[{"k":"특징","v":"직류전원 공급부로부터 직류 전원을 인가받은 (-)·(+) 대전부가 망부 입구에서 미세먼지를 대전시켜, (+) 극성 입자는 (-) 대전부에, (-) 극성 입자는 (+) 대전부에 흡착되므로 망목 크기를 줄이지 않고도 미세먼지를 포집한다."},{"k":"효과","v":"망목을 작게 하거나 복수의 망체를 이동시키는 기존 방식과 달리 구조가 간단하며, 공기의 흐름에는 영향을 주지 않으면서 미세먼지 제거 성능이 뛰어나다는 효과가 있다."}],"lvl":3,"comparison":[{"item":"미세먼지 차단 방식","old":"망목 크기를 작게 하여 미세먼지를 물리적으로 걸렀다","new":"상·하 (-)·(+) 대전부로 미세먼지를 대전시켜 흡착 제거한다"},{"item":"공기 유동 성능","old":"망목을 작게 하면 공기 흐름이 원활하지 않은 문제가 있었다","new":"공기 흐름에는 영향을 주지 않으면서 미세먼지만 제거한다"},{"item":"구조 복잡성","old":"복수 망체와 별도 이동수단이 필요해 구조가 복잡하였다","new":"프레임부·망부·대전부로 구성되어 창틀에 삽입·분리된다"}],"applications":[{"title":"주거용 창호 방충망","desc":"출입구나 창문에 설치해 곤충 침입을 막으면서 유입 공기의 미세먼지를 제거한다"},{"title":"실내 공기질 관리","desc":"환기 시 창을 통해 들어오는 미세먼지를 대전 흡착으로 줄여 실내 공기질을 관리한다"},{"title":"교체형 방충망 제품","desc":"창틀에 삽입·분리되는 프레임 구조로 기존 창호에 장착하는 교체형 제품으로 공급한다"}],"figFile":"10-2020-0010386.jpg","figureCaption":"공보 대표도면"},{"id":"p1020230021249","title":"맴돌이 전류를 이용한 자동차 제동 장치","field":"건설","status":"등록","regNo":"10-2705503","regDate":"2024.09.05","appNo":"10-2023-0021249","appDate":"2023.02.17","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2043.02.17","inventor":"최창하","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 마찰 패드 없이 맴돌이 전류를 이용해 차량을 감속시키는 자동차 제동 장치에 관한 것으로, 차륜에 형성된 디스크를 향해 근접 제동부를 이동시켜 자력 변화에 따른 와전류를 만들어 디스크의 회전 속도를 줄인다. 패드 마모에 따라 제동 거리가 좌우되고 패드가 손상되면 제동력을 상실하는 기존 브레이크의 한계와, 인휠 구동 전기차에 필요한 새로운 제동 방식 문제를 다룬다.","features":[{"k":"특징","v":"위치 이동부의 축 회전에 제1·2스크류가 맞물려 근접 제동부가 디스크로 나사 이동하고, 바디부 안의 삽입 자성부가 유도 코일에 진입한 길이만큼 전자기력이 커져 센서부가 이를 자력 정보로 읽는다. 제어부는 자력·운동 정보로 감속이 부족하다고 판단하면 노면 제동 유도부를 감속 구간 노면에 대향시켜 활성화한다."},{"k":"효과","v":"비점착식 제동이어서 차륜에 부착할 구성을 최소화해 인휠모터 등 전기차 부품 배치 공간을 확보하기 쉽고, 기존 브레이크와 함께 사용해 트럭 등 고중량 차량의 제동 성능을 높이며, 패드 마모와 파손에 따른 제동력 상실 사고를 예방할 수 있다."}],"lvl":3,"comparison":[{"item":"제동력 발생 방식","old":"패드와 디스크의 마찰력을 이용하는 점착식 제동 방식","new":"삽입 자성부와 디스크 간 와전류를 쓰는 비점착식 제동"},{"item":"패드 마모 영향","old":"패드 마모도가 제동 거리를 좌우하고 제동력 상실로 이어짐","new":"비접촉 제동으로 패드 마모를 최소화해 제동력 상실을 방지"},{"item":"인휠 구동 적용성","old":"유압 캘리퍼 구조가 커서 인휠 구동장치 공간 확보가 어려움","new":"차륜 부착 구성을 최소화해 인휠모터 배치 공간을 확보"}],"applications":[{"title":"전기차 인휠 제동 장치","desc":"휠 안에 구동장치가 장착되는 인휠 전기자동차에서 종래 브레이크를 대체하는 비점착식 감속 장치"},{"title":"고중량 차량 보조 제동","desc":"종래의 브레이크와 함께 사용해 트럭 등 고중량 차량의 제동 성능을 높이고 안전사고를 줄이는 보조 장치"},{"title":"노면 연동 감속 구간 설비","desc":"노면 제동 유도부를 활성화해 감속 구간을 통과하는 차체에 추가 제동력을 부여하는 도로 연계 설비"}],"figFile":"10-2023-0021249.jpg","figureCaption":"공보 대표도면"},{"id":"p1020220051214","title":"유연 광산란층, 발광 소자 및 유연 광산란층의 제조 방법","field":"전기·전자","status":"등록","regNo":"10-2704163","regDate":"2024.09.03","appNo":"10-2022-0051214","appDate":"2022.04.26","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2042.04.26","inventor":"백동현","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 발광 소자의 광추출 효율을 높이는 유연 광산란층과 발광 소자 및 그 제조 방법에 관한 것으로, 폴리스티렌 용액을 기재에 도포·건조해 오목한 마이크로 몰드 패턴이 랜덤하게 형성된 몰드층을 만들고 그 위에 PDMS 용액을 도포·경화한 뒤 박리하여, 볼록한 마이크로 렌즈 패턴이 베이스와 일체로 형성된 플렉서블 필름을 얻는다. 이 광산란층은 기판 하면이나 기판과 기능층 사이에 배치된다.","features":[{"k":"특징","v":"상대습도 60~80 RH%로 유지된 챔버에서 폴리스티렌 농도 40~240g/L의 제1 용액을 20℃에서 10분 건조해 몰드 패턴을 자발적으로 형성하고, PDMS 제2 용액을 60℃에서 2시간 경화해 직경 1~10㎛의 마이크로 렌즈 패턴을 만들며 몰드층은 박리 후 재사용할 수 있다."},{"k":"효과","v":"별도의 정밀 패터닝 공정 없이 간이한 방법으로 유연 광산란층을 용이하게 제작할 수 있다. 또한 기판과 공기 또는 전극과 기판 계면에서 일어나는 전반사를 줄여 소자 내부에 고립되던 광을 외부로 추출함으로써 OLED 등 발광 소자의 광추출 효율을 향상시킬 수 있다."}],"lvl":3,"comparison":[{"item":"광추출 효율","old":"층간 굴절률 차로 전반사가 일어나 광이 소자 내부에 고립","new":"랜덤 마이크로 렌즈 패턴으로 고립된 광을 외부로 추출"},{"item":"제조 공정 방식","old":"나노·마이크로 표면 패터닝 공정이 필요해 제작이 까다로움","new":"폴리스티렌 몰드에 PDMS를 도포·경화한 뒤 박리하는 간이 공정"},{"item":"패턴 형성 방법","old":"전반사를 완화할 표면 구조가 없는 평탄한 계면 구조","new":"상대습도 60~80% 챔버에서 오목 몰드 패턴을 랜덤 자발 형성"}],"applications":[{"title":"OLED 광추출 향상 필름","desc":"유기 발광 소자 기판 일면에 배치해 전반사로 내부에 갇힌 광을 외부로 끌어내는 광산란층으로 적용"},{"title":"플렉서블 발광 소자","desc":"베이스와 마이크로 렌즈 패턴이 PDMS로 일체 형성되어 휘어지는 발광 소자에 그대로 부착 가능"},{"title":"마이크로 렌즈 어레이 공정","desc":"챔버 습도로 랜덤 오목 몰드를 만들고 PDMS로 전사해 마이크로 렌즈를 간이 제작하는 공정 기술"}],"figFile":"10-2022-0051214.jpg","figureCaption":"공보 대표도면"},{"id":"p1020240117696","title":"거동이 불편한 환자를 위한 체중계 매트","field":"의료","status":"공개","regNo":"","regDate":"","appNo":"10-2024-0117696","appDate":"2024.08.30","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2044.08.30","inventor":"남연교","transfer":"매매 · 라이센스","smk":true,"brief":false,"summary":"본 기술은 스스로 일어나거나 앉기 어려운 환자의 체중을 누운 상태로 측정하는 체중계 매트에 관한 것으로, 매트 본체와 그 안에 간격을 두고 설치되어 체중 신호를 출력하는 복수의 로드셀, 디스플레이, 체중 신호를 처리해 표시하는 제어부, 전원부로 구성된다. 신체부위별 무게와 합산 체중을 현장에서 실시간으로 확인할 수 있다. 병원이나 요양 시설의 병실 침대 위에 올려 사용하는 매트 형태이며 일반 가정에도 설치할 수 있다.","features":[{"k":"특징","v":"로드셀은 누울 때 하방으로 돌출되는 후두·어깨뼈·팔꿈치·엉덩뼈·발뒤꿈치 위치에 설치되고, 쿠션체를 받치는 받침판을 3~5개 구간으로 분할해 지지판 사이에 배치한다. 제어부는 키 정보와 부위별 무게로 발끝부터 머리끝까지의 무게 그래프를 산출해 표시한다."},{"k":"효과","v":"환자나 보호자, 간병인이 휠체어 체중계까지 이동하는 번거로움 없이 쉽게 체중을 측정할 수 있어 검사·수술 전 체중 기재의 부정확성을 줄이고, 신체부위별 무게 정보를 제공해 환자가 체중관리에 흥미를 갖도록 돕는다."}],"lvl":3,"comparison":[{"item":"체중 측정 방식","old":"휠체어 체중계가 있는 곳까지 이동해야 환자 체중을 측정 가능","new":"매트 본체에 누우면 간격을 둔 복수의 로드셀이 체중을 측정"},{"item":"정보 제공 방식","old":"측정 정보를 환자 정보 서버에 제공할 뿐 현장 실시간 제공 불가","new":"매트에 설치된 디스플레이로 환자와 의료팀에게 실시간 표시"},{"item":"측정 정보 범위","old":"전체 체중 정보만 제공하고 신체부위별 무게 정보는 알 수 없음","new":"후두·어깨·팔꿈치·엉덩이·발뒤꿈치 부위별 무게를 각각 표시"}],"applications":[{"title":"거동 불편 환자 체중 측정","desc":"스스로 일어나거나 앉아 있기 어려운 신경계 환자가 누운 상태로 체중을 측정하는 의료용 매트"},{"title":"병원 검사·수술 전 기록","desc":"검사나 수술 전 환자 체중 기재 시 휠체어 이동 없이 정확한 수치를 확보하게 하는 장치"},{"title":"신체 무게 분포 측정","desc":"키 정보와 부위별 무게로 발끝부터 머리끝까지의 무게 분포를 그래프로 제공하는 기능"}],"figFile":"10-2024-0117696.jpg","figureCaption":"공보 대표도면"},{"id":"p1020240116898","title":"개인 휴대용 다기능 구조신호 발생장치","field":"기계","status":"공개","regNo":"","regDate":"","appNo":"10-2024-0116898","appDate":"2024.08.29","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2044.08.29","inventor":"박옥남","transfer":"매매 · 라이센스","tags":["구조신호","산악안전","조난","위치전송"],"summary":"본 기술은 산행 등 각종 활동 중 발생하는 안전사고·조난을 감지하여 자동으로 구조신호와 현재 위치 정보를 담당기관에 전송하는 개인 휴대용 장치에 관한 것임. 산악지형은 정확한 사고 발생 위치를 파악하기 어렵고, 추락 등으로 자력 신고나 구조 요청이 불가능한 경우 신속한 구조활동이 이루어지지 못하는 문제가 있음. 본 기술은 이를 해결하여 구조대원이 정확한 사고 위치를 신속히 파악하고 즉각적인 구조활동을 수행할 수 있도록 하는 것을 목적으로 함.","features":[{"k":"특징","v":"사고를 감지하면 자동으로 구조신호와 현재 위치 정보를 담당기관에 전송하고, 불빛과 소리로 착용자의 위치를 알리는 것을 핵심 구성으로 함. 여기에 나침반, 시계, 배터리 충전, 연락처 기재, 휴대를 위한 견착 기능을 함께 담아 하나의 장치로 구성한 특징이 있음."},{"k":"효과","v":"자력으로 신고할 수 없는 상황에서도 구조 요청이 자동으로 이루어져, 구조대원이 정확한 사고 위치를 신속하게 파악하고 즉각 대응할 수 있음. 평상시에는 나침반·시계·보조배터리 등으로 활용할 수 있어 상시 휴대성이 높음."}],"outlook":"사고 발생 시에만 쓰이는 단일 기능 장비는 평소 휴대율이 낮아 정작 필요한 순간에 소지하지 않는 경우가 많음. 본 기술은 나침반·시계·충전 기능 등 평상시 효용을 함께 제공해 상시 휴대를 유도하고, 사고 감지 시 자동으로 신고와 위치 전송이 이루어지도록 하여 「휴대하지 않아 쓰지 못하는」 문제를 구조적으로 해소함.","comparison":[{"item":"신고 방식","old":"조난자가 직접 휴대폰으로 신고해야 함","new":"사고를 감지해 자동으로 구조신호 전송"},{"item":"위치 파악","old":"산악지형에서 구두 설명에 의존, 위치 특정이 어려움","new":"현재 위치 정보를 담당기관에 전송하고 불빛·소리로 현장 표시"},{"item":"평상시 활용","old":"사고 시에만 쓰이는 단일 기능","new":"나침반·시계·충전·연락처 기재 등 다기능 제공"}],"markets":[{"title":"세계 개인 안전경보기 시장","unit":"억 달러","from":{"y":"2024","v":"21"},"to":{"y":"2033","v":"38"},"cagr":"CAGR 6.8%","note":"2024년 21억 달러에서 2033년 38억 달러로 성장할 것으로 전망되며, 2025~2033년 연평균 성장률은 6.8%로 추정됨. (출처: DataHorizzon Research)"}],"applications":[{"title":"등산·트레킹 안전장비","desc":"개인 등산객과 산악회를 대상으로 한 휴대형 안전장비. 평상시에는 나침반·시계·보조배터리로 쓰이고 사고 시 자동 구조신호로 전환"},{"title":"공공 산악안전 사업","desc":"국립공원·지자체의 등산로 안전 정책과 연계해 대여·보급하는 장비로 활용. 조난 신고 접수부터 위치 확인까지의 시간 단축"},{"title":"1인 작업자 안전관리","desc":"현장 단독 작업자, 순찰·점검 인력 등 고립 위험이 있는 업무에 적용해 비상 호출과 위치 전송 수단으로 활용"}],"smk":true,"brief":false,"lvl":3,"figFile":"10-2024-0116898.jpg","figureCaption":"공보 대표도면"},{"id":"p1020240115684","title":"시각 장애인의 대중 교통 이용 시 안전 및 편리성을 증대시키는 교통 서비스 중계 시스템","field":"의료","status":"공개","regNo":"","regDate":"","appNo":"10-2024-0115684","appDate":"2024.08.28","applicant":"선문대학교 산학협력단","coApplicant":false,"expiry":"2044.08.28","inventor":"경종수","transfer":"매매 · 라이센스","smk":true,"brief
